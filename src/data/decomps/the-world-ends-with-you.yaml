name: The World Ends With You
console: nds
repo: Yotona/twewy
decomp: Yotona/twewy
desc:
  es: "Base de código obtenida por ingeniería inversa de The World Ends With You para Nintendo DS, hecha para estudiar y entender el código y las mecánicas del juego, con código escrito por colaboradores individuales. Cubre la versión norteamericana (NTR-AWLE-USA) y la japonesa, Subarashiki Kono Sekai (NTR-AWLJ-JPN), y no incluye recursos del juego. 3 de sus últimos 100 commits llevan a Copilot como coautor."
  en: "Reverse-engineered codebase of The World Ends With You for Nintendo DS, made to study and understand the game’s code and mechanics, with code written by individual contributors. It covers the North American release (NTR-AWLE-USA) and the Japanese one, Subarashiki Kono Sekai (NTR-AWLJ-JPN), and includes no assets. 3 of its last 100 commits list Copilot as a co-author."
tags:
  - ai-assisted
