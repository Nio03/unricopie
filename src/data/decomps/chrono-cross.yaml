name: Chrono Cross
games: [chrono-cross]
console: ps1
repo: jdperos/chrono-cross-decomp
decomp: jdperos/chrono-cross-decomp
desc:
  es: "Decompilación exacta en curso de Chrono Cross para PS1. Se basa en la versión japonesa (SLPS 023.64) extraída de la remasterización Radical Dreamers Edition, cuyo cdrom.dat contiene el juego original sin modificar y evita el complicado sistema de sectores propio del disco original."
  en: "In-progress matching decompilation of Chrono Cross for PS1. It targets the Japanese release (SLPS 023.64), extracted from the Radical Dreamers Edition remaster, whose cdrom.dat holds the unmodified original and avoids the original disc’s awkward custom sectoring."
tags:
  - matching
