  es: "Decompilación en curso de Crash Tag Team Racing para GameCube, con la versión estadounidense (G9RE7D) y la japonesa, Crash Bandicoot: Gatchanko World (G9RJ7D), que todavía no está dividida en unidades. Prohíbe usar o consultar filtraciones de código de otros juegos de Radical Entertainment, y por eso también el uso de IA y de modelos de lenguaje."
  en: "Work-in-progress decompilation of Crash Tag Team Racing for GameCube, with the US version (G9RE7D) and the Japanese Crash Bandicoot: Gatchanko World (G9RJ7D), the latter not yet split into units. Contributors may not use or reference source leaks from other Radical Entertainment games, which also rules out AI and LLMs."
