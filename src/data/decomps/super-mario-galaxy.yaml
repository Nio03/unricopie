name: Super Mario Galaxy (Petari)
console: wii
repo: SMGCommunity/Petari
decomp: SMGCommunity/Petari
desc:
  es: "Petari, la decompilación de Super Mario Galaxy, que mide por separado el avance del código y el de los datos. Su README es explícito en algo que suele confundirse: el proyecto no pretende ser un port para PC. El port del equipo es otro proyecto, AstroCore. No incluye recursos ni ensamblador."
  en: "Petari, the Super Mario Galaxy decompilation, tracking code and data progress separately. Its README is explicit about something often confused: the project isn’t an attempt at a PC port. The team’s port is a separate project called AstroCore. It ships no assets or assembly."
tags:
  - powerpc
  - human-driven
