name: Wave Race 64
console: n64
repo: LLONSIT/Wave-Race-64
decomp: LLONSIT/Wave-Race-64
desc:
  es: "Decompilación temprana de Wave Race 64 para N64. Solo trabaja con la ROM estadounidense y por ahora no tiene previsto abordar las versiones europea ni japonesa. El README avisa de que todavía no sirve para modificar el juego."
  en: "Early decompilation of Wave Race 64 for N64. It works only on the US ROM and has no plans yet for the European or Japanese versions. The README warns that it’s too early to make modifications with it."
