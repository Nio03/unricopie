name: "Star Wars Episode I: Racer"
games: [star-wars-episode-i-racer]
console: pc
repo: tim-tim707/SW_RACER_RE
desc:
  es: "Proyecto de decompilación de Star Wars Episode I: Racer (LucasArts, 1999) para PC. No busca una compilación idéntica ni decompilar el juego entero, sino documentar y reimplementar parte de sus funciones para que la comunidad pueda modificarlo: la fuente de verdad son data_symbols.syms (variables globales) y src/generated/hook_generated.c (funciones). Se inspira en OpenJKDF2, y su último recuento, del 12 de junio de 2026, da un 71,2 % de las funciones analizadas (1518 de 2132), aunque no todas están reimplementadas. Con ese conocimiento, el directorio dinput_hook/ construye un mod con un dinput.dll que sustituye las funciones de dibujo del juego. Su versión 0.17 (28 de agosto), llamada community improvement mod, se descomprime en la carpeta de tu copia del juego (la que contiene SWEP1RCR.EXE y Smush.dll), sirve para las versiones de GOG y de Steam, abre un menú con F5 y añade mando en los menús y las carreras, carrera rápida, menú de audio, menú de trucos, vueltas y tiempos sin los límites originales, pistas personalizadas y la sustitución de modelos 3D por otros en HD (el primer paquete, de febrero de 2025). El repositorio incluye nueve pistas personalizadas en assets/custom_tracks (unos 215 MB, en el formato de bloques del juego), algunas con nombres de circuitos de otros juegos, como Bomb-omb Battlefield, Bowser’s Castle y Koopa Beach. 54 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A decompilation project for Star Wars Episode I: Racer (LucasArts, 1999) on PC. It doesn’t aim for a matching build or to decompile the whole game, but to document and reimplement some of its functions so the community can mod it: the source of truth is data_symbols.syms (global variables) and src/generated/hook_generated.c (functions). It’s heavily influenced by OpenJKDF2, and its latest tally, from June 12, 2026, lists 71.2% of the functions as analyzed (1,518 of 2,132), though not all of them are reimplemented. With that knowledge, the dinput_hook/ directory builds a mod with a dinput.dll that replaces the game’s rendering functions. Its version 0.17 (August 28), called the community improvement mod, is unzipped into the folder of your copy of the game (the one with SWEP1RCR.EXE and Smush.dll), works with the GOG and Steam versions, opens a menu with F5, and adds controller support in menus and races, a quick race menu, an audio menu, a cheat menu, laps and times without the original limits, custom tracks, and replacement of the 3D models with HD ones (the first pack, from February 2025). The repository includes nine custom tracks in assets/custom_tracks (about 215 MB, in the game’s block format), some named after circuits from other games, such as Bomb-omb Battlefield, Bowser’s Castle, and Koopa Beach. 54 of its last 100 commits list Claude as a co-author."
