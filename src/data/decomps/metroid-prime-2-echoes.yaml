name: "Metroid Prime 2: Echoes"
games: [metroid-prime-2-echoes, metroid-prime-trilogy]
console: gamecube
repo: PrimeDecomp/echoes
decomp: PrimeDecomp/echoes
desc:
  es: "Decompilación de Metroid Prime 2: Echoes que abarca seis versiones: las de GameCube estadounidense, japonesa y PAL, además de las de Wii New Play Control! (Japón) y Metroid Prime Trilogy (Estados Unidos y PAL). Los módulos REL solo se compilan para G2ME01 (GameCube, versión estadounidense)."
  en: "Decompilation of Metroid Prime 2: Echoes covering six builds: the US, Japanese, and PAL GameCube releases, plus the Wii New Play Control! (Japan) and Metroid Prime Trilogy (US and PAL) releases. REL modules are only built for G2ME01 (US GameCube)."
