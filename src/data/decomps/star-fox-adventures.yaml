name: Star Fox Adventures
games: [star-fox-adventures]
console: gamecube
repo: zcanann/SFA-Decomp
decomp: zcanann/SFA-Decomp
desc:
  es: "Decompilación de Star Fox Adventures para GameCube. El juego tiene tres versiones: la japonesa, la inglesa (con la v1.00 inicial y una v1.01 corregida) y la PAL. Las divisiones del código y los símbolos están todavía muy incompletos, así que es difícil aportar código, salvo para mejorar secciones que ya coinciden en parte."
  en: "Decompilation of Star Fox Adventures for GameCube. The game has three versions: JP, EN (an initial v1.00 and a patched v1.01), and PAL. Splits and symbols are still largely incomplete, so contributing is hard except for improving sections that already partly match."
