name: "Minecraft: Nintendo Switch Edition"
games: [minecraft-nintendo-switch-edition]
console: switch
repo: GRAnimated/MinecraftLCE
decomp: GRAnimated/MinecraftLCE
desc:
  es: "Decompilación de Minecraft: Legacy Console Edition, abordada desde la versión 1.0.17 de Nintendo Switch porque es la más reciente de la familia: la Legacy Console Edition salió también en Xbox 360, PS3, PS Vita, Wii U, Xbox One y PS4. Para trasladar los símbolos, recomiendan apoyarse en el ejecutable de la edición de Wii U. El repositorio no incluye recursos del juego y no sirve para jugar. El proyecto insiste en ser estrictamente de sala limpia (clean-room): Microsoft no ha actuado contra los volcados que circulan, pero sí ha retirado proyectos que no lo eran."
  en: "Decompilation of Minecraft: Legacy Console Edition, approached through the Nintendo Switch Edition v1.0.17 because it’s the most recent of the family: LCE also shipped on Xbox 360, PS3, PS Vita, Wii U, Xbox One, and PS4. For porting symbols, they recommend leaning on the Wii U edition’s executable. The repository ships no assets and can’t be used to play. The project insists on being strictly clean-room: Microsoft hasn’t acted against the dumps in circulation, but it has taken down projects that weren’t."
tags:
