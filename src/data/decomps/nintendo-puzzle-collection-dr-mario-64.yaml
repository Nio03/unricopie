name: "Nintendo Puzzle Collection: Dr. Mario 64"
console: gamecube
repo: NewGBAXL/drmario64-gc
decomp: NewGBAXL/drmario64-gc
desc:
  es: "Decompilación en curso del port a GameCube de Dr. Mario 64, incluido en Nintendo Puzzle Collection junto con un port de Panel de Pon 64 y Yoshi's Cookie. Solo soporta la Rev 0 japonesa (GPZJ01)."
  en: "Work-in-progress decompilation of the GameCube port of Dr. Mario 64, bundled in Nintendo Puzzle Collection with a Panel de Pon 64 port and Yoshi's Cookie. Only the Japanese Rev 0 (GPZJ01) is supported."
