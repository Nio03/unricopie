name: Betrayal at Krondor
console: dos
repo: canassa/betrayal-at-krondor
desc:
  es: "Reconstrucción del código fuente de Betrayal at Krondor (Dynamix, 1993) a partir de los binarios de DOS, que reproduce byte a byte KRONDOR.EXE, VMCODE.OVL y SX.OVL de dos versiones desde el mismo código: la 1.00 en disquetes (16 de junio de 1993) y la 1.02 en CD-ROM (21 de marzo de 1994). Se compila con las herramientas de la época (Borland C++ 3.1, 3.0 y 2.0 y TASM) dentro de FreeDOS en QEMU, con una herramienta en Python que lo automatiza; el autor publica esas herramientas empaquetadas como descarga aparte. El único ensamblador que contiene es el que ya era ensamblador en el original. Su objetivo es educativo y de preservación: no añade soporte para sistemas modernos, algo que su autor planea hacer en un fork aparte. La coincidencia byte a byte está completa, pero el código todavía tiene restos de la decompilación y nombres por corregir, y el trabajo sigue módulo a módulo. Incluye un visor en el navegador para explorar los recursos y los diálogos del juego con tus propios archivos. Su guía para colaboradores considera útiles los modelos de lenguaje para este trabajo siempre que se les exijan pruebas, y el repositorio tiene instrucciones para agentes de Claude; la documentación, en cambio, la escribe o la revisa una persona. No incluye datos del juego: para compilar un ejecutable jugable hacen falta los archivos de tu propia copia."
  en: "A reconstruction of Betrayal at Krondor’s source code (Dynamix, 1993) from the DOS binaries that reproduces KRONDOR.EXE, VMCODE.OVL, and SX.OVL byte for byte for two releases from the same code: 1.00 on floppy disks (June 16, 1993) and 1.02 on CD-ROM (March 21, 1994). It builds with the period tools (Borland C++ 3.1, 3.0, and 2.0, and TASM) inside FreeDOS on QEMU, with a Python tool that automates it; the author publishes those tools packaged as a separate download. The only assembly in it is what was already assembly in the original. Its goals are education and preservation: it adds no support for modern systems, which the author plans to do in a separate fork. The byte match is complete, but the code still carries decompilation artifacts and names to fix, and the work continues module by module. It includes a browser-based viewer for exploring the game’s assets and dialogue with your own files. Its contributing guide calls language models useful for this work as long as they are held to evidence, and the repository carries instructions for Claude agents; documentation, by contrast, is written or reviewed by a person. It includes no game data: building a playable executable needs the files from your own copy."
