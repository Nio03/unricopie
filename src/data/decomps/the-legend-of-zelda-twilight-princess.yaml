desc:
  es: "Decompilación de la versión de GameCube, del equipo zeldaret, que mide por separado el avance de cuatro versiones: la estadounidense GZ2E01, la europea GZ2P01, la japonesa GZ2J01 y ShieldD. De ella salen los ports para PC de Twilight Princess, como Dusklight, que también está en el catálogo. El repositorio no incluye recursos ni ensamblador."
  en: "Decompilation of the GameCube version by the zeldaret team, tracking four builds separately: the US GZ2E01, the European GZ2P01, the Japanese GZ2J01, and ShieldD. Twilight Princess PC ports such as Dusklight, also in the catalog, are built from it. The repository ships no assets or assembly."
