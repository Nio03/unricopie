name: New Super Mario Bros. Wii
games: [new-super-mario-bros-wii]
console: wii
repo: NSMBW-Community/NSMBW-Decomp
decomp: NSMBW-Community/NSMBW-Decomp
desc:
  es: "Decompilación de New Super Mario Bros. Wii basada en los binarios PAL v1, que vuelve a enlazar el .dol y los .rel byte a byte. Declara que no busca crear un port para PC. Admite la IA para limpiar, dar formato, documentar y poner nombres, pero rechaza la decompilación generada por IA."
  en: "Decompilation of New Super Mario Bros. Wii based on the PAL v1 binaries, relinking the .dol and .rel files byte for byte. It states it isn’t an effort to create a PC port. AI is allowed for cleanup, formatting, documentation, and naming, but AI-generated decompilation is rejected."
tags:
  - matching
  - human-driven
