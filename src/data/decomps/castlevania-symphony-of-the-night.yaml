name: "Castlevania: Symphony of the Night"
games: [castlevania-symphony-of-the-night]
console: ps1
repo: Xeeynamo/sotn-decomp
decomp: Xeeynamo/sotn-decomp
desc:
  es: "Decompilación exacta que abarca tres plataformas a la vez (PlayStation, PSP y Saturn): reconstruye el código fuente a partir de los binarios, con análisis estático y dinámico, hasta que compila byte a byte. Admite cuatro versiones: la estadounidense SLUS-00067, que es la de referencia; la europea de PSP; el port de Saturn hecho por un equipo externo, y una versión japonesa de PS1 que nunca se publicó y que se encontró dentro de los datos de Dracula X Chronicles. No incluye recursos del juego: hay que extraerlos de tu copia."
  en: "Matching decompilation covering three platforms at once (PlayStation, PSP, and Saturn): it reconstructs the source code from the binaries through static and dynamic analysis, down to byte-for-byte builds. It supports four versions: the reference US SLUS-00067, the European PSP build, the Saturn port made by an outside team, and an unreleased Japanese PS1 build found inside the Dracula X Chronicles game data. It ships no assets: they must be extracted from your copy."
tags:
  - mips
  - matching
