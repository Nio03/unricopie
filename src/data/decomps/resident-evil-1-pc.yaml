name: Resident Evil (PC, 1997)
games: [resident-evil]
console: pc
repo: ecruells/resident-evil-pc-decomp
desc:
  es: "Decompilación del Resident Evil de PC de 1997, reconstruido por ingeniería inversa a partir de la decompilación en Ghidra del ejecutable original y montado sobre una capa de renderizado moderna, para Windows con Direct3D 11 y para Linux con SDL2 y OpenGL. Las dos versiones comparten cada línea de la lógica del juego; solo cambian la capa de plataforma y el motor de renderizado. El port está completo en lo funcional: se juega entero, con todas las salas, enemigos, cinemáticas, vídeos, menús y finales."
  en: "Decompilation of the 1997 PC Resident Evil, reverse-engineered from a Ghidra decompilation of the original executable and rebuilt on a modern rendering layer, for Windows with Direct3D 11 and Linux with SDL2 and OpenGL. Both builds share every line of game logic; only the platform layer and the rendering backend differ. The port is functionally complete: the whole game is playable, with every room, enemy, cutscene, FMV, menu, and ending."
tags:
  - x86
  - ghidra
