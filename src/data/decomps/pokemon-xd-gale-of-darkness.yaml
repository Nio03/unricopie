name: "Pokémon XD: Gale of Darkness"
console: gamecube
repo: TeamOrre/xd-decomp
decomp: TeamOrre/xd-decomp
desc:
  es: "Decompilación en curso de Pokémon XD: Gale of Darkness para GameCube, a cargo de TeamOrre. Es compatible con la Rev 0 estadounidense (GXXE01) y con un disco de demostración japonés (NXXJ01), con el objetivo de obtener un binario idéntico al de la versión comercial."
  en: "Work-in-progress decompilation of Pokémon XD: Gale of Darkness for GameCube under TeamOrre. It supports the US Rev 0 (GXXE01) and a Japanese demo disc (NXXJ01), aiming for a matching retail binary."
