name: "Fire Emblem: Seima no Kouseki"
console: gba
repo: laqieer/fireemblem8j
decomp: laqieer/fireemblem8j
desc:
  es: "Decompilación de la versión japonesa de Fire Emblem: The Sacred Stones (Seima no Kouseki, BE8J) para GBA. Es la compañera de la decompilación de la versión estadounidense, que está casi completa: las dos ROM salen del mismo código fuente, así que el trabajo consiste en volver a enlazar el C de la versión estadounidense con la disposición de datos japonesa y decompilar el código propio de esa región (texto, fuentes, menús y versiones de las partidas guardadas). Su README documenta el uso de Claude Code con IDA y Ghidra a través de MCP para las funciones que faltan."
  en: "Decompilation of the Japanese version of Fire Emblem: The Sacred Stones (Seima no Kouseki, BE8J) for GBA. It’s the counterpart of the nearly complete US decomp: both ROMs come from the same source, so the work is re-linking the US C code against the Japanese data layout and decompiling the region-specific code (text, fonts, menus, and save versioning). Its README documents using Claude Code with IDA and Ghidra over MCP for the remaining functions."
