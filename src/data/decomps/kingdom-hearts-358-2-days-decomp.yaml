name: "Kingdom Hearts 358/2 Days (khdays-decomp)"
games: [kingdom-hearts-358-2-days]
console: nds
repo: Yokimitsuro/khdays-decomp
decomp: Yokimitsuro/khdays-decomp
desc:
  es: "Decompilación exacta de Kingdom Hearts 358/2 Days para Nintendo DS, de la versión europea (YKGP), compilada con el mismo compilador que el original, CodeWarrior para DS (mwccarm 3.0, build 139). Todas las funciones del programa ARM9 y de sus overlays coinciden con las originales, los 306 módulos que genera son idénticos byte a byte a los del juego y los datos inicializados están reconstruidos del todo. Todo el código propio del juego está en C salvo dos funciones que necesitan la instrucción clz, que el compilador no genera desde C; el resto del ensamblador es código de bibliotecas (NitroSDK, el runtime de CodeWarrior y MobiClip) que ya era ensamblador en su origen. En cifras del proyecto, unas 23 125 de sus unas 23 233 funciones están en C (el 99,5 %, y el 99,73 % de los bytes de código). El trabajo ahora es hacer legible ese C: declarar una sola vez las estructuras que comparten los archivos, poner nombre a lo que todavía se nombra por dirección y agrupar las funciones en sus archivos de origen. Usa dsd (ds-decomp) para extraer y separar el código de tu ROM, y se puede colaborar desde decomp.me. Por sí sola no genera una versión jugable: el port nativo para PC del mismo autor, khdays-port, que tiene su propia ficha, se construye sobre ella. Las fuentes de DS Protect se reconstruyeron a partir de la decompilación de taxicat1, y para identificar las funciones del NitroSDK compila el de la decompilación de Pokémon Diamante de pret. El repositorio, abierto el 26 de junio, no incluye la ROM, ni recursos del juego, ni su ensamblador original, y su código está en dominio público (CC0)."
  en: "A matching decompilation of Kingdom Hearts 358/2 Days for Nintendo DS, European release (YKGP), built with the same compiler as the original, CodeWarrior for DS (mwccarm 3.0, build 139). Every function of the ARM9 program and its overlays matches the original, the 306 modules it builds are byte-identical to the game’s, and all of the initialized data is reconstructed. All of the game’s own code is C except two functions that need the clz instruction, which the compiler can’t produce from C; the rest of the assembly is library code (NitroSDK, the CodeWarrior runtime, and MobiClip) that was assembly in its original source too. By the project’s count, about 23,125 of its roughly 23,233 functions are in C (99.5%, and 99.73% of the code bytes). The work now is making that C readable: declaring once the structures the files share, naming what is still named by address, and grouping functions back into their original files. It uses dsd (ds-decomp) to extract and delink the code from your ROM, and contributions can be made through decomp.me. On its own it doesn’t produce a playable build: the same author’s native PC port, khdays-port, which has its own entry, is built on it. The DS Protect sources were reconstructed from taxicat1’s decompilation, and to identify NitroSDK functions it compiles the NitroSDK from pret’s Pokémon Diamond decompilation. The repository, opened on June 26, includes neither the ROM, nor game assets, nor the original assembly, and its code is in the public domain (CC0)."
