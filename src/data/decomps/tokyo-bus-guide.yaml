name: Tokyo Bus Guide
console: dreamcast
repo: lhsazevedo/tbg-decomp
decomp: lhsazevedo/tbg-decomp
author: Lucas Azevedo
desc:
  es: "La primera decompilación pública de un juego de Dreamcast, del clásico japonés 東京バス案内. Busca la equivalencia funcional antes que la coincidencia byte a byte, y se plantea como un esfuerzo colectivo para impulsar la ingeniería inversa de la consola. Su README avisa de algo que conviene repetir: de esta decompilación no sale una ROM jugable sin una copia legítima del juego original."
  en: "The first public decompilation of a Dreamcast game, of the Japanese classic 東京バス案内. It aims for functional equivalence rather than byte-level matching, and is framed as a collective effort to push the console’s reverse engineering forward. Its README flags something worth repeating: this decompilation can’t produce a playable ROM without a legitimate copy of the original game."
tags:
  - sh-4
