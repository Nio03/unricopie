name: "Sonic Dream Team (Project Lucid)"
games: [sonic-dream-team]
console: mobile
repo: dev-camo/project-lucid
desc:
  es: "Project Lucid: reconstrucción en curso de Sonic Dream Team (Apple Arcade, 2023) para macOS, Windows y Linux, como proyecto de Unity en C#, a partir de la versión de macOS del juego. Hay que poner tu propio paquete del juego de macOS: los recursos del juego no vienen incluidos. Según el README, de momento solo se han probado sus herramientas de extracción con la versión 1.10.1, y el juego original todavía no se puede jugar desde el proyecto. El repositorio sube código C# recuperado del juego y generado por sus herramientas (carpetas como HLAutoGenerated y RecoveredProof). No publica versiones. Es otro proyecto que Project Dream."
  en: "Project Lucid: an in-progress reconstruction of Sonic Dream Team (Apple Arcade, 2023) for macOS, Windows and Linux, as a Unity project in C#, built from the game's macOS version. You supply your own macOS game bundle: the game's assets aren't included. According to the README, so far only its extraction tools have been exercised, with version 1.10.1, and the original game isn't yet playable from the project. The repository commits C# code recovered from the game and generated by its tools (folders such as HLAutoGenerated and RecoveredProof). It publishes no releases. It's a separate project from Project Dream."
tags:
  - decomp
