name: Hybrid Heaven
console: n64
repo: ogdanimal/HybridHeaven-Decomp
desc:
  es: "Decompilación de Hybrid Heaven (versión estadounidense) hecha para servir al port por recompilación del mismo autor, que también está en el catálogo. La compilación reproduce la ROM original byte a byte, con el código dividido en 137 unidades de traducción y los 92 overlays que se cargan en memoria convertidos en segmentos de código, y genera el ELF con los símbolos que necesita N64Recomp. Casi todo sigue en ensamblador: su autor explica que pasar a C no hacía falta para el port, y por ahora solo 13 unidades de la biblioteca libultra están en C, también exactas. Incluye herramientas para el formato de archivo de Konami que comparte con Mystical Ninja Starring Goemon. No trae datos del juego: hace falta tu propia ROM. Sus 2 commits llevan a Claude como coautor."
  en: "A decompilation of Hybrid Heaven (US release) made to serve the same author’s recompilation port, also in this catalog. The build reproduces the retail ROM byte for byte, with the code split into 137 translation units and the 92 RAM-loaded overlays promoted to code segments, and it produces the ELF and symbols N64Recomp needs. Almost all of it is still assembly: its author explains that moving to C wasn’t needed for the port, and so far only 13 libultra translation units are in C, also matching. It includes tooling for the Konami archive format it shares with Mystical Ninja Starring Goemon. It ships no game data: you need your own ROM. All 2 of its commits list Claude as a co-author."
tags:
  - mips
  - matching
  - ai-assisted
