name: "Halo 2"
games: [halo-2]
console: xbox
repo: kirklandsig/halo2-decompiled
decomp: kirklandsig/halo2-decompiled
desc:
  es: "Decompilación exacta en curso de Halo 2 para la Xbox original, a partir del ejecutable de la versión comercial en disco (default.xbe, enlazado el 28 de septiembre de 2004): cada función se recrea en C y C++ y, compilada con el compilador de la época (Visual C++ 7.1 del XDK 5849), tiene que dar los mismos bytes que el original. El juego se compiló con generación de código en el enlace (LTCG), que mezcla funciones de distintos archivos y usa convenciones de llamada propias, y el README dice no conocer ningún proyecto anterior que haya igualado una compilación así. Además del código del juego decompila Havok, la biblioteca de física, para que los vehículos, los cuerpos y los proyectiles se comporten como en la Xbox. Según el README coinciden 10.519 de las 11.326 funciones del juego (el 71 % de los bytes) y 1.267 de las 1.436 de Havok (el 60 %); el avance en vivo sale de ByteMatch. Un port nativo es la última etapa del plan y todavía no existe. No incluye nada del juego ni del XDK de Microsoft: hace falta el default.xbe de tu propia copia, y para comprobar las coincidencias, el compilador original, que el proyecto no proporciona. Está abierto a colaboradores, y el README dice que buena parte del trabajo del mantenedor lo hacen agentes de IA (Claude y Codex) bajo las mismas comprobaciones, revisado antes de entrar. Licencia GPL-3.0 desde el 27 de octubre (antes, CC0). 91 de sus últimos 100 commits llevan a Claude como coautor."
  en: "Work-in-progress matching decompilation of Halo 2 for the original Xbox, from the retail disc executable (default.xbe, linked September 28, 2004): each function is recreated in C and C++ and, built with the period compiler (Visual C++ 7.1 from XDK 5849), has to produce the same bytes as the original. The game was compiled with link-time code generation (LTCG), which mixes functions from different files and uses custom calling conventions, and the README says it knows of no earlier project that has matched such a build. Besides the game’s code it decompiles Havok, the physics library, so that vehicles, ragdolls, and projectiles behave as they do on the Xbox. According to the README, 10,519 of the game’s 11,326 functions match (71% of the bytes) and 1,267 of Havok’s 1,436 (60%); live progress comes from ByteMatch. A native port is the last stage of the plan and doesn’t exist yet. It includes nothing from the game or from Microsoft’s XDK: you need the default.xbe from your own copy and, to check matches, the original compiler, which the project doesn’t provide. It’s open to contributors, and the README says much of the maintainer’s work is done by AI agents (Claude and Codex) under the same checks, reviewed before it lands. GPL-3.0 license since October 27 (CC0 before that). 91 of its last 100 commits list Claude as a co-author."
