name: Animal Crossing
console: gamecube
repo: ACreTeam/ac-decomp
decomp: ACreTeam/ac-decomp
desc:
  es: "Decompilación de la versión de GameCube, sobre la revisión 0 estadounidense (GAFE01_00). Mide por separado el avance del DOL y el de los módulos REL, porque el juego reparte buena parte de su código en módulos que se cargan bajo demanda en lugar de tenerlo en el ejecutable principal. No incluye recursos del juego ni ensamblador: hace falta una copia del juego."
  en: "Decompilation of the GameCube version, against US revision 0 (GAFE01_00). It tracks progress on the DOL and the REL modules separately, because the game keeps a good part of its code in loadable overlays rather than in the main executable. It ships neither assets nor assembly: a copy of the game is required."
tags:
  - powerpc
