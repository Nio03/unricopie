desc:
  es: "Himuro, decompilación exacta de Fatal Frame (Project Zero) para PS2, con la intención declarada de portar el juego a hardware moderno cuando coincida por completo con el original. Cubre tres regiones: Estados Unidos (SLUS_203.88), Europa (SLES_508.21) y Japón (SLPS_250.74)."
  en: "Himuro, a matching decompilation of Fatal Frame (Project Zero) for PS2, with the stated intent of porting the game to modern hardware once it fully matches. It covers three regions: US (SLUS_203.88), Europe (SLES_508.21), and Japan (SLPS_250.74)."
