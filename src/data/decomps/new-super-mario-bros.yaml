name: New Super Mario Bros.
console: nds
repo: NSMB-Decomp/nsmb
decomp: NSMB-Decomp/nsmb
desc:
  es: "Decompilación de New Super Mario Bros. para Nintendo DS, en fase temprana: todavía no puede compilar una ROM completa. Lista varias ediciones por código de producto (A2DE, A2DJ y demos de kiosco) con el progreso de cada una."
  en: "Decompilation of New Super Mario Bros. for Nintendo DS, at an early stage: it cannot yet build a complete ROM. It lists several releases by product code (A2DE, A2DJ and kiosk demos) with progress for each."
