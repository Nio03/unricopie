name: New Super Mario Bros.
console: nds
repo: NSMB-Decomp/nsmb
decomp: NSMB-Decomp/nsmb
desc:
  es: "Decompilación de New Super Mario Bros. para Nintendo DS, en una fase temprana: todavía no puede compilar una ROM completa. Enumera varias ediciones por su código de producto (A2DE, A2DJ y demos para tiendas) con el avance de cada una."
  en: "Decompilation of New Super Mario Bros. for Nintendo DS, at an early stage: it can’t yet build a complete ROM. It lists several releases by product code (A2DE, A2DJ, and kiosk demos) with progress for each."
