desc:
  es: "Decompilación exacta en curso de Klonoa: Empire of Dreams (GBA, 2001), con el objetivo de obtener código C que compile a un código máquina idéntico byte a byte. El README explica qué es una decompilación exacta y enlaza una charla de su autor sobre el tema."
  en: "In-progress matching decompilation of Klonoa: Empire of Dreams (GBA, 2001), aiming for C code that compiles to byte-for-byte identical machine code. The README explains what matching decompilation is and links to the author’s talk on it."
