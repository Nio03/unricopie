name: LEGO City Undercover
console: switch
repo: Nintendocustom/Lego-City-Undercover-Decompilation
decomp: Nintendocustom/Lego-City-Undercover-Decompilation
desc:
  es: "Decompilación de LEGO City Undercover para Switch que parte del ejecutable main de la última actualización europea, la v1.0.3 (la estadounidense 1.0.2 probablemente también sirva, pero no está probada). La versión japonesa no es compatible porque se compiló con otra versión del compilador. No sirve para jugar."
  en: "Decompilation of LEGO City Undercover for Switch that starts from the main executable of the latest European update, v1.0.3 (US 1.0.2 likely works too, but it’s untested). The Japanese version isn’t supported because it was built with a different compiler version. It can’t be used to play the game."
