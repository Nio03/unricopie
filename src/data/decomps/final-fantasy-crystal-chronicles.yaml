name: Final Fantasy Crystal Chronicles
console: gamecube
repo: zcanann/FFCC-Decomp
decomp: zcanann/FFCC-Decomp
desc:
  es: "Decompilación de Final Fantasy Crystal Chronicles para GameCube, con tres versiones (japonesa, inglesa y PAL). La versión inglesa trae un archivo de símbolos de depuración, y la PAL, uno de versión final de otra compilación, lo que permitió recuperar los nombres exactos de funciones y clases, sus parámetros y la jerarquía de clases. El avance se mide en código, datos y enlazado."
  en: "Decompilation of Final Fantasy Crystal Chronicles for GameCube, with three versions (JP, EN, and PAL). The EN build ships a debug symbol file and the PAL build a release one, from a different build, which made it possible to recover exact function and class names, parameters, and class hierarchies. Progress is tracked as code match, data match, and linkage."
