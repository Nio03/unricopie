name: Super Mario Galaxy 2
console: wii
repo: SMGCommunity/Garigari
decomp: SMGCommunity/Garigari
desc:
  es: "Decompilación en curso de Super Mario Galaxy 2 (proyecto Garigari). Solo es compatible con la Rev 0 estadounidense (SB4E01). Declara que no busca crear un port para PC. Admite la IA para limpiar, dar formato, documentar y poner nombres, pero rechaza la decompilación generada por IA."
  en: "Work-in-progress decompilation of Super Mario Galaxy 2 (project Garigari). Only the US Rev 0 (SB4E01) is supported. It states it isn’t an effort to create a PC port. AI is allowed for cleanup, formatting, documentation, and naming, but AI-generated decompilation is rejected."
tags:
  - human-driven
