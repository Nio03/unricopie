name: "Grand Theft Auto: San Andreas (gta-reversed)"
games: [grand-theft-auto-san-andreas]
console: pc
repo: gta-reversed/gta-reversed
desc:
  es: "gta-reversed (antes gta-reversed-modern): proyecto para reconstruir por ingeniería inversa todo el código de la versión de PC de Grand Theft Auto: San Andreas (1.0 US), reescribiendo y documentando cada función. No busca una compilación idéntica: compila una DLL que se carga en el juego con cualquier cargador de ASI y sustituye sus funciones por las reescritas, con el juego comportándose igual, de modo que cualquier cambio en el código reescrito se nota en el juego. La meta es reescribirlo entero y compilar un ejecutable independiente. El README estima que hay hecho entre un 50 y un 60 % y avisa de que la cifra está por actualizar; el recuento automático del 4 de noviembre da 7.664 de 8.336 funciones documentadas y reimplementadas (un 92 %), con la advertencia de que aún no todas las funciones están documentadas. Necesita tu propia copia del juego con el ejecutable «Compact» (5.189.632 bytes), que no es el 1.0 US, un cargador de ASI y una DLL para el ratón; se compila con Visual Studio 2026, Conan y CMake. Cita como proyecto original el gta-reversed de codenulls y da las gracias a plugin-sdk y a re3. 54 de sus últimos 100 commits llevan a Claude como coautor, y otro a Copilot."
  en: "gta-reversed (formerly gta-reversed-modern): a project to reverse engineer all the code of the PC version of Grand Theft Auto: San Andreas (1.0 US), rewriting and documenting every function. It doesn’t aim for a matching build: it compiles a DLL that any ASI loader injects into the game, replacing its functions with the rewritten ones while the game behaves the same, so any change to the rewritten code shows up in the game. The goal is to rewrite all of it and compile a standalone executable. The README estimates that 50 to 60% is done and warns that the figure needs updating; the automatic count from November 4 lists 7,664 of 8,336 functions as documented and reimplemented (92%), with the caveat that not every function is documented yet. It needs your own copy of the game with the «Compact» executable (5,189,632 bytes), which isn’t the 1.0 US one, an ASI loader, and a mouse fix DLL; it’s built with Visual Studio 2026, Conan, and CMake. It credits codenulls’ gta-reversed as the original project, and thanks plugin-sdk and re3. 54 of its last 100 commits list Claude as a co-author, and one more lists Copilot."
tags:
