name: "Harvest Moon 64 (hm64-decomp)"
games: [harvest-moon-64]
console: n64
repo: harvestwhisperer/hm64-decomp
desc:
  es: "Decompilación completa a C de Harvest Moon 64 para N64, en sus versiones estadounidense y japonesa: todas las funciones, los datos y la rodata de la sección principal del código y todas las funciones de biblioteca, más un lenguaje propio (DSL) para las escenas y los diálogos que se compila al bytecode del juego. Compila ROM idénticas a las originales, y los textos se extraen de tu ROM y se vuelven a convertir al formato del juego al compilar. Admite shiftability, y para mods recomienda partir de sus ramas dev y dev-qol. Trae herramientas para extraer sprites, animaciones (también como GIF), textos, mapas (que se pueden ver en Blender) y un soundfont con los instrumentos del juego, y para meter MIDI en las canciones; su editor de sprites, la 0.1.0 (26 de mayo), funciona en Windows, Linux y macOS. Se compila con WSL o Docker y por sí sola solo genera ROM de N64. El repositorio incluye, escritos en ese lenguaje propio, las escenas y los diálogos del juego decompilados de su bytecode (unos 3,6 MB)."
  en: "A full C decompilation of Harvest Moon 64 for N64, in its US and Japanese versions: every function, the data, and the rodata of the main code section, and every library function, plus a custom language (DSL) for cutscenes and dialogue that compiles to the game’s bytecode. It builds ROMs identical to the originals, and the text is extracted from your ROM and converted back to the game’s format during the build. It supports shiftability, and for mods it recommends starting from its dev and dev-qol branches. It comes with tools to extract sprites, animations (also as GIFs), text, maps (viewable in Blender), and a soundfont with the game’s instruments, and to insert MIDI into songs; its sprite editor, version 0.1.0 (May 26), runs on Windows, Linux, and macOS. It builds with WSL or Docker and on its own only produces N64 ROMs. The repository includes the game’s cutscenes and dialogue, decompiled from their bytecode into that custom language (about 3.6 MB)."
