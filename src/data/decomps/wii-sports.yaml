name: Wii Sports
console: wii
repo: doldecomp/ogws
decomp: doldecomp/ogws
desc:
  es: "Decompilación en curso de Wii Sports. Solo es compatible con la versión estadounidense Revisión 1 (compilación del 5 de julio de 2007). Pide no usar material filtrado, para que el repositorio sea lo más de sala limpia posible y otros proyectos puedan reutilizarlo libremente. Prohíbe el código del SDK escrito con modelos de lenguaje, y solo los permite en el código del juego, con restricciones."
  en: "Work-in-progress decompilation of Wii Sports. Only the US Revision 1 build (dated July 5, 2007) is supported. Contributors are asked not to use leaked material, so the repository stays as clean-room as possible and freely reusable by other projects. It bans LLM-written SDK code and allows LLMs only for game code, with restrictions."
tags:
  - clean-room
