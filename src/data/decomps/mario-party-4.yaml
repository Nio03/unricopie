name: Mario Party 4 (marioparty4)
games: [mario-party-4]
console: gamecube
repo: mariopartyrd/marioparty4
decomp: mariopartyrd/marioparty4
desc:
  es: "Decompilación en curso en la que las dos versiones estadounidenses ya compilan de forma idéntica al original, aunque casi todo lo que no es el motor del juego sigue sin documentar. Las versiones europea y japonesa están paradas a propósito: implican mucho trabajo repetitivo que será bastante más fácil cuando haya herramientas para trasladar las divisiones y los símbolos de una versión a otra."
  en: "Work-in-progress decompilation in which both US versions already build fully identical to the original, though almost everything outside the game engine remains undocumented. The European and Japanese versions are deliberately on hold: they involve a lot of repetitive work that will be far easier once there is tooling to carry splits and symbols between versions."
tags:
  - powerpc
  - build-android
