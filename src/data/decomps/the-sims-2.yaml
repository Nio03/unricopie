name: The Sims 2
console: gamecube
repo: natebag/Sims2DECOMP
decomp: natebag/Sims2DECOMP
desc:
  es: "Decompilación exacta, en una fase temprana, de Los Sims 2 para GameCube (G4ZE69, versión F.09.12.0 del 12 de septiembre de 2005). El DOL se enlaza idéntico al del disco, pero en buena parte inyectando bytes del binario original durante la compilación: solo una parte de las funciones está decompilada a mano a C++. Su indicador principal es el código limpio que coincide byte a byte."
  en: "Early-stage matching decompilation of The Sims 2 for GameCube (G4ZE69, build F.09.12.0 from September 12, 2005). The DOL links byte-identical to the retail disc, but mostly through byte injection from the original binary during the build: only a fraction of functions are hand-decompiled to real C++. Its headline metric is clean code that matches byte for byte."
tags:
  - matching
