name: Parasite Eve II
console: ps1
repo: GabeRealB/parasite-eve-2-decomp
decomp: GabeRealB/parasite-eve-2-decomp
desc:
  es: "Decompilación matching en curso de Parasite Eve II para PS1, dirigida al ejecutable USA SLUS_010.42 (discos SLUS-01042 y SLUS-01055). Usa GCC 2.8.1 con maspsx y los objetos de Psy-Q 4.5, y mide por separado el ejecutable principal y los overlays de juego y de título. El código del proyecto es CC0. El repo incluye herramientas para matching asistido por IA."
  en: "In-progress matching decompilation of Parasite Eve II for PS1, targeting the USA executable SLUS_010.42 (discs SLUS-01042 and SLUS-01055). It uses GCC 2.8.1 with maspsx and Psy-Q 4.5 objects, and tracks the main executable and the gameplay and title overlays separately. The project code is CC0. The repo includes tooling for AI-assisted matching."
tags:
  - matching
