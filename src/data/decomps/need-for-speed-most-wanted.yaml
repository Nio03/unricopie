name: "Need for Speed: Most Wanted"
console: gamecube
repo: dbalatoni13/nfsmw
decomp: dbalatoni13/nfsmw
desc:
  es: "Decompilación en curso de Need for Speed: Most Wanted que cubre varias plataformas a la vez: GameCube USA, un prototipo de Xbox 360 PAL, un prototipo alfa de PS2 PAL, la Black Edition de PS2 USA y la versión 1.3 de PC. Declara que usa LLMs solo como primer borrador, con revisión manual antes de aceptar nada."
  en: "Work-in-progress decompilation of Need for Speed: Most Wanted that covers several platforms at once: GameCube USA, an Xbox 360 PAL prototype, a PS2 PAL alpha prototype, PS2 USA Black Edition and PC version 1.3. It states that LLMs are used only for rough first passes, with manual review before anything is merged."
