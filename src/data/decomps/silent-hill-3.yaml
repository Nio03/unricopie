name: Silent Hill 3
console: ps2
repo: dreamingmoths/memory-of-alessa
decomp: dreamingmoths/memory-of-alessa
desc:
  es: "Decompilación exacta de Silent Hill 3 para PS2 (v1.02 NTSC-U, SLUS_206.22), en el repositorio Memory of Alessa. Busca la coincidencia byte a byte al 100 % tanto de Silent Hill 3 como del motor de Silent Hill 2 sobre el que se construye, y documentar la historia técnica del motor de Team Silent. El README avisa de que está en una fase temprana."
  en: "Matching decompilation of Silent Hill 3 for PS2 (v1.02 NTSC-U, SLUS_206.22), in the Memory of Alessa repository. It aims for 100% byte-matching of both Silent Hill 3 and the Silent Hill 2 engine it builds on, and for documenting the technical history of Team Silent’s engine. The README warns it’s at an early stage."
tags:
  - matching
