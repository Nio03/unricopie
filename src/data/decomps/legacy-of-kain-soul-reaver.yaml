name: "Legacy of Kain: Soul Reaver (Soul Reaverse)"
console: ps1
repo: fmil95/soul-re
decomp: fmil95/soul-re
desc:
  es: "Soul Reaverse reconstruye el código fuente de Soul Reaver para PS1 a partir de un prototipo del ejecutable compilado dos semanas antes de la versión final, que conserva todos los símbolos de depuración. El proyecto plantea usar el resultado para portar el juego, mejorar su rendimiento y crear herramientas como un editor de niveles."
  en: "Soul Reaverse reconstructs the source code of Soul Reaver for PS1 from a prototype executable built two weeks before the final release, which retains a full set of debugging symbols. The project suggests using the result to port the game, improve its performance, and build tools such as a level editor."
