name: Namco System 22
console: arcade
repo: spacestate1/namco22-decompile
desc:
  es: "Decompilación de la placa recreativa Namco System 22, con los juegos reconstruidos para funcionar en un PC normal, con Linux o Windows. Cubre cuatro títulos de los años noventa: Prop Cycle (1996), jugable de principio a fin y con sonido; Rave Racer (1995), con carreras y sonido, y Tokyo Wars (1996) y Dirt Dash (1995), ambos jugables, con sonido y modo panorámico. Necesitas los archivos de cada juego por tu cuenta, en un conjunto de ROMs de MAME 0.271 o posterior."
  en: "Decompilation of the Namco System 22 arcade board, with the games rebuilt to run on an ordinary PC, on Linux or Windows. It covers four 1990s titles: Prop Cycle (1996), playable from start to finish with sound; Rave Racer (1995), with races and sound; and Tokyo Wars (1996) and Dirt Dash (1995), both playable, with sound and widescreen. You supply each game’s files yourself, from a MAME 0.271 or later ROM set."
tags:
  - arcade
  - mame
