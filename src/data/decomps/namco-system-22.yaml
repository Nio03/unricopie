name: "Namco System 21 / 22 / 23"
games: [ace-driver, armadillo-racing, cyber-commando, cyber-sled, dirt-dash, prop-cycle, rave-racer, time-crisis, time-crisis-ii, tokyo-wars]
console: arcade
repo: spacestate1/namco22-decompile
desc:
  es: "Namco 2x Systems: juegos de recreativa de Namco de los años noventa, de las placas System 21, 22 y 23, reconstruidos para funcionar en un PC normal, con Linux o Windows. Cubre diez juegos de 1993 a 1997: Prop Cycle, Rave Racer, Tokyo Wars, Dirt Dash, Armadillo Racing, Time Crisis, Ace Driver y Cyber Commando, de la System 22; Cyber Sled, de la System 21, y Time Crisis II, de la System 23. Todos se pueden jugar (Prop Cycle, de principio a fin), los Time Crisis admiten ratón o pistola de luz, y Rave Racer y Cyber Sled tienen juego en línea. Prop Cycle se decompiló a mano a partir de la salida de Ghidra; los demás se traducen a C con una herramienta del propio proyecto y se comprueban contra MAME. Necesitas los archivos de cada juego por tu cuenta, de un conjunto de ROM de MAME 0.271 o posterior. 56 de sus 79 commits llevan a Claude como coautor."
  en: "Namco 2x Systems: 1990s Namco arcade games from the System 21, 22, and 23 boards, rebuilt to run on an ordinary PC, on Linux or Windows. It covers ten games from 1993 to 1997: Prop Cycle, Rave Racer, Tokyo Wars, Dirt Dash, Armadillo Racing, Time Crisis, Ace Driver, and Cyber Commando on System 22; Cyber Sled on System 21; and Time Crisis II on System 23. All of them are playable (Prop Cycle from start to finish), the Time Crisis games support a mouse or a light gun, and Rave Racer and Cyber Sled have online play. Prop Cycle was hand-decompiled from Ghidra’s output; the others are translated to C by the project’s own tool and checked against MAME. You supply each game’s files yourself, from a MAME 0.271 or later ROM set. 56 of its 79 commits list Claude as a co-author."
