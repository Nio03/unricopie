  en: "Complete decompilation of the US PlayStation release (SLUS-01044), by the same author as the matching decompilation of the Nintendo 64 version. All 589,836 code bytes and 1,794 functions rebuild byte-for-byte from 1,898 source units. It also includes decoders for every file format on the disc (textures, models, levels, sound, and video). It includes neither the executable, the disc image, nor any extracted asset."
