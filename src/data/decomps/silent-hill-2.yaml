desc:
  es: "Copia del informe de Silent Hill 2 del monorrepositorio memory-of-alessa, subida aparte porque decomp.dev espera un juego por repositorio. Si llega a existir un proyecto independiente de Silent Hill 2, este repositorio se borrará."
