desc:
  es: "Decompilación de la versión estadounidense, y la base sobre la que se construye el recomp de Conker que también está en el catálogo. Se compila en Docker, con tu propia ROM colocada en la raíz del repositorio. El repositorio está archivado en GitHub desde mayo de 2026: el avance se conserva y sigue siendo utilizable, pero ya no progresa."
  en: "Decompilation of the US version, and the base that the Conker recomp, also in the catalog, is built on. It builds in Docker with your own ROM placed at the repository root. The repository has been archived on GitHub since May 2026: the progress is preserved and still usable, but it’s no longer moving."
