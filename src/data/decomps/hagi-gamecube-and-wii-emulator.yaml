name: Hagi GameCube and Wii Emulator
games: [super-mario-3d-all-stars]
console: switch
repo: GRAnimated/Hagi
decomp: GRAnimated/Hagi
desc:
  es: "Decompila Hagi, el emulador de GameCube y Wii que Nintendo usó en Super Mario 3D All-Stars, a partir del ejecutable de su versión de Super Mario Sunshine (SM3DAS v1.0.0). Eligen ese juego porque su ejecutable es solo Hagi, mientras que los juegos de Wii incluyen código recompilado de forma nativa que infla el ejecutable."
  en: "Decompiles Hagi, the GameCube and Wii emulator Nintendo used in Super Mario 3D All-Stars, from the executable of its Super Mario Sunshine (SM3DAS v1.0.0). That game was chosen because its executable is Hagi alone, while the Wii games contain natively recompiled code that inflates the executable."
