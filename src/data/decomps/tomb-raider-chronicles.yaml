name: "Tomb Raider: Chronicles (TOMB5, PS1)"
console: ps1
repo: TOMB5/TOMB5
desc:
  es: "Decompilación a C de Tomb Raider: Chronicles (Core Design, 2000) a partir de las versiones finales de PlayStation (NTSC, SLUS_013.11) y de PC, ya que el código original se perdió. No busca que el código coincida 1:1 con el original, sino que funcione igual; los nombres de funciones, variables y estructuras salen de los símbolos de depuración (.SYM y .MAP), de TRosettastone 3.0 y de GAMEWAD.OBJ. Su objetivo declarado era decompilar todo hasta la pantalla de título y pasar después al código de juego. Además de la versión de PS1, compila PSXPC_N: el código de PS1 para Windows y Linux (x86 de 32 bits) sobre una capa que emula el hardware de la consola, pensada para depurar y que lee los archivos de tu disco. También hay código para la versión de PC con DirectX 7 (PC_N). Sus últimas compilaciones para Windows son de octubre de 2020 y el último commit, de marzo de 2021. El repositorio incluye, en ensamblador MIPS, el desensamblado de partes del ejecutable de PS1 (unos 470 KB)."
  en: "A C decompilation of Tomb Raider: Chronicles (Core Design, 2000) based on the final PlayStation (NTSC, SLUS_013.11) and PC releases, since the original source code was lost. It doesn’t aim for code that matches the original 1:1, only for the same behavior; function, variable, and structure names come from debug symbols (.SYM and .MAP), TRosettastone 3.0, and GAMEWAD.OBJ. Its stated goal was to decompile everything up to the title screen and then move on to in-game code. Besides the PS1 build, it builds PSXPC_N: the PS1 code for Windows and Linux (32-bit x86) on a layer that emulates the console hardware, meant for debugging and reading the files from your disc. There’s also code for the PC release with DirectX 7 (PC_N). Its latest Windows builds are from October 2020 and its last commit from March 2021. The repository includes, as MIPS assembly, the disassembly of parts of the PS1 executable (about 470 KB)."
tags:
  - mips
