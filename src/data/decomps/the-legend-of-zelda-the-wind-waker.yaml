name: "The Legend of Zelda: The Wind Waker"
console: gamecube
repo: zeldaret/tww
decomp: zeldaret/tww
desc:
  es: "Decompilación en curso de la versión de GameCube, del equipo zeldaret, que mide por separado el avance del DOL y el de los módulos REL. Es la base del recomp de Wind Waker que está en el catálogo, y conviene no confundirla con la versión HD de Wii U, que tiene su propio proyecto."
  en: "Work-in-progress decompilation of the GameCube version by the zeldaret team, with DOL and REL module progress measured separately. It’s the base of the Wind Waker recomp in this catalog, and shouldn’t be confused with the Wii U HD version, which has its own separate project."
