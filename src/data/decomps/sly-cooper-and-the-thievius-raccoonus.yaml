desc:
  es: "Decompilación en curso de Sly Cooper and the Thievius Raccoonus para PS2. Compila el ejecutable NTSC-U (SCUS_971.98) con el objetivo de convertir todo el motor en código fuente exacto, y mantiene documentación del código en línea. 3 de sus últimos 100 commits llevan a Claude o Copilot como coautor."
  en: "Work-in-progress decompilation of Sly Cooper and the Thievius Raccoonus for PS2. It builds the NTSC-U executable (SCUS_971.98), aims to turn the whole engine into matching source, and hosts online documentation of the code. 3 of its last 100 commits list Claude or Copilot as a co-author."
