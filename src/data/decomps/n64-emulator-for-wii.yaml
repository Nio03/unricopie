name: N64 Emulator for Wii
console: wii
repo: zeldaret/oot-vc
decomp: zeldaret/oot-vc
desc:
  es: "Decompilación en curso del emulador de N64 de la Consola Virtual de Wii. Cubre nueve versiones japonesas, estadounidenses y europeas de Super Mario 64, Mario Kart 64 y Ocarina of Time; el trabajo se centra sobre todo en oot-j."
  en: "Work-in-progress decompilation of the N64 emulator used by Wii Virtual Console releases. It covers nine Japanese, US, and European builds of Super Mario 64, Mario Kart 64, and Ocarina of Time, mainly targeting oot-j."
