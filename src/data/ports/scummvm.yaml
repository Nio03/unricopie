name: ScummVM
category: fan-remake
status: fully
repo: scummvm/scummvm
homepage: https://www.scummvm.org
desc:
  es: "ScummVM: programa que sustituye a los ejecutables de cientos de aventuras gráficas, aventuras de texto y juegos de rol clásicos para jugarlos en sistemas actuales con los archivos de datos de tus propias copias. Nació en 2001 para los juegos de LucasArts hechos con SCUMM, como Maniac Mansion y la serie Monkey Island, y hoy reúne más de 120 motores, entre ellos los de Broken Sword, Myst, Blade Runner y, en 3D, Grim Fandango, Escape from Monkey Island y Myst III. Ofrece escaladores y filtros, shaders GLSL que se descargan desde el propio programa, corrección de la relación de aspecto, sincronización de juegos y partidas con Dropbox, OneDrive, Google Drive o Box, un servidor web para pasar archivos por la red local y lectura en voz alta de los textos del lanzador. Hay versiones para Windows, macOS y Linux, y para muchas otras plataformas. Desde la 2026.1.0 numera las versiones por año y publica una cada tres meses; la última, la 2026.4.0 (11 de octubre), añadió nueve juegos de Mortadelo y Filemón, Dracula: Resurrection, Star Wars: Rebel Assault I y II, Dungeon Master y más de 140 juegos del motor Wintermute. Sus normas admiten la ayuda de IA con condiciones y piden declararla en cada commit: unos 620 de sus casi 180 000 commits lo hacen, sobre todo con Codex, Kiro y Claude. Para algunos juegos incluye archivos de datos propios (como kyra.dat, hugo.dat o titanic.dat) con tablas, textos y lógica que venían dentro de los ejecutables originales, y parches para los scripts de Grim Fandango y Escape from Monkey Island."
  en: "ScummVM: a program that replaces the executables of hundreds of classic graphic adventures, text adventures, and RPGs so you can play them on current systems with the data files from your own copies. It began in 2001 for LucasArts games made with SCUMM, such as Maniac Mansion and the Monkey Island series, and now brings together more than 120 engines, among them those of Broken Sword, Myst, Blade Runner, and, in 3D, Grim Fandango, Escape from Monkey Island, and Myst III. It offers scalers and filters, GLSL shaders you can download from within the program, aspect ratio correction, game and save syncing through Dropbox, OneDrive, Google Drive, or Box, a web server for moving files over the local network, and text-to-speech for the launcher’s text. There are builds for Windows, macOS, and Linux, and for many other platforms. Since 2026.1.0 it numbers versions by year and releases one every three months; the latest, 2026.4.0 (October 11), added nine Mortadelo y Filemón games, Dracula: Resurrection, Star Wars: Rebel Assault I and II, Dungeon Master, and over 140 games on the Wintermute engine. Its rules allow AI assistance under conditions and require declaring it in each commit: about 620 of its nearly 180,000 commits do, mostly with Codex, Kiro, and Claude. For some games it includes its own data files (such as kyra.dat, hugo.dat, or titanic.dat) with tables, text, and logic that came inside the original executables, plus patches for the Grim Fandango and Escape from Monkey Island scripts."
requirements:
  es: "Los archivos de datos de tus propias copias de los juegos, de los discos originales o de tiendas digitales; la wiki del proyecto indica qué archivos necesita cada juego, y muchos motores los leen directamente de los instaladores originales. Algunos juegos los liberaron sus dueños y son gratuitos, y el paquete Snap para Linux trae varios de ellos y algunas demos. Además, Windows, macOS o Linux, entre otros sistemas."
  en: "The data files from your own copies of the games, from the original discs or from digital stores; the project’s wiki lists the files each game needs, and many engines can read them straight from the original installers. Some games were released for free by their owners, and the Linux Snap package comes with several of them and some demos. Plus Windows, macOS, or Linux, among other systems."
