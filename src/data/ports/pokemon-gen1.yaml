name: Gen1Recomp
category: fan-remake
console: gb
status: playable
repo: bryanthaboi/gen1recomp
originalDeveloper: Game Freak
engine: LOVE2D
desc:
  es: "Recreación nativa en Lua y LÖVE de Pokémon Rojo, Azul, Oro, Plata y Cristal: pese a su nombre, ya no se limita a la primera generación. El motor y el comportamiento de los mapas están escritos a mano; los datos y los gráficos se decodifican de la ROM que aporta el jugador. Es una recreación, no una recompilación estática."
  en: "A native Lua/LÖVE recreation of Pokémon Red, Blue, Gold, Silver, and Crystal: despite the name, it no longer stops at the first generation. The engine and map behavior are hand-written; the game data and graphics are decoded from a ROM the player supplies. It’s a recreation, not a static recompilation."
