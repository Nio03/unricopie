desc:
  es: "OpenTESArena: motor de código abierto escrito desde cero para The Elder Scrolls: Arena, el juego de DOS de 1994, con el objetivo de reproducir todos sus aspectos con un enfoque de sala limpia y añadir mejoras de comodidad; lo que se sabe del funcionamiento interno del original está documentado en su wiki. Ya funcionan la creación de personaje (salvo las preguntas para generar la clase), el combate con enemigos que atacan y dan botín y experiencia, la subida de nivel, recoger, equiparse y soltar objetos, las tiendas (comprar y vender, alquilar habitación en la taberna, curar enfermedades), los ciudadanos que pasean, dan indicaciones y cuentan rumores, y el viaje rápido a cualquier lugar del mapa del mundo. Aún faltan los materiales de las armaduras de placas, las pociones y objetos de uso, las misiones, los hechizos y guardar y cargar partida. Tiene un modo de control moderno, con WASD y vista con el ratón, y otro clásico; usa Vulkan por defecto y permite subir el límite de fotogramas a la frecuencia de tu monitor. La 0.18.0 (13 de agosto) añadió la inteligencia de combate de los enemigos, la subida de nivel, las conversaciones, el modo de robo y la detección de las versiones de Steam y GOG. Hay versiones para Windows x86-64, Linux x86-64 y Raspberry Pi 5, y macOS con Apple silicon."
  en: "OpenTESArena: an open-source engine written from scratch for The Elder Scrolls: Arena, the 1994 DOS game, aiming to replicate every aspect of it with a clean-room approach while adding quality-of-life changes; what’s known about the original’s inner workings is documented in its wiki. Character creation (except the class generation questions), combat with enemies that attack and drop loot and experience, leveling up, picking up, equipping, and dropping items, shops (buying and selling, renting a tavern room, curing diseases), citizens who wander, give directions, and share rumors, and fast travel anywhere on the world map already work. Plate armor materials, potions and on-use items, quests, spells, and saving and loading are still missing. It has a modern control mode, with WASD and mouselook, and a classic one; it uses Vulkan by default and lets you raise the frame rate cap to your monitor’s refresh rate. Version 0.18.0 (August 13) added enemy combat AI, leveling up, conversations, thieving mode, and detection of the Steam and GOG releases. There are builds for x86-64 Windows, x86-64 Linux and Raspberry Pi 5, and Apple silicon macOS."
requirements:
  es: "No hace falta comprar el juego: Bethesda distribuye The Elder Scrolls: Arena gratis, en Steam, en GOG o como Arena106Setup.zip en su web, y basta con sus archivos (en Linux y macOS, los del Arena106.exe autoextraíble). Encuentra solo la versión de Steam en todos los sistemas y la de GOG en Windows. Para la música, opcionalmente, el paquete de instrumentos eawpats que el proyecto publica en sus versiones. Además, Windows de 64 bits (con el Visual C++ Redistributable y OpenAL), Linux x86-64 o Raspberry Pi 5, o macOS con Apple silicon."
  en: "No need to buy the game: Bethesda gives The Elder Scrolls: Arena away for free, on Steam, on GOG, or as Arena106Setup.zip on its website, and its files are enough (on Linux and macOS, the ones from the self-extracting Arena106.exe). It finds the Steam release on its own on every system and the GOG release on Windows. For music, optionally, the eawpats instrument patch set the project publishes with its releases. Plus 64-bit Windows (with the Visual C++ Redistributable and OpenAL), x86-64 Linux or Raspberry Pi 5, or Apple silicon macOS."
