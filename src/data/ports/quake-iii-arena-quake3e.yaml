name: "Quake III Arena (Quake3e)"
category: source-port
console: pc
status: fully
repo: ec-/Quake3e
originalDeveloper: id Software
year: 1999
desc:
  es: "Quake3e: motor de Quake III Arena que busca ser rápido, seguro y compatible con todos los mods existentes del juego. Parte de la última revisión de ioquake3 anterior a SDL, el port que continúa el código fuente que id Software liberó en 2005, con los arreglos posteriores de ioquake3 y muchos cambios propios. Su renderizador Vulkan, basado en el de Quake-III-Arena-Kenny-Edition, añade iluminación dinámica por píxel, MSAA y supermuestreo, HDR, bloom, reflejos y dibujado a cualquier resolución; el renderizador OpenGL tiene los mismos efectos. También trae entrada de ratón directa, una máquina virtual QVM reescrita (con un compilador JIT x87 nuevo en la última versión), grabación de vídeo a través de ffmpeg y descargas rápidas de mapas por HTTP o FTP, y para los servidores, mejor protección contra ataques DoS, menos consumo de memoria y hasta 20 000 mapas por carpeta. Hay versiones para Windows (x86, x86-64 y ARM64), Linux (x86, x86-64 y ARM64) y macOS (Intel y Apple silicon), además de una compilación continua; la última versión con fecha, del 14 de octubre, incluye también una para Windows 98."
  en: "Quake3e: a Quake III Arena engine that aims to be fast, secure, and compatible with every existing mod for the game. It’s based on the last pre-SDL revision of ioquake3, the port that carries on the source code id Software released in 2005, with later ioquake3 fixes and many changes of its own. Its Vulkan renderer, based on Quake-III-Arena-Kenny-Edition’s, adds per-pixel dynamic lighting, MSAA and supersampling, HDR, bloom, reflections, and rendering at any resolution; the OpenGL renderer has the same effects. It also brings raw mouse input, a reworked QVM virtual machine (with a new x87 JIT compiler in the latest release), video capture through ffmpeg, and fast map downloads over HTTP or FTP, and for servers, better DoS protection, lower memory use, and up to 20,000 maps per folder. There are builds for Windows (x86, x86-64, and ARM64), Linux (x86, x86-64, and ARM64), and macOS (Intel and Apple silicon), plus a rolling build; the latest dated release, from October 14, also includes one for Windows 98."
requirements:
  es: "Una instalación de tu propia copia de Quake III Arena, en cuya carpeta se copian los ejecutables (el juego se lee de baseq3); encuentra sola la instalación de Steam. Además, Windows (también ARM64 y Windows 98), Linux o macOS."
  en: "An installation of your own copy of Quake III Arena, into whose folder you copy the executables (the game is read from baseq3); it finds the Steam install on its own. Plus Windows (ARM64 and Windows 98 included), Linux, or macOS."
