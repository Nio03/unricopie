name: F-Zero X
category: decomp-port
console: n64
status: playable
repo: Zorkats/G-Diffuser
decomp: inspectredc/fzerox
author: Zorkats
originalDeveloper: Nintendo EAD
year: 1998
desc:
  es: "G-Diffuser: port nativo de F-Zero X, sin emulador de por medio. Es un port completo del código fuente sobre la decompilación exacta de inspectredc/fzerox y la biblioteca libultraship (el mismo motor que usan Ship of Harkinian y Starship). Sobre el juego original añade un modo panorámico real, un menú de mejoras dentro del juego, varias mejoras de comodidad, mods mediante paquetes de texturas y compatibilidad completa con el 64DD Expansion Kit, incluidos Course Edit y las copas del DD."
  en: "G-Diffuser: a native F-Zero X port with no emulator in the loop. It’s a full source port on top of the inspectredc/fzerox matching decompilation and the libultraship runtime (the same engine behind Ship of Harkinian and Starship). On top of the original game, it adds true widescreen, an in-game enhancements menu, quality-of-life features, texture-pack modding, and full 64DD Expansion Kit support, including Course Edit and the DD cups."
requirements:
  es: "Tu propia ROM de F-Zero X (N64) y, para el contenido del 64DD, también tu propio volcado del Expansion Kit. El repositorio no incluye ROM, disco, IPL ni recursos extraídos."
  en: "Your own F-Zero X ROM (N64) and, for the 64DD content, your own Expansion Kit dump as well. The repository ships no ROM, disk, IPL, or extracted assets."
