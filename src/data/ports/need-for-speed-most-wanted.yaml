desc:
  es: "Reconstrucción en Unity de Need for Speed: Most Wanted (2005, PC), escrita desde cero mediante ingeniería inversa de speed.exe (v1.3) función por función. Lee de la carpeta del juego instalado los mapas, los coches, los menús, los scripts de la carrera, los sonidos y las escenas. Según el README, ha portado el 98 % del código del juego y permite jugar la carrera sin conexión desde la pantalla de inicio hasta la Blacklist: carreras, persecuciones, el refugio, el concesionario, la personalización, las series de desafíos, pantalla dividida y LAN. También carga texturas y modelos modificados desde una carpeta Mods. La única versión publicada es una compilación de prueba del 25 de octubre (un zip de unos 37 MB). 2 de sus 3 commits llevan a Claude como coautor."
  en: "A rebuild in Unity of Need for Speed: Most Wanted (2005, PC), written from scratch by reverse engineering speed.exe (v1.3) function by function. It reads the maps, cars, menus, career scripts, sounds, and cutscenes from the installed game folder. According to the README it has ported 98% of the game’s code and the offline career can be played from the press-start screen to the Blacklist: races, pursuits, the safehouse, car lot, customization, the Challenge Series, split screen, and LAN. It also loads modified textures and models from a Mods folder. The only release is a test build from October 25 (a zip of about 37 MB). 2 of its 3 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Need for Speed: Most Wanted (2005) para PC, con los datos de la versión 1.3 (el juego con el parche oficial), instalada en una carpeta que contenga GLOBAL, TRACKS, CARS, FRONTEND y speed.exe; se indica con -gameRoot, un archivo gameroot.txt o la variable NFSMW_ROOT. Solo la lee, no escribe en ella. Para compilar hace falta Unity 6000.4.2f1."
  en: "Your own copy of Need for Speed: Most Wanted (2005) for PC, with the v1.3 data (the officially patched game), installed in a folder that holds GLOBAL, TRACKS, CARS, FRONTEND, and speed.exe; it is pointed to with -gameRoot, a gameroot.txt file, or the NFSMW_ROOT variable. It only reads it and never writes to it. Building it needs Unity 6000.4.2f1."
