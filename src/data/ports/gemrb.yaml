desc:
  es: "GemRB (Game Engine Made with preRendered Background): reimplementación de código abierto y multiplataforma del Infinity Engine de BioWare, en sus ocho versiones, el motor de Baldur’s Gate, Icewind Dale y Planescape: Torment. Según su propia tabla, Baldur’s Gate, Baldur’s Gate II, Icewind Dale e Icewind Dale II se pueden jugar hasta el final y están pulidos; Planescape: Torment también se completa, pero le faltan algunas funciones. De las Enhanced Edition solo admite, en pruebas, Baldur’s Gate II: EE (la parte de Shadows of Amn se puede terminar); el multijugador no está implementado. Corre a cualquier resolución sin el mod panorámico (la interfaz queda centrada a su tamaño), con escalado de toda la ventana y a cualquier tasa de fotogramas, admite pantallas táctiles y mandos, y su diseño por complementos quita límites del motor original y facilita los mods; los mods de los juegos funcionan, salvo lo que dependa de parchear el ejecutable. Trae una pequeña demo propia que funciona sin ningún juego. La 0.9.5 (23 de marzo) reescribió parte del audio, con sonido espacial, mejoró el mando, aceleró mucho la búsqueda de caminos, llevó a todos los juegos el zoom de las Enhanced Edition y dejó Icewind Dale II tan pulido como los demás. Hay versiones para Windows, Linux (también en Flatpak) y macOS. Cuatro de sus más de 28 000 commits, todos de 2026, indican que el fallo se encontró o se corrigió con Claude."
  en: "GemRB (Game Engine Made with preRendered Background): an open-source, cross-platform reimplementation of BioWare’s Infinity Engine, in all eight of its versions, the engine behind Baldur’s Gate, Icewind Dale, and Planescape: Torment. According to its own table, Baldur’s Gate, Baldur’s Gate II, Icewind Dale, and Icewind Dale II can be played to the end and are polished; Planescape: Torment can be completed too, but lacks a few features. Of the Enhanced Editions it only supports, experimentally, Baldur’s Gate II: EE (its Shadows of Amn part can be finished); multiplayer isn’t implemented. It runs at any resolution without the widescreen mod (the interface stays centered at its size), with whole-window scaling and at any frame rate, supports touchscreens and controllers, and its plugin-based design removes limits of the original engine and makes modding easier; the games’ mods work, except whatever depends on patching the executable. It ships a small demo of its own that runs without any game. Version 0.9.5 (March 23) partly rewrote the audio, with spatial sound, improved controller input, greatly sped up pathfinding, brought the Enhanced Editions’ zoom to every game, and made Icewind Dale II as polished as the others. There are builds for Windows, Linux (also on Flatpak), and macOS. Four of its more than 28,000 commits, all from 2026, say the bug was found or fixed with Claude."
requirements:
  es: "Los archivos de tu propia copia de alguno de los juegos originales del Infinity Engine (Baldur’s Gate, Baldur’s Gate II, Icewind Dale, Icewind Dale II o Planescape: Torment, con sus expansiones), instalados; también vale la demo gratuita de Baldur’s Gate II, y sin ningún juego arranca su propia demo. Fuera de Windows, el juego se copia de una instalación de Windows o se instala con WINE o con unshield. Se recomienda instalar los fixpacks. Además, Windows (con el Visual C++ Redistributable de 2017), Linux o macOS."
  en: "The files from your own copy of one of the original Infinity Engine games (Baldur’s Gate, Baldur’s Gate II, Icewind Dale, Icewind Dale II, or Planescape: Torment, with their expansions), installed; the free Baldur’s Gate II demo works too, and with no game at all it runs its own demo. Outside Windows, the game is copied from a Windows install or installed with WINE or unshield. Installing the fixpacks is recommended. Plus Windows (with the Visual C++ 2017 Redistributable), Linux, or macOS."
