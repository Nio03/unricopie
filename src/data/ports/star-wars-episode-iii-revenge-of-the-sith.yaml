desc:
  es: "SWROTS-PC: port nativo no oficial para Windows de la versión de Xbox. No se emula ni se recompila nada: como la Xbox tiene un procesador x86, el código original del juego corre tal cual en el procesador del PC, dentro de un programa de 32 bits, y lo que no existe en un PC se sustituye por código nativo: el núcleo de la Xbox (unas 130 funciones) y las bibliotecas que el juego lleva enlazadas, Direct3D 8 (sobre Direct3D 9), DirectSound (sobre XAudio2) y la de los mandos. Los cambios de nivel y los reinicios de misión, que en la consola reinician el juego, ocurren en la misma ventana. Ofrece cualquier tamaño de ventana o pantalla completa, panorámico 16:9, más resolución interna, filtrado anisótropo, teclado y ratón, y mandos de Xbox y de PlayStation (DualShock 4 y DualSense) con vibración; los 60 fps son experimentales, porque parte de la lógica va a 30. Añade lo que la versión de Xbox no tenía: Yoda como luchador del modo versus, que el juego dejó a medias; jugar las misiones con cualquier personaje, traje o cuerpo y hacer aparecer personajes desde la consola; cooperativo para dos jugadores en las misiones de la historia, desde la 0.4.0 (10 de octubre); cámara libre; la consola y las pantallas de depuración ocultas del juego, y mods como archivos sueltos. Está en desarrollo temprano: se juega con cambios de nivel, reinicios y partidas guardadas, pero nadie lo ha terminado aún de principio a fin, y los botones en pantalla siguen siendo los del mando de Xbox. Adapta código de Cxbx-Reloaded, y en Linux y Steam Deck funciona con Proton, según una guía de la comunidad."
  en: "SWROTS-PC: an unofficial native Windows port of the Xbox version. Nothing is emulated or recompiled: since the Xbox has an x86 CPU, the game’s original code runs as-is on the PC’s CPU, inside a 32-bit program, and what doesn’t exist on a PC is replaced with native code: the Xbox kernel (about 130 functions) and the libraries the game links in, Direct3D 8 (on Direct3D 9), DirectSound (on XAudio2), and the controller library. Level changes and mission restarts, which reboot the game on the console, happen in the same window. It offers any window size or fullscreen, 16:9 widescreen, higher internal resolution, anisotropic filtering, keyboard and mouse, and Xbox and PlayStation controllers (DualShock 4 and DualSense) with rumble; 60 fps is experimental, since some of the game logic runs at 30. It adds what the Xbox release never had: Yoda as a Versus fighter, which the game left unfinished; playing the missions as any character, costume, or body and spawning characters from the console; two-player co-op in the story missions, since 0.4.0 (October 10); a free camera; the game’s hidden debug console and displays; and loose-file mods. It’s in early development: it plays through level changes, restarts, and saving, but nobody has finished it from start to finish yet, and on-screen prompts still show the Xbox controller. It adapts code from Cxbx-Reloaded, and on Linux and Steam Deck it runs through Proton, per a community guide."
requirements:
  es: "Tu propia imagen de disco de Star Wars: Episode III – Revenge of the Sith para Xbox, versión norteamericana (el ejecutable tiene que dar el MD5 6460ef37862de3af364a0563a0a18c4e), como .iso o .xiso, o dentro de un .7z, .zip o .rar; la primera vez copia los archivos del juego a una carpeta GameData (unos 2,5 GB). Además, Windows 10 (1803) o posterior de 64 bits (el port es de 32 bits) y una tarjeta gráfica con Direct3D 9."
  en: "Your own disc image of Star Wars: Episode III – Revenge of the Sith for Xbox, North American release (the executable must match MD5 6460ef37862de3af364a0563a0a18c4e), as an .iso or .xiso, or inside a .7z, .zip, or .rar; on first run it copies the game files into a GameData folder (about 2.5 GB). Plus 64-bit Windows 10 (1803) or later (the port itself is 32-bit) and a Direct3D 9 graphics card."
