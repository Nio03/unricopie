originalDeveloper: Softstar
year: 1995
desc:
  es: "SDLPal: reimplementación multiplataforma, basada en SDL, de Xian Jian Qi Xia Zhuan (仙剑奇侠传), el RPG chino de Softstar conocido como PAL, que funciona con los datos del juego original. La creó Wei Mingzhi en 2009 y hoy la mantiene un equipo; muchos de sus conceptos vienen de la documentación del PAL Research Project. No es un emulador: el juego corre como programa nativo, y solo se emulan los chips de sonido OPL2 y OPL3 (con núcleos de DOSBox, MAME y Chocolate Doom) para tocar la música RIX de la versión para DOS. Admite los datos de las versiones para DOS y para Windows 95 y puede sumar lo mejor de cada una, como las descripciones de objetos en la de DOS o la música RIX en la de Windows 95, cuyos vídeos AVI también reproduce. Añade música en MIDI, OGG o MP3, traducciones con archivos de mensajes y fuentes externos, filtros de imagen con shaders GLSL de RetroArch (experimental) y una ventana de configuración al arrancar, y sus partidas guardadas son compatibles con las del juego original en los dos sentidos. Hay versiones para Windows, Linux y macOS, y también para Android, iOS, Wii, 3DS, navegador y como núcleo de libretro. La última versión publicada, la 3.0.2025.0616 (junio de 2025), ya usa SDL3; en 2026 siguió con arreglos del mando y del intérprete de scripts, y la versión de Visual Studio recuperó la compatibilidad con Windows XP."
  en: "SDLPal: a cross-platform, SDL-based reimplementation of Xian Jian Qi Xia Zhuan (仙剑奇侠传), Softstar’s Chinese RPG known as PAL, that runs on the original game’s data. Wei Mingzhi created it in 2009, and a team maintains it today; many of its concepts come from the PAL Research Project’s documentation. It isn’t an emulator: the game runs as a native program, and only the OPL2 and OPL3 sound chips are emulated (with cores from DOSBox, MAME, and Chocolate Doom) to play the DOS version’s RIX music. It supports data from the DOS and Windows 95 versions and can combine the best of each, such as item descriptions in the DOS version or RIX music in the Windows 95 one, whose AVI videos it also plays. It adds MIDI, OGG, or MP3 music, translations through external message and font files, image filters with RetroArch GLSL shaders (experimental), and a settings window at launch, and its saves work with the original game’s and vice versa. There are builds for Windows, Linux, and macOS, plus Android, iOS, Wii, 3DS, the browser, and a libretro core. The latest release, 3.0.2025.0616 (June 2025), already uses SDL3; in 2026 work continued with controller and script interpreter fixes, and the Visual Studio build regained Windows XP support."
requirements:
  es: "Los archivos de datos de tu propia copia de Xian Jian Qi Xia Zhuan: la versión para DOS, en disquetes o en CD, o la de Windows 95, en chino tradicional o la «98 柔情篇» en chino simplificado; la de Sega Saturn no sirve. El proyecto recomienda la versión que se vende en Steam, y su wiki enlaza sitios chinos donde se pueden descargar gratis y de forma legal. Además, Windows (también XP), Linux (en AppImage) o macOS."
  en: "The data files from your own copy of Xian Jian Qi Xia Zhuan: the DOS version, on floppy disks or CD, or the Windows 95 version, in Traditional Chinese or the Simplified Chinese “98 柔情篇”; the Sega Saturn version doesn’t work. The project recommends the version sold on Steam, and its wiki links Chinese sites where it can be downloaded legally for free. Plus Windows (XP included), Linux (as an AppImage), or macOS."
