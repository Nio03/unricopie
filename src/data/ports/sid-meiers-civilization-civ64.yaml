desc:
  es: "Ejecuta la versión de 1992 de Sid Meier's Civilization para Windows (la de 16 bits para Windows 3.1) como programa nativo de 64 bits para Windows y como aplicación nativa para macOS (Apple Silicon e Intel), sin DOSBox, Wine ni máquinas virtuales. Según el autor, el civ.exe original se recuperó del código máquina a C legible (1.065 funciones) y las 699 funciones que se ejecutan se tradujeron a C portable y se compararon instrucción por instrucción con el original; la biblioteca de Borland se sustituyó y el entorno de Windows 3.1 se recrea dentro del programa. Las reglas, la IA y los guardados son los del original, con sus errores, y se puede cambiar en cualquier momento a los gráficos de Civilization para DOS. El código no está publicado: el repositorio solo contiene la documentación y las capturas, y el programa (civ64.exe, Civ64-Win7.exe y el .dmg de macOS, de unos 5 MB) va como archivo ya compilado en cada versión; el autor dice que el código propio se publicará al final del proyecto, y que el C recuperado del original no se publicará. Según el README, juega el juego entero, de los créditos iniciales a los finales. La 1.2.5 (25 de octubre) es la última de ocho versiones. Declara que se hizo con ayuda de Claude; 12 de sus 19 commits lo llevan como coautor."
  en: "Runs the 1992 Windows version of Sid Meier’s Civilization (the 16-bit Windows 3.1 release) as a native 64-bit Windows program and as a native macOS application (Apple silicon and Intel), with no DOSBox, Wine, or virtual machine. According to the author, the original civ.exe was recovered from machine code into readable C (1,065 functions) and the 699 functions that can run were translated into portable C and compared instruction by instruction with the original; the Borland run-time library was replaced and the Windows 3.1 environment is re-created inside the program. The rules, the AI, and the saves are the original’s, bugs included, and you can switch to the graphics of Civilization for DOS at any moment. The code isn’t published: the repository only holds documentation and screenshots, and the program (civ64.exe, Civ64-Win7.exe, and the macOS .dmg, about 5 MB) ships as a prebuilt file in each release; the author says the project’s own code will be published at the end of the project, and that the recovered C of the original will not be. According to the README, it plays the whole game, from the opening credits to the end games. Version 1.2.5 (October 25) is the latest of eight releases. It states it was made with Claude’s help; 12 of its 19 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Sid Meier's Civilization para Windows (la de Windows 3.1), con todos sus archivos, en una carpeta CivWin o en un CivWin.zip junto al programa: solo acepta un civ.exe de 832.512 bytes con SHA-256 a66ec64020f10adb81613964f3d08a11ea278b6a5a060c8e49d1ea1fd3ba1788. Opcional, para los gráficos de DOS: tu copia de Civilization para DOS 475.05 (CIV.EXE de 305.030 bytes), en CivDos. Además, Windows 10 (1607 o posterior) u 11 de 64 bits (Civ64-Win7.exe para Windows 7, sin probar todavía en ese sistema) o macOS."
  en: "Your own copy of Sid Meier’s Civilization for Windows (the Windows 3.1 release), with all its files, in a CivWin folder or a CivWin.zip next to the program: it only accepts a civ.exe of 832,512 bytes with SHA-256 a66ec64020f10adb81613964f3d08a11ea278b6a5a060c8e49d1ea1fd3ba1788. Optional, for the DOS graphics: your copy of Civilization for DOS 475.05 (CIV.EXE of 305,030 bytes), in CivDos. Plus 64-bit Windows 10 (1607 or later) or 11 (Civ64-Win7.exe for Windows 7, not yet tried on that system), or macOS."
