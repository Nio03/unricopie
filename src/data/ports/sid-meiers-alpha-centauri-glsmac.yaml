desc:
  es: "GLSMAC: reimplementación libre de Sid Meier's Alpha Centauri y su expansión Alien Crossfire, escrita desde cero en C++ con OpenGL y SDL2, que carga las imágenes, los sonidos y demás recursos de tu instalación del juego. No desensambla los ejecutables originales ni enlaza con sus bibliotecas. Quiere reproducir el juego original, con sus modelos, textos, facciones y reglas, pero rehace el motor gráfico y el de red, que no será compatible con el del original; la generación de mapas, la IA y la música dinámica se recrean desde cero. Ya tiene generador de mapas aleatorios, casi toda la interfaz, un editor de mapas y, desde la v0.3, una sala multijugador para crear partidas y unirse a ellas, con chat. La lógica del juego y la interfaz están escritas en scripts parecidos a JavaScript (.gls.js) que se pueden modificar. El juego en sí aún está en construcción: el trabajo de 2026, camino de la v0.4, se centra en las bases (producción, instalaciones y casillas trabajadas). Hay versiones de 64 bits para Windows y Ubuntu; la última estable es la v0.3-db4dbc9 (31 de mayo) y hay compilaciones de desarrollo al día. En macOS se compila, pero falla por problemas con OpenGL. Su autor declara que no usa código generado por IA, aunque acepta contribuciones hechas con ella: tres commits de un colaborador lo declaran, uno de ellos con Claude como coautor."
  en: "GLSMAC: a free reimplementation of Sid Meier’s Alpha Centauri and its Alien Crossfire expansion, written from scratch in C++ with OpenGL and SDL2, that loads the images, sounds, and other resources from your installed copy of the game. It doesn’t disassemble the original executables or link to their libraries. It aims to replicate the original game, with its models, texts, factions, and rules, but rewrites the graphics engine and the network code, which won’t be compatible with the original’s; map generation, AI, and dynamic music are recreated from scratch. It already has a random map generator, most of the interface, a map editor, and, since v0.3, a multiplayer lobby for hosting and joining games, with chat. The game logic and interface are written in moddable JavaScript-like scripts (.gls.js). The game itself is still under construction: the 2026 work, on the way to v0.4, focuses on bases (production, facilities, and worked tiles). There are 64-bit builds for Windows and Ubuntu; the latest stable one is v0.3-db4dbc9 (May 31), and development builds are kept up to date. It builds on macOS but crashes because of OpenGL issues. Its author states that they don’t use AI-generated code, though they accept contributions made with it: three commits by one contributor declare it, one of them listing Claude as a co-author."
requirements:
  es: "Tu propia copia de Sid Meier's Alpha Centauri con la expansión Alien Crossfire instalada; valen las versiones de GOG, Steam (Planetary Pack), Loki y Legacy. En el primer arranque te pide la carpeta del juego. Además, Windows o Linux de 64 bits y, para ir a 60 fps, una tarjeta gráfica como una Intel HD 4400, Radeon R7 o GeForce GT 710, con 2 a 4 GB de RAM."
  en: "Your own copy of Sid Meier’s Alpha Centauri with the Alien Crossfire expansion installed; the GOG, Steam (Planetary Pack), Loki, and Legacy releases are supported. On first launch it asks for the game folder. Plus 64-bit Windows or Linux and, for 60 fps, a graphics card along the lines of an Intel HD 4400, Radeon R7, or GeForce GT 710, with 2–4 GB of RAM."
