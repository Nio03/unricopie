desc:
  es: "Código fuente de Celeste 64: Fragments of the Mountain, el juego de plataformas en 3D que el equipo original de Celeste hizo en menos de dos semanas para el sexto aniversario de Celeste y que publicó gratis en enero de 2024. Sus autores lo comparan con un juego hecho en una game jam de fin de semana, con bibliotecas pensadas sobre todo para juegos en 2D: está escrito en C# con Foster y SDL3, los niveles se hicieron con TrenchBroom, los modelos con Blender y las texturas con Aseprite, y el sonido usa FMOD. El repositorio trae el juego completo: el código, con licencia MIT, y todo el contenido (modelos, texturas, mapas, sonido y textos), que sigue siendo de Maddy Makes Games, aunque sus autores permiten usarlo en mods, niveles y juegos de fans sin ánimo de lucro siempre que quede claro que no son obra suya. En GitHub hay versiones para Windows de 64 bits, Linux (x64, ARM64 y ARM32) y macOS (Intel y Apple Silicon); la última es la 1.1.1 (6 de febrero de 2024). Desde entonces el código pasó a SDL3 y .NET 10, llegó a la versión 1.2.0 en agosto de 2026 y en septiembre sumó opciones para invertir la cámara y un selector de idioma con traducciones al coreano y al alemán."
  en: "The source code of Celeste 64: Fragments of the Mountain, the 3D platformer the original Celeste team made in under two weeks for Celeste’s sixth anniversary and released for free in January 2024. Its makers compare it to a weekend game jam entry, built with libraries mostly intended for 2D games: it’s written in C# with Foster and SDL3, its levels were made in TrenchBroom, its models in Blender, and its textures in Aseprite, and its audio uses FMOD. The repository holds the whole game: the code, under the MIT license, and all of the content (models, textures, maps, audio, and text), which still belongs to Maddy Makes Games, though its makers allow it to be used in non-commercial mods, levels, and fan games as long as it’s clear they didn’t make them. GitHub has builds for 64-bit Windows, Linux (x64, ARM64, and ARM32), and macOS (Intel and Apple silicon); the latest is 1.1.1 (February 6, 2024). Since then the code has moved to SDL3 and .NET 10, reached version 1.2.0 in August 2026, and in September gained camera inversion options and a language selector with Korean and German translations."
requirements:
  es: "Ninguna copia: el juego es gratuito y sus autores publican el juego completo, con todo su contenido, en GitHub y en itch.io. Para jugar, Windows 10 o posterior de 64 bits, Linux con glibc 2.35 o posterior (x64, ARM64 o ARM32) o macOS Monterey o posterior (Intel o Apple Silicon); para compilarlo, .NET 10."
  en: "No copy needed: the game is free, and its makers publish the whole game, with all of its content, on GitHub and itch.io. To play, 64-bit Windows 10 or later, Linux with glibc 2.35 or later (x64, ARM64, or ARM32), or macOS Monterey or later (Intel or Apple silicon); to build it, .NET 10."
