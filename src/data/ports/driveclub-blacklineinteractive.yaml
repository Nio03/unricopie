name: Driveclub (BlackLineInteractive)
category: native-layer
console: ps4
status: playable
repo: BlackLineInteractive/Driveclub-Port
author: BlackLineInteractive
originalDeveloper: Evolution Studios
year: 2014
desc:
  es: "Driveclub Native: el código x86-64 de la versión de PS4 corre directamente en el procesador, sin recompilar, y solo se reemplazan las bibliotecas del sistema de Sony y la GPU. Tiene dos versiones independientes. La de macOS, de BlackLineInteractive, es para Mac con procesador Intel, usa la versión 1.05 del juego y un renderizador propio en Metal hecho para este juego. La de Windows, DCport, la mantiene qnfn: parte del runtime de bloodborne_pc, usa la versión 1.28 y el renderizador Vulkan de shadPS4, y añade FSR 3.1, 4 y 4.1.1 como antialiasing (el 4.1.1 se construye en tu equipo a partir de tu propia DLL de AMD), además de un launcher con actualizaciones automáticas y elección de idioma. Los procesadores Intel funcionan desde la 0.3.5, que sustituye una instrucción exclusiva de AMD que usa el juego. La versión de Windows va por la 0.4.2 (20 de octubre)."
  en: "Driveclub Native: the PS4 version’s x86-64 code runs directly on the CPU, without recompiling, and only Sony’s system libraries and the GPU are replaced. It has two independent backends. The macOS one, by BlackLineInteractive, is for Intel Macs, uses game version 1.05, and has its own Metal renderer made for this game. The Windows one, DCport, is maintained by qnfn: it builds on the bloodborne_pc runtime, uses version 1.28 and shadPS4’s Vulkan renderer, and adds FSR 3.1, 4, and 4.1.1 as anti-aliasing (4.1.1 is built on your PC from your own AMD DLL), plus a launcher with automatic updates and a language choice. Intel CPUs work since 0.3.5, which replaces an AMD-only instruction the game uses. The Windows version is at 0.4.2 (October 20)."
requirements:
  es: "Tu propio volcado descifrado de Driveclub para PS4: en Windows, la versión 1.28 (europea, CUSA00003, o estadounidense, CUSA00093); en Mac, la 1.05. En Windows hacen falta Windows 10 u 11 de 64 bits, un procesador con AVX y una tarjeta gráfica con Vulkan 1.3; en macOS, un Mac con procesador Intel y una tarjeta gráfica con Metal 3."
  en: "Your own decrypted Driveclub PS4 dump: on Windows, version 1.28 (European CUSA00003 or US CUSA00093); on Mac, 1.05. Windows needs 64-bit Windows 10 or 11, a CPU with AVX, and a Vulkan 1.3 graphics card; macOS needs an Intel Mac with a Metal 3 graphics card."
