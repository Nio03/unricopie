desc:
  es: "Doom 64 EX+: continuación comunitaria del Doom 64 EX original de Samuel «Kaiser» Villarreal, que busca recrear fielmente la experiencia de Nintendo 64 con funciones modernas. Usa el IWAD de la remasterización oficial de Nightdive de 2020 (los IWAD de las versiones antiguas, hechos con el volcado de la ROM, ya no sirven) y admite sus «Lost Levels», los PWAD, los archivos KPF y los mods de la remasterización. Cambia FluidSynth por FMOD Studio para el audio, adopta SDL3, avisa al descubrir secretos, admite mapas más allá de MAP40 y tiene shaders para el filtrado de tres puntos de la N64. El 5 de noviembre de 2025 su autor lo dio por «terminado y completo», invitó a hacer forks y archivó el repositorio. La última versión, la 5.2.0.0 (20 de octubre de 2025), trae paquetes para Windows de 64 bits y un .dmg para macOS. Código bajo la Doom Source License."
  en: "Doom 64 EX+: a community continuation of Samuel “Kaiser” Villarreal’s original Doom 64 EX, which aims to faithfully recreate the Nintendo 64 experience with modern features. It uses the IWAD from Nightdive’s official 2020 remaster (the ROM-dump-based IWADs of older versions no longer work) and supports its “Lost Levels,” PWADs, KPF files, and the remaster’s mods. It swaps FluidSynth for FMOD Studio for audio, adopts SDL3, announces secrets when found, supports maps past MAP40, and has shaders for the N64’s three-point filtering. On November 5, 2025 its author declared it “done and complete,” invited forks, and archived the repository. The latest release, 5.2.0.0 (October 20, 2025), has packages for 64-bit Windows and a .dmg for macOS. Code under the Doom Source License."
requirements:
  es: "El IWAD de tu propia copia de la remasterización oficial de DOOM 64 (Nightdive, 2020), de Steam o de GOG; el juego los busca solo en las carpetas de GOG (Windows) y Steam (Windows y Linux). Windows, macOS o Linux; el audio usa FMOD."
  en: "The IWAD from your own copy of the official DOOM 64 remaster (Nightdive, 2020), from Steam or GOG; the game looks for it by itself in the GOG (Windows) and Steam (Windows and Linux) folders. Windows, macOS, or Linux; the audio uses FMOD."
