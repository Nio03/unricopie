originalDeveloper: Apogee Software
year: 1994
desc:
  es: "Barrett: port de Rise of the Triad basado en rottexpr, centrado en la comodidad de jugadores y desarrolladores, con más compatibilidad, funciones nuevas y mejor soporte del hardware actual. Usa SDL2 y SDL2_mixer y se compila con CMake (GCC o Clang; en Windows, algo como MinGW). La 1.3-beta (14 de junio) renovó la pantalla: corrección de relación de aspecto, que estira el render por 1,2 para imitar los píxeles altos de VGA, menú de resoluciones ordenado y etiquetado por proporción, cambio de resolución sin reiniciar, resolución por defecto según el monitor y HUD y vistas previas de partidas guardadas corregidos. En Linux la música usa un soundfont (userdata/barrett.sf2 o los del sistema); en Windows, el MIDI del sistema; el menú de opciones extra permite la emulación de OPL. Hay compilaciones para Windows, Linux y macOS. Código bajo GPL-2.0, sobre el de Apogee y el port de icculus.org."
  en: "Barrett: a Rise of the Triad source port based on rottexpr, focused on quality of life for players and developers, with wider compatibility, new features, and better support for modern hardware. It uses SDL2 and SDL2_mixer and builds with CMake (GCC or Clang; on Windows, something like MinGW). Version 1.3-beta (June 14) overhauled the display: aspect ratio correction, which stretches the render by 1.2 to imitate VGA’s tall pixels, a resolution menu sorted and labeled by aspect ratio, resolution changes without a restart, a default resolution based on the monitor, and fixed HUD and save-preview scaling. On Linux, music uses a soundfont (userdata/barrett.sf2 or the system ones); on Windows, the system MIDI; the extended options menu can enable OPL emulation. There are builds for Windows, Linux, and macOS. Licensed under GPL-2.0, on top of Apogee’s code and the icculus.org port."
requirements:
  es: "Los archivos de tu propia copia de Rise of the Triad: DEMO1_3.DMO a DEMO4_3.DMO y REMOTE1.RTS, más DARKWAR.RTC, DARKWAR.RTL y DARKWAR.WAD (versión registrada) o HUNTBGIN.RTC, HUNTBGIN.RTL y HUNTBGIN.WAD (la versión shareware), todos en la carpeta del ejecutable. Además, SDL2 y SDL2_mixer; en Linux, un soundfont (FluidR3 como alternativa)."
  en: "The files from your own copy of Rise of the Triad: DEMO1_3.DMO to DEMO4_3.DMO and REMOTE1.RTS, plus DARKWAR.RTC, DARKWAR.RTL, and DARKWAR.WAD (registered version) or HUNTBGIN.RTC, HUNTBGIN.RTL, and HUNTBGIN.WAD (the shareware version), all in the executable’s folder. Plus SDL2 and SDL2_mixer; on Linux, a soundfont (FluidR3 as the fallback)."
