desc:
  es: "Port nativo no oficial para Windows de la versión de PS4: el código x86-64 original del juego corre directamente en el procesador, un entorno de ejecución de PS4 reimplementado sustituye las bibliotecas del sistema y los gráficos se traducen a Vulkan; no es un emulador general. El README lo califica de preversión jugable: arranca, llega a los menús y al juego, guarda y se juega por las primeras misiones, y se ven los poderes de neón de Fetch, el rastro de la carrera, las luces y las partículas. Va a unos 35-45 fps con el renderizador v2 (el predeterminado) y a 15-25 con el clásico, en un Ryzen con una RTX 4070 SUPER; el objetivo son 30 fps estables en equipos de gama media. Los shaders se compilan la primera vez (2-3 minutos). El launcher se actualiza solo, acepta pantallas panorámicas (experimental) y se puede lanzar desde Steam. La 0.3.8 (25 de octubre) es la última de 11 versiones, con una para Windows y otra para Linux. 91 de sus últimos 100 commits llevan a Claude como coautor."
  en: "An unofficial native Windows port of the PS4 version: the game’s original x86-64 code runs directly on the CPU, a reimplemented PS4 runtime stands in for the system libraries, and the graphics are translated to Vulkan; it is not a general-purpose emulator. The README calls it an early, playable preview: it boots, reaches the menus and gameplay, saves, and plays through the first missions, and Fetch’s neon powers, the dash trail, lights, and particles render. It runs at about 35-45 fps with renderer v2 (the default) and 15-25 with the classic one, on a Ryzen with an RTX 4070 SUPER; the goal is a steady 30 fps on mid-range PCs. Shaders are compiled on the first start (2-3 minutes). The launcher updates itself, supports ultrawide (experimental), and can be started from Steam. Version 0.3.8 (October 25) is the latest of 11 releases, with one build for Windows and one for Linux. 91 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propio volcado de inFAMOUS First Light para PS4, hecho con tu propia consola (probado con el volcado europeo CUSA00897, juego base 1.00), en una carpeta con eboot.bin y sce_sys. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Vulkan 1.3 y un procesador con AVX (los de Intel sirven: las instrucciones solo de AMD que usa el juego se emulan)."
  en: "Your own dump of inFAMOUS First Light for PS4, made from your own console (tested with the European dump CUSA00897, base game 1.00), in a folder with eboot.bin and sce_sys. Plus 64-bit Windows 10 or 11, a Vulkan 1.3 graphics card, and a CPU with AVX (Intel CPUs work: the AMD-only instructions the game uses are emulated)."
