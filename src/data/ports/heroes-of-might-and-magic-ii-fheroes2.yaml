desc:
  es: "fheroes2: recreación del motor de Heroes of Might and Magic II, escrita desde cero, que usa los recursos del juego original sin modificar ninguno de sus archivos. Reproduce el juego sin tocar su equilibrio, y suma resoluciones altas, una IA reescrita que decide mejor y sin las ventajas ocultas de la original (ver todo el mapa o recibir más criaturas cada semana), muchas correcciones y mejoras de interfaz: más información sobre criaturas y hechizos, batallas instantáneas o que se pueden reiniciar, teclas reasignables y más, recogidas en una página de su documentación. Se juegan las campañas de The Succession Wars y de The Price of Loyalty, y tiene partidas por turnos en el mismo equipo, un modo solo de batallas, un generador de mapas aleatorios y un editor de mapas propio. Está traducido a más de 20 idiomas y no carga las partidas guardadas del juego original. Hay versiones para Windows, macOS y Linux, y también para Android, PS Vita y Switch. La 1.0.0 salió el 21 de diciembre de 2022 y la última, la 1.1.17, el 30 de junio, con una primera versión de las pruebas automáticas de mapas en el editor y mejoras de la IA. Si no tienes el juego, el instalador de Windows y un script incluido ofrecen descargar la demo gratuita en inglés desde archive.org y usar sus recursos; es opcional."
  en: "fheroes2: a from-scratch recreation of the Heroes of Might and Magic II engine that uses the original game’s resources without modifying any of its files. It reproduces the game without changing its balance, and adds high resolutions, a rewritten AI that makes better decisions without the original’s hidden advantages (seeing the whole map or getting extra weekly creatures), many fixes, and interface improvements: more information on creatures and spells, instant or restartable battles, rebindable hotkeys, and more, listed on a page of its documentation. Both The Succession Wars and The Price of Loyalty campaigns are playable, and it has hot-seat games, a battle-only mode, a random map generator, and its own map editor. It’s translated into more than 20 languages and doesn’t load the original game’s saves. There are builds for Windows, macOS, and Linux, and for Android, PS Vita, and Switch too. Version 1.0.0 came out on December 21, 2022 and the latest, 1.1.17, on June 30, with a first version of automatic map playtesting in the editor and AI improvements. If you don’t own the game, the Windows installer and a bundled script offer to download the free English demo from archive.org and use its resources; this is optional."
requirements:
  es: "Los archivos de tu propia copia de Heroes of Might and Magic II (las carpetas ANIM, DATA, MAPS y MUSIC), por ejemplo de GOG o de Ubisoft Store; los scripts que trae los buscan y los extraen de una instalación, y con innoextract se pueden sacar del instalador de GOG. El editor de mapas necesita los recursos de la expansión The Price of Loyalty. También funciona con la demo gratuita. Además, Windows (de 32 o 64 bits), macOS (la versión publicada es para Intel; en Apple Silicon, con Homebrew, MacPorts o compilándolo) o Linux (x86-64 o ARM64, también en Flatpak, AUR, Homebrew o paquetes de Debian y Ubuntu)."
  en: "The files from your own copy of Heroes of Might and Magic II (the ANIM, DATA, MAPS, and MUSIC folders), from GOG or the Ubisoft Store for example; its bundled scripts find and extract them from an installation, and innoextract can pull them from the GOG installer. The map editor needs the resources of The Price of Loyalty expansion. The free demo works too. Plus Windows (32- or 64-bit), macOS (the released build is for Intel; on Apple silicon, via Homebrew, MacPorts, or building from source), or Linux (x86-64 or ARM64, also on Flatpak, AUR, Homebrew, or as Debian and Ubuntu packages)."
