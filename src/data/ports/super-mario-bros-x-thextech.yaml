desc:
  es: "TheXTech: continuación directa del motor de Super Mario Bros. X 1.3 (SMBX), el juego de plataformas hecho por fans en Visual Basic 6 para Windows, a partir de su código fuente, que se publicó como código abierto. Su autor lo convirtió entero a C++ con SDL2 buscando reproducirlo con exactitud, así que buena parte del código es idéntica a la de VB6. Reproduce por completo el motor de SMBX 1.3, salvo su editor, con muchos de sus fallos de lógica incluidos (los que colgaban o cerraban el juego están corregidos), para jugar los niveles y episodios antiguos como en el original, sin Wine fuera de Windows y también en procesadores ARM y MIPS. Arranca casi al instante, usa de 80 a 150 MB de memoria en lugar de los 600 a 800 del original y añade nombres de archivo en UTF-8, gráficos PNG, puntos de control múltiples, música y sonidos propios por episodio o nivel, un grabador de GIF, LunaScript (una implementación del lenguaje Autocode de LunaDLL) y, desde la 1.3.6, un editor integrado que se maneja con teclado, ratón, mando o pantalla táctil; LunaLua y el contenido de SMBX2 no son compatibles. La 1.7.4 (5 de octubre) cambió la numeración de versiones y añadió iOS, tvOS y Haiku, y la última, la 1.7.4.1 (18 de octubre), deja que algunos gráficos superen sus tamaños originales en los niveles hechos para TheXTech. Hay versiones para Windows, Linux y macOS, además de Android, iOS, Switch, Wii, Wii U, 3DS y Vita. El proyecto prohíbe usar IA para generar el código de las contribuciones. Las descargas «Super Mario Bros. X» traen los recursos de SMBX 1.3 (gráficos, música y sonidos), otras traen Adventures of Demo, un juego de fans del universo A2XT de raocow, y las dos tienen también versión para navegador; hay además ejecutables sin recursos."
  en: "TheXTech: a direct continuation of the Super Mario Bros. X 1.3 (SMBX) engine, the fan-made platformer written in Visual Basic 6 for Windows, built from its source code, which was released as open source. Its author converted all of it to C++ with SDL2, aiming for an accurate reproduction, so much of the code is identical to the VB6 original. It fully reproduces the SMBX 1.3 engine, except for its editor, including many of its logic bugs (the ones that crashed or froze the game are fixed), so old levels and episodes play the way they did in the original, without Wine outside Windows and on ARM and MIPS processors too. It starts almost instantly, uses 80–150 MB of memory instead of the original’s 600–800 MB, and adds UTF-8 file names, PNG graphics, multiple checkpoints, per-episode and per-level music and sounds, a GIF recorder, LunaScript (an implementation of LunaDLL’s Autocode language), and, since 1.3.6, a built-in editor you can use with keyboard, mouse, controller, or touch screen; LunaLua and SMBX2 content aren’t compatible. Version 1.7.4 (October 5) changed the version numbering and added iOS, tvOS, and Haiku, and the latest, 1.7.4.1 (October 18), lets some graphics exceed their original sizes in levels made for TheXTech. There are builds for Windows, Linux, and macOS, plus Android, iOS, Switch, Wii, Wii U, 3DS, and Vita. The project forbids using AI to generate code for contributions. The “Super Mario Bros. X” downloads include the SMBX 1.3 assets (graphics, music, and sounds), others include Adventures of Demo, a fan game set in raocow’s A2XT universe, and both also come in a browser version; there are asset-free executables as well."
requirements:
  es: "No hace falta ninguna copia: SMBX 1.3 era un juego gratuito, y las descargas «Super Mario Bros. X» ya traen sus recursos. Los ejecutables sin recursos funcionan con la carpeta de una instalación de SMBX 1.3, con sus gráficos convertidos a PNG. Además, Windows (32 o 64 bits, o ARM64), Linux o macOS."
  en: "No copy is needed: SMBX 1.3 was a free game, and the “Super Mario Bros. X” downloads already include its assets. The asset-free executables work with the folder of an SMBX 1.3 install, with its graphics converted to PNG. Plus Windows (32- or 64-bit, or ARM64), Linux, or macOS."
