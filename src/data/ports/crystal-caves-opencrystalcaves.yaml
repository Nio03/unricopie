name: "Crystal Caves (OpenCrystalCaves)"
category: fan-remake
console: dos
status: playable
repo: OpenCrystalCaves/OpenCrystalCaves
homepage: https://congusbongus.itch.io/opencrystalcaves
author: "Simon Sandström (gurka), Cong (cxong)"
originalDeveloper: Apogee Software
year: 1991
desc:
  es: "OpenCrystalCaves: reimplementación libre y no oficial del motor de Crystal Caves, la trilogía de plataformas de Apogee Software de 1991 para MS-DOS, escrita en C++20 con SDL2. La empezó Simon Sandström (gurka) en 2017 y hoy la desarrolla sobre todo Cong (cxong), que publica las versiones para Windows y Linux en GitHub y en itch.io. Quiere ser un remake mejor y moderno que conserve la forma de jugar del original, y su README enumera, con capturas comparadas, lo que cambia: los enemigos ya no detectan al jugador a través de las paredes, el impulso horizontal no se pierde al darse con la cabeza en el techo, los láseres salen alineados con el cañón, los niveles se reinician desde el menú, los fondos tienen parallax, hay una paleta azul monocroma opcional para las zonas a oscuras y el episodio se elige en el menú principal en lugar de con ejecutables separados. Por ahora solo se puede jugar el primer episodio, entero desde la 0.7.0 (29 de agosto); la 0.6.0 (4 de abril) había añadido guardar y continuar la partida, y después el menú ya deja elegir episodio y ha empezado el trabajo en el segundo. Le faltan la tabla de récords, reasignar teclas, el mando y el ratón, y algunos efectos de sonido y mensajes, y el sonido no es del todo fiel. El repositorio y las descargas incluyen los archivos del primer episodio en su versión shareware, que Apogee distribuía gratis, así que ese episodio se juega sin tener el juego."
  en: "OpenCrystalCaves: an unofficial open-source reimplementation of the engine of Crystal Caves, Apogee Software’s 1991 platformer trilogy for MS-DOS, written in C++20 with SDL2. Simon Sandström (gurka) started it in 2017, and today it’s mostly developed by Cong (cxong), who publishes the Windows and Linux builds on GitHub and itch.io. It aims to be a better, modern remake that keeps the original’s gameplay, and its README lists, with side-by-side captures, what changes: enemies no longer detect the player through walls, horizontal momentum isn’t lost when bumping your head on the ceiling, lasers line up with the muzzle, levels restart from the menu, backgrounds have parallax, there’s an optional blue monochrome palette for dark areas, and the episode is picked from the main menu instead of through separate executables. For now only the first episode is playable, all the way through since 0.7.0 (August 29); 0.6.0 (April 4) had added saving and continuing a game, and since then the menu lets you choose an episode and work on the second one has started. It still lacks the high score table, key remapping, controller and mouse input, and some sound effects and messages, and the sound isn’t entirely accurate. The repository and the downloads include the files of the first episode in its shareware version, which Apogee distributed for free, so that episode plays without owning the game."
requirements:
  es: "Nada para el primer episodio, que viene incluido en su versión shareware. Para los episodios 2 y 3, cuando se puedan jugar, los archivos de datos de tu propia copia de Crystal Caves (como CC1.GFX) copiados en la carpeta media, o el juego instalado desde Steam o GOG. Además, Windows de 64 bits o Linux; en macOS hay que compilarlo."
  en: "Nothing for the first episode, which is included in its shareware version. For episodes 2 and 3, once they’re playable, the data files from your own copy of Crystal Caves (such as CC1.GFX) copied into the media folder, or the game installed from Steam or GOG. Plus 64-bit Windows or Linux; on macOS you have to build it."
