name: "KKnD (OpenKrush)"
category: fan-remake
console: pc
status: experimental
repo: IceReaper/OpenKrush
author: "IceReaper, Dzierzan"
originalDeveloper: Beam Software
year: 1997
desc:
  es: "OpenKrush: reimplementación de KKnD (Krush Kill 'n' Destroy), el juego de estrategia en tiempo real de Beam Software, hecha como mod del motor OpenRA, con su código en C# y las reglas en YAML. El proyecto nació para KKnD y KKnD2: Krossfire, pero por ahora solo cubre el primero, con los Survivors, los Evolved, las unidades de los búnkeres tecnológicos y los tres terrenos (desierto, montaña y ciudad). Lee los archivos del original y sus vídeos, y trae mapas multijugador, entre ellos los clásicos del juego, e IA para las escaramuzas, a la que se añadieron la construcción de bases y la gestión del petróleo en noviembre de 2022, el último periodo de trabajo intenso; el último cambio es de noviembre de 2025. De OpenRA hereda el multijugador y el servidor dedicado. No tiene versiones publicadas: se compila con los scripts del SDK de mods de OpenRA, que también generan instaladores para Windows, apps para macOS y AppImages para Linux, y su README es todavía el de esa plantilla. El repositorio incluye los tilesets de los tres terrenos, hechos a partir de volcados de los del juego y muy retocados, los mapas multijugador clásicos convertidos, y sprites y sonidos sacados de la demo, de los vídeos y de material beta sin usar de Beam Software, junto con voces hechas por el autor con una voz sintética. Su instalador de contenido puede descargar desde archive.org la demo gratuita de KKnD Xtreme y sacar de ella los sprites de las unidades; la música y los vídeos salen solo del juego completo."
  en: "OpenKrush: a reimplementation of KKnD (Krush Kill ’n’ Destroy), Beam Software’s real-time strategy game, built as a mod for the OpenRA engine, with its code in C# and its rules in YAML. The project was started for KKnD and KKnD2: Krossfire, but so far it only covers the first game, with the Survivors, the Evolved, the tech bunker units, and the three terrains (desert, highland, and urban). It reads the original’s files and videos, and comes with multiplayer maps, the game’s classic ones among them, and a skirmish AI, which gained base building and oil management in November 2022, its last stretch of heavy work; the latest change is from November 2025. It inherits multiplayer and the dedicated server from OpenRA. There are no releases: it’s built with OpenRA’s mod SDK scripts, which also produce Windows installers, macOS apps, and Linux AppImages, and its README is still the SDK template’s. The repository includes the three terrains’ tilesets, made from dumps of the game’s own and heavily edited, the converted classic multiplayer maps, and sprites and sounds taken from the demo, the videos, and unused Beam Software beta material, along with voices the author made with a synthetic voice. Its content installer can download the free KKnD Xtreme demo from archive.org and extract the unit sprites from it; music and videos come only from the full game."
requirements:
  es: "Los archivos de tu propia copia de KKnD Xtreme, de Steam o de GOG, o los CD en inglés de KKnD o de KKnD Xtreme, que el instalador de contenido copia; la demo gratuita de KKnD Xtreme basta para los sprites de las unidades. Además, Windows, Linux o macOS, y para compilarlo, el SDK de .NET que pide OpenRA."
  en: "The files from your own copy of KKnD Xtreme, from Steam or GOG, or the English KKnD or KKnD Xtreme CDs, which the content installer copies; the free KKnD Xtreme demo is enough for the unit sprites. Plus Windows, Linux, or macOS, and, to build it, the .NET SDK that OpenRA requires."
