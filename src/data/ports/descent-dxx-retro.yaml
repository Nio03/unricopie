name: "Descent / Descent II (DXX-Retro)"
category: source-port
console: dos
status: playable
repo: CDarrow/DXX-Retro
originalDeveloper: "Parallax Software"
year: 1995
desc:
  es: "DXX-Retro: port de Descent y Descent II pensado para el juego competitivo de calidad, con el compromiso de respetar el juego original salvo donde el original «era malo». Se basa en el proyecto Rebirth y tiene un ejecutable para cada juego, D1X-Retro y D2X-Retro. Las últimas versiones estables son la 1.3 de D1X-Retro y la 1.3a de D2X-Retro (20 de enero de 2017), con compilaciones para Windows y macOS. Las experimentales, hasta la 1.4X6 (17 de enero de 2018, solo para D1X-Retro), añadieron colores de nave personalizados, un modo de observador (con vistas en primera y tercera persona, y Ctrl+1 a 8 para seguir a cada jugador), arreglos de las demos y del cooperativo, y compilar en macOS con scons. El último cambio del código es de abril de 2023. De él parte DXX-Redux, otro proyecto sobre los mismos juegos."
  en: "DXX-Retro: a Descent and Descent II source port aimed at quality competitive play, committed to the original gameplay except where the original “sucked.” It’s based on the Rebirth project and has one executable per game, D1X-Retro and D2X-Retro. The latest stable releases are 1.3 for D1X-Retro and 1.3a for D2X-Retro (January 20, 2017), with builds for Windows and macOS. The experimental ones, up to 1.4X6 (January 17, 2018, D1X-Retro only), added custom ship colors, an observer mode (with first- and third-person views, and Ctrl+1 to 8 to follow each player), demo and co-op fixes, and building on macOS with scons. The last code change is from April 2023. DXX-Redux, another project for the same games, builds on it."
requirements:
  es: "Los archivos de datos de tu propia copia de Descent o de Descent II; el README no los detalla. Además, Windows o macOS (las descargas son de 2017 y 2018); en otros sistemas, compilarlo."
  en: "The data files from your own copy of Descent or Descent II; the README doesn’t list them. Plus Windows or macOS (the downloads are from 2017 and 2018); on other systems, build it."
tags:
