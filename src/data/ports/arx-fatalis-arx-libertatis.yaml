year: 2002
desc:
  es: "Arx Libertatis: port multiplataforma de Arx Fatalis basado en el código fuente que Arkane Studios publicó, que lo adapta a sistemas actuales, lo lleva a otras plataformas y corrige fallos y limitaciones del original. La 1.2 (13 de julio de 2021), ocho años después de la 1.1, trajo un reconocimiento de runas más tolerante al trazar hechizos y un modo de apuntado con arco en el que la flecha sale hacia donde apunta, que se pueden desactivar para volver a los controles originales; escala configurable del HUD, el libro del jugador y el cursor para resoluciones altas, sin estirar el libro ni el minimapa en panorámico o ultrapanorámico; cambio de idioma de textos y voces desde el menú; física de objetos corregida; campo de visión ajustable, opción de quitar el balanceo de la cámara y límite de fotogramas; sonido envolvente HRTF con OpenAL Soft y la reverberación que antes pedía una tarjeta con EAX; SDL 2, con entrada directa del ratón y Wayland, y una consola para ejecutar comandos de script. La última versión es la 1.2.1 (10 de abril de 2022), de corrección de errores, que devolvió la compatibilidad con Windows XP; hay instalador para Windows y binarios para Linux, además de compilaciones de desarrollo y paquetes para macOS (Homebrew), muchas distribuciones de Linux, los BSD y Haiku. El último commit es del 22 de agosto de 2024. En Linux, su script de instalación de datos (arx-install-data), si instalas desde el CD y no encuentra el parche en tu equipo, descarga por su cuenta el parche oficial 1.21 desde la CDN de Bethesda o su copia en Internet Archive, y para la versión japonesa el parche 1.02j desde la copia en Internet Archive de la web de Capcom; se evita con la opción --no-patch o indicando tu propio archivo."
  en: "Arx Libertatis: a cross-platform port of Arx Fatalis based on the source code Arkane Studios released, which adapts it to modern systems, brings it to new platforms, and removes bugs and limitations of the original. Version 1.2 (July 13, 2021), eight years after 1.1, brought more forgiving rune recognition when drawing spells and a bow aim mode where the arrow flies where it points, both of which can be turned off for the original controls; configurable HUD, player book, and cursor scaling for high resolutions, without stretching the book or minimap in widescreen or ultrawide; text and voice language selection in the menu; fixed item physics; adjustable field of view, an option to remove camera bobbing, and a frame rate limit; HRTF surround sound with OpenAL Soft and the reverb that used to need an EAX sound card; SDL 2, with raw mouse input and Wayland; and a console for running script commands. The latest release is 1.2.1 (April 10, 2022), a bugfix release that restored Windows XP support; there’s a Windows installer and Linux binaries, plus development snapshots and packages for macOS (Homebrew), many Linux distributions, the BSDs, and Haiku. The latest commit is from August 22, 2024. On Linux, its data install script (arx-install-data), if you install from the CD and it can’t find the patch on your machine, downloads the official 1.21 patch by itself from Bethesda’s CDN or its Internet Archive copy, and for the Japanese version the 1.02j patch from the Internet Archive copy of Capcom’s site; you can avoid this with the --no-patch option or by pointing it to your own file."
requirements:
  es: "Los datos de tu propia copia de Arx Fatalis (de GOG, Steam, la Microsoft Store o el CD, que necesita además el parche 1.21) o de su demo. En Windows, instala Arx Fatalis antes que Arx Libertatis; en Linux, los datos se instalan con su script. Además, Windows o Linux (en otros sistemas, con los paquetes de la comunidad o compilándolo) y una tarjeta gráfica con OpenGL 1.5, aunque se recomienda 2.1 o posterior."
  en: "The data from your own copy of Arx Fatalis (from GOG, Steam, the Microsoft Store, or the CD, which also needs the 1.21 patch) or from its demo. On Windows, install Arx Fatalis before Arx Libertatis; on Linux, the data is installed with its script. Plus Windows or Linux (on other systems, through community packages or by building it) and a graphics card with OpenGL 1.5, though 2.1 or later is recommended."
