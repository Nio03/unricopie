name: Project '06 (Sonic P-06)
category: fan-remake
console: x360
status: playable
author: Ian 'ChaosX' Moris
originalDeveloper: Sonic Team / Sega
engine: Unity
desc:
  es: "Remake desde cero en Unity de Sonic the Hedgehog (2006): corrige errores del original, recupera contenido eliminado y añade mejoras, en versiones por episodios. Es un remake de fans, no un recomp ni una decompilación, y es un proyecto en solitario de ChaosX, distinto del port cancelado de Gistix y Mefiresu."
  en: "From-scratch Unity remake of Sonic the Hedgehog (2006): it fixes the original’s bugs, restores cut content, and adds features, in episodic builds. A fan remake, not a recomp or a decomp, and ChaosX’s solo project, separate from the canceled Gistix/Mefiresu port."
requirements:
  es: "Nada: es un remake completo en Unity. Lo descargas y juegas."
  en: "Nothing: it’s a complete Unity remake. Just download it and play."
