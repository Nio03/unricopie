originalDeveloper: Vanillaware
year: 2024
desc:
  es: "vwport: la versión de PS4 de Unicorn Overlord funcionando de forma nativa en Linux y Windows. No es un emulador ni una decompilación: el ejecutable original del juego corre directamente en el procesador, un runtime escrito para este juego implementa las unas 700 funciones del sistema de PS4 que usa, y los gráficos pasan a Vulkan con el núcleo de vídeo de shadPS4 y un renderizado multihilo propio. Parte del port de God of War III y del método de bloodborne_pc. Con la versión asiática y la actualización 1.04 en inglés se han jugado el prólogo, el capítulo 1 y su primera batalla, y guardar y cargar funciona; todavía no se ha terminado, y va a unos 50 o 60 fps en un portátil de gama media. Las opciones del propio juego suman una sección PC con modo de pantalla, resolución de renderizado, FSR 1, nitidez e iconos de botones de PlayStation, Xbox o Nintendo. La 1.0.0 salió el 19 de octubre."
  en: "vwport: the PS4 version of Unicorn Overlord running natively on Linux and Windows. It’s neither an emulator nor a decompilation: the game’s original executable runs directly on the CPU, a runtime written for this game implements the roughly 700 PS4 system functions it uses, and graphics are turned into Vulkan by the shadPS4 video core with the port’s own multi-threaded draw pipeline. It builds on the God of War III port and the bloodborne_pc approach. With the Asian release and its 1.04 English update, the prologue, chapter 1, and its first battle have been played, and saving and loading work; it hasn’t been played to the end yet, and runs at about 50–60 fps on a mid-range laptop. The game’s own options gain a PC section with display mode, render resolution, FSR 1, sharpening, and PlayStation, Xbox, or Nintendo button icons. Version 1.0.0 came out on October 19."
requirements:
  es: "Tu propio volcado de la versión asiática de PS4 (CUSA36381) con la actualización 1.04 integrada, como carpeta con eboot.bin, sce_module, sce_sys y los archivos .CPK (unos 7 GB); es la única versión admitida. Además, Linux de 64 bits o Windows 10 (1903 o posterior) u 11, y una tarjeta gráfica con Vulkan 1.3."
  en: "Your own dump of the Asian PS4 release (CUSA36381) with the 1.04 update merged in, as a folder with eboot.bin, sce_module, sce_sys, and the .CPK files (about 7 GB); it’s the only supported version. Plus 64-bit Linux or Windows 10 (1903 or later) or 11, and a Vulkan 1.3 graphics card."
