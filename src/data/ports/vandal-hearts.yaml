desc:
  es: "Port nativo para PC del Vandal Hearts de PlayStation, construido sobre decompilaciones exactas (byte a byte) del juego: el ejecutable estadounidense (SLUS_004.47) y, desde la 2.0.0, el japonés (SLPM_860.07), que la compilación reproduce y se comprueba con cada cambio. Las interfaces de la consola (paquetes de la GPU, matemáticas de la GTE, CD-ROM y audio XA, SPU, vídeo MDEC y mando) se sustituyen por equivalentes portátiles con SDL2, Metal u OpenGL y OpenAL. Un solo ejecutable reconoce los discos estadounidense, asiático y japonés. Sobre el juego fiel añade, de forma opcional, controles reformados con una vista de la amenaza de los enemigos, un menú de opciones y partidas, un «Modo Táctico» que reequilibra el juego, un rasterizador por software exacto con supermuestreo de resolución interna, avance rápido, un marco de traducciones (hay un paquete en español de la comunidad, alojado por su autora o autor) y paquetes HD con fondos y vídeos escalados. La 2.1.0 es del 31 de agosto. Hay versiones de Windows y Linux (AppImage); la de macOS es experimental y se compila a partir del código. El repositorio incluye el código C decompilado del juego y algunas tablas de datos funcionales, y las versiones publican dos paquetes HD de unos 330 MB (uno por región), con fondos y vídeos escalados que el proyecto describe como arte derivado. 84 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A native PC port of the PlayStation Vandal Hearts, built on byte-exact matching decompilations of the game: the US executable (SLUS_004.47) and, since 2.0.0, the Japanese one (SLPM_860.07), which the build reproduces and which is verified on every change. The console’s interfaces (GPU packets, GTE math, CD-ROM and XA audio, SPU, MDEC video, and pad input) are replaced with portable equivalents using SDL2, Metal or OpenGL, and OpenAL. One executable recognizes the US, Asian, and Japanese discs. On top of the faithful game it adds, optionally, reworked controls with an enemy threat overlay, an options and save-management overlay, a “Tactical Mode” that rebalances the game, an exact software rasterizer with internal-resolution supersampling, fast-forward, a translation framework (a community Spanish pack exists, hosted by its author), and HD packs with upscaled backgrounds and movies. 2.1.0 is from August 31. There are Windows and Linux (AppImage) builds; the macOS build is experimental and compiled from the source. The repository includes the game’s decompiled C code and a few functional game-data tables, and the releases publish two HD packs of about 330 MB (one per region), with upscaled backgrounds and movies that the project describes as derivative art. 84 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia imagen de disco (.bin) de Vandal Hearts: estadounidense (SLUS-00447), asiática (SCPS-45183) o japonesa (SLPM-86007), en una carpeta game/ junto al ejecutable; sin ella la descarga no hace nada. Además, Windows 10 u 11, o Linux con glibc 2.34 o posterior y FUSE2 para el AppImage, o macOS 11 o posterior compilando a partir del código."
  en: "Your own Vandal Hearts disc image (.bin): US (SLUS-00447), Asian (SCPS-45183), or Japanese (SLPM-86007), in a game/ folder beside the executable; without it the download does nothing. Plus Windows 10 or 11, or Linux with glibc 2.34 or later and FUSE2 for the AppImage, or macOS 11 or later building from the source."
