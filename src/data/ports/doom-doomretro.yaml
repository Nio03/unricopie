desc:
  es: "DOOM Retro: port de Doom para Windows de Brad Harding, que lo publicó el 10 de diciembre de 2013, en el 20.º aniversario del juego. Partió de Chocolate Doom, que se basa en el código fuente que id Software publicó en 1997, y hoy es un port propio de unas 120.000 líneas de C. Admite mapas y mods vanilla, sin límites, Boom, MBF y MBF21, con DeHackEd (incluida la ampliación DEHEXTRA, que nació aquí), DSDHacked y, en parte, MAPINFO y UMAPINFO, pero no graba ni reproduce demos y no tiene multijugador. Dibuja con un renderizador por software de 256 colores a 640×400, el doble que el original, escalado con Direct3D u OpenGL, con modo panorámico y dos HUD a elegir, fotogramas sin límite y campo de visión de 45 a 135 grados. Corrige la mayoría de los fallos del motor original y más de 1.400 errores de los mapas oficiales de Doom y Doom II, y añade efectos de translucidez, sangre que deja manchas permanentes, sombras de los monstruos, líquidos que se mecen, un lanzador de WAD, una consola, un automapa que puede ir en otra pantalla, estadísticas, vibración en el mando y vista libre con el ratón, además de un modo «vanilla» para compararlo con el original. Reconoce SIGIL y SIGIL II, las ediciones BFG con No Rest for the Living, Freedoom, Chex Quest, HacX y REKKR. Incluye además E1M4B y E1M8B, dos mapas de John Romero que se juegan con la IWAD de Doom. La 6.3 (8 de agosto) mejoró la compatibilidad con ID24 y añadió proyección cilíndrica del cielo, iluminación radial y Discord Rich Presence."
  en: "DOOM Retro: a Doom source port for Windows by Brad Harding, who released it on December 10, 2013, for the game’s 20th anniversary. It started from Chocolate Doom, which builds on the source code id Software released in 1997, and is now its own port of about 120,000 lines of C. It supports vanilla, limit-removing, Boom, MBF, and MBF21 maps and mods, with DeHackEd (including the DEHEXTRA extension, which began here), DSDHacked, and partial MAPINFO and UMAPINFO, but it doesn’t record or play back demos and has no multiplayer. It draws with a 256-color software renderer at 640×400, twice the original resolution, scaled up with Direct3D or OpenGL, with a widescreen mode and a choice of two HUDs, uncapped frame rates, and a 45–135° field of view. It fixes most of the original engine’s bugs and over 1,400 errors in the official Doom and Doom II maps, and adds translucency effects, blood that leaves permanent splats, monster shadows, bobbing liquids, a WAD launcher, a console, an automap that can go on a second display, stats, controller rumble, and mouselook, plus a “vanilla” mode to compare it with the original. It recognizes SIGIL and SIGIL II, the BFG Editions with No Rest for the Living, Freedoom, Chex Quest, HacX, and REKKR. It also includes E1M4B and E1M8B, two maps by John Romero played with the Doom IWAD. Version 6.3 (August 8) improved ID24 compatibility and added a cylindrical sky projection, radial lighting, and Discord Rich Presence."
requirements:
  es: "El archivo IWAD de tu propia copia de Doom, Doom II o Final Doom (DOOM.WAD, DOOM2.WAD, PLUTONIA.WAD o TNT.WAD), por ejemplo de Steam, GOG o la Epic Games Store; intenta encontrar solo dónde está instalado. También acepta el DOOM1.WAD de la versión shareware, aunque con él no se pueden cargar PWAD, y las IWAD libres de Freedoom. Además, Windows de 64 bits; el código también se puede compilar en Linux y macOS, sin soporte."
  en: "The IWAD file from your own copy of Doom, Doom II, or Final Doom (DOOM.WAD, DOOM2.WAD, PLUTONIA.WAD, or TNT.WAD), for example from Steam, GOG, or the Epic Games Store; it tries to find where it’s installed on its own. It also takes the shareware DOOM1.WAD, though PWADs can’t be loaded with it, and the free Freedoom IWADs. Plus 64-bit Windows; the source can also be built on Linux and macOS, without support."
