desc:
  es: "Port a Windows, Linux y Android de la decompilación de Halo: Combat Evolved, a partir de la versión (build) 2342 de la Xbox original. No es un recomp: parte del código reconstruido por punpckhdq/halo, que tiene su propia ficha de decompilación en el catálogo, con su avance actualizado a diario. GitHub Actions compila el juego en cada commit, y hay dos binarios: el de la versión normal, para jugar, y uno de depuración que se detiene en el primer fallo de aserción y lo escribe en el registro."
  en: "Windows, Linux, and Android port of the Halo: Combat Evolved decompilation, starting from build 2342 of the original Xbox release. It isn’t a recomp: it builds on the code reconstructed by punpckhdq/halo, which has its own decompilation entry in the catalog, with its progress updated daily. GitHub Actions builds the game on every commit, and there are two binaries: the release one to play, and a debug one that stops at the first failed assertion and writes it to the log."
requirements:
  es: "Tu propia copia de Halo: Combat Evolved para la Xbox original (versión 2342)."
  en: "Your own copy of Halo: Combat Evolved for the original Xbox (build 2342)."
