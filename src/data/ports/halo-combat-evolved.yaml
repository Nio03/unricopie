desc:
  es: "OpenCE (Open Community Edition, anteriormente halo-ce-universal): port de la decompilación de Halo: Combat Evolved, hecha a partir de la versión de desarrollo 2342 de la Xbox original, para Windows, Linux, Android y el navegador; la de macOS está en camino. No es un emulador: el código del propio juego se compila para cada plataforma, con una capa nueva en lugar del hardware de la Xbox, OpenGL para los gráficos y SDL3 para el sonido y los mandos. Parte de bnunu/halo-1, un fork de la decompilación de punpckhdq/halo, que tiene su propia ficha. Añade multijugador de hasta 128 jugadores con juego cruzado entre todas las plataformas y pantalla dividida para cuatro, partidas por internet entre jugadores con buscador de servidores e invitaciones, campaña cooperativa en línea, chat de voz y descarga automática de mapas. Admite los mapas de Halo Custom Edition y mods hechos con las herramientas de Halo PC. Por defecto se ve como en la Xbox; las opciones añaden cualquier resolución, un fotograma por cada refresco de la pantalla mientras la simulación sigue a 30 ticks por segundo, campo de visión de 80 a 150 grados, antialiasing, filtrado anisótropo, HDR y un HUD redibujado en alta resolución. Se actualiza solo, y cada compilación que pasa en las cuatro plataformas es una versión nueva."
  en: "OpenCE (Open Community Edition, formerly halo-ce-universal): a port of the Halo: Combat Evolved decompilation, made from development build 2342 of the original Xbox release, for Windows, Linux, Android, and the browser; a macOS version is in progress. It isn’t an emulator: the game’s own code is compiled for each platform, with a new layer in place of the Xbox hardware, OpenGL for graphics, and SDL3 for sound and controllers. It starts from bnunu/halo-1, a fork of the punpckhdq/halo decompilation, which has its own entry. It adds multiplayer for up to 128 players with cross-play across every platform and four-player split screen, peer-to-peer internet games with a server browser and invite links, online campaign co-op, voice chat, and automatic map downloads. It supports Halo Custom Edition maps and mods made with the Halo PC tools. By default it looks as it did on the Xbox; the options add any resolution, a frame for every display refresh while the simulation stays at 30 ticks a second, an 80–150° field of view, anti-aliasing, anisotropic filtering, HDR, and a HUD redrawn at high resolution. It updates itself, and every build that passes on all four platforms is a new release."
requirements:
  es: "Tu propia imagen de disco de Halo: Combat Evolved para la Xbox original (.iso o .xiso). Sirve cualquier versión: los mapas de la versión europea se ajustan para jugar con los de la americana. Para los mapas de Custom Edition hacen falta bitmaps.map, sounds.map y loc.map de tu propia instalación de Halo Custom Edition."
  en: "Your own Halo: Combat Evolved disc image for the original Xbox (.iso or .xiso). Any version works: the European release’s maps are adjusted to play with the North American ones. Custom Edition maps need bitmaps.map, sounds.map, and loc.map from your own Halo Custom Edition install."
