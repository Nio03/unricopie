name: "Halo: Combat Evolved (Universal)"
category: decomp-port
console: xbox
status: experimental
repo: cybersecurity/halo-ce-universal
originalDeveloper: Bungie
year: 2001
forkOf:
  label: punpckhdq/halo (decompilación)
  url: https://github.com/punpckhdq/halo
desc:
  es: "Port a Windows, Linux y Android de la decompilación de Halo: Combat Evolved, partiendo de la build 2342 de la Xbox original. No es un recomp: arranca del código reconstruido por punpckhdq/halo, que ya está en el catálogo como decompilación y va por el 99,5% de coincidencia byte a byte. GitHub Actions compila el juego en cada commit, y hay dos binarios: el de release para jugar y uno de depuración que se detiene en el primer fallo de aserción y lo escribe al log."
  en: "Windows, Linux and Android port of the Halo: Combat Evolved decompilation, starting from the original Xbox build 2342. It is not a recomp: it builds on the code reconstructed by punpckhdq/halo, already in the catalogue as a decompilation and currently at 99.5% byte matching. GitHub Actions builds the game on every commit, and there are two binaries: the release one to play, and a debug one that stops at the first failed assertion and writes it to the log."
requirements:
  es: "Tu propia copia de Halo: Combat Evolved para la Xbox original (build 2342)."
  en: "Your own copy of Halo: Combat Evolved for the original Xbox (build 2342)."
