originalDeveloper: Sucker Punch Productions
year: 2014
desc:
  es: "Port nativo experimental para Windows de la versión de PS4. El código x86-64 original corre directamente en el procesador y un runtime propio sustituye las bibliotecas del sistema; la GPU partió del núcleo de vídeo de shadPS4 y se va pasando a Vulkan nativo, con los dibujos del motor grabados directamente y los shaders compilados de antemano a partir de tus archivos. Se juega: partidas de la historia, mundo abierto, menús, pausa y guardado. En su equipo de referencia (Ryzen 7 7800X3D y RX 9070 XT) pasa de 100 fps en escenas pequeñas, ronda los 80 a 95 en la ciudad y baja a 60 o 70 en las vistas más densas. Tiene un launcher con modo de ventana, VSync, límite de 30 a 240 fps o sin límite, FSR 1, controles configurables y tus DLC, y una ventana aparte para manejar con el ratón el panel táctil y la lata de spray de los grafitis. Su autor declara a Claude, de Anthropic, como programador de IA del proyecto."
  en: "An experimental native Windows port of the PS4 version. The original x86-64 code runs directly on the CPU and its own runtime replaces the system libraries; the GPU started from shadPS4’s video core and is being moved to native Vulkan, with the engine’s draws recorded directly and shaders compiled ahead of time from your files. It’s playable: story saves, free roam, menus, pause, and saving. On its reference PC (Ryzen 7 7800X3D and RX 9070 XT) it goes above 100 fps in smaller scenes, about 80–95 in the city, and drops to 60–70 in the densest views. It has a launcher with window mode, VSync, a 30–240 fps or unlimited frame cap, FSR 1, configurable controls, and your DLC, plus a separate window to work the touchpad and the graffiti spray can with the mouse. Its author credits Claude, by Anthropic, as the project’s AI pair programmer."
requirements:
  es: "Tu propia copia de inFAMOUS Second Son para PS4, con sus DLC si los tienes. Además, Windows de 64 bits y una tarjeta gráfica con Vulkan."
  en: "Your own copy of inFAMOUS Second Son for PS4, with its DLC if you have them. Plus 64-bit Windows and a Vulkan graphics card."
