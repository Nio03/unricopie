name: "Mario Party 4 (Party Board, mariopartyrd)"
games: [mario-party-4]
category: decomp-port
console: gamecube
status: experimental
repo: mariopartyrd/partyboard
originalDeveloper: "Hudson Soft"
year: 2002
desc:
  es: "Party Board: port en desarrollo de Mario Party 4 para Windows, Linux, macOS, Android e iOS, hecho con Aurora y con el agradecimiento de sus autores a la comunidad de decompilación de GameCube y Wii. El repositorio no contiene recursos del juego ni ensamblador: hace falta una copia propia. Las versiones que da por completadas son la revisión 0 y la 1 de la edición estadounidense (GMPE01). Se construye con CMake y hay instrucciones para Windows, macOS y Linux. La única versión publicada es la alfa 0.2.0 del 8 de mayo, con paquetes para Windows (x64 y x86) y Android; el repositorio sigue recibiendo cambios (el último, el 28 de octubre). Existe otro repositorio de Party Board, el de zeranemesis, que ya está en el catálogo."
  en: "Party Board: a work-in-progress port of Mario Party 4 for Windows, Linux, macOS, Android, and iOS, made with Aurora, whose authors thank the GameCube and Wii decompilation community. The repository contains no game assets or assembly: a copy of the game is required. The versions it lists as completed are revision 0 and revision 1 of the US release (GMPE01). It builds with CMake and has instructions for Windows, macOS, and Linux. The only published release is the alpha 0.2.0 from May 8, with packages for Windows (x64 and x86) and Android; the repository is still being updated (the latest change was on October 28). Another Party Board repository exists, zeranemesis’s, which is already in the catalog."
requirements:
  es: "Tu propia copia de Mario Party 4 para GameCube, estadounidense (GMPE01), revisión 0 o 1."
  en: "Your own copy of Mario Party 4 for GameCube, US (GMPE01), revision 0 or 1."
