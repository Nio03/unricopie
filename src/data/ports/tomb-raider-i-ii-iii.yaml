desc:
  es: "TRX: reimplementación de código abierto de Tomb Raider, Tomb Raider II y Tomb Raider III para PC, hecha a partir de la decompilación de los juegos y con alternativas libres a sus componentes propietarios. Un solo motor ejecuta los tres juegos, sus expansiones y niveles personalizados respetando las mecánicas de cada original, y el README dice que los tres se pueden jugar de principio a fin; el soporte de Tomb Raider IV está en marcha, aún en fase temprana. Hay versiones para Windows, Linux y macOS. Añade interpolación a 60 fps, distancia de dibujado ajustable, escalado de la interfaz, barras de vida de los enemigos, modo foto, objetos en 3D, cielos, sprint y otros movimientos, la trenza de Lara en el primer juego, consola de desarrollo, mando con controles reasignables y scripts en Lua, y corrige muchos fallos de los originales. La última versión es la 1.11.1 (22 de septiembre). El repositorio y las descargas incluyen archivos de «inyección» con modelos, animaciones y texturas de otros juegos de la serie, como trajes de Lara de Tomb Raider II a IV y uno de Natla, el modelo de Winston y las armas de Tomb Raider IV; las descargas traen además lo necesario para jugar sin archivos propios la demo de PC de Tomb Raider y Tomb Raider II: The Golden Mask, que según el proyecto se pueden distribuir libremente. El instalador de Windows descarga desde lostartefacts.dev, en casillas aparte que hay que marcar, los niveles de Tomb Raider: Unfinished Business (original o con arreglos de fans), la demo y The Golden Mask, y para Tomb Raider y Tomb Raider II ofrece descargar su música, en una casilla que viene marcada."
  en: "TRX: an open-source reimplementation of Tomb Raider, Tomb Raider II, and Tomb Raider III for PC, built from the decompiled games and with open-source replacements for their proprietary components. A single engine runs all three games, their expansions, and custom levels while keeping each original’s mechanics, and the README says all three are playable from start to finish; Tomb Raider IV support is underway, still at an early stage. There are builds for Windows, Linux, and macOS. It adds 60 fps interpolation, adjustable draw distance, UI scaling, enemy health bars, a photo mode, 3D pickups, skyboxes, sprinting and other moves, Lara’s braid in the first game, a developer console, controller support with remappable controls, and Lua scripting, and it fixes many bugs in the originals. The latest release is 1.11.1 (September 22). The repo and the downloads include “injection” files with models, animations, and textures from other games in the series, such as Lara’s outfits from Tomb Raider II to IV and a Natla outfit, Winston’s model, and the Tomb Raider IV guns; the downloads also bring what’s needed to play the Tomb Raider PC demo and Tomb Raider II: The Golden Mask without your own files, which the project says can be freely distributed. The Windows installer downloads from lostartefacts.dev, as separate boxes you have to tick, the levels of Tomb Raider: Unfinished Business (original or fan-patched), the demo, and The Golden Mask, and for Tomb Raider and Tomb Raider II it offers to download their music, in a box that comes ticked."
requirements:
  es: "Tus propias copias para PC de Tomb Raider, Tomb Raider II y Tomb Raider III, de Steam, GOG o en disco: sus niveles, vídeos y música; las expansiones Unfinished Business, The Golden Mask y The Lost Artifact se añaden aparte. El instalador de Windows encuentra solo las copias de Steam, GOG o disco y copia los archivos; con los zip de Windows y Linux, o en macOS, se copian a mano en la carpeta de cada juego. Además, Windows, Linux o macOS."
  en: "Your own PC copies of Tomb Raider, Tomb Raider II, and Tomb Raider III, from Steam, GOG, or disc: their levels, videos, and music; the Unfinished Business, The Golden Mask, and The Lost Artifact expansions are added separately. The Windows installer finds Steam, GOG, or disc copies by itself and copies the files; with the Windows and Linux zips, or on macOS, you copy them by hand into each game’s folder. Plus Windows, Linux, or macOS."
