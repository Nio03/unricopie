originalDeveloper: Spike
year: 2007
desc:
  es: "Port nativo a PC construido sobre BT3-Decompiled, la decompilación que reproduce byte a byte la edición estadounidense (SLUS-21678): es el código del propio juego compilado para PC, con un renderizado, un sonido y un control nuevos por debajo, no un emulador. Funciona el ciclo completo (arranque, vídeo de apertura, menús, guardado, combates y pantalla partida), con un renderizador Vulkan que conserva los efectos de PS2 (contorno, brillo, tinte de profundidad y desenfoque por distancia), cada uno activable por separado, y un renderizador OpenGL 3.3 de reserva. Resolución interna de 1x a 8x y modo panorámico hasta 21:9 o más, sin estirar los combates."
  en: "Native PC port built on BT3-Decompiled, the matching decompilation of the US release (SLUS-21678): it’s the game’s own code compiled for PC, with a new renderer, sound, and input layer underneath, not an emulator. The whole loop works (boot, opening movie, menus, saving, fights, and split screen), with a Vulkan renderer that keeps the PS2’s effects (outline, glow, depth tint, and distance blur), each one toggleable, plus an OpenGL 3.3 fallback. Internal resolution from 1x to 8x, and widescreen up to 21:9 and beyond without stretching the fights."
requirements:
  es: "Tu propia imagen de disco de la edición estadounidense (SLUS-21678). El repositorio no contiene datos del juego: la instalación los lee de tu disco y se quedan en tu equipo."
  en: "Your own disc image of the US release (SLUS-21678). The repository holds no game data: setup reads it from your disc and it stays on your machine."
