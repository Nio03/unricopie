desc:
  es: "ReRAC: reescritura de Ratchet & Clank (2002) como juego nativo para PC, en Rust y sobre el motor Bevy. Los sistemas del juego se portan y corren de forma nativa, sin emulador, con el objetivo de que se vea, suene y se juegue como el original. Está en una fase temprana: todos los niveles cargan y se dibujan, pero todavía no se puede jugar de principio a fin. Hay versiones alfa para Windows, Linux y macOS, y un launcher aparte que prepara el juego a partir de tu disco. 74 de sus últimos 100 commits llevan a Claude como coautor."
  en: "ReRAC: a rewrite of Ratchet & Clank (2002) as a native PC game, in Rust on the Bevy engine. The game’s systems are ported and run natively, with no emulator in between, aiming to look, sound, and play like the original. It’s at an early stage: every level loads and renders, but it isn’t playable from start to finish yet. There are alpha builds for Windows, Linux, and macOS, and a separate launcher that sets the game up from your disc. 74 of its last 100 commits list Claude as a co-author."
requirements:
