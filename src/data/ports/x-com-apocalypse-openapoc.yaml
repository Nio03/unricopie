name: "X-COM: Apocalypse (OpenApoc)"
category: fan-remake
console: dos
status: experimental
repo: OpenApoc/OpenApoc
originalDeveloper: Mythos Games
year: 1997
desc:
  es: "OpenApoc (OpenApocalypse): reimplementación de código abierto de X-COM: Apocalypse, escrita en C++ con SDL2, que necesita los archivos del juego original. La fundó PmProg en julio de 2014, y su README cita a Julian Gollop, el diseñador de X-COM, diciendo que conoce el proyecto y lo apoya. Funciona a las resoluciones actuales, con escalado de pantalla y a 60 fps, reproduce el sonido sin los chasquidos ni cortes del original y añade un menú «More Options» con decenas de mejoras opcionales, un modo de escaramuza experimental para combates rápidos, un sistema de depuración y partidas guardadas en XML dentro de un ZIP, que se pueden editar. Casi todo se puede cambiar con mods. Sigue en alfa: hay fallos y cierres, y su hoja de ruta todavía enumera lo que falta para una alfa «realmente jugable», como el entrenamiento de los agentes desde el combate táctico. Publica compilaciones con fecha para Windows de 64 bits, con instalador; en Linux y macOS se compila. La última es la 20260916 (16 de septiembre), y las de septiembre aplicaron las reglas de experiencia en combate del original, las medallas por puntos de victoria y el final de la partida al ganar o al perder la última base, y el launcher ya detecta solo el CD o la ISO."
  en: "OpenApoc (OpenApocalypse): an open-source reimplementation of X-COM: Apocalypse, written in C++ with SDL2, that needs the original game’s files. PmProg founded it in July 2014, and its README quotes Julian Gollop, X-COM’s designer, saying they know about the project and support it. It runs at modern resolutions, with display scaling and at 60 fps, plays sound without the original’s pops and stutters, and adds a “More Options” menu with dozens of optional improvements, an experimental skirmish mode for quick fights, a debug system, and saves stored as XML in a ZIP file that you can edit. Almost everything can be changed with mods. It’s still in alpha: there are bugs and crashes, and its roadmap still lists what’s needed for a “truly playable” alpha, such as agent training from tactical combat. It publishes dated builds for 64-bit Windows, with an installer; on Linux and macOS you build it yourself. The latest is 20260916 (September 16), and the September builds applied the original’s combat experience rules, medals from victory points, and the end of the game on the final victory or the loss of the last base, and the launcher now detects the CD or ISO on its own."
requirements:
  es: "Tu propio CD de X-COM: Apocalypse convertido en imagen ISO (cd.iso) o una carpeta con todos sus archivos, el cd.iso de la versión de Steam o los XCOM.cue y XCOM.bin de la de GOG; tiene que estar completo, música incluida. Además, una tarjeta gráfica con OpenGL 2.0 y, en Windows, la última versión de Visual C++ Redistributable; las compilaciones publicadas son para Windows de 64 bits, y en Linux y macOS hay que compilarlo."
  en: "Your own X-COM: Apocalypse CD as an ISO image (cd.iso) or a folder with all its files, the Steam release’s cd.iso, or the GOG release’s XCOM.cue and XCOM.bin; it must be complete, music included. Plus an OpenGL 2.0 graphics card and, on Windows, the latest Visual C++ Redistributable; the published builds are for 64-bit Windows, and on Linux and macOS you have to build it."
tags:
