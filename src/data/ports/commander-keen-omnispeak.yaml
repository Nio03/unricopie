name: "Commander Keen in Goodbye, Galaxy! (Omnispeak)"
category: fan-remake
console: dos
status: fully
repo: sulix/omnispeak
homepage: https://davidgow.net/keen/omnispeak.html
author: David Gow
originalDeveloper: id Software
year: 1991
desc:
  es: "Omnispeak: reimplementación libre de los episodios 4, 5 y 6 de Commander Keen, escrita en C99, que busca ser un clon exacto al píxel y fallo por fallo de los juegos originales y es compatible con las partidas guardadas de la versión de DOS. Funciona en Windows y Linux, y hay ports a MS-DOS y a otros sistemas. Añade escalado mejorado, con corrección de aspecto, borde de overscan y escalado por múltiplos enteros opcionales, mucho mejor soporte de mando, con botones reasignables y un modo «moderno» que facilita las diagonales, guardado y carga rápidos con F5 y F9, y emulación del chip OPL con el de DOSBox o Nuked OPL3, o tarjetas AdLib u OPL2 reales en Linux y MS-DOS. Desde su configuración se pueden desactivar el fallo «Impossible Bullet» de Keen 6 y su pregunta anticopia. La última versión es la 1.1, y hay una versión preliminar con soporte básico de mods, que cambian textos, acciones de los sprites y valores del juego con archivos de variables. El repositorio incluye, para cada episodio y versión, datos que el original lleva dentro del ejecutable: las cabeceras y los diccionarios de compresión de los gráficos, el sonido y los mapas, la información de los tiles, las acciones de los sprites y todos los textos del juego."
  en: "Omnispeak: an open-source reimplementation of Commander Keen episodes 4, 5, and 6, written in C99, that aims to be a pixel-perfect, bug-for-bug clone of the original games and is compatible with the DOS version’s saved games. It runs on Windows and Linux, and there are ports to MS-DOS and other systems. It adds improved scaling, with optional aspect ratio correction, overscan border, and integer scaling, much better controller support, with remappable buttons and a “modern” mode that makes diagonal movement easier, QuickSave and QuickLoad on F5 and F9, and OPL chip emulation with DOSBox’s or Nuked OPL3, or real AdLib or OPL2 cards on Linux and MS-DOS. Keen 6’s “Impossible Bullet” glitch and its copy protection question can be turned off in its settings. The latest release is 1.1, and there’s a preview build with basic mod support, where mods change text, sprite actions, and game values through variable files. The repository includes, for each episode and version, data the original keeps inside its executable: the headers and compression dictionaries for graphics, sound, and maps, the tile info, the sprite actions, and all of the game’s text."
requirements:
  es: "Los archivos GAMEMAPS, EGAGRAPH y AUDIO de tu propia copia de Keen 4 1.4 EGA, Keen 5 1.4 EGA o Keen 6 1.4 o 1.5 EGA, junto a los de la carpeta data del proyecto que correspondan a tu versión; las de Steam y GOG son la 1.4. Otras versiones, como las CGA, las 1.0, las comerciales de FormGen o GT Interactive y el Keen 6 del id Anthology, probablemente se cuelguen. La versión shareware de Keen 4 1.4, gratuita, está en la web del autor. Además, Windows (32 o 64 bits) o Linux."
  en: "The GAMEMAPS, EGAGRAPH, and AUDIO files from your own copy of Keen 4 v1.4 EGA, Keen 5 v1.4 EGA, or Keen 6 v1.4 or v1.5 EGA, together with the files from the project’s data folder that match your version; the Steam and GOG releases are 1.4. Other versions, such as the CGA ones, the v1.0 releases, the FormGen or GT Interactive retail versions, and the Keen 6 bundled with the id Anthology, will likely crash. The free shareware release of Keen 4 v1.4 is on the author’s website. Plus Windows (32- or 64-bit) or Linux."
