desc:
  es: "OpenRA: motor libre de estrategia en tiempo real, escrito en C#, que recrea y moderniza tres juegos de Westwood: Command & Conquer (Tiberian Dawn), Command & Conquer: Red Alert y Dune 2000, cada uno como un «mod» propio; el soporte de Tiberian Sun sigue en desarrollo y no va en el instalador. Es una reimplementación hecha por ingeniería inversa de los archivos de los juegos, sin desensamblar ni parchear los ejecutables originales. No busca ser una copia exacta: añade control con clic derecho o con el clásico clic izquierdo, barras laterales con colas de producción y atajos de teclado, ataque en movimiento y posturas de las unidades, niebla de guerra, veteranía, edificios tecnológicos capturables, repeticiones y una interfaz para observadores. Tiene multijugador en línea, editor de mapas, misiones con scripts en Lua y un SDK para crear juegos propios sobre el motor, y funciona en Windows, macOS y Linux. La última versión estable es la release-20250330 (30 de marzo de 2025); la playtest-20261011 (11 de octubre) completa la campaña de Dune 2000, pasa el motor a .NET 10 y añade versiones para Windows en ARM y Linux aarch64. Uno de sus más de 30 000 commits, del 15 de octubre, lleva a Claude como coautor. En el primer arranque, el gestor de contenido ofrece descargar desde servidores espejo del proyecto los archivos base de cada juego, sin música ni vídeos: los de Red Alert y Tiberian Dawn salen de las versiones que EA publicó como gratuitas, y los de Dune 2000, con los de su parche 1.06, de una réplica de los archivos del juego. Es opcional: también puede copiarlos, junto con la música y los vídeos, de los discos o de una instalación del juego. El proyecto dice usar esos archivos bajo la licencia que conceden las C&C Franchise Modding Guidelines de EA."
  en: "OpenRA: a free real-time strategy engine, written in C#, that recreates and modernizes three Westwood games: Command & Conquer (Tiberian Dawn), Command & Conquer: Red Alert, and Dune 2000, each as its own “mod”; Tiberian Sun support is still in development and isn’t in the installer. It’s a reimplementation built by reverse engineering the games’ files, without disassembling or patching the original executables. It doesn’t aim to be an exact copy: it adds right-click or classic left-click controls, sidebars with production queues and hotkeys, attack-move and unit stances, fog of war, veterancy, capturable tech structures, replays, and an observer interface. It has online multiplayer, a map editor, Lua-scripted missions, and an SDK for building your own games on the engine, and it runs on Windows, macOS, and Linux. The latest stable release is release-20250330 (March 30, 2025); playtest-20261011 (October 11) completes the Dune 2000 campaign, moves the engine to .NET 10, and adds Windows on ARM and aarch64 Linux builds. One of its more than 30,000 commits, from October 15, lists Claude as a co-author. On first launch, the content manager offers to download each game’s base files, without music or videos, from the project’s mirror servers: the Red Alert and Tiberian Dawn files come from the releases EA made available as freeware, and the Dune 2000 files, along with its 1.06 patch files, from a mirror of the game’s files. This is optional: it can also copy them, along with the music and videos, from the discs or from an installed copy. The project says it uses those files under the license granted by EA’s C&C Franchise Modding Guidelines."
requirements:
  es: "Los archivos de los juegos originales: el primer arranque puede descargar los archivos base, o copiarlos de tus propios discos (también montados como ISO) o de una instalación de The First Decade, The Ultimate Collection o la Remastered Collection en Steam u Origin; para Dune 2000, el disco en inglés o la Gruntmods Edition. La música y los vídeos de las campañas solo se copian de los discos o de esas instalaciones. Además, Windows 7 o posterior con DirectX 11 u OpenGL 3, macOS 10.11 o posterior, o Linux de 64 bits (AppImage, una por juego)."
  en: "The original games’ files: on first launch it can download the base files, or copy them from your own discs (mounted ISOs work too) or from a The First Decade, The Ultimate Collection, or Remastered Collection install on Steam or Origin; for Dune 2000, the English disc or the Gruntmods Edition. Campaign music and videos can only be copied from the discs or those installs. Plus Windows 7 or later with DirectX 11 or OpenGL 3, macOS 10.11 or later, or 64-bit Linux (one AppImage per game)."
