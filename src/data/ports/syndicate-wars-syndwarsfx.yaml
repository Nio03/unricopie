desc:
  es: "Syndicate Wars Fan Expansion: port del Syndicate Wars de DOS, el juego de Bullfrog de 1996, a sistemas actuales, que continúa el que crearon Unavowed y Gynvael Coldwind. Se hizo desensamblando el ejecutable original de DOS y sustituyendo las partes propias de DOS por código independiente de la plataforma: SDL para la imagen y el control, Vorbis para la música y OpenAL para el sonido. Lo que aún no se ha rehecho sigue siendo el código original, que se va reescribiendo en C función a función; por eso, según el proyecto, no falta nada de la campaña para un jugador, e incluso ha recuperado funciones recortadas o de versiones beta. El multijugador no funciona, porque falta el código de red. Añade recursos que no estaban en el juego, como sonidos y gráficos de más resolución, traducciones hechas por fans y la captura del ratón. Según el proyecto funciona en Windows, Linux y macOS, pero solo como programa x86 de 32 bits. Publica versiones de prueba para Windows, con instalador, y para Ubuntu; la última, la 0.3.8.4358, es del 5 de octubre. El instalador y el script de instalación copian los archivos de tu CD o imagen del juego y, además, descargan de GitHub, de los repositorios del proyecto, los gráficos, los sonidos y voces y los mapas y niveles originales de Bullfrog, con correcciones de la comunidad; el script no tiene opción para saltarse esa descarga. El repositorio incluye el desensamblado del ejecutable del juego (unos 3,7 MB) y los textos del juego, en inglés y en otros siete idiomas, como archivos de traducción."
  en: "Syndicate Wars Fan Expansion: a port of the DOS version of Syndicate Wars, Bullfrog’s 1996 game, to modern systems, continuing the one created by Unavowed and Gynvael Coldwind. It was made by disassembling the original DOS executable and replacing the DOS-specific parts with platform-independent code: SDL for video and input, Vorbis for music, and OpenAL for sound. Whatever hasn’t been remade yet is still the original code, which is being rewritten in C function by function; because of that, according to the project, nothing is missing from the single-player campaign, and some cut and beta features have even been revived. Multiplayer doesn’t work, since the network code is missing. It adds resources that weren’t in the game, such as extra sounds and higher-resolution graphics, fan-made translations, and mouse capture. According to the project it runs on Windows, Linux, and macOS, but only as a 32-bit x86 program. It publishes pre-release builds for Windows, with an installer, and for Ubuntu; the latest, 0.3.8.4358, is from October 5. The installer and the install script copy the files from your CD or disc image and also download from GitHub, from the project’s own repositories, Bullfrog’s original graphics, sounds and voices, and maps and levels, with fixes from the community; the script has no option to skip that download. The repository includes the disassembly of the game’s executable (about 3.7 MB) and the game’s text, in English and seven other languages, as translation files."
requirements:
  es: "Tu propio CD de Syndicate Wars para PC o una imagen del CD de una tienda digital (las de las tiendas más conocidas incluyen una de las versiones probadas); se han probado la europea multilingüe y la estadounidense, y para el alemán hace falta la edición alemana. El CD solo se usa durante la instalación. Además, Windows o Linux en x86 (el programa es de 32 bits; en Linux se compila o se usa el paquete para Ubuntu si tu sistema es compatible) o macOS, compilándolo; para pasar la música del CD a Ogg Vorbis, cdparanoia y oggenc."
  en: "Your own Syndicate Wars CD for PC or a disc image from a digital store (those from the best-known stores include one of the tested versions); the multilingual European and the US releases have been tested, and German requires the German release. The CD is only used during installation. Plus Windows or Linux on x86 (the program is 32-bit; on Linux, build it or use the Ubuntu package if your system is compatible) or macOS, building it yourself; to convert the CD music to Ogg Vorbis, cdparanoia and oggenc."
