desc:
  es: "CatacombGL: port del código fuente de Catacomb 3-D: The Descent (id Software, 1991) y de la Catacomb Adventure Series de Softdisk (The Catacomb Abyss, The Catacomb Armageddon y The Catacomb Apocalypse, de 1992 y 1993), los cuatro juegos de MS-DOS cuyo código publicó Flatrock Software con licencia GPLv2. Los originales dibujaban en 16 colores en una ventana de 320×200; CatacombGL los dibuja con OpenGL, a resoluciones panorámicas, con campo de visión ajustable y fotogramas sin límite, y mueve al jugador, los proyectiles y los monstruos con precisión de coma flotante. Tiene controles de teclado y ratón configurables y compartidos por los cuatro juegos, un minimapa con cuatro estilos (uno basado en el mapa de depuración de Catacomb 3-D), la opción de deslizarse por las paredes, la cámara un poco detrás del jugador como en DOS, y música opcional en la serie Adventure, con la pista de Bobby Prince que sus datos ya traían sin usar. El sonido sale del de ReflectionHLE, con emulación del OPL3. Una pantalla de selección lista los juegos y detecta el Catacombs Pack si lo instalaste con el instalador de GOG. La última versión es la 0.5.7 beta (4 de enero de 2025), para Windows de 32 y 64 bits y Linux; desde entonces el código ha pasado a SDL3 y ha sumado mandos, compatibilidad con macOS y la versión 1.00 de Catacomb 3-D, y trabaja en leer las partidas guardadas de DOS. El repositorio incluye, para cada juego y versión, los diccionarios de compresión de sus gráficos EGA."
  en: "CatacombGL: a source port of Catacomb 3-D: The Descent (id Software, 1991) and Softdisk’s Catacomb Adventure Series (The Catacomb Abyss, The Catacomb Armageddon, and The Catacomb Apocalypse, from 1992 and 1993), the four MS-DOS games whose source code Flatrock Software released under the GPLv2. The originals drew in 16 colors in a 320×200 view window; CatacombGL draws them with OpenGL, at widescreen resolutions, with an adjustable field of view and an uncapped frame rate, and moves the player, projectiles, and monsters with floating-point precision. It has configurable keyboard and mouse controls shared by all four games, an automap with four styles (one based on Catacomb 3-D’s debug automap), an option to slide along walls, the camera slightly behind the player as in DOS, and optional music in the Adventure Series, using the Bobby Prince track their data already contained but never played. Sound comes from ReflectionHLE’s, with OPL3 emulation. A selection screen lists the games and detects the Catacombs Pack if you installed it with GOG’s installer. The latest release is 0.5.7 beta (January 4, 2025), for 32- and 64-bit Windows and Linux; since then the code has moved to SDL3 and added controllers, macOS compatibility, and Catacomb 3-D version 1.00, and work is underway on reading DOS saved games. The repository includes, for each game and version, the compression dictionaries for its EGA graphics."
requirements:
  es: "Los archivos de datos de tu propia copia: el Catacombs Pack de GOG, con los cuatro juegos, o, en el código posterior a la 0.5.7, el Catacomb 3-D 1.00 de las ediciones físicas Big Box de Romero Games de 2024. The Catacomb Abyss 1.13 es shareware y gratuito, y basta para jugar a ese juego; el proyecto dice que sus diferencias con la versión comercial son solo estéticas. Además, Windows 7 a 11 o Linux; macOS, compilándolo."
  en: "The data files from your own copy: GOG’s Catacombs Pack, with all four games, or, in the code after 0.5.7, Catacomb 3-D version 1.00 from Romero Games’ 2024 physical Big Box releases. The Catacomb Abyss 1.13 is free shareware and is enough to play that game; the project says it differs from the commercial release only cosmetically. Plus Windows 7 to 11 or Linux; macOS, by building it."
