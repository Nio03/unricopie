desc:
  es: "re3: código fuente de la versión de PC de Grand Theft Auto III reconstruido por ingeniería inversa, con el que el juego corría de forma nativa en Windows, Linux y FreeBSD, también en ARM, a partir de tu propia copia. Podía dibujar con el RenderWare original o con librw, una reimplementación libre, y el sonido iba por MSS u OpenAL. En el mismo repositorio, en la rama miami, estaba reVC, el de Vice City. El 19 de febrero de 2021, Take-Two pidió por DMCA retirar el repositorio y toda su red de forks, 861 repositorios en total. Tras las contranotificaciones de abril a junio, el código volvió a GitHub; a principios de septiembre, Take-Two demandó a varios de sus autores, y el 29 de septiembre avisó a GitHub de la demanda, con lo que se retiró de nuevo."
  en: "re3: the PC version of Grand Theft Auto III’s source code, rebuilt by reverse engineering, which ran the game natively on Windows, Linux, and FreeBSD, ARM included, from your own copy. It could render with the original RenderWare or with librw, a free reimplementation, and audio went through MSS or OpenAL. The same repository held reVC, the Vice City one, on its miami branch. On February 19, 2021, Take-Two asked for the repository and its whole fork network, 861 repositories in all, to be taken down under the DMCA. After counter-notices from April to June the code came back to GitHub; in early September Take-Two sued several of its authors, and on September 29 it notified GitHub of the lawsuit, so it was taken down again."
requirements:
  es: "Tu propia copia de Grand Theft Auto III para PC."
  en: "Your own copy of Grand Theft Auto III for PC."
