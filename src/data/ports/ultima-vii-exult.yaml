name: "Ultima VII: The Black Gate / Serpent Isle (Exult)"
category: fan-remake
console: dos
status: fully
repo: exult/exult
homepage: https://exult.info/
originalDeveloper: Origin Systems
year: 1992
desc:
  es: "Exult: motor nuevo para Ultima VII, escrito en C++ con SDL, que usa los archivos de datos y gráficos originales del juego, un título de DOS con un gestor de memoria muy poco estándar que cuesta hacer funcionar en equipos actuales. Admite por completo The Black Gate y Serpent Isle, que se pueden terminar, sus expansiones Forge of Virtue y Silver Seed y la beta de Serpent Isle. Añade cualquier resolución con escaladores hasta 8x, un área de juego mayor que los 320×200 originales, el muñeco de equipo de Serpent Isle también en Black Gate, una barra de atajos, opciones de combate y música MIDI por un dispositivo real, FluidSynth, una MT-32 emulada o síntesis FM. Desde la 1.8 reproduce la introducción larga de Serpent Isle, que Origin recortó para ahorrar disquetes. Incluye Exult Studio, un editor para crear mods, y el instalador de Windows ofrece instalar algunos, como Keyring o el remake de Ultima VI hecho por otros fans. Hay versiones para Windows, macOS y Android, y en Linux está en Flatpak. La última estable es la 1.12.1 (8 de enero); las de prueba de la 1.13, ya sobre SDL3, salen a menudo, la última el 21 de octubre. El repositorio incluye esa introducción, restaurada a partir de una grabación antigua (unos 10 MB de animaciones), y en su documentación el desensamblado del usecode de Black Gate, el código de los guiones y diálogos del juego (unos 6 MB). Aparte, su web ofrece como descargas opcionales la música del juego grabada en una Roland MT-32 y sus efectos de sonido grabados con una Sound Blaster y con una MT-32, que el instalador de Windows puede descargar."
  en: "Exult: a new engine for Ultima VII, written in C++ with SDL, that uses the original data and graphics files of the game, a DOS title with a very nonstandard memory manager that is hard to run on current computers. It fully supports The Black Gate and Serpent Isle, both of which can be finished, their Forge of Virtue and Silver Seed add-ons, and the Serpent Isle beta. It adds any resolution with scalers up to 8x, a game area larger than the original 320×200, Serpent Isle’s paperdoll in Black Gate too, a shortcut bar, combat options, and MIDI music through a real device, FluidSynth, an emulated MT-32, or FM synthesis. Since 1.8 it plays Serpent Isle’s long intro, which Origin cut down to save floppy disks. It includes Exult Studio, an editor for making mods, and the Windows installer offers to install some, such as Keyring or the Ultima VI remake made by other fans. There are builds for Windows, macOS, and Android, and on Linux it’s on Flatpak. The latest stable release is 1.12.1 (January 8); 1.13 snapshots, already on SDL3, come out often, the latest on October 21. The repository includes that intro, restored from an old recording (about 10 MB of animations), and, in its documentation, a disassembly of Black Gate’s usecode, the code behind the game’s scripts and dialogue (about 6 MB). Separately, its website offers as optional downloads the game’s music recorded on a Roland MT-32 and its sound effects recorded on a Sound Blaster and on an MT-32, which the Windows installer can download."
requirements:
  es: "Los archivos de tu propia copia de Ultima VII: The Black Gate, de Ultima VII Part Two: Serpent Isle o de los dos, ya instalados (sirven las versiones de GOG, de CD-ROM o de disquetes), sin mezclar los de un juego con los del otro; las expansiones Forge of Virtue y Silver Seed son opcionales. Para la MT-32 emulada, las ROM de tu propia MT-32 o CM-32L. Además, Windows 7 o posterior, macOS 10.12 o posterior (las versiones de prueba piden 10.15), Linux, Android o iOS."
  en: "The files from your own copy of Ultima VII: The Black Gate, Ultima VII Part Two: Serpent Isle, or both, already installed (the GOG, CD-ROM, and floppy versions all work), without mixing one game’s files with the other’s; the Forge of Virtue and Silver Seed add-ons are optional. For the emulated MT-32, the ROMs from your own MT-32 or CM-32L. Plus Windows 7 or later, macOS 10.12 or later (snapshots need 10.15), Linux, Android, or iOS."
