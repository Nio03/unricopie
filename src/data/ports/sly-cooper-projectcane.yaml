name: Sly Cooper and the Thievius Raccoonus (ProjectCane)
games: [sly-cooper-and-the-thievius-raccoonus]
category: decomp-port
console: ps2
status: playable
repo: theclub654/ProjectCane
originalDeveloper: Sucker Punch Productions
year: 2002
desc:
  es: "Port jugable de la edición NTSC, reconstruido por ingeniería inversa. Empezó como un visor de mapas y creció hasta ser un port completo, el camino contrario al del otro proyecto de Sly Cooper del catálogo, que recompila el binario de PS2 y sigue atascado antes de mostrar gráficos. Por ahora solo para Windows; Linux está previsto. Se compila con Visual Studio 2022 e incluye un extractor al que arrastras tu propia ISO."
  en: "Playable port of the NTSC release, rebuilt through reverse engineering. It started as a map viewer and grew into a complete port, the opposite route to the other Sly Cooper project in the catalog, which recompiles the PS2 binary and is still stuck before graphics. Windows only for now, with Linux planned. You build it in Visual Studio 2022, and it ships a file extractor you drag your own ISO onto."
requirements:
  es: "Tu propia ISO NTSC de Sly Cooper and the Thievius Raccoonus (PS2) y Visual Studio 2022 con la carga de trabajo de desarrollo de escritorio con C++."
  en: "Your own NTSC ISO of Sly Cooper and the Thievius Raccoonus (PS2) and Visual Studio 2022 with the Desktop C++ workload."
