name: The Legend of Zelda (ZQuest Classic)
category: game-engine
console: nes
status: playable
repo: ZQuestClassic/ZQuestClassic
homepage: https://zquestclassic.com/
originalDeveloper: Nintendo
year: 1986
desc:
  es: "ZQuest Classic (antes Zelda Classic): motor libre y de código abierto para jugar y crear juegos al estilo del Zelda original de NES, con un editor, ZQuest, y cientos de misiones hechas por la comunidad. No es una decompilación ni ejecuta el código del juego original: es un motor propio hecho a imagen de ese juego, y no pide tu copia. Funciona en Windows 7 o posterior, macOS 12 o posterior y Linux, y tiene una versión web experimental que también va en móviles. La última versión estable es la 2.55.17 (27 de septiembre); la 3.0 sale en versiones preliminares, la última del 18 de octubre. Según su propio documento sobre la IA, algunos de sus mantenedores usan herramientas de IA para depurar, revisar y escribir parte del código, que siempre revisa una persona, pero no para gráficos, sonido ni misiones."
  en: "ZQuest Classic (formerly Zelda Classic): a free, open-source engine for playing and making games in the style of the original NES Zelda, with an editor, ZQuest, and hundreds of community-made quests. It isn’t a decompilation and doesn’t run the original game’s code: it’s an engine of its own, modeled on that game, and it doesn’t ask for your copy. It runs on Windows 7 or later, macOS 12 or later, and Linux, and has an experimental web version that also works on phones. The latest stable version is 2.55.17 (September 27); 3.0 is out as pre-releases, the latest from October 18. According to its own document on AI, some of its maintainers use AI tools to debug, review, and write part of the code, which a person always reviews, but not for graphics, sound, or quests."
requirements:
  es: "No hace falta ninguna copia del juego original. Windows 7 o posterior, macOS 12 o posterior o Linux; la versión web funciona mejor en Chrome."
  en: "No copy of the original game is needed. Windows 7 or later, macOS 12 or later, or Linux; the web version works best in Chrome."
