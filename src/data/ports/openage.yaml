repo: SFTtech/openage
homepage: https://openage.dev/
originalDeveloper: Ensemble Studios / LucasArts
desc:
  es: "openage: proyecto voluntario para crear un clon libre del Genie Engine, el motor de Age of Empires, Age of Empires II y Star Wars: Galactic Battlegrounds, escrito en C++ con Python para los scripts, la conversión de recursos y la consola. Convierte a sus propios formatos, más fáciles de modificar, los gráficos y sonidos de Age of Empires con Rise of Rome, Age of Empires II con The Conquerors, Age of Empires II HD, las Definitive Edition de los dos y Star Wars: Galactic Battlegrounds con Clone Campaigns. Sus metas son el aspecto y el manejo del original sin sus límites artificiales, un formato de contenido para mods (nyan), una consola y una API en Python, IA programable en Python y multijugador, sin compatibilidad de red ni de archivos con el juego original. Por ahora la jugabilidad, según su propio README, «básicamente no funciona», porque están rehaciendo la simulación interna del juego. La 0.6.0 (26 de noviembre de 2024) añadió un buscador de rutas por campos de flujo y un sistema de comportamiento de las unidades basado en grafos, y en julio de 2025 el blog del proyecto contó que ya funcionan los ataques y las demás interacciones entre unidades. Su último instalador para Windows es el de la 0.4.0, de 2019: las versiones actuales hay que compilarlas en Linux, macOS o Windows, aunque algunas distribuciones de Linux lo empaquetan. Nueve de sus casi 6000 commits, de septiembre, llevan a Claude como coautor."
  en: "openage: a volunteer project to build a free clone of the Genie Engine, the engine of Age of Empires, Age of Empires II, and Star Wars: Galactic Battlegrounds, written in C++ with Python for scripting, asset conversion, and the console. It converts the graphics and sound of Age of Empires with Rise of Rome, Age of Empires II with The Conquerors, Age of Empires II HD, both Definitive Editions, and Star Wars: Galactic Battlegrounds with Clone Campaigns into its own, more moddable formats. Its goals are the original’s look and feel without its artificial limits, a moddable content format (nyan), a Python console and API, AI scripting in Python, and multiplayer, with no network or file compatibility with the original game. For now, in its own README’s words, gameplay is “basically non-functional,” because the internal game simulation is being rebuilt. Version 0.6.0 (November 26, 2024) added a flow field pathfinder and a node-graph system for unit behavior, and in July 2025 the project’s blog reported that attacking and the other interactions between units now work. Its last Windows installer is the one for 0.4.0, from 2019: current versions have to be built on Linux, macOS, or Windows, though some Linux distributions package it. Nine of its nearly 6,000 commits, from September, list Claude as a co-author."
requirements:
  es: "Los archivos de tu propia copia de uno de los juegos admitidos: Age of Empires con Rise of Rome, Age of Empires II con The Conquerors, Age of Empires II HD, Age of Empires: Definitive Edition, Age of Empires II: Definitive Edition o Star Wars: Galactic Battlegrounds con Clone Campaigns. El conversor los transforma la primera vez que lo arrancas. Además, compilarlo tú en Linux, macOS o Windows."
  en: "The files from your own copy of one of the supported games: Age of Empires with Rise of Rome, Age of Empires II with The Conquerors, Age of Empires II HD, Age of Empires: Definitive Edition, Age of Empires II: Definitive Edition, or Star Wars: Galactic Battlegrounds with Clone Campaigns. The converter transforms them the first time you run it. Plus building it yourself on Linux, macOS, or Windows."
