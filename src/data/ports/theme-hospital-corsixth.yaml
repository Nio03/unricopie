name: "Theme Hospital (CorsixTH)"
category: fan-remake
console: dos
status: fully
repo: CorsixTH/CorsixTH
originalDeveloper: Bullfrog Productions
year: 1997
desc:
  es: "CorsixTH: reimplementación de código abierto de Theme Hospital, el simulador de gestión de hospitales de Bullfrog, que carga los gráficos, los sonidos, los niveles y los vídeos de los archivos del juego original. Está escrito en C++ y en Lua, donde va casi toda la lógica del juego, y funciona en Windows, macOS, Linux y BSD. Según el proyecto, la campaña se puede completar entera: están todas las enfermedades, objetos y salas, todos los sucesos (urgencias, terremotos, epidemias, visitas de VIP), las ventanas de gestión, la música y los vídeos. Faltan el multijugador, los hospitales rivales que lleva la IA, las ratas y su nivel extra, las oleadas de vómitos y el vídeo y la carta de nivel superado. Añade resoluciones Full HD y 4K, zoom, escalado de la interfaz, subtítulos, más de 20 idiomas, niveles y campañas propios con un editor de mapas integrado, partidas guardadas sin límite, tu propia música, construir con el juego en pausa y teclas reasignables. La 0.70.0 (10 de julio) añadió la edición rusa oficial de Soft Club, el escalado de la interfaz a 2x y 3x, subtítulos para el locutor, la opción de quitar el temblor de pantalla, dispositivos MIDI y un historial de mensajes del asesor; la última versión es la 0.70.1 (28 de agosto). Tiene normas para agentes de IA en su archivo AGENTS.md, y uno de sus más de 5800 commits, de agosto y sobre la compilación para Windows ARM64, lleva a Copilot como coautor."
  en: "CorsixTH: an open-source reimplementation of Theme Hospital, Bullfrog’s hospital management sim, that loads the graphics, sounds, levels, and movies from the original game’s files. It’s written in C++ and Lua, which holds most of the game logic, and runs on Windows, macOS, Linux, and BSD. According to the project, the whole campaign can be completed: every disease, object, and room is in, as are all events (emergencies, earthquakes, epidemics, VIP visits), the management windows, the music, and the movies. Still missing are multiplayer, the AI-run rival hospitals, the rats and their bonus level, vomit waves, and the level-won video and letter. It adds Full HD and 4K resolutions, zooming, UI scaling, subtitles, more than 20 languages, custom levels and campaigns with a built-in map editor, unlimited save files, your own music, building while paused, and rebindable hotkeys. Version 0.70.0 (July 10) added the official Russian Soft Club edition, 2x and 3x UI scaling, subtitles for the announcer, an option to turn off screen shake, MIDI devices, and an adviser message history; the latest release is 0.70.1 (August 28). It has rules for AI agents in its AGENTS.md file, and one of its more than 5,800 commits, from August and about the Windows ARM64 build, lists Copilot as a co-author."
requirements:
  es: "Los archivos de tu propia copia de Theme Hospital, del CD (la carpeta HOSP) o de la versión de GOG o de EA; en Linux se pueden sacar del instalador de GOG con innoextract. También funciona con la demo, que el proyecto ofrece en su web, aunque solo tiene un nivel y le faltan casi todas las pantallas de gestión. Además, Windows, macOS o Linux (en AppImage, Flatpak, Snap o paquetes de distribuciones)."
  en: "The files from your own copy of Theme Hospital, from the CD (the HOSP folder) or the GOG or EA release; on Linux they can be extracted from the GOG installer with innoextract. The demo, which the project offers on its website, works too, though it has a single level and lacks most management screens. Plus Windows, macOS, or Linux (as an AppImage, Flatpak, Snap, or distro packages)."
