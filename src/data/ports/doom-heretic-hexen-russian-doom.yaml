name: "Doom / Heretic / Hexen (Russian Doom)"
games: [doom, heretic, hexen-beyond-heretic]
category: source-port
console: dos
status: playable
repo: Russian-Doom/russian-doom
originalDeveloper: "id Software, Raven Software"
year: 1993
desc:
  es: "Russian Doom: port de Doom, Heretic y Hexen que quita los límites del motor original. Continúa el código de Russian Doom e International Doom que mantiene Leonid Murin (Dasperal), y se apoya en Chocolate Doom y Crispy Doom, con aportaciones importantes de Doom Retro, con la aprobación de sus autores. Corrige numerosos fallos del juego original, dibuja en resoluciones mejoradas de 640×400 y 1280×800, trae paletas mejoradas y muchas mejoras estéticas opcionales, y ofrece la traducción más completa posible al ruso. La última versión numerada es la 6.3 (29 de octubre de 2023), que reúne los cambios hechos antes de que International Doom 7.0 abandonara este código; sus compilaciones son para Windows de 32 y de 64 bits, y en Linux hay un paquete en el AUR o se compila. El repositorio sigue activo (último cambio, el 11 de mayo de 2026). Aparte hay una versión para DOS. Además del código, el repositorio incluye en src/base una veintena de WAD con recursos para los tres juegos; entre ellos, doom-beta.wad, doom-jaguar.wad y hexen-psx.wad (de 4 a 6 MB) llevan mapas y gráficos de la beta de Doom, de Doom para Jaguar y de Hexen para PlayStation. En test_data hay además tres WAD de prueba (DOOM1.WAD, HERETIC1.WAD y hexen.wad, unos 19 MB)."
  en: "Russian Doom: a limit-removing source port of Doom, Heretic, and Hexen. It continues the Russian Doom and International Doom codebase maintained by Leonid Murin (Dasperal), builds on Chocolate Doom and Crispy Doom with significant additions from Doom Retro, and is distributed with their authors’ approval. It fixes numerous bugs of the original games, renders at enhanced 640×400 and 1280×800 resolutions, has improved palettes and many optional aesthetic enhancements, and offers the most complete translation into Russian possible. The latest numbered version is 6.3 (October 29, 2023), which gathers the changes made before International Doom 7.0 abandoned this code; its builds are for 32-bit and 64-bit Windows, and on Linux there is an AUR package or you compile it. The repository is still active (last change on May 11, 2026). A separate version exists for DOS. Besides the code, the repository includes about twenty WAD files in src/base with resources for the three games; among them, doom-beta.wad, doom-jaguar.wad, and hexen-psx.wad (4 to 6 MB each) carry maps and graphics from the Doom beta, Doom for the Jaguar, and Hexen for the PlayStation. test_data also holds three test WADs (DOOM1.WAD, HERETIC1.WAD, and hexen.wad, about 19 MB)."
requirements:
  es: "Los archivos (IWAD) de tu propia copia de Doom, Doom II, Heretic o Hexen, según el juego que quieras jugar; el README remite a la wiki del proyecto para los detalles. Además, Windows de 32 o 64 bits, o Linux."
  en: "The files (IWAD) from your own copy of Doom, Doom II, Heretic, or Hexen, depending on which game you want to play; the README points to the project’s wiki for details. Plus 32-bit or 64-bit Windows, or Linux."
