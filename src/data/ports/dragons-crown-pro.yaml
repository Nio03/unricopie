desc:
  es: "Port nativo no oficial de Dragon's Crown Pro, el beat 'em up de Vanillaware para PS4, a Windows y, de forma experimental, a Linux y Steam Deck. Es de la familia del de Bloodborne: el código x86-64 original del juego corre directamente en la CPU, con un entorno de ejecución que sustituye las bibliotecas del sistema de la PS4, y los gráficos pasan a Vulkan con un renderizador derivado de shadPS4; según el README, el cargador, el entorno y el núcleo de vídeo salen de gow3_pc (hoy SpartanPort) y sus derivados. El launcher instala el juego directamente desde tu archivo .pkg, después de comprobar la versión y el hash del eboot.bin, y busca versiones nuevas del port. Permite resolución interna de 480p a 4K, relaciones de aspecto de 16:10 a 32:9 (que de momento estiran la imagen, porque el juego está maquetado para 1280×720), SMAA, filtrado anisotrópico, FSR 1 con nitidez RCAS, ventana o ventana sin bordes, elegir el idioma de menús y subtítulos, voces japonesas para los personajes no jugables en la versión estadounidense, trofeos locales sin conexión, trucos, multijugador local con hasta cuatro mandos e iconos de botones de Xbox; el juego va a sus 60 fps y no tiene juego en línea. La v0.7.0 (21 de octubre) añadió un modo para aracnofóbicos que redibuja las arañas gigantes, la reasignación del teclado y la actualización 1.01 estadounidense. Los iconos de Xbox y la araña redibujada se aplican con dos parches incluidos en el port que modifican texturas dentro de los archivos del juego en tu copia instalada. El proyecto declara que se usaron herramientas de IA para analizar el código, desarrollar, depurar y documentar, y 3 de sus 69 commits llevan a Claude como coautor."
  en: "An unofficial native port of Dragon’s Crown Pro, Vanillaware’s PS4 beat ’em up, to Windows and, experimentally, to Linux and the Steam Deck. It belongs to the Bloodborne port family: the game’s original x86-64 code runs directly on the CPU, with a runtime that replaces the PS4 system libraries, and the graphics go to Vulkan through a renderer derived from shadPS4; according to the README, its loader, runtime, and video core come from gow3_pc (now SpartanPort) and its descendants. The launcher installs the game straight from your .pkg file after checking the version and the eboot.bin hash, and looks for new releases of the port. It offers render resolutions from 480p to 4K, aspect ratios from 16:10 to 32:9 (which for now stretch the picture, since the game is laid out for 1280×720), SMAA, anisotropic filtering, FSR 1 with RCAS sharpening, windowed or borderless mode, a choice of menu and subtitle language, Japanese NPC voices on the US release, offline local trophies, cheats, local multiplayer with up to four controllers, and Xbox button prompts; the game runs at its own 60 fps and has no online play. v0.7.0 (October 21) added an arachnophobia mode that redraws the giant spiders, keyboard rebinding, and the US 1.01 update. The Xbox prompts and the redrawn spider are applied by two patches bundled with the port that modify textures inside the game’s archives in your installed copy. The project states that AI tools were used for code analysis, development, debugging, and documentation, and 3 of its 69 commits list Claude as a co-author."
requirements:
  es: "Tu propio paquete .pkg descifrado de Dragon's Crown Pro para PS4, de una versión admitida: la estadounidense (CUSA10454) 1.00, con la actualización 1.01 opcional; la japonesa (CUSA07001) 1.00, 1.02 o 1.03, o la de Asia y Hong Kong (CUSA10209) 1.00 o 1.02. La estadounidense 1.00 es la más probada. Unos 6 GB libres para el juego instalado y, para ver la lista de trofeos, tu propia Trophy Key. Además, Windows 10 (1903 o posterior) u 11 de 64 bits, o Linux x86-64 con glibc 2.31 o posterior (experimental), y una tarjeta gráfica con Vulkan 1.3. No se incluye ningún archivo del juego."
  en: "Your own decrypted Dragon’s Crown Pro PS4 .pkg file, from a supported release: US (CUSA10454) 1.00, with the optional 1.01 update; Japanese (CUSA07001) 1.00, 1.02, or 1.03; or Asia and Hong Kong (CUSA10209) 1.00 or 1.02. US 1.00 is the most tested. About 6 GB of free space for the installed game and, to see the trophy list, your own Trophy Key. Plus 64-bit Windows 10 (1903 or later) or 11, or x86-64 Linux with glibc 2.31 or later (experimental), and a Vulkan 1.3 graphics card. No game files are included."
