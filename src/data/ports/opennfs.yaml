name: OpenNFS
category: fan-remake
status: experimental
repo: OpenNFS/OpenNFS
author: Amrik Sadhra
originalDeveloper: EA Canada / EA Seattle
desc:
  es: "OpenNFS: motor nuevo, escrito desde cero en C++ con OpenGL y la física de Bullet, que intenta recrear los Need for Speed clásicos, del primero al quinto, cargando los coches, las pistas y la música de sus archivos originales. Está en una fase temprana. Lee, con distinto grado de avance, los formatos de las versiones de PC de Need for Speed II, II Special Edition, III: Hot Pursuit, High Stakes y Porsche Unleashed (de este último, aún sin un lector estable), y en parte los de PlayStation de II, III y High Stakes; los de III para PC son los más completos, y el primer Need for Speed aún no se carga. En 2026 ha sumado menús para elegir coche, color y pista, marcas de derrape, un clima ajustable y la física de conducción de High Stakes para PC que Bluv escribió para el proyecto Velocity, con la que los coches ya se pueden conducir. Sus planes incluyen la jugabilidad de cada juego original, menús configurables, la importación automática de los juegos, un mundo abierto que una todas las pistas clásicas y multijugador. Su última versión publicada, la 0.3 (14 de julio de 2020), es una compilación de finales de 2018; las actuales salen de su integración continua para Windows, macOS y Linux. El repositorio incluye además las 11 texturas de cielo de una pista de Need for Speed III: Hot Pursuit, extraídas de su archivo sky.fsh, que usa para los reflejos de los coches."
  en: "OpenNFS: a new engine, written from scratch in C++ with OpenGL and Bullet physics, that aims to recreate the classic Need for Speed games, the first through the fifth, by loading the cars, tracks, and music from their original files. It’s at an early stage. It reads, to varying degrees, the formats of the PC versions of Need for Speed II, II Special Edition, III: Hot Pursuit, High Stakes, and Porsche Unleashed (the last one still without a stable parser), and partly those of the PlayStation versions of II, III, and High Stakes; III for PC is the most complete, and the first Need for Speed doesn’t load yet. In 2026 it gained menus to pick a car, color, and track, skid marks, adjustable weather, and the High Stakes PC driving physics Bluv wrote for the Velocity project, which make the cars drivable. Its plans include each original game’s gameplay, configurable menus, automatic import of the games, an open world joining all the classic tracks, and multiplayer. Its last published release, 0.3 (July 14, 2020), is a build from late 2018; current builds come from its continuous integration for Windows, macOS, and Linux. The repository also includes the 11 sky textures of a Need for Speed III: Hot Pursuit track, extracted from its sky.fsh file, which it uses for the cars’ reflections."
requirements:
  es: "Los archivos de tu propia copia de Need for Speed III: Hot Pursuit para PC (las carpetas gamedata y fedata), que son obligatorios; los de Need for Speed II, II Special Edition, High Stakes y Porsche Unleashed para PC son opcionales. Además, Windows, macOS o Linux; para la versión actual hay que compilarlo o bajar una compilación de su integración continua."
  en: "The files from your own copy of Need for Speed III: Hot Pursuit for PC (the gamedata and fedata folders), which are required; those of Need for Speed II, II Special Edition, High Stakes, and Porsche Unleashed for PC are optional. Plus Windows, macOS, or Linux; for the current version you have to build it or grab a build from its continuous integration."
tags:
  - racing
