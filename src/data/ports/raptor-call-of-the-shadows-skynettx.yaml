desc:
  es: "Port a sistemas actuales de Raptor: Call of the Shadows, el matamarcianos de scroll vertical para MS-DOS de Cygnus Studios, sobre el código que nukeykt y wel97459 reconstruyeron por ingeniería inversa; su README agradece además el apoyo de Scott Host, autor del juego original. Usa SDL2 y lee los archivos de datos (GLB) de la versión 1.2 o posteriores, shareware o completa. Tiene música AdLib emulada o MIDI, por TinySoundFont con un banco de sonidos SF2 o por el MIDI del sistema (Windows, ALSA en Linux, Core Audio y Core MIDI en macOS), control con teclado, ratón o mando con vibración, pantalla completa o ventana redimensionable, corrección de la relación de aspecto y un programa de configuración como el original, hecho con la libtextscreen de Chocolate Doom, que desde la 0.8.2 va dentro del propio juego. Guarda la configuración y las partidas en una carpeta del usuario y funciona también en sistemas big-endian. La última versión, la 0.8.2 (28 de septiembre), mejoró el control con mando y corrigió el volumen bajo de la música OPL y el ratón en pantallas de alta densidad. Publica instaladores para Windows de 32 y 64 bits y para macOS (Intel y Apple Silicon), además de una APK para Android; en Linux se compila. Las descargas de la 0.8.0 traían los datos de la versión shareware 1.2."
  en: "A port of Raptor: Call of the Shadows, Cygnus Studios’ vertical scrolling shooter for MS-DOS, to modern systems, built on the code that nukeykt and wel97459 reconstructed by reverse engineering; its README also credits the support of Scott Host, the original game’s author. It uses SDL2 and reads the data files (GLB) of version 1.2 or later, shareware or full. It has emulated AdLib or MIDI music, through TinySoundFont with an SF2 sound bank or through the system’s MIDI (Windows, ALSA on Linux, Core Audio and Core MIDI on macOS), keyboard, mouse, or controller input with rumble, fullscreen or a resizable window, aspect ratio correction, and a setup program like the original, made with Chocolate Doom’s libtextscreen, which since 0.8.2 is built into the game itself. It keeps settings and saves in a user folder and also runs on big-endian systems. The latest release, 0.8.2 (September 28), improved controller input and fixed the low OPL music volume and the mouse on high-DPI displays. It publishes installers for 32- and 64-bit Windows and for macOS (Intel and Apple silicon), plus an Android APK; on Linux you build it yourself. The 0.8.0 downloads included the shareware version 1.2 data."
requirements:
  es: "Los archivos GLB de Raptor: Call of the Shadows en su versión 1.2 o posterior: FILE0000.GLB y FILE0001.GLB de la versión shareware, que es gratuita, o de FILE0000.GLB a FILE0004.GLB de tu propia copia de la versión completa; las versiones anteriores a la 1.2 no sirven. Para la música MIDI por TinySoundFont, un banco de sonidos SF2 compatible con General MIDI. Además, Windows, macOS o Linux (compilándolo)."
  en: "The GLB files of Raptor: Call of the Shadows version 1.2 or later: FILE0000.GLB and FILE0001.GLB from the shareware version, which is free, or FILE0000.GLB through FILE0004.GLB from your own copy of the full version; versions before 1.2 don’t work. For MIDI music through TinySoundFont, a General MIDI–compatible SF2 sound bank. Plus Windows, macOS, or Linux (building it yourself)."
