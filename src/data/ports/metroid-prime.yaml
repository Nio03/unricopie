desc:
  es: "Port nativo para Linux, Windows y Android compilado directamente del código decompilado por PrimeDecomp, que tiene su propia ficha en el catálogo, y renderizado con Aurora sobre SDL3 y WebGPU. Sin emulador de por medio. Añade modo 4:3, 16:9 o adaptado a la ventana, con el HUD extendido hasta los bordes y los menús, la pausa y el mapa con la relación de aspecto corregida."
  en: "Native Linux, Windows, and Android port compiled straight from the source decompiled by PrimeDecomp, which has its own catalog entry, and rendered through Aurora on SDL3 and WebGPU. No emulator involved. It adds 4:3, 16:9, or window-following widescreen, with the HUD spread to the edges and the menus, pause, and map screens aspect-corrected."
requirements:
