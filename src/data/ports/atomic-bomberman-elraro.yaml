desc:
  es: "Reimplementación desde cero de Atomic Bomberman (1997) en C++20 con SDL3 y OpenGL 3.3, hecha estudiando el ejecutable original por ingeniería inversa y comprobando cada regla contra él: el original se ejecuta con Wine y se maneja con pulsaciones automáticas para contrastar. Las reglas salen de ese estudio y no de traducir el código antiguo. Funciona sin el juego original gracias a un conjunto propio y libre de gráficos, sonidos, música y escenarios que genera el programa; con tu copia del original se importan sus datos una vez (en el primer arranque o en Opciones, Original Game Data) para tener el aspecto y el sonido originales. Admite hasta 10 jugadores con ordenadores, un modo en red cliente-servidor por TCP y UDP con servidor dedicado, y compilaciones para Linux, Windows, macOS y Android. La v1.0 se publicó el 5 de octubre. 100 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A from-scratch reimplementation of Atomic Bomberman (1997) in C++20 with SDL3 and OpenGL 3.3, made by reverse engineering the original executable and checking every rule against it: the original is run under Wine and driven with scripted key presses for comparison. The rules come from that study rather than from translating the old code. It works without the original game thanks to its own free set of graphics, sounds, music, and arenas generated by the program; with your copy of the original you import its data once (on first start or under Options, Original Game Data) to get the original look and sound. It supports up to 10 players with computer opponents, a client-server network mode over TCP and UDP with a dedicated server, and builds for Linux, Windows, macOS, and Android. Version 1.0 was published on October 5. 100 of its last 100 commits list Claude as a co-author."
requirements:
  es: "No necesita el juego original: arranca con su propio conjunto libre de gráficos y sonidos. Opcional: tu copia del Atomic Bomberman original (instalada o en CD) para importar sus gráficos, sonidos, música y escenarios."
  en: "It doesn’t need the original game: it starts with its own free set of graphics and sounds. Optional: your copy of the original Atomic Bomberman (installed or on CD) to import its graphics, sounds, music, and arenas."
