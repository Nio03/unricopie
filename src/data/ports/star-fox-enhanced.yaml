desc:
  es: "Port nativo a Windows del Star Fox de SNES, construido sobre el código abierto de UltraStarFox. Permite elegir entre 20 y 480 fps sin perder la velocidad NTSC que tenía el juego; por defecto funciona a 60. Es un primer trabajo de fidelidad al original, temprano pero jugable."
  en: "Native Windows port of the SNES Star Fox, built on the open-source UltraStarFox codebase. It lets you pick anything from 20 to 480 fps while keeping the game’s intended NTSC speed; the default is 60. An early but playable fidelity pass."
