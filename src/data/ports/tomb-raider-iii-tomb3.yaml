desc:
  es: "tomb3: decompilación de la versión de PC de Tomb Raider III, de los autores de TOMB4 y TOMB5, las decompilaciones de The Last Revelation y Chronicles; se inspira en TR2Main, de Arsunt, de la que usa además código para algunas funciones. Su objetivo declarado es conservar el código fuente original de la versión de PC. Empezó como una DLL que sustituía funciones del juego, y en la 2.0.0 (18 de abril de 2023) terminó de decompilarlo y pasó a compilar su propio ejecutable. Corrige muchos fallos del original (colisiones en geometría triangular, datos que no se guardaban, cierres, errores del New Game+) y añade modo ventana, una herramienta de configuración hecha por Lahm86, renderizado interno en color de 32 bits en vez de 16, mejores luces dinámicas y niebla, la sombra y los colores de explosiones de la versión de PlayStation, el sistema de guardado de PlayStation como opción, un mapa en 3D de los niveles, presencia en Discord, límites internos mucho más altos y nuevos comandos de guion para los creadores de niveles (TRLE). También ejecuta la expansión The Lost Artifact, con su propio New Game+. Es solo para Windows. La última versión es la 2.0.2 (10 de mayo de 2023) y el último commit, de septiembre de 2023. La descarga incluye además, para cada idioma, una versión modificada del archivo de guion del juego (tombpc.dat), que la 2.0 necesita para funcionar bien."
  en: "tomb3: a decompilation of the PC version of Tomb Raider III, by the authors of TOMB4 and TOMB5, the decompilations of The Last Revelation and Chronicles; it’s inspired by Arsunt’s TR2Main, whose code it also uses for some features. Its stated goal is to preserve the original source code of the PC version. It started as a DLL that replaced game functions, and with 2.0.0 (April 18, 2023) it finished decompiling the game and began building its own executable. It fixes many bugs in the original (collisions on triangular geometry, data that wasn’t saved, crashes, New Game+ errors) and adds windowed mode, a configuration tool made by Lahm86, internal 32-bit color rendering instead of 16-bit, better dynamic lights and fog, the PlayStation version’s shadow and explosion colors, the PlayStation save system as an option, a 3D level map, Discord presence, much higher internal limits, and new script commands for level builders (TRLE). It also runs The Lost Artifact expansion, with its own New Game+. It’s Windows-only. The latest release is 2.0.2 (May 10, 2023) and the last commit is from September 2023. The download also includes, for each language, a modified version of the game’s script file (tombpc.dat), which 2.0 needs to work properly."
requirements:
  es: "Tu propia copia de Tomb Raider III para PC, de Steam, GOG o en CD; con el CD hay que copiar además a la carpeta del juego las carpetas audio, cuts, data, fmv y pix y varias DLL del disco. El contenido de la descarga se copia encima de la carpeta del juego. Para The Lost Artifact, las carpetas data y pix de su disco. Además, Windows."
  en: "Your own copy of Tomb Raider III for PC, from Steam, GOG, or on CD; with the CD you also copy the audio, cuts, data, fmv, and pix folders and several DLLs from the disc into the game folder. The download’s contents are copied over the game folder. For The Lost Artifact, the data and pix folders from its disc. Plus Windows."
