name: "Heretic II (Heretic2R)"
games: [heretic-ii]
category: fan-remake
console: pc
status: fully
repo: m-x-d/Heretic2R
originalDeveloper: Raven Software
year: 1998
desc:
  es: "Heretic2R: port de Heretic II reconstruido por ingeniería inversa, que sustituye al ejecutable y a las bibliotecas del juego original y usa sus datos. Admite pantalla panorámica con el HUD escalado automáticamente, separa la tasa de fotogramas del ritmo de envío de los paquetes de red (con un máximo teórico de 1000 fps), actualiza la mayoría de los efectos especiales a la tasa de fotogramas en vez de a 20 por segundo, reproduce la música en OGG y carga los mapas más rápido, además de corregir muchos fallos y hacer retoques visuales para que el juego sea como lo recuerdas y no como era en realidad. Según su autor, la campaña está bastante probada y se puede terminar sin fallos graves; el cooperativo y el multijugador funcionan, pero apenas se han probado, y desde la R4 también arranca como servidor dedicado. No tiene el multijugador en línea de GameSpy, ni soporte de mando ni de HiDPI, y no se ha probado por encima de 60 fps ni de 1080p. Sus partidas guardadas no son compatibles con las del original y, por cambios en la API, tampoco lo son los renderizadores, los módulos de sonido ni las bibliotecas de juego de Heretic II. La primera versión, la R1, salió el 23 de marzo; la última es la R6 (3 de agosto), para Windows, que terminó la brújula que el juego original había dejado a medias. El repositorio incluye además, en su carpeta stuff, un ZIP de unos 10,8 MB con los archivos del parche oficial 1.06 de Heretic II (el Heretic II Enhancement Pack) sin sus .exe ni sus .dll, que el README ofrece para actualizar tu copia en lugar del instalador del parche."
  en: "Heretic2R: a reverse-engineered port of Heretic II that replaces the original game’s executable and libraries and runs its data. It supports widescreen with automatic HUD scaling, decouples the rendering frame rate from the network packet rate (with a theoretical maximum of 1000 fps), updates most special effects at the rendering frame rate instead of 20 fps, plays music as OGG, and loads maps faster, plus many bug fixes and cosmetic tweaks so the game plays the way you remember it rather than how it actually played. According to its author, the single-player campaign is fairly well tested and can be completed without major issues; co-op and multiplayer work but are practically untested, and since R4 it can also run as a dedicated server. GameSpy online multiplayer, gamepad support, and HiDPI support aren’t implemented, and frame rates above 60 fps and resolutions above 1080p haven’t been tested. Its saves aren’t compatible with the original’s, and because of API changes neither are Heretic II’s renderers, sound backends, or game libraries. The first release, R1, came out on March 23; the latest is R6 (August 3), for Windows, which finished the compass the original game had left incomplete. The repository also includes, in its stuff folder, a ZIP of about 10.8 MB with the files of Heretic II’s official 1.06 patch (the Heretic II Enhancement Pack) minus its .exe and .dll files, which the README offers for updating your copy instead of the patch’s installer."
requirements:
  es: "Los datos de tu propia copia de Heretic II para PC, actualizada a la versión 1.06: sin ella faltan modelos, texturas y sonidos. Se sobrescriben los ejecutables del juego con los de Heretic2R, o se copia la carpeta base del juego, sin sus .dll, a la de Heretic2R. Para la música hay que ripear las pistas 2 a 14 del CD a OGG (de track02.ogg a track14.ogg) en la carpeta music, dentro de base. Además, Windows."
  en: "The data from your own copy of Heretic II for PC, updated to version 1.06: without it, models, textures, and sounds are missing. Either overwrite the game’s binaries with Heretic2R’s or copy the game’s base folder, minus its .dll files, into the Heretic2R folder. For music, rip the CD’s tracks 2–14 to OGG (track02.ogg to track14.ogg) into the music folder inside base. Plus Windows."
