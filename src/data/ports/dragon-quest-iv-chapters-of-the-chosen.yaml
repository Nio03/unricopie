desc:
  es: "DQIV-Recompiled: la versión europea de Nintendo DS, compilada desde su decompilación, que viene en el propio repositorio, y convertida en un programa nativo de Windows con su propia capa para PC (ventana, OpenGL, sonido, archivos). Une las dos pantallas en una sola imagen 16:9 a 60 fps, dibujada entera por la cámara inferior, en lugar de las dos a 30 fps que alternaba la DS; dibuja el 3D a la resolución de la ventana con supermuestreo 2x y texturas reescaladas, admite de 60 a 240 fps o sin límite, zoom de cámara del 50 al 200 % y combates en 16:9 con los monstruos ampliados. Recupera la charla con el grupo que se quitó en la versión europea, en inglés, francés, alemán, italiano, español y japonés, permite jugar con los textos japoneses que ya trae el cartucho europeo y, si aportas el archivo de datos de la versión de Android, usa su música y sus efectos en lugar del sintetizador de la DS. Suma guardado rápido en cualquier sitio, velocidad de texto y de combate, controles reasignables y una pantalla de opciones con el estilo del juego. No hay versiones compiladas: un script lo compila con Visual Studio y mete los datos extraídos de tu ROM en un único ejecutable. La 1.4 (20 de octubre) quitó el tearing con la sincronización vertical activada. El repositorio incluye los textos de la charla con el grupo: los ingleses, sacados de la versión para móviles con las correcciones de dq4-partychat-patcher, y sus traducciones al francés, alemán, italiano y español."
  en: "DQIV-Recompiled: the European Nintendo DS release, built from its decompilation, which lives in the repository itself, and turned into a native Windows program with its own PC layer (window, OpenGL, sound, files). It joins both screens into one 16:9 picture at 60 fps, drawn whole by the bottom camera, instead of the two 30 fps screens the DS alternated; it draws the 3D at the window’s resolution with 2x supersampling and upscaled textures, supports 60 to 240 fps or uncapped, a 50–200% camera zoom, and 16:9 battles with enlarged monsters. It brings back the party chat that the European release removed, in English, French, German, Italian, Spanish, and Japanese, lets you play with the Japanese text already on the European cartridge, and, if you provide the Android version’s data file, uses its music and sound effects instead of the DS synthesizer. It also adds quick save anywhere, text and battle speed settings, rebindable controls, and a settings screen in the game’s style. There are no prebuilt releases: a script builds it with Visual Studio and packs the data extracted from your ROM into a single executable. Version 1.4 (October 20) removed tearing with vertical sync on. The repository includes the party chat text: the English lines, taken from the mobile version with the dq4-partychat-patcher fixes, and their French, German, Italian, and Spanish translations."
requirements:
  es: "Tu propia ROM europea de Dragon Quest IV para Nintendo DS (código YIVP), en .nds o dentro de un .zip; si quieres el sonido de la versión para móviles, también el archivo .obb de la versión de Android (main.xxxxx.com.square_enix.android_googleplay.dq4.obb). Para compilarlo, Visual Studio 2022 o 2026 con la carga de trabajo «Desarrollo para el escritorio con C++» y conexión a internet la primera vez. El ejecutable es de 32 bits y funciona en Windows de 64 bits."
  en: "Your own European Dragon Quest IV ROM for Nintendo DS (game code YIVP), as a .nds or inside a .zip; for the mobile version’s sound, also the Android version’s .obb data file (main.xxxxx.com.square_enix.android_googleplay.dq4.obb). To build it, Visual Studio 2022 or 2026 with the “Desktop development with C++” workload and an internet connection the first time. The executable is 32-bit and runs on 64-bit Windows."
