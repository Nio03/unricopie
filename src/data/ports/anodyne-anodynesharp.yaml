desc:
  es: "AnodyneSharp: reescritura de Anodyne, de Analgesic Productions, en C# con MonoGame, hecha a partir del código fuente del juego que publicó el propio estudio (Anodyne-1-Repo). Busca ser fiel al original, con algunas mejoras de uso y un código más modular. Dibuja a 60 fps con OpenGL o DirectX, hace los efectos con shaders en lugar de en la CPU, admite mando (el de Switch Pro necesita que Steam esté activo), muestra la escoba elegida arriba a la izquierda, deja cambiar de escoba con RePág y AvPág o con 1 a 4 sin pasar por el menú, marca en los minimapas los cofres sin abrir de las pantallas que ya has visitado y los números de planta de las mazmorras con varias, hace que «volver a la entrada» te lleve a la pantalla por la que entraste, y trata mejor el polvo en el borde del agua. Las versiones publicadas son prelanzamientos: la 0.1 (2 de febrero de 2021) llegaba al final del primer templo, y la 0.2 (24 de julio de 2021), hasta la Cueva Roja, con FIELDS, BEACH, REDSEA y REDCAVE completas y los ajustes rehechos. El repositorio recibió cambios hasta el 4 de febrero de 2026. Trae unos 73 MB de contenido del juego, con niveles, arte, música, sonido y texto: Analgesic Productions los publicó junto con el código, con una licencia propia, la de Anodyne 1, que no exige tener el juego original y pide créditos, y que prohíbe vender o redistribuir gratis una versión sin alterar."
  en: "AnodyneSharp: a rewrite of Anodyne, by Analgesic Productions, in C# with MonoGame, made from the game’s source code that the studio itself published (Anodyne-1-Repo). It aims to be faithful to the original, with some usability improvements and more modular code. It renders at 60 fps with OpenGL or DirectX, does effects with shaders instead of on the CPU, supports controllers (the Switch Pro one needs Steam to be active), shows the selected broom in the top left, lets you swap brooms with PgUp and PgDn or with 1 to 4 without going through the menu, marks unopened chests on the minimaps of screens you’ve visited and floor numbers in multi-floor dungeons, makes “return to entrance” take you to the screen where you entered, and handles the dust at the edge of water better. The published releases are pre-releases: 0.1 (February 2, 2021) reached the end of the first temple, and 0.2 (July 24, 2021) went up to the Red Cave, with FIELDS, BEACH, REDSEA, and REDCAVE fully done and the settings menu reworked. The repository received changes until February 4, 2026. It carries about 73 MB of the game’s content, with levels, art, music, sound, and text: Analgesic Productions published them together with the code, under its own license, the Anodyne 1 one, which doesn’t require owning the original game, asks for credit, and forbids selling or freely redistributing an unaltered version."
requirements:
  es: "Nada: las descargas (archivos .7z de unos 105 MB para Windows y Linux) traen el juego entero, y el repositorio, su contenido. Windows (con OpenAL 2.0) o Linux (con OpenGL 3.0 y SDL2); para compilar, Visual Studio 2017 o posterior, o Mono en Linux."
  en: "Nothing: the downloads (.7z archives of about 105 MB for Windows and Linux) include the whole game, and the repository its content. Windows (with OpenAL 2.0) or Linux (with OpenGL 3.0 and SDL2); to build, Visual Studio 2017 or later, or Mono on Linux."
