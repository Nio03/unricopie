name: "Caesar III (Julius)"
games: [caesar-iii]
category: fan-remake
console: pc
status: fully
repo: bvschaik/julius
originalDeveloper: Impressions Games
year: 1998
desc:
  es: "Julius: reimplementación de código abierto de Caesar III que funciona con los archivos del juego original. Su objetivo es la misma lógica de juego con el mismo aspecto: las partidas guardadas son compatibles al 100 % en los dos sentidos con las del original, y por eso conserva incluso sus fallos de jugabilidad. Lo que cambia es la parte técnica y la interfaz: ventana redimensionable a cualquier resolución, panorámico incluido, modo en ventana que funciona con cualquier profundidad de color, teclas reasignables, rueda del ratón en listas y textos, capturas de pantalla de la ciudad entera, autoguardado mensual opcional, más información en edificios, tooltips y consejeros, el editor de mapas dentro del juego y música en MP3 de alta calidad. Funciona en Windows, Linux y macOS, y también en el navegador, Android, PS Vita y Switch. Para cambios de jugabilidad existe Augustus, un fork de Julius. La última versión es la 1.8.0 (31 de julio de 2025), que añadió el checo, el griego y el japonés y opciones de línea de comandos para la pantalla completa y el monitor. En otro repositorio del proyecto, julius-support, enlazado desde su wiki, ofrece como descargas opcionales los parches oficiales 1.0.1.0 del juego en varios idiomas (necesarios si tu copia no los tiene), los cinco temas de música en MP3 que Sierra publicaba en su web y traducciones hechas por fans; el propio repositorio incluye, entre sus datos de prueba, los dos archivos del mapa del imperio del juego (c3.emp y c32.emp)."
  en: "Julius: an open-source reimplementation of Caesar III that runs with the original game’s files. Its goal is the same game logic with the same look and feel: saves are 100% compatible with the original’s both ways, so it even keeps its gameplay bugs. What changes is the technical side and the interface: a resizable window at any resolution, widescreen included, a windowed mode that works at any color depth, rebindable hotkeys, mouse wheel scrolling in lists and texts, full-city screenshots, optional monthly autosaves, more information in buildings, tooltips, and advisors, the map editor inside the game, and high-quality MP3 music. It runs on Windows, Linux, and macOS, and in the browser, on Android, PS Vita, and Switch too. For gameplay changes there’s Augustus, a fork of Julius. The latest release is 1.8.0 (July 31, 2025), which added Czech, Greek, and Japanese and command-line options for fullscreen and display selection. In another of the project’s repositories, julius-support, linked from its wiki, it offers as optional downloads the game’s official 1.0.1.0 patches in several languages (needed if your copy doesn’t have them), the five MP3 music tracks Sierra once published on its website, and fan translations; the repository itself includes, among its test data, the game’s two empire map files (c3.emp and c32.emp)."
requirements:
  es: "Los archivos de tu propia copia de Caesar III, de GOG, de Steam o del CD, actualizada a la versión 1.0.1.0; para el editor, además, los archivos del editor original. Además, Windows, Linux (en AppImage o Flatpak) o macOS."
  en: "The files from your own copy of Caesar III, from GOG, Steam, or the CD, updated to version 1.0.1.0; for the editor, the original editor files as well. Plus Windows, Linux (as an AppImage or Flatpak), or macOS."
