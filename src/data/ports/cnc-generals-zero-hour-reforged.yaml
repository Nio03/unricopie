desc:
  es: "Zero Hour Reforged: Command & Conquer: Generals – Zero Hour reconstruido a partir del código fuente que Electronic Arts publicó en febrero de 2025, pasado a Visual Studio 2022 y a 64 bits y, desde octubre, a SDL3 para macOS y Linux, sin Wine ni Proton. Dibuja con Direct3D 11 o 9 en Windows, con Metal en macOS y con Vulkan en Linux y Steam Deck, sin tope de fotogramas y con más campo de batalla en pantallas ultrapanorámicas. Corrige unos sesenta fallos que EA dejó en 2003, la mayoría hallados con pruebas automáticas, y cambia el juego: la IA de escaramuza por fin construye una base y explora sin ver a través de la niebla, los vehículos aceleran y frenan, la veteranía de cada baja se reparte entre quienes dañaron al objetivo, y hay una pasada de equilibrio, una barra de mando nueva, rutas y efectos mucho más rápidos, las 481 texturas originales del juego base a cuatro veces la resolución de las de Zero Hour, sombras e iluminación nuevas, una opción para volver al aspecto de 2003 y textos en turco y alemán. El multijugador en red local funciona; el juego por internet y el mando, todavía no. En Windows, un launcher lo instala sobre tu juego, con copia de lo que sustituye, y lo mantiene al día; en macOS y Linux se compila con un solo comando. La última versión, la v3.2.0 (20 de octubre), fijó las partidas a 60 pasos por segundo con un modo Turbo opcional y abrió todas las misiones de las campañas. Su web dice que los cambios del código se hacen con ayuda de IA, y 87 de sus últimos 100 commits llevan a Claude como coautor. El repositorio incluye además versiones modificadas de archivos de datos del juego, como los scripts de la IA de escaramuza y las pantallas de la interfaz, y en Windows el script de compilación descarga de las versiones del propio repositorio un paquete de arte del juego reescalado, que en macOS y Linux se copia a mano o se omite."
  en: "Zero Hour Reforged: Command & Conquer: Generals – Zero Hour rebuilt from the source code Electronic Arts released in February 2025, moved to Visual Studio 2022 and 64-bit and, since October, to SDL3 for macOS and Linux, with no Wine or Proton. It renders with Direct3D 11 or 9 on Windows, Metal on macOS, and Vulkan on Linux and Steam Deck, with an uncapped frame rate and more of the battlefield on ultrawide screens. It fixes about sixty bugs EA shipped in 2003, most of them found by automated tests, and changes the game: the skirmish AI finally builds a base and scouts without seeing through the fog of war, vehicles accelerate and brake, each kill’s veterancy is shared among everything that damaged the target, and there’s a balance pass, a new command bar, much faster pathfinding and effects, the base game’s 481 original textures at four times the resolution of Zero Hour’s, new shadows and lighting, an option to go back to the 2003 look, and Turkish and German text. LAN multiplayer works; internet play and gamepads don’t yet. On Windows, a launcher installs it over your game, backing up what it replaces, and keeps it up to date; on macOS and Linux it’s built with a single command. The latest release, v3.2.0 (October 20), locked matches to 60 steps a second with an optional Turbo mode and opened every campaign mission. Its website says code changes are made with AI assistance, and 87 of its last 100 commits list Claude as a co-author. The repository also includes modified versions of game data files, such as the skirmish AI scripts and the interface screens, and on Windows the build script downloads a pack of upscaled game art from the repository’s own releases, which on macOS and Linux is copied by hand or left out."
requirements:
  es: "Una instalación de tu propia copia de Command & Conquer: Generals – Zero Hour con el Generals original (Zero Hour usa los archivos de los dos), mejor la versión 1.04 de Steam o de la EA App; el proyecto no incluye archivos del juego. En macOS y Linux encuentra solo las instalaciones en las bibliotecas de Steam, en ~/Games, en /Applications y en las botellas de CrossOver y Whisky, y un script saca los juegos de un disco o una ISO, aunque los discos traen la 1.00. Además, Windows de 64 bits, macOS (Apple Silicon o Intel) o Linux x86-64."
  en: "An installation of your own copy of Command & Conquer: Generals – Zero Hour along with the original Generals (Zero Hour uses the files of both), preferably the 1.04 release from Steam or the EA app; the project includes no game files. On macOS and Linux it finds installs in Steam libraries, ~/Games, /Applications, and CrossOver and Whisky bottles on its own, and a script lays the games out from a disc or an ISO, though the discs carry 1.00. Plus 64-bit Windows, macOS (Apple silicon or Intel), or x86-64 Linux."
