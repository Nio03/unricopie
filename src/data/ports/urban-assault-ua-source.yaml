desc:
  es: "UA_source: reimplementación de código abierto del motor de Urban Assault, el juego de acción y estrategia que Microsoft publicó en 1998, que sustituye al ejecutable original y usa los archivos del juego. Está escrita en C++ con SDL2, OpenGL y OpenAL, y funciona en Windows, también en una versión para Windows XP, y en Linux. Su archivo nucleus.ini suma opciones de sincronización vertical, también adaptativa, límite de fotogramas (el README desaconseja pasar de 60, porque rompe el giro de los helicópteros y la IA), un desvanecido nuevo del terreno lejano, una emulación de los efectos de color del renderizado por software original y un límite de partículas. Permite activar el arreglo de un fallo original que impedía que las armas tuvieran radios distintos, ocultar facciones y tipos de unidad por mundo o por nivel y construir varios objetos a la vez, y tiene una API de scripts en Lua. El multijugador en red funciona, con una pantalla para escribir la IP, y la música suena desde las pistas del CD pasadas a Ogg. Usa fuentes libres en lugar de las originales, que puedes añadir tú. La última versión es del 14 de febrero de 2023, para Windows y Windows XP; el último cambio, de marzo de 2025, añadió la compilación con CMake. El repositorio incluye los textos del juego en inglés, alemán, francés, japonés y ruso (los archivos .lng), junto con un script que los extrae de las bibliotecas de idioma del original."
  en: "UA_source: an open-source reimplementation of the engine of Urban Assault, the action strategy game Microsoft published in 1998, that replaces the original executable and uses the game’s files. It’s written in C++ with SDL2, OpenGL, and OpenAL, and runs on Windows, with a separate Windows XP build, and on Linux. Its nucleus.ini file adds options for vertical sync, adaptive included, a frame rate cap (the README advises against going above 60, since it breaks helicopter rotation and the AI), a new fade for distant terrain, an emulation of the original software renderer’s color effects, and a particle limit. It can enable a fix for an original bug that kept weapons from having different radii, hide factions and unit types per world or per level, and build several objects at once, and it has a Lua scripting API. Network multiplayer works, with a screen to enter an IP address, and music plays from the CD tracks converted to Ogg. It uses free fonts instead of the original ones, which you can add yourself. The latest release is from February 14, 2023, for Windows and Windows XP; the latest change, from March 2025, added CMake builds. The repository includes the game’s text in English, German, French, Japanese, and Russian (the .lng files), along with a script that extracts it from the original’s language libraries."
requirements:
  es: "Tu propia copia de Urban Assault, instalada en Windows o con Wine, o la carpeta Game del CD. En esa carpeta se copian el ejecutable de UA_source, sus carpetas res y fonts y su language.lng, dentro de locale. Para la música, las pistas de audio del CD en Ogg (2.ogg a 6.ogg) en una carpeta music; para las fuentes originales, Dungeon, Arial y Microsoft Sans Serif en la carpeta fonts. Además, Windows (también XP) o Linux; compilarlo pide SDL2, SDL2_ttf, OpenGL, OpenAL, vorbisfile y ffmpeg."
  en: "Your own copy of Urban Assault, installed on Windows or through Wine, or the Game folder from the CD. UA_source’s executable, its res and fonts folders, and its language.lng, inside locale, are copied into that folder. For music, the CD’s audio tracks as Ogg (2.ogg to 6.ogg) in a music folder; for the original fonts, Dungeon, Arial, and Microsoft Sans Serif in the fonts folder. Plus Windows (XP included) or Linux; building it needs SDL2, SDL2_ttf, OpenGL, OpenAL, vorbisfile, and ffmpeg."
