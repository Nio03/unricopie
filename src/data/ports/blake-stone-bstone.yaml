name: "Blake Stone (BStone)"
category: source-port
console: dos
status: fully
repo: bibendovsky/bstone
homepage: https://bibendovsky.github.io/bstone/
author: Boris I. Bendovsky
originalDeveloper: JAM Productions
year: 1993
desc:
  es: "BStone: port no oficial de la serie Blake Stone, Aliens of Gold y Planet Strike, sobre el código fuente que publicó Apogee; su motor deriva del de Wolfenstein 3D. Admite Aliens of Gold en sus versiones 1.0, 2.0, 2.1 y 3.0, completa o shareware, y Planet Strike 1.0 y 1.1. Ofrece el renderizado original por software a alta resolución o un renderizador 3D por hardware (OpenGL 2.0 o 3.2, OpenGL ES 2.0 y, desde la 1.3.0 del 21 de diciembre de 2025, Vulkan), modo panorámico, un filtro de escalado de texturas, sustitución de las texturas de paredes, suelos, techos y sprites por imágenes PNG o BMP, controles reasignables, sonido 3D con OpenAL, volúmenes separados para efectos y música, música AdLib emulada (con el código OPL de DOSBox o con Nuked OPL3) y carga de mods con la opción --mod_dir. La última versión es la 1.3.4 (27 de mayo), que corrigió la decodificación de audio con Nuked OPL3; hay versiones para Windows de 32 y 64 bits y Linux, y para macOS en pruebas."
  en: "BStone: an unofficial source port of the Blake Stone series, Aliens of Gold and Planet Strike, built on the source code Apogee released; its engine derives from Wolfenstein 3D’s. It supports Aliens of Gold versions 1.0, 2.0, 2.1, and 3.0, full or shareware, and Planet Strike 1.0 and 1.1. It offers the original software rendering at high resolution or a hardware 3D renderer (OpenGL 2.0 or 3.2, OpenGL ES 2.0, and, since 1.3.0 on December 21, 2025, Vulkan), a widescreen mode, a texture upscaling filter, replacement of wall, floor, ceiling, and sprite textures with PNG or BMP images, rebindable controls, 3D sound through OpenAL, separate sound effect and music volumes, emulated AdLib music (with DOSBox’s OPL code or Nuked OPL3), and mod loading with the --mod_dir option. The latest release is 1.3.4 (May 27), which fixed audio decoding with Nuked OPL3; there are builds for 32- and 64-bit Windows and Linux, and experimental ones for macOS."
requirements:
  es: "Los archivos de tu propia copia de Blake Stone: Aliens of Gold (.BS6) o de Planet Strike (.VSI); con las versiones de GOG o Steam basta con descomprimir BStone en cualquier carpeta, y con otras, junto a los archivos del juego. La versión shareware de Aliens of Gold (.BS1) es gratuita y también sirve; el proyecto la ofrece en su web. Además, Windows, Linux o macOS (en pruebas)."
  en: "The files from your own copy of Blake Stone: Aliens of Gold (.BS6) or Planet Strike (.VSI); with the GOG or Steam versions you just extract BStone into any folder, and with others, next to the game files. The shareware version of Aliens of Gold (.BS1) is free and works too; the project offers it on its website. Plus Windows, Linux, or macOS (experimental)."
