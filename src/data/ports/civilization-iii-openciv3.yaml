originalDeveloper: Firaxis Games
year: 2001
desc:
  es: "OpenCiv3 (antes conocido por su nombre en clave, C7): nueva versión de código abierto de Civilization III hecha por la comunidad de fans, con el motor Godot y C#, y Lua para las reglas del juego. Se define como una reimplementación de caja negra, compatible en mecánicas con el original: rehace la jugabilidad con código propio y gráficos de la comunidad, a partir de información pública y de la observación del juego, sin incluir nada de Civilization III, y puede cargar los gráficos de tu propia instalación para parecerse más al original. Su objetivo es un juego con el aspecto y la jugabilidad de Civ3 y su expansión Conquests, pero sin sus límites arbitrarios, con las funciones rotas arregladas y mucho más abierto a los mods. Lee los archivos BIQ y SAV de Civ3, aunque la compatibilidad con escenarios y partidas guardadas está incompleta. El proyecto está en prealfa: se puede jugar, pero faltan muchas mecánicas y el contenido del final de la partida. La última versión, la 0.3 «Dutch» Preview 1 (7 de diciembre de 2025), estrenó un modo independiente con gráficos provisionales que no necesita los archivos de Civ3, con versiones para Windows, Linux y macOS. El desarrollo sigue: en octubre se sumaron la lógica de las maravillas y las victorias por conquista y por dominación."
  en: "OpenCiv3 (formerly known by its codename, C7): an open-source remake of Civilization III by the fan community, built with the Godot engine and C#, with Lua for the game rules. It describes itself as a mechanically compatible black-box reimplementation: it rebuilds the gameplay with its own code and community-made art, based on public information and on observing the game, ships nothing from Civilization III, and can load the art from your own install to look closer to the original. Its goal is a game that looks and plays like Civ3 and its Conquests expansion, but without its arbitrary limits, with broken features fixed, and much more open to modding. It reads Civ3 BIQ and SAV files, though support for scenarios and saves is incomplete. The project is in pre-alpha: it’s playable, but many mechanics and the late-game content are missing. The latest release, 0.3 “Dutch” Preview 1 (December 7, 2025), introduced a standalone mode with placeholder graphics that doesn’t need the Civ3 files, with builds for Windows, Linux, and macOS. Development continues: in October it added the logic for wonders and conquest and domination victories."
requirements:
  es: "Recomendado: los archivos de tu propia copia de Civilization III con Conquests o de la edición Complete (no hace falta que el juego funcione); en Windows los busca en el registro, y en Linux y macOS se indican con la variable CIV3_HOME. Sin ellos, el modo independiente usa gráficos provisionales. Además, Windows de 64 bits, Linux x86-64 o macOS (Intel o Apple Silicon)."
  en: "Recommended: the files from your own copy of Civilization III with Conquests or the Complete edition (the game itself doesn’t have to run); on Windows it finds them through the registry, and on Linux and macOS you point to them with the CIV3_HOME variable. Without them, standalone mode uses placeholder graphics. Plus 64-bit Windows, x86-64 Linux, or macOS (Intel or Apple silicon)."
