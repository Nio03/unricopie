originalDeveloper: "FromSoftware"
year: 2015
desc:
  es: "Bloodborne en Windows 10 y 11 de forma nativa a partir de tu copia de PS4, sin emulador: la PS4 tiene un procesador x86-64 como el del PC, así que el código del juego se ejecuta tal cual y una capa propia sustituye lo que el juego pedía al sistema operativo de la consola y convierte sus órdenes de dibujo a Vulkan. Es una bifurcación del proyecto de deadinside28, con unos 280 commits propios por delante, y añade un launcher (modo simple y avanzado), escalado con DLSS, FSR 4 y XeSS, generación de fotogramas, teclado y ratón y compatibilidad con mods, además de la instalación desde los .pkg de tu copia. Su README lo marca como experimental: el juego arranca, carga partidas y se juega con sonido, mando y guardado, pero no se ha comprobado una partida completa. La versión 1.8.0-beta.7 es del 25 de octubre. Aclara que no está relacionado con shadPS4."
  en: "Bloodborne running natively on Windows 10 and 11 from your own PS4 copy, with no emulator: the PS4 has an x86-64 processor like a PC’s, so the game’s code runs as it is, and a custom layer replaces what the game asked of the console’s operating system and converts its drawing commands to Vulkan. It is a fork of deadinside28’s project, with about 280 commits of its own ahead, and adds a launcher (simple and advanced modes), DLSS, FSR 4, and XeSS upscaling, frame generation, keyboard and mouse, and mod support, plus installation from your copy’s .pkg files. Its README marks it as experimental: the game boots, loads saves, and plays with sound, gamepad, and saving, but a full playthrough has not been verified. Version 1.8.0-beta.7 is from October 25. It clarifies that it is unrelated to shadPS4."
requirements:
  es: "Tu propia copia de Bloodborne para PS4 (CUSA03173, versión 1.09), como carpeta de juego descifrada (con eboot.bin) o como los .pkg del juego, la actualización y el DLC (el pkg del juego pesa unos 31 GB y hace falta espacio libre de 1,1 veces su tamaño). Windows 10 (1903 o posterior) u 11 de 64 bits, una tarjeta con Vulkan 1.3 (DLSS requiere una GeForce RTX serie 20 o posterior) y unos 6 GB de memoria libre (10 GB para 1440p o 4K)."
  en: "Your own copy of Bloodborne for PS4 (CUSA03173, version 1.09), as a decrypted game folder (with eboot.bin) or as the game, update, and DLC .pkg files (the game package is about 31 GB and you need 1.1 times its size free). 64-bit Windows 10 (1903 or later) or 11, a Vulkan 1.3 graphics card (DLSS needs a GeForce RTX 20 series or newer), and about 6 GB of free memory (10 GB for 1440p or 4K)."
