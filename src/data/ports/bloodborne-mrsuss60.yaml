desc:
  es: "Adaptación para Windows del port nativo de Linux bbport. Reemplaza el núcleo, el mapeo de memoria y los hilos POSIX por un entorno Win32 nativo: el código x86-64 del ejecutable de PS4 corre directamente en el procesador, sin emulación ni JIT, y el núcleo de vídeo Vulkan de shadPS4, con un canal de dibujo multihilo y escalado FSR 3.1 y FSR 4, se encarga de la GPU. El README dice que es jugable en Windows: arranca, carga partidas y funciona con audio y mando. Añade un lanzador gráfico, ratón con giro de 360 grados, 30, 60, 90 o cuadros sin tope mediante parches de la comunidad y cachés de pipelines de Vulkan. La v0.7.2 (28 de octubre) es la última versión."
  en: "A Windows adaptation of the native Linux port bbport. It replaces the Linux kernel layer, memory mapping, and POSIX threading with a native Win32 runtime: the PS4 executable’s x86-64 code runs directly on the processor, with no emulation or JIT, and shadPS4’s Vulkan video core, with a multithreaded draw pipeline and FSR 3.1 and FSR 4 upscaling, handles the GPU. The README says it is playable on Windows: it boots, loads saves, and runs with audio and gamepad support. It adds a graphical launcher, 360-degree mouse look, 30, 60, 90, or uncapped frame rates through community patches, and persistent Vulkan pipeline caches. Version 0.7.2 (October 28) is the latest release."
requirements:
  es: "Tu propio volcado descifrado de Bloodborne para PS4 (CUSA03173, versión 1.09), con eboot.bin. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Vulkan 1.3 (GeForce GTX serie 10 o posterior, Radeon RX serie 400 o posterior, o Intel Arc serie A) y un procesador x86-64 con AVX 1.0 y SSE4.2."
  en: "Your own decrypted dump of Bloodborne for PS4 (CUSA03173, version 1.09), with eboot.bin. Plus 64-bit Windows 10 or 11, a Vulkan 1.3 graphics card (GeForce GTX 10-series or newer, Radeon RX 400-series or newer, or Intel Arc A-series), and an x86-64 processor with AVX 1.0 and SSE4.2."
