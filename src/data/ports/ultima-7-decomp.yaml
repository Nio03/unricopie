name: "Ultima VII: The Black Gate / Serpent Isle (Ultima7_Decomp)"
category: decomp-port
console: dos
status: playable
repo: Kitrinx/Ultima7_Decomp
author: Jamie Blanks
originalDeveloper: Origin Systems
year: 1992
desc:
  es: "Decompilación de Ultima VII: The Black Gate y de Ultima VII Part Two: Serpent Isle, comprobada byte a byte con Borland C++ 2.0, el compilador original; lo que Origin escribió en ensamblador se conserva en ensamblador, y la mayoría de los nombres de funciones y variables son deducidos. Sobre ella hay dos ports. Ultima VII Portable, con versiones para Windows, macOS (Apple Silicon) y Linux, sustituye a los ejecutables originales de cada juego casi sin tocar su lógica: une en un solo programa la introducción, el menú, el juego y el final, corrige los punteros nulos que DOS toleraba y los problemas de 16 a 32 bits, y suena con una MT-32 emulada con Munt (con tus propias ROM) o con una AdLib emulada con Nuked OPL3; la última versión es la 0.4.0 (12 de octubre). Ultima VII Modern, añadido el 20 de octubre y todavía sin versión publicada, juega los dos juegos con el motor de Serpent Isle: lleva a Black Gate sus correcciones y comodidades (el muñeco del equipo, atajos como comer o apuntar, un llavero desde el principio), añade vistas 16:9 y 16:10, un menú de inicio con ajustes y música AdLib en estéreo deducida de la de MT-32, y permite que los objetos de un juego aparezcan en el otro. Para el muñeco de Black Gate usa dibujos de Grant W. Chapman, con su permiso. Su autor declara que la decompilación se hizo con ayuda de IA. El repositorio incluye además, como código fuente, el usecode decompilado de los dos juegos (los guiones y diálogos de personajes y sucesos), que se compila aparte y no hace falta para jugar."
  en: "A decompilation of Ultima VII: The Black Gate and Ultima VII Part Two: Serpent Isle, verified byte for byte with Borland C++ 2.0, the original compiler; what Origin wrote in assembly is kept as assembly, and most function and variable names are inferred. Two ports are built on it. Ultima VII Portable, with builds for Windows, macOS (Apple silicon), and Linux, replaces each game’s original executables with hardly any change to their logic: it merges the intro, menu, game, and endgame into one program, fixes the null pointers DOS tolerated and the 16-to-32-bit issues, and plays sound through an MT-32 emulated with Munt (with your own ROMs) or an AdLib emulated with Nuked OPL3; the latest release is 0.4.0 (October 12). Ultima VII Modern, added on October 20 and not released yet, plays both games on the Serpent Isle engine: it brings that game’s fixes and conveniences to Black Gate (the paperdoll, hotkeys such as feed and target, a keyring from the start), adds 16:9 and 16:10 views, a start menu with settings, and stereo AdLib music derived from the MT-32 score, and lets items from one game appear in the other. Black Gate’s paperdoll uses Grant W. Chapman’s art, with the artist’s permission. The author states the decompilation was AI-assisted. The repository also includes the two games’ decompiled usecode as source (the character and event scripts, with their dialogue), which is compiled separately and isn’t needed to play."
requirements:
  es: "Los archivos de tu propia copia instalada de Ultima VII: The Black Gate (con su carpeta STATIC), de Serpent Isle o de los dos; Ultima VII Modern necesita los dos. Ultima VII Portable escribe en la carpeta del juego, así que conviene usar una copia. Para la música de MT-32, las ROM de la Roland MT-32. Además, Windows x64, un Mac con Apple Silicon o Linux x64."
  en: "The files from your own installed copy of Ultima VII: The Black Gate (with its STATIC folder), Serpent Isle, or both; Ultima VII Modern needs both. Ultima VII Portable writes to the game folder, so use a copy. For MT-32 music, the Roland MT-32 ROMs. Plus x64 Windows, an Apple silicon Mac, or x64 Linux."
