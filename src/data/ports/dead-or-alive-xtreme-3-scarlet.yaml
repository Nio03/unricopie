name: "Dead or Alive Xtreme 3 Scarlet"
games: [dead-or-alive-xtreme-3]
category: native-layer
console: ps4
status: experimental
repo: negroISO/doax3-scarlet-pc
originalDeveloper: "Team Ninja"
year: 2019
desc:
  es: "Port experimental para Windows x64 con Vulkan de la versión de PS4 (CUSA14173, versión 01.08). El código x86-64 original del juego se ejecuta a través de un runtime nativo heredado y el núcleo gráfico de shadPS4 traduce las órdenes de la GPU y los shaders a Vulkan. El repositorio contiene el código, herramientas portátiles de arranque y compilación, documentación y capturas de pruebas; el anfitrión hay que compilarlo antes de usarlo, y los datos del juego, el firmware, las partidas, las cachés de shaders y los archivos propietarios de DLSS se aportan aparte. Según el README, están validados los menús y la isla del título y las escenas animadas de Relax, incluido el renderizado neuronal nativo con profundidad y vectores de movimiento; la actividad completa del juego, los DLC y todos los ángulos de cámara de la isla siguen incompletos, y no se da por resuelto algún informe de fondos negros fuera de las rutas capturadas. Ofrece renderizado neuronal opcional con NVIDIA, sin generación de fotogramas. La release del 26 de octubre es una candidata nativa para Steam Deck."
  en: "An experimental Windows x64 Vulkan port of the PS4 version (CUSA14173, version 01.08). The game’s original x86-64 code runs through an inherited native runtime, and shadPS4’s graphics core translates GPU commands and shaders to Vulkan. The repository contains source, portable launch and build tools, documentation, and test screenshots; the host must be built before use, and the game data, firmware, saves, shader caches, and proprietary DLSS files are supplied separately. According to the README, the title screen island, menus, and animated Relax scenes are validated, including native neural rendering with depth and camera and object motion; full-game activity, DLC, and every island camera angle remain incomplete, and occasional black-background reports outside the captured routes are not declared fully resolved. It offers optional neural rendering on NVIDIA hardware, with no frame generation. The October 26 release is a native Steam Deck candidate."
requirements:
  es: "Tu propia copia de Dead or Alive Xtreme 3 Scarlet de PS4 (CUSA14173), con datos extraídos en claro, la actualización 01.08 superpuesta y, opcionalmente, los DLC de CUSA14173; además, los módulos de sistema libSceFiber.sprx, ulobjmgr.sprx y libSceUlt.sprx. Para compilar: Windows x64, Python 3.11 o posterior, MSYS2 CLANG64 y un controlador de Vulkan. El renderizado neuronal opcional necesita hardware NVIDIA compatible."
  en: "Your own copy of Dead or Alive Xtreme 3 Scarlet for PS4 (CUSA14173), with extracted plaintext data, the 01.08 update overlaid, and optionally the CUSA14173 DLC packs; plus the system modules libSceFiber.sprx, ulobjmgr.sprx, and libSceUlt.sprx. To build: Windows x64, Python 3.11 or later, MSYS2 CLANG64, and a Vulkan driver. The optional neural rendering needs compatible NVIDIA hardware."
tags:
  - x86
