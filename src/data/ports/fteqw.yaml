homepage: https://www.fteqw.org/
originalDeveloper: "id Software / Raven Software"
year: 1996
desc:
  es: "FTEQW: motor de Quake avanzado y portátil, que parte del código fuente de Quake publicado por id Software y juega a varios juegos con tecnología id Tech, además de a los que otros desarrolladores han hecho con él. Admite Quake y sus packs de misiones, QuakeWorld, Quake II y sus packs de misiones, Quake III Arena y Team Arena, y Hexen II y su expansión; Half-Life y Half-Life 2 funcionan a través del proyecto Rad Therapy. Encuentra solo los juegos instalados con Steam, incluidas las reediciones de Quake y Quake II, y las carpetas de juegos clásicas de Linux. Dibuja con Direct3D 8, 9 u 11, OpenGL o Vulkan, con un sistema de materiales que acepta sombreadores HLSL y GLSL y preajustes de vídeo para que los juegos se vean como los originales o más modernos, con iluminación en tiempo real. Tiene pantalla partida en Quake y en la mayoría de sus mods, chat de voz con Opus o Speex, un explorador de servidores que reúne todos los protocolos que admite, servidor dedicado, partidas de cientos de jugadores, IPv4 e IPv6, sustitución de la música de CD por archivos Vorbis, MP3, WAV o FLAC, complementos (FFmpeg, físicas con Bullet u ODE) y su propio compilador de QuakeC, FTEQCC, que se puede ejecutar dentro del juego, con depurador. Funciona en Windows, Linux, OpenBSD y otros sistemas, en x86, x86-64, ARM y PPC64LE, y también en Android y en la web. Las compilaciones para Windows (64 y 32 bits) y Linux (x86-64 y x86) se descargan de su web; el repositorio de GitHub es su réplica oficial, y su último cambio es del 4 de junio."
  en: "FTEQW: an advanced, portable Quake engine that grew from the Quake source code id Software released and plays several id Tech games, plus the games other developers have made with it. It supports Quake and its mission packs, QuakeWorld, Quake II and its mission packs, Quake III Arena and Team Arena, and Hexen II and its expansion; Half-Life and Half-Life 2 run through the Rad Therapy project. It finds games installed through Steam on its own, including the Quake and Quake II re-releases, as well as the classic Linux game folders. It renders with Direct3D 8, 9, or 11, OpenGL, or Vulkan, with a material system that accepts HLSL and GLSL shaders and video presets that make the games look like the originals or more modern, with real-time lighting. It has split-screen for Quake and most of its mods, Opus or Speex voice chat, a server browser covering every protocol it supports, a dedicated server, games with hundreds of players, IPv4 and IPv6, CD music replacement with Vorbis, MP3, WAV, or FLAC files, plugins (FFmpeg, Bullet or ODE physics), and its own QuakeC compiler, FTEQCC, which can run in-game, with a debugger. It runs on Windows, Linux, OpenBSD, and other systems, on x86, x86-64, ARM, and PPC64LE, and also on Android and the web. The builds for Windows (64- and 32-bit) and Linux (x86-64 and x86) are downloaded from its website; the GitHub repository is its official mirror, and its latest change is from June 4."
requirements:
  es: "Los archivos de tu propia copia de alguno de los juegos (Quake, Quake II, Quake III Arena o Hexen II, con sus expansiones si las tienes), con el motor copiado en la carpeta del juego; también encuentra solo las instalaciones de Steam. Para Quake II con la versión de 64 bits del motor hace falta además la lógica del juego compilada en 64 bits, que el proyecto recomienda tomar de Yamagi Quake II. Además, Windows, Linux u otro sistema compatible."
  en: "The files from your own copy of one of the games (Quake, Quake II, Quake III Arena, or Hexen II, with their expansions if you have them), with the engine copied into the game’s folder; it also finds Steam installs on its own. For Quake II with the 64-bit build of the engine you also need 64-bit game logic, which the project recommends taking from Yamagi Quake II. Plus Windows, Linux, or another supported system."
