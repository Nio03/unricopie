desc:
  es: "Port nativo para Windows, Linux y macOS de los dos Zelda Oracle de Game Boy Color, reconstruidos en C a partir del código de los propios juegos; también hay versión para Android. No hay emulador debajo: todo Oracle of Ages y el 99 % de Oracle of Seasons están en C legible, compartido entre los dos donde coinciden y escrito aparte donde Seasons cambia, y el resto se genera a partir del desensamblado de la comunidad (oracles-disasm), del que también salen los símbolos. La primera vez que arranca lee tu ROM, guarda los gráficos, el sonido y los datos, pone a cero los bytes de código y ya no la vuelve a necesitar. Para comprobar que se comporta igual que el original reproduce partidas completas (dos TAS verificados en consola) y compara cada rutina en C con el código al que sustituye. Añade panorámico 16:9, que muestra a los lados las salas vecinas sacadas de la ROM, cuatro ranuras de estado con miniatura y un estado de reanudación, sincronización de partidas y estados entre dispositivos con un código de 16 cifras y sin contraseñas, controles reasignables para teclado y mando, avance rápido, filtros de pantalla (líneas de escaneo, rejilla LCD, CRT, xBRZ y hqx, y los colores reales de la Game Boy Color), un modo portátil que guarda todo junto a la aplicación y mods en Lua que leen el juego y dibujan encima; los cambios de juego, como el texto rápido, el intercambio rápido de objetos y las cuatro ranuras de objeto, vienen desactivados. Las ROM europeas se juegan en inglés, francés, alemán, italiano o español. Solo hay compilaciones nightly, que se rehacen con cada cambio; la última es del 22 de octubre. Su autor declara que lo hizo con ayuda de IA generativa, en concreto de Claude Opus. El repositorio incluye el código C generado automáticamente a partir de las ROM europeas para las rutinas que difieren de las estadounidenses (unos 2,5 MB)."
  en: "A native Windows, Linux, and macOS port of the two Game Boy Color Zelda Oracle games, rebuilt in C from the games’ own code; there’s also an Android version. There’s no emulator underneath: all of Oracle of Ages and 99% of Oracle of Seasons are readable C, shared between the two where they agree and written separately where Seasons differs, and the rest is generated from the community disassembly (oracles-disasm), which also supplies the symbols. On first launch it reads your ROM, keeps the graphics, sound, and data, zeroes the code bytes, and never needs the ROM again. To check that it behaves like the original, it replays full playthroughs (two console-verified TASes) and compares every C routine with the code it replaces. It adds 16:9 widescreen, which shows the neighboring rooms, read from the ROM, at the sides, four save-state slots with thumbnails plus a resume state, save and state sync across devices with a 16-digit code and no passwords, rebindable keyboard and controller input, fast-forward, screen filters (scanlines, LCD grid, CRT, xBRZ and hqx, and true Game Boy Color colors), a portable mode that keeps everything next to the app, and Lua mods that read the game and draw on top of it; gameplay changes such as fast text, quick item swap, and four item slots are off by default. The European ROMs play in English, French, German, Italian, or Spanish. There are only nightly builds, rebuilt on every change; the latest is from October 22. Its author states it was made with help from generative AI, specifically Claude Opus. The repository includes C code generated automatically from the European ROMs for the routines that differ from the US ones (about 2.5 MB)."
requirements:
  es: "Tu propia ROM de The Legend of Zelda: Oracle of Ages, de Oracle of Seasons o de los dos para Game Boy Color, en su versión estadounidense o europea, que la aplicación comprueba; puede ir suelta (.gbc o .gb) o dentro de un .zip o un .gz. Además, Windows 10 u 11 de 64 bits, Linux x86-64 o macOS 11 o posterior (Apple Silicon o Intel)."
  en: "Your own ROM of The Legend of Zelda: Oracle of Ages, Oracle of Seasons, or both for Game Boy Color, US or European release, which the app checks; it can be loose (.gbc or .gb) or inside a .zip or .gz. Plus 64-bit Windows 10 or 11, x86-64 Linux, or macOS 11 or later (Apple silicon or Intel)."
