decomp: gcsmith/Pilotwings64Decomp
desc:
  es: "Birdman64: Pilotwings 64 como juego nativo para Windows y Linux, construido sobre la decompilación de gcsmith. No es una recompilación: la primera vez que arranca descarga la decompilación y la compila en tu equipo con el compilador que trae, y el juego corre sobre una capa en Rust que sustituye al sistema operativo de la N64, con su propio renderizador y su propio motor de sonido; los gráficos, el sonido y los datos salen de tu ROM. Ofrece panorámico hasta 21:9 que muestra más mundo en lugar de estirarlo, la tasa de refresco de tu monitor (144 Hz y más), MSAA hasta 8x, escala de renderizado, pantalla partida para dos jugadores, paquetes de texturas, mandos modernos con controles reasignables y una opción para desbloquearlo todo. Hay una versión experimental para Android y otra de prueba para iPhone y iPad que compilas tú; para macOS todavía no hay. Su autor lo dirigió con un equipo de agentes de IA (Claude Opus 5.5 y GLM 5.3-Flash) y pasó de un repositorio vacío a la 1.0 en seis días, del 27 de septiembre al 3 de octubre."
  en: "Birdman64: Pilotwings 64 as a native game for Windows and Linux, built on gcsmith’s decompilation. It isn’t a recompilation: on first start it downloads the decompilation and compiles it on your machine with the compiler it ships, and the game runs on a Rust layer that replaces the N64’s operating system, with its own renderer and audio engine; graphics, sound, and data come from your ROM. It offers widescreen up to 21:9 that shows more of the world instead of stretching it, your monitor’s refresh rate (144 Hz and beyond), up to 8x MSAA, render scaling, two-player split screen, texture packs, modern controllers with rebindable controls, and an unlock-everything option. There’s an experimental Android build and a test build for iPhone and iPad that you build yourself; there’s no macOS build yet. Its author directed it with a team of AI agents (Claude Opus 5.5 and GLM 5.3-Flash) and went from an empty repository to 1.0 in six days, from September 27 to October 3."
requirements:
  es: "Tu propia ROM estadounidense de Pilotwings 64 (.z64, .n64, .v64 o dentro de un .zip); las de otras regiones no sirven. Además, Windows 10 u 11 de 64 bits con DirectX 12 o Vulkan, o Linux de 64 bits de 2022 o posterior con Vulkan u OpenGL, y conexión a internet la primera vez."
  en: "Your own US Pilotwings 64 ROM (.z64, .n64, .v64, or inside a .zip); other regions won’t work. Plus 64-bit Windows 10 or 11 with DirectX 12 or Vulkan, or a 64-bit Linux distro from 2022 or later with Vulkan or OpenGL, and an internet connection the first time."
