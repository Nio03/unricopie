desc:
  es: "rac1-native: port nativo para PC de Ratchet & Clank (PlayStation 2, 2002), para Linux y Windows. El código del juego se porta a C++ función a función a partir de la versión norteamericana (SCUS-97199), y cada función se comprueba contra el código original: un oráculo ejecuta el original en un intérprete del R5900 y compara los resultados bit a bit. No es un emulador: el código del juego, incluido el microcódigo de las unidades vectoriales de la PS2, se ejecuta como C++ nativo, y el 3D lo dibuja un renderizador propio (OpenGL, o Vulkan como opción experimental), lo que permite pantalla panorámica, altas resoluciones, texturas con todo el detalle y mayor distancia de dibujo. La preparación lee tu ISO: extrae los recursos y, con generadores, traduce a C++ buena parte del código MIPS y de las unidades vectoriales (unas 2.150 de las 4.000 funciones portadas), y ese código generado se queda en tu equipo, no en el repositorio. Unas 1.600 funciones más están escritas a mano. En la 0.4.0 (18 de octubre) están portados todos los planetas, de Veldin al combate final con Drek, y queda una función por portar; el juego se ha completado entero, pero la segunda mitad se ha jugado una sola vez, y solo se ha probado en Linux (Windows es experimental). La rama principal añade un lanzador, un renderizador Vulkan experimental, una opción de HUD panorámico y sonido 5.1 y 7.1. El soporte de la versión europea (SCES-50916) está sin probar. El repositorio se creó el 9 de octubre y 69 de sus últimos 100 commits llevan a Claude como coautor."
  en: "rac1-native: a native PC port of Ratchet & Clank (PlayStation 2, 2002), for Linux and Windows. The game’s code is ported to C++ function by function from the North American release (SCUS-97199), and each function is checked against the original code: an oracle runs the original in an R5900 interpreter and compares the results bit for bit. It isn’t an emulator: the game’s code, including the PS2’s vector-unit microcode, runs as native C++, and the 3D is drawn by a renderer of its own (OpenGL, or Vulkan as an experimental option), which allows widescreen, high resolutions, full-detail textures, and a longer draw distance. Setup reads your ISO: it extracts the assets and, with generators, translates much of the MIPS and vector-unit code into C++ (about 2,150 of the 4,000 ported functions), and that generated code stays on your machine, not in the repository. About 1,600 more functions are hand-written. In 0.4.0 (October 18) every planet is ported, from Veldin to the final fight with Drek, with one function left to port; the whole game has been played through, but the second half only once, and it’s tested on Linux only (Windows is experimental). The main branch adds a launcher, an experimental Vulkan renderer, a widescreen HUD option, and 5.1 and 7.1 sound. Support for the European release (SCES-50916) is untested. The repository was created on October 9 and 69 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia en ISO del disco estadounidense de PS2 (SCUS-97199); el repositorio no contiene nada del disco. Hay que compilarlo con CMake y ejecutar el script de preparación (setup.sh o setup.cmd), que genera código a partir de tu ISO; las versiones publicadas no traen binarios. Además, Linux o Windows."
  en: "Your own ISO of the US PS2 disc (SCUS-97199); the repository contains nothing from the disc. You have to build it with CMake and run the setup script (setup.sh or setup.cmd), which generates code from your ISO; the published releases carry no binaries. Plus Linux or Windows."
