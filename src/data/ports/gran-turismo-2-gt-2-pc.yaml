name: "Gran Turismo 2 (gt-2-pc)"
category: fan-remake
console: ps1
status: playable
repo: dubrovskiy-yevhen-stakelogic/gt-2-pc
author: Yevhen Dubrovskyi
originalDeveloper: Polyphony Digital
year: 1999
desc:
  es: "Gran Turismo 2 PC, VR & Browser: port nativo en C++ de los dos discos, Arcade y Simulación, escrito por ingeniería inversa. El código del juego no usa el intérprete de MIPS que el repositorio tiene como herramienta de análisis, y lo que Ghidra decompila del original solo sirve de apoyo y no está en el repositorio. Tiene las carreras arcade, el rally y la contrarreloj con la IA de los rivales, fantasmas y repeticiones, y en Simulación el modo GT con carnés, concesionarios, garaje, ajustes y eventos, con la física original a paso fijo de 30 Hz. Dibuja a 720p, 1080p, 1440p o 4K, o del 50 al 200 % de la ventana, con límite de fotogramas configurable y presentación interpolada, MSAA, filtrado de texturas y distancia de dibujado hasta el circuito entero. Añade una vista de cabina con volante y manos animados y retrovisor, mandos XInput, DualSense con gatillos adaptativos, volantes, trucos opcionales y realidad virtual por OpenXR en Windows, con tres modos de conducción. Los instaladores pueden preparar menús, fuentes, HUD y vídeos en HD a partir de tu disco con Real-ESRGAN, que descargan con su SHA-256 fijado, y, si das una BIOS, capturar el arranque de PlayStation con el núcleo Beetle PSX de RetroArch, que también descargan; nada de eso hace falta para jugar. Funciona en Windows (en pantalla y con PCVR), macOS y Linux o Steam Deck, donde el instalador lo compila, además de en Quest y en el navegador con WebAssembly, siempre con tus imágenes de disco. La última versión es la 0.8.1 (30 de septiembre), un único paquete para todas las plataformas."
  en: "Gran Turismo 2 PC, VR & Browser: a native C++ port of both discs, Arcade and Simulation, written through reverse engineering. The game code doesn’t use the MIPS interpreter the repository keeps as an analysis tool, and Ghidra’s decompilation of the original only serves as a reading aid and isn’t in the repository. It has the arcade races, rally and time trials with opponent AI, ghosts, and replays, and in Simulation the GT Mode career with licenses, dealerships, garage, tuning, and events, with the original fixed-step 30 Hz physics. It renders at 720p, 1080p, 1440p, or 4K, or at 50–200% of the window, with a configurable frame cap and interpolated presentation, MSAA, texture filtering, and draw distance up to the whole course. It adds a cockpit view with an animated wheel and hands and a rear-view mirror, XInput controllers, DualSense with adaptive triggers, steering wheels, optional cheats, and virtual reality through OpenXR on Windows, with three driving modes. The installers can prepare HD menus, fonts, HUD, and movies from your disc with Real-ESRGAN, which they download with a pinned SHA-256, and, if you provide a BIOS, capture the PlayStation boot sequence with RetroArch’s Beetle PSX core, which they also download; none of that is needed to play. It runs on Windows (on a monitor and in PCVR), macOS, and Linux or Steam Deck, where the installer builds it, as well as on Quest and in the browser through WebAssembly, always with your disc images. The latest release is 0.8.1 (September 30), a single package for every platform."
requirements:
  es: "Tus propias imágenes completas de los discos de Gran Turismo 2 (BIN/CUE con sectores de 2352 bytes), Arcade, Simulación o ambos, de las versiones estadounidenses (Arcade 1.1 y Simulación 1.2) o europeas (SCES-02380 y SCES-12380); una ISO de 2048 bytes no sirve, porque le faltan los sectores de audio y vídeo. Una BIOS de PlayStation es opcional y solo sirve para preparar la secuencia de arranque. Además, Windows (para la RV, un casco con un runtime OpenXR), macOS o Linux; la preparación en HD necesita una tarjeta gráfica con Vulkan."
  en: "Your own complete Gran Turismo 2 disc images (BIN/CUE with 2352-byte sectors), Arcade, Simulation, or both, from the US (Arcade 1.1 and Simulation 1.2) or European (SCES-02380 and SCES-12380) releases; a 2048-byte ISO doesn’t work, since it lacks the audio and video sectors. A PlayStation BIOS is optional and only used to prepare the boot sequence. Plus Windows (for VR, a headset with an OpenXR runtime), macOS, or Linux; HD preparation needs a Vulkan graphics card."
