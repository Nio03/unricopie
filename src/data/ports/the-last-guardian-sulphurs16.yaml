originalDeveloper: "genDESIGN"
year: 2016
desc:
  es: "Port no oficial para Windows de la versión de PlayStation 4, escrito en Rust. No parte del código fuente del juego: ejecuta el programa de la PS4 de tu copia sobre una capa de compatibilidad hecha para este juego. El código x86-64 corre directamente en el procesador, sin emulación de CPU, las bibliotecas del sistema de la PS4 se reimplementan para Windows, y los comandos gráficos y los shaders se traducen a Vulkan. Ofrece resoluciones de 1280x720 a 3840x2160, 30 cuadros por segundo, 60 o sin tope, cámara con ratón y mandos DualShock 4, DualSense y Xbox. El README lista límites: el juego no se ha jugado entero a 60 cuadros, solo se probó con gráficos NVIDIA y a veces se cierra con un error al empezar a cargar un área. La v0.7.2 (25 de octubre) es la última versión. 87 de sus últimos 100 commits llevan a Claude como coautor."
  en: "An unofficial port of the PlayStation 4 version for Windows, written in Rust. It is not built from the game’s source code: it runs your copy’s PS4 program on a compatibility layer made for this game. The x86-64 code runs directly on the processor, without CPU emulation, the PS4’s system libraries are reimplemented for Windows, and the graphics commands and shaders are translated to Vulkan. It offers resolutions from 1280x720 to 3840x2160, 30 frames per second, 60, or uncapped, mouse camera, and DualShock 4, DualSense, and Xbox controllers. The README lists limits: the game has not been played through at 60 fps, it was only tested with NVIDIA graphics, and it sometimes closes with an error just after an area starts loading. Version 0.7.2 (October 25) is the latest release. 87 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de The Last Guardian para PS4 (EE. UU. CUSA03627 o Europa CUSA03745) en la versión 01.00 con la actualización 01.03, como carpetas descifradas (eboot.bin, sce_module, sce_sys y los archivos trico_*.psarc), y unos 25 GB de disco. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Vulkan 1.3 y unos 4 GB de memoria de vídeo, y un procesador con buen rendimiento por núcleo."
  en: "Your own copy of The Last Guardian for PS4 (US CUSA03627 or European CUSA03745) at version 01.00 with update 01.03, as decrypted folders (eboot.bin, sce_module, sce_sys, and the trico_*.psarc archives), and about 25 GB of disk. Plus 64-bit Windows 10 or 11, a graphics card with Vulkan 1.3 and about 4 GB of video memory, and a processor with high single-core speed."
