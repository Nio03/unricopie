desc:
  es: "Port para Windows del MediEvil de PS4 de 2019, la nueva versión del juego de PS1, hecho sobre SpartanPort (antes gow3_pc), el port de God of War III de la misma familia que el de Bloodborne. El código x86-64 original del juego corre directamente en la CPU, un entorno de ejecución escrito para el port sustituye las bibliotecas del sistema de la PS4 y el núcleo de vídeo de shadPS4 traduce el trabajo de la GPU a Vulkan. Según su README funcionan el arranque, los vídeos, los menús y el juego, con sonido, partidas guardadas, y mando y teclado reasignables. Puede dibujar la escena a hasta 4K y reducirla a los 1080p del juego, o dar la imagen a 1440p, 1800p o 4K nativos, con el escalado temporal del propio Unreal Engine 4, cinco niveles de calidad gráfica y 60 fps por defecto (120 y 240, en pruebas). Su launcher instala el juego desde un .pkg, deja elegir cualquiera de los idiomas del juego, activa el menú de depuración que sus desarrolladores dejaron dentro, munición ilimitada, parches y mods, y se actualiza solo; las fuentes del juego que usa las lee de tu copia. No hay funciones en línea, y con salida nativa por encima de 1080p el mando no llega a algunas opciones de los menús. La 1.3.5 (19 de octubre) corrigió un cierre con tarjetas AMD antiguas, y Porticus añadió la compatibilidad con la actualización 01.02. 20 de sus últimos 100 commits, todos los que su autor hizo para este port, llevan a Claude como coautor; casi todos los demás vienen del historial de gow3_pc."
  en: "A Windows port of the 2019 PS4 MediEvil, the remake of the PS1 game, built on SpartanPort (formerly gow3_pc), the God of War III port from the same family as the Bloodborne one. The game’s original x86-64 code runs directly on the CPU, a runtime written for the port replaces the PS4 system libraries, and shadPS4’s video core translates the GPU work to Vulkan. According to its README, booting, movies, menus, and gameplay work, with sound, saves, and remappable controller and keyboard. It can render the scene at up to 4K and scale it to the game’s 1080p, or output natively at 1440p, 1800p, or 4K, with Unreal Engine 4’s own temporal upscaling, five graphics quality presets, and 60 fps by default (120 and 240 are experimental). Its launcher installs the game from a .pkg, lets you pick any of the game’s languages, turns on the debug menu its developers left in the game, unlimited ammo, patches, and mods, and updates itself; the game fonts it uses are read from your copy. There are no online features, and with native output above 1080p the controller can’t reach some menu items. Version 1.3.5 (October 19) fixed a crash on older AMD graphics cards, and Porticus added support for the 01.02 update. 20 of its last 100 commits, all the ones its author made for this port, list Claude as a co-author; nearly all the others come from gow3_pc’s history."
requirements:
  es: "Tu propia copia de MediEvil para PS4 (CUSA11227, o la europea CUSA12982), en la versión 01.00 o con la actualización 01.02, como carpeta desempaquetada (eboot.bin, sce_module y sce_sys) o como paquete .pkg falso (fake PKG); instalar desde el .pkg necesita unos 32 GB libres. Además, Windows 10 (1903 o posterior) u 11 de 64 bits y una tarjeta gráfica con Vulkan 1.3. No se incluye ningún archivo del juego."
  en: "Your own copy of MediEvil for PS4 (CUSA11227, or the European CUSA12982), version 01.00 or with the 01.02 update, as an unpacked folder (eboot.bin, sce_module, and sce_sys) or as a fake PKG; installing from the .pkg needs about 32 GB of free space. Plus 64-bit Windows 10 (1903 or later) or 11 and a Vulkan 1.3 graphics card. No game files are included."
