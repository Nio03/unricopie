name: "Buzz Aldrin's Race into Space (Race into Space)"
category: source-port
console: dos
status: fully
repo: raceintospace/raceintospace
originalDeveloper: Strategic Visions
year: 1993
desc:
  es: "Race into Space: la versión libre de Buzz Aldrin's Race into Space, el juego de estrategia sobre la carrera espacial entre Estados Unidos y la Unión Soviética, adaptación para ordenador del juego de tablero Liftoff! de Fritz Bronner, que desarrolló Strategic Visions y publicó Interplay, en disquetes y, en 1994, en CD-ROM. Parte del código fuente que se liberó en 2005, y desde entonces se ha ido rehaciendo. Se juega contra la IA o contra otra persona por correo electrónico (PBEM). La 2.0.0 (27 de marzo de 2025), la última versión estable, trasladó el proyecto de SourceForge a GitHub, pasó el código de C a C++, quitó los restos de la protección anticopia, arregló la música y muchos fallos, cambió el orden de turnos de las partidas por correo para que cada jugador juegue dos turnos seguidos e igualó los modificadores de presupuesto de los dos bandos. La 2.1, en desarrollo, corrige vídeos de lanzamiento y cambia las imágenes del módulo lunar soviético LK por otras más fieles. Hay versiones para Windows, Linux (.deb, .rpm y .tar.gz) y macOS. El repositorio incluye todos los datos del juego salvo la música, que por dudas sobre sus derechos de autor está en un repositorio aparte, «nonfree», desde el que se puede añadir a mano; según las notas de la 2.0.0, la versión para macOS no trae música, a diferencia de las de Windows y Linux."
  en: "Race into Space: the free software version of Buzz Aldrin’s Race into Space, the strategy game about the space race between the United States and the Soviet Union, a computer adaptation of Fritz Bronner’s Liftoff! board game developed by Strategic Visions and published by Interplay, on floppy disks and, in 1994, on CD-ROM. It builds on the source code released in 2005 and has been reworked since then. It’s played against the AI or against another person by email (PBEM). 2.0.0 (March 27, 2025), the latest stable release, moved the project from SourceForge to GitHub, converted the code from C to C++, removed the leftover copy protection, fixed the music and many bugs, changed the turn order of play-by-email games so each player plays two turns in a row, and gave both sides the same budget modifiers. Version 2.1, in development, fixes launch movies and replaces the images of the Soviet LK lunar lander with more accurate ones. There are builds for Windows, Linux (.deb, .rpm, and .tar.gz), and macOS. The repository includes all of the game’s data except the music, which, over copyright concerns, is kept in a separate “nonfree” repository it can be added from by hand; according to the 2.0.0 notes, the macOS build has no music, unlike the Windows and Linux ones."
requirements:
  es: "No hace falta ninguna copia del juego: el proyecto se distribuye con licencia GPL e incluye los datos del juego, salvo la música, que se añade aparte. Además, Windows, Linux o macOS; en macOS hay que instalar sdl12-compat con Homebrew, y se compila en macOS 15 o posterior con Apple Silicon."
  en: "No copy of the game is needed: the project is distributed under the GPL and includes the game’s data, except for the music, which is added separately. Plus Windows, Linux, or macOS; on macOS, sdl12-compat has to be installed with Homebrew, and it builds on macOS 15 or later with Apple silicon."
