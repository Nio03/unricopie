desc:
  es: "Port nativo para Linux y Windows de la versión de PS4 (CUSA03627 estadounidense o CUSA03745 europea, con la actualización 01.03): el código original del juego corre directamente en el procesador, sin emular la CPU, un entorno de ejecución reimplementa las bibliotecas del sistema de la PS4 y los comandos y shaders de la GPU se traducen a Vulkan con el núcleo de vídeo de shadPS4. Parte de gow3_pc (hoy SpartanPort) y de bloodborne_pc, y comparte arreglos con el port de inFAMOUS Second Son del mismo autor. Su autor lo da por jugable: arranca, llega al juego y aguanta sesiones de más de 10 minutos sin fallos, con imagen nativa a 1080p, sonido, guardado automático, mandos DualSense, DualShock 4, Xbox y 8BitDo por SDL3 con giroscopio real o simulado, y teclado y ratón con la cámara en el ratón y teclas reasignables. Va a 30 fps como en la PS4, con 60 fps o tasa libre como opciones experimentales, y añade antialiasing SMAA, nitidez RCAS o CAS, ajustes de color, un menú propio dentro del juego y un launcher que también carga trucos en el formato de shadPS4 y GoldHEN. La versión de Linux está probada; la de Windows se compila sola, pero aún no se ha probado jugando. Publica una versión con cada cambio, la última del 22 de octubre. 67 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A native Linux and Windows port of the PS4 release (US CUSA03627 or European CUSA03745, with update 01.03): the game’s original code runs directly on the CPU, with no CPU emulation, a runtime reimplements the PS4 system libraries, and the GPU’s commands and shaders are translated to Vulkan with shadPS4’s video core. It builds on gow3_pc (now SpartanPort) and bloodborne_pc, and shares fixes with the same author’s inFAMOUS Second Son port. Its author calls it playable: it boots, reaches gameplay, and holds up through sessions of more than 10 minutes without failures, with native 1080p output, audio, autosave, DualSense, DualShock 4, Xbox, and 8BitDo controllers through SDL3 with real or simulated gyro, and keyboard and mouse with mouse camera control and remappable keys. It runs at 30 fps as on PS4, with 60 fps or an unlocked rate as experimental options, and adds SMAA anti-aliasing, RCAS or CAS sharpening, color adjustments, its own in-game menu, and a launcher that also loads cheats in the shadPS4 and GoldHEN format. The Linux build is tested; the Windows one is built automatically but hasn’t been tested in game yet. It publishes a release with every change, the latest on October 22. 67 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propio volcado de The Last Guardian para PS4, CUSA03627 (EE. UU.) o CUSA03745 (Europa), con el juego base y la actualización 01.03 en una sola carpeta (unos 25 GB), sacado de tu consola con GoldHEN e Itemzflow; para tener sonido, además, el archivo libSceNgs2.sprx del firmware de tu PS4. Además, Windows 10 u 11 de 64 bits o Linux x86-64 (glibc 2.39 o posterior), una tarjeta gráfica con Vulkan 1.3 (se recomiendan 6 GB de memoria de vídeo) y unos 25 GB libres. En los procesadores sin MOVBE, BMI1 o LZCNT (Intel anteriores a Haswell) emula esas instrucciones."
  en: "Your own dump of The Last Guardian for PS4, CUSA03627 (US) or CUSA03745 (Europe), with the base game and update 01.03 in one folder (about 25 GB), taken from your console with GoldHEN and Itemzflow; for audio, also the libSceNgs2.sprx file from your PS4’s firmware. Plus 64-bit Windows 10 or 11 or x86-64 Linux (glibc 2.39 or later), a Vulkan 1.3 graphics card (6 GB of VRAM recommended), and about 25 GB of free space. On CPUs without MOVBE, BMI1, or LZCNT (Intel before Haswell) it emulates those instructions."
