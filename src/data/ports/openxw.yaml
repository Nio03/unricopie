desc:
  es: "OpenXW: reimplementación de código abierto de X-Wing para Windows, macOS y Linux, del mismo autor que OpenXWA, que usa los datos del juego original. Su código sigue el del ejecutable de la versión para Windows de 1998: cada función y cada variable global llevan anotada su dirección en él. Admite esa versión y la edición en CD-ROM para coleccionistas de 1994; con las dos instaladas, recomienda combinar los menús, las escenas y la banda sonora adaptativa iMUSE de 1994, que reimplementa, con la simulación de vuelo y los modelos 3D de 1998. Cada parte se puede elegir por separado, y con una instalación extraída de la versión de 1993 con la expansión B-Wing se juegan también los gráficos de vuelo y las misiones originales. Para la música emula los sintetizadores Roland MT-32 y SC-55 (con sus ROM, que pones tú), AdLib y OPL3, y también puede usar FluidSynth con una SoundFont. Tiene un modo gráfico clásico y uno moderno (se cambia con Tab en vuelo) que, con los gráficos de 1998, añade sombras, oclusión ambiental, bloom, desenfoque de movimiento, filtrado anisótropo, MSAA hasta 8x, FSR y HDR; los gráficos de DOS se pueden dibujar a más resolución con MSAA. El vuelo puede ir con el tiempo desbloqueado, más fluido, o con el original, y se juega con ratón y teclado, mando o joystick. La última versión es la 0.0.3 (29 de septiembre)."
  en: "OpenXW: an open-source reimplementation of X-Wing for Windows, macOS, and Linux, by the author of OpenXWA, that runs on the original game’s data. Its code follows the executable of the 1998 Windows release: every function and global variable is tagged with its address in it. It supports that release and the 1994 Collector’s CD-ROM; with both installed, it recommends combining the 1994 menus, cutscenes, and adaptive iMUSE soundtrack, which it reimplements, with the 1998 flight simulation and 3D assets. Each part can be chosen separately, and an extracted 1993 installation with the B-Wing expansion adds the original flight graphics and missions. For music it emulates the Roland MT-32 and SC-55 synthesizers (with ROMs you supply), AdLib, and OPL3, and it can also use FluidSynth with a SoundFont. It has a classic graphics mode and a modern one (toggled with Tab in flight) that, with the 1998 graphics, adds shadows, ambient occlusion, bloom, motion blur, anisotropic filtering, up to 8x MSAA, FSR, and HDR; the DOS graphics can be drawn at higher resolutions with MSAA. Flight can run with unlocked timing for smoother motion, or with the original timing, and you can play with mouse and keyboard, a gamepad, or a joystick. The latest release is 0.0.3 (September 29)."
requirements:
  es: "Una instalación completa de tu propia copia de Star Wars: X-Wing, de la edición en CD-ROM para coleccionistas de 1994, de la versión para Windows de 1998 o, mejor, de las dos; de la de 1998 se elige la carpeta principal, la que tiene X-Wing Data, IVFiles y MUSIC. Para los gráficos y misiones de 1993, una instalación extraída de esa versión con la expansión B-Wing, y para emular el MT-32 o el SC-55, sus ROM. Además, un sistema de 64 bits con una tarjeta gráfica moderna: Windows x86-64 (Direct3D 12 o Vulkan), macOS 13 o posterior (Metal) o Linux x86-64 con glibc 2.35 o posterior (Vulkan), con GLib y GThread."
  en: "A complete installation of your own copy of Star Wars: X-Wing, from the 1994 Collector’s CD-ROM, the 1998 Windows release, or, better, both; for 1998, pick the main folder, the one with X-Wing Data, IVFiles, and MUSIC. For the 1993 graphics and missions, an extracted installation of that version with the B-Wing expansion, and to emulate the MT-32 or SC-55, their ROMs. Plus a 64-bit system with a modern graphics card: x86-64 Windows (Direct3D 12 or Vulkan), macOS 13 or later (Metal), or x86-64 Linux with glibc 2.35 or later (Vulkan), with GLib and GThread."
