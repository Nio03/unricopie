year: 1999
desc:
  es: "Piccu Engine: motor nuevo para Descent 3 a partir del código fuente de la versión 1.5, publicado en abril de 2024, que incorpora casi todos los cambios de InjectD3. Se puede poner directamente en la carpeta del juego o en otra con los archivos de datos copiados, y sirve para la campaña, la expansión Mercenary y el multijugador, con servidor dedicado. Añade modo ventana centrado, escalado en ventana y en pantalla completa, una pantalla completa que no cambia la configuración del escritorio, un código de ratón nuevo que lo lee a su frecuencia real en vez de a los 20 Hz del original, campo de visión ajustable que se amplía solo en panorámico, con una cabina que funciona en esa relación de aspecto, funciones de OpenGL que faltaban (reflejos especulares, control del mipmapping), sonido por OpenAL sin chasquidos, con reverberación de entorno y efecto Doppler, escalado del texto del HUD, menús a 60 fps, MSAA, vídeos a todo lo ancho de la pantalla y mandos XInput. Las partidas, demos y pilotos se guardan en la carpeta de partidas guardadas del usuario, salvo en modo portátil. La 1.2 (9 de septiembre de 2024) sumó un renderizador con OpenGL 3.3, que la 1.2.1 dejó como opción porque iba mal en tarjetas de Nvidia, la publicación de partidas en servidores de seguimiento compatibles con el protocolo de Gamespy y la descarga de misiones por HTTPS. La última versión estable es la 1.2.2 (12 de septiembre de 2024), para Windows; desde junio de 2025 hay versiones de prueba de la 1.3.0 que pasan la entrada, las ventanas y el contexto gráfico a SDL, la última del 25 de julio de 2025, y el último commit es del 27 de agosto de 2026. Como el código fuente publicado, el repositorio incluye datos de la demo de Linux de Descent 3 (cuatro niveles, gráficos, sonidos, la música del menú y textos, unos 15 MB) y las tablas de textos del juego completo."
  en: "Piccu Engine: a new engine for Descent 3 based on the version 1.5 source code released in April 2024, which incorporates almost every change from InjectD3. It can be dropped straight into the game’s folder or into a separate one with the data files copied over, and it covers the campaign, the Mercenary expansion, and multiplayer, with a dedicated server. It adds a centered window mode, scaling in windowed and fullscreen modes, a fullscreen mode that doesn’t change desktop settings, new mouse code that reads the mouse at its native rate instead of the original’s 20 Hz, an adjustable field of view that expands automatically in widescreen, with a cockpit that works at that aspect ratio, restored OpenGL features (specular highlights, mipmapping control), OpenAL sound with no crackling, environmental reverb, and Doppler, HUD text scaling, menus at 60 fps, MSAA, videos that fill the screen width, and XInput controllers. Savegames, demos, and pilots go to the user’s Saved Games folder unless you use portable mode. Version 1.2 (September 9, 2024) added an OpenGL 3.3 renderer, which 1.2.1 made optional because it ran poorly on Nvidia cards, game listing on trackers that speak the Gamespy protocol, and mission downloads over HTTPS. The latest stable release is 1.2.2 (September 12, 2024), for Windows; since June 2025 there have been 1.3.0 test builds that move input, window, and graphics context handling to SDL, the latest from July 25, 2025, and the latest commit is from August 27, 2026. Like the released source code, the repository includes data from the Descent 3 Linux demo (four levels, graphics, sounds, the menu music, and text, about 15 MB) and the full game’s text tables."
requirements:
  es: "Los archivos de tu propia copia de Descent 3 actualizada a la versión 1.4: d3.hog, extra.hog y extra13.hog, y en missions d3.mn3, d3_2.mn3, d3voice1.hog, d3voice2.hog y training.mn3, más merc.hog y merc.mn3 si tienes la expansión Mercenary; también valen los datos de la versión de Steam. Para el multijugador hacen falta además las carpetas netgames y online, Fury.hog y bedlam.mn3; los vídeos son opcionales. Además, Windows."
  en: "The files from your own copy of Descent 3 updated to version 1.4: d3.hog, extra.hog, and extra13.hog, and in missions d3.mn3, d3_2.mn3, d3voice1.hog, d3voice2.hog, and training.mn3, plus merc.hog and merc.mn3 if you own the Mercenary expansion; the Steam release’s data works too. Multiplayer also needs the netgames and online folders, Fury.hog, and bedlam.mn3; the movies are optional. Plus Windows."
