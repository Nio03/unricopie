name: "Doom / Doom II (Chocolate Doom)"
category: source-port
console: dos
status: fully
repo: chocolate-doom/chocolate-doom
homepage: https://www.chocolate-doom.org/
originalDeveloper: id Software
year: 1993
desc:
  es: "Chocolate Doom: port de Doom, sobre el código fuente que publicó id Software, que busca reproducir con exactitud la versión original de DOS, fallos incluidos, en sistemas actuales. Es compatible con las demos, la configuración y las partidas guardadas de DOS, y busca que la imagen y el control se sientan como entonces. Empezó solo con Doom, pero ahora incluye también ports de Heretic y Hexen, sobre el código que publicó Raven Software, y de Strife: como el código de Strife se perdió, Chocolate Strife se reconstruyó en más de cuatro años de ingeniería inversa del ejecutable de DOS, con el visto bueno de sus programadores originales. Escala por hardware a cualquier tamaño de ventana; la música puede sonar con un OPL3 emulado (Nuked OPL3), FluidSynth, MIDI nativo o paquetes de música en FLAC, Ogg o MP3, y la opción -merge permite jugar conversiones totales sin tocar la IWAD. La 3.1.0 (1 de agosto de 2024) añadió UDP hole punching para que los servidores detrás de un router sean accesibles desde internet, carga automática de WAD y arrastrar archivos al ejecutable en Windows. La última es la 3.1.1 (14 de agosto de 2025), con soporte inicial para la versión 1.5 de Doom. Las versiones publicadas son para Windows de 64 bits y macOS (Intel y Apple Silicon); en Linux y otros sistemas se compila desde el código."
  en: "Chocolate Doom: a Doom port, built on the source code id Software released, that aims to accurately reproduce the original DOS version, bugs included, on current systems. It’s compatible with DOS demos, configuration files, and saves, and aims for the display and controls to feel the way they did back then. It started with Doom alone, but now also includes ports of Heretic and Hexen, built on the code Raven Software released, and of Strife: since Strife’s source code was lost, Chocolate Strife was rebuilt over more than four years of reverse engineering the DOS executable, with the blessing of its original programmers. It scales in hardware to any window size; music can play through an emulated OPL3 (Nuked OPL3), FluidSynth, native MIDI, or FLAC, Ogg, or MP3 music packs, and the -merge option lets you play total conversions without modifying the IWAD. Version 3.1.0 (August 1, 2024) added UDP hole punching so servers behind a router are reachable from the internet, WAD autoloading, and dragging files onto the executable on Windows. The latest is 3.1.1 (August 14, 2025), with initial support for Doom version 1.5. The published builds are for 64-bit Windows and macOS (Intel and Apple silicon); on Linux and other systems it’s built from source."
requirements:
  es: "La IWAD de tu propia copia: doom.wad, doom2.wad, tnt.wad o plutonia.wad para Doom, Doom II y Final Doom; heretic.wad, hexen.wad, o strife1.wad con voices.wad (Strife 1.2 o posterior, o Strife: Veteran Edition). También valen las versiones shareware gratuitas de Doom (doom1.wad) y Heretic (heretic1.wad), Chex Quest y las IWAD libres de Freedoom. Encuentra solo las instalaciones de Steam y GOG. Además, Windows de 64 bits o macOS; en Linux, compilándolo."
  en: "The IWAD from your own copy: doom.wad, doom2.wad, tnt.wad, or plutonia.wad for Doom, Doom II, and Final Doom; heretic.wad, hexen.wad, or strife1.wad with voices.wad (Strife 1.2 or later, or Strife: Veteran Edition). The free shareware versions of Doom (doom1.wad) and Heretic (heretic1.wad), Chex Quest, and the free Freedoom IWADs work too. It finds Steam and GOG installs on its own. Plus 64-bit Windows or macOS; on Linux, by building it."
