repo: deadinside28/bloodborne_pc
originalDeveloper: FromSoftware
year: 2015
desc:
  es: "bbport: el juego de PS4 funcionando de forma nativa en Linux x86-64, y la primera ficha de su tipo en el catálogo. No es un recomp ni una decompilación, y su autor lo explica mejor que nadie: es el equivalente de Wine + DXVK para un solo juego. Como en Wine, el código x86-64 original se ejecuta directamente en la CPU, y un entorno de ejecución escrito para este juego sustituye las bibliotecas del sistema de la PS4; como en DXVK, los gráficos se traducen a Vulkan, con un renderizador derivado de shadPS4 y muy ampliado, que incluye escalado temporal con FSR 3.1, 4 y 4.1.1. El fork de Supermedo lleva todo esto a Windows con un launcher en 13 idiomas, DLSS y juego en línea en beta. 92 de sus últimos 100 commits llevan a Claude como coautor."
  en: "bbport: the PS4 game running natively on x86-64 Linux, and the first entry of its kind in this catalog. It’s neither a recomp nor a decomp, and its author puts it best: it’s the counterpart of Wine + DXVK for a single game. As in Wine, the original x86-64 code runs directly on the CPU, and a runtime written for this one game replaces the PS4 system libraries; as in DXVK, the graphics are translated to Vulkan, by a renderer derived from shadPS4 and heavily extended, including temporal upscaling with FSR 3.1, 4, and 4.1.1. The Supermedo fork brings all this to Windows with a launcher in 13 languages, DLSS, and beta online play. 92 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propio volcado descifrado de Bloodborne (CUSA03173). La versión 1.09 es la que admiten los parches de la comunidad (60 o 90 fps o tasa desbloqueada, resolución, efectos); las demás versiones funcionan a 30 fps. No se incluye ningún archivo del juego."
  en: "Your own decrypted Bloodborne dump (CUSA03173). Version 1.09 is the one the community patches support (60/90 fps or unlocked, resolution, effects); other versions run at 30 fps. No game files are included."
