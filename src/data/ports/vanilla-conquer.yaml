name: Vanilla Conquer
category: source-port
status: playable
repo: TheAssemblyArmada/Vanilla-Conquer
originalDeveloper: Westwood Studios
desc:
  es: "Vanilla Conquer: versión portable del motor de la primera generación de Command & Conquer, que ejecuta Tiberian Dawn y Red Alert en Windows, Linux, macOS y BSD con SDL y OpenAL. Parte del código de Tiberian Dawn y Red Alert que EA publicó junto a la Remastered Collection y busca que los juegos se jueguen como en su época, como sustituto directo de los ejecutables originales (vanillatd y vanillara), con correcciones de errores y de compatibilidad y mejoras de comodidad. También compila las DLL de los dos juegos como mods para la Remastered Collection, lo que sirve para crear mods para ella. Incluye una herramienta para los archivos MIX. No tiene versiones numeradas: publica compilaciones de desarrollo para Windows (32 y 64 bits), Linux y macOS con cada cambio, la última del 16 de julio. El README enlaza a las ediciones que EA publicó como gratuitas: las ISO de Command & Conquer Gold (GDI y NOD) en ModDB y el CD de Red Alert a través de la página archivada de EA, además de la demo oficial de Red Alert."
  en: "Vanilla Conquer: a portable version of the first-generation Command & Conquer engine that runs Tiberian Dawn and Red Alert on Windows, Linux, macOS, and the BSDs with SDL and OpenAL. It builds on the Tiberian Dawn and Red Alert source code EA released alongside the Remastered Collection and aims to keep the games as they were at release, working as a drop-in replacement for the original executables (vanillatd and vanillara) with bug fixes, compatibility fixes, and quality-of-life improvements. It also builds both games’ DLLs as mods for the Remastered Collection, which makes it useful for Remastered mod development. It includes a tool for MIX files. There are no numbered releases: it publishes development builds for Windows (32- and 64-bit), Linux, and macOS with every change, the latest on July 16. The README links to the editions EA released as freeware: the Command & Conquer Gold ISOs (GDI and NOD) on ModDB and the Red Alert CD through EA’s archived page, plus the official Red Alert demo."
requirements:
  es: "Los archivos de tu propia copia de los juegos clásicos: se copia vanillatd.exe o vanillara.exe (en Windows, con SDL2.dll y OpenAL32.dll) en la carpeta del juego. Valen las ediciones gratuitas de Command & Conquer Gold y de Red Alert, y la demo de Red Alert se puede jugar entera; los datos de la Remastered Collection, The Ultimate Collection o The First Decade todavía no se admiten. Los mods para la Remastered Collection necesitan tu copia de esta. Además, Windows, Linux o macOS."
  en: "The files from your own copy of the classic games: you copy vanillatd.exe or vanillara.exe (on Windows, along with SDL2.dll and OpenAL32.dll) into the game folder. The freeware Command & Conquer Gold and Red Alert releases work, and the Red Alert demo is fully playable; data from the Remastered Collection, The Ultimate Collection, or The First Decade isn’t supported yet. The Remastered mods need your copy of the Remastered Collection. Plus Windows, Linux, or macOS."
tags:
  - mods
