author: Adrien Moulin
originalDeveloper: Totally Games
year: 1995
desc:
  es: "OpenTIE: reimplementación de código abierto de Star Wars: TIE Fighter para Windows, macOS y Linux, que funciona con los datos del juego original. Admite la edición Collector’s CD-ROM de 1995, para DOS, y la versión para Windows de 1998, y con las dos instaladas puede combinar los menús, las escenas y la música adaptativa iMUSE de la de 1995 con el vuelo y los modelos 3D de la de 1998, que es la combinación que recomienda; cada parte se elige por separado. Reimplementa la banda sonora iMUSE, que cambia según lo que pasa en la misión, y la puede tocar con una Roland SC-55 emulada (con tus propias ROM), con síntesis FM OPL3 o con FluidSynth y la SoundFont que elijas. Tiene un modo gráfico clásico y otro moderno, que se alternan con TAB; el moderno añade sombras, oclusión ambiental, bloom, desenfoque de movimiento, MSAA, FSR 3.1.4 y HDR. El vuelo se puede simular hasta a 240 Hz, o con los tiempos originales de cada edición, y se juega con ratón y teclado (con un modo de palanca virtual), mando, joystick o HOTAS, con teclas reasignables. Importa los pilotos que ya tengas. La 0.0.7 (4 de octubre) reescribió buena parte del código para seguir más de cerca el original y corrigió un fallo del juego original por el que las torretas de los destructores estelares no disparaban. Sigue en desarrollo y aún puede tener fallos y diferencias con el original."
  en: "OpenTIE: an open-source reimplementation of Star Wars: TIE Fighter for Windows, macOS, and Linux that runs on the original game’s data. It supports the 1995 Collector’s CD-ROM edition for DOS and the 1998 Windows release, and with both installed it can combine the 1995 menus, cutscenes, and adaptive iMUSE music with the 1998 flight engine and 3D models, the combination it recommends; each part is chosen separately. It reimplements the iMUSE soundtrack, which shifts with what happens in the mission, and can play it on an emulated Roland SC-55 (with your own ROMs), with OPL3 FM synthesis, or with FluidSynth and a SoundFont of your choice. It has a classic and a modern graphics mode, toggled with TAB; the modern one adds shadows, ambient occlusion, bloom, motion blur, MSAA, FSR 3.1.4, and HDR. Flight can be simulated at up to 240 Hz, or with each edition’s original timing, and is played with mouse and keyboard (including a virtual-stick mode), gamepad, joystick, or HOTAS, with remappable keys. It imports your existing pilot files. Version 0.0.7 (October 4) rewrote much of the code to follow the original more closely and fixed an original bug that kept Star Destroyer turrets from firing. It’s still in development, and bugs and differences from the original are still possible."
requirements:
  es: "Una instalación completa de tu propia copia de Star Wars: TIE Fighter, la Collector’s CD-ROM de 1995 o la versión para Windows de 1998, o las dos; la Special Edition se vende en GOG y Steam. Para la música con la Roland SC-55 emulada, también sus ROM. Además, un sistema de 64 bits con una tarjeta gráfica moderna: Windows x86-64 (Direct3D 12 o Vulkan), macOS 13 o posterior (Metal; la versión publicada es para Apple Silicon) o Linux x86-64 con glibc 2.35 o posterior (Vulkan)."
  en: "A complete installation of your own copy of Star Wars: TIE Fighter, the 1995 Collector’s CD-ROM or the 1998 Windows release, or both; the Special Edition is sold on GOG and Steam. For music on the emulated Roland SC-55, its ROMs too. Plus a 64-bit system with a modern graphics card: x86-64 Windows (Direct3D 12 or Vulkan), macOS 13 or later (Metal; the published build is for Apple silicon), or x86-64 Linux with glibc 2.35 or later (Vulkan)."
