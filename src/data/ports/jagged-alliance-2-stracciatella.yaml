desc:
  es: "JA2 Stracciatella: port de Jagged Alliance 2, el juego de táctica de 1999, a más plataformas, que mejora su estabilidad, corrige fallos y sirve de base para crear mods. Parte del código fuente que Strategy First publicó en 2004 con su propia licencia, y continúa el proyecto que Tron empezó en 2006 para limpiar y hacer portable ese código, con más de 7000 commits en su repositorio original; hoy está escrito en C++ y Rust, con algo de Lua, y en 2021 tenía un 30 % menos de código que el original. El nombre alude al helado: mantiene el juego «vainilla» con mejoras repartidas como los trocitos de chocolate. Añade un launcher, resoluciones altas, atajos de teclado nuevos, controles táctiles, un modo «Dead is Dead» que guarda por ti en una sola ranura, partidas guardadas con nombre y sin límite, el editor de mapas integrado, pantallas de depuración y compatibilidad con los mapas de Wildfire mediante un mod. Muchos datos del juego están en archivos JSON externos, fáciles de modificar. Admite las versiones en neerlandés, inglés, francés, alemán, italiano, polaco y las dos rusas. La 0.22.0 (28 de septiembre de 2025) añadió los parches JSON para mods y sacó a archivos externos las armaduras, los explosivos y los guiones de los personajes, con al menos 38 fallos corregidos, 19 de ellos del juego original; la 0.22.1, de octubre de 2025, corrigió un fallo. Hay versiones para Windows (32 y 64 bits), Linux (AppImage y Flatpak), macOS y Android, además de compilaciones diarias. 8 de sus últimos 100 commits, de septiembre de 2026, llevan a Claude como coautor. El repositorio incluye además, como mod, la localización al chino simplificado: los textos y las fuentes del juego en ese idioma."
  en: "JA2 Stracciatella: a port of Jagged Alliance 2, the 1999 tactical game, to more platforms, improving its stability, fixing bugs, and providing a platform for mod development. It builds on the source code Strategy First released in 2004 under its own license, and continues the project Tron started in 2006 to clean up that code and make it portable, with over 7,000 commits in its original repository; today it’s written in C++ and Rust, with some Lua, and in 2021 it had 30% less code than the original. The name is a nod to the ice cream: it keeps the “vanilla” game with improvements mixed in like the chocolate pieces. It adds a launcher, high resolutions, new hotkeys, touch controls, a “Dead is Dead” mode that saves for you in a single slot, unlimited named saves, the built-in map editor, debug screens, and support for the Wildfire maps through a mod. Much of the game data lives in external JSON files that are easy to edit. It supports the Dutch, English, French, German, Italian, and Polish releases and both Russian ones. Version 0.22.0 (September 28, 2025) added JSON patches for mods and moved armor, explosives, and NPC script records to external files, with at least 38 bugs fixed, 19 of them from the original game; 0.22.1, from October 2025, fixed one bug. There are builds for Windows (32- and 64-bit), Linux (AppImage and Flatpak), macOS, and Android, plus nightly builds. 8 of its last 100 commits, from September 2026, list Claude as a co-author. The repository also includes, as a mod, the Simplified Chinese localization: the game’s text and fonts in that language."
requirements:
  es: "Una instalación completa y limpia de tu propia copia de Jagged Alliance 2 (no sirve con el mod 1.13), por ejemplo de GOG o la Jagged Alliance 2 Gold de Steam, cuyos archivos están en la subcarpeta JA2Classic; en el launcher eliges la carpeta y la versión de idioma. Para los mapas de Wildfire, también Wildfire y el mod de conversión. Además, Windows, Linux o macOS."
  en: "A full, clean install of your own copy of Jagged Alliance 2 (not one with the 1.13 mod), for example from GOG or Steam’s Jagged Alliance 2 Gold, whose files are in the JA2Classic subfolder; in the launcher you pick the folder and the language version. For the Wildfire maps, Wildfire and the conversion mod too. Plus Windows, Linux, or macOS."
