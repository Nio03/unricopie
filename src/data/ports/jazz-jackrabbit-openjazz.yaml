year: 1994
desc:
  es: "OpenJazz: versión libre y de código abierto de Jazz Jackrabbit, el juego de plataformas de Epic MegaGames de 1994, que usa los archivos del juego original. AJ Thomson la empezó el 23 de agosto de 2005 y publicó la primera versión jugable el 15 de enero de 2006, y en 2009 sumó el multijugador en red. Desde 2014 está en GitHub, donde Carsten Teibes la mantiene y ha integrado los ports a otras plataformas. Según el proyecto, es compatible con todas las versiones publicadas de Jazz Jackrabbit, de las shareware a la edición en CD con The Lost Episodes, aunque su FAQ advierte de que la física no es exactamente la del original y de que no siempre se pueden terminar los niveles hechos por fans. La 20260218 (18 de febrero) añadió SDL3, recuperó las opciones de escalado, arregló la red en Windows y sumó versiones para Switch, Android y Mac (de Mac Source Ports); la última, la 20260301 (1 de marzo), centró los menús, añadió un HUD como el de los juegos de disparos en primera persona e hizo que la salud de Jazz y de los enemigos dependa de la dificultad. Desde entonces ha sumado la opción de guardar partida y menús de depuración y trucos. Hay versiones para Windows y Linux de 64 bits, y también para navegador y varias consolas y portátiles; se compila además en macOS y BSD. La versión para navegador que enlaza su README (openjazz.github.io) incluye las versiones shareware de Jazz Jackrabbit 1.1, Holiday Hare y Holiday Hare '95, que Epic MegaGames publicó como shareware, junto con su licencia de distribución."
  en: "OpenJazz: a free, open-source version of Jazz Jackrabbit, Epic MegaGames’ 1994 platformer, that uses the original game’s files. AJ Thomson started it on August 23, 2005, and released the first playable version on January 15, 2006, and networked multiplayer followed in 2009. It has been on GitHub since 2014, where Carsten Teibes maintains it and has merged the ports to other platforms. According to the project, it’s compatible with every released version of Jazz Jackrabbit, from the shareware ones to the CD edition with The Lost Episodes, though its FAQ warns that the physics aren’t exactly the original’s and that fan-made levels can’t always be finished. Version 20260218 (February 18) added SDL3, brought back the scaling options, fixed networking on Windows, and added builds for Switch, Android, and Mac (by Mac Source Ports); the latest, 20260301 (March 1), centered the menus, added a HUD like the ones in first-person shooters, and made Jazz’s and the enemies’ health depend on the difficulty. Since then it has gained the ability to save games and debug and cheat menus. There are builds for 64-bit Windows and Linux, plus the browser and several consoles and handhelds; it also builds on macOS and BSD. The browser version linked from its README (openjazz.github.io) includes the shareware versions of Jazz Jackrabbit 1.1, Holiday Hare, and Holiday Hare ’95, which Epic MegaGames released as shareware, along with their distribution license."
requirements:
  es: "Los archivos de tu propia copia de Jazz Jackrabbit, no de Jazz Jackrabbit 2: sirven la versión shareware, que es gratuita, la Christmas Edition, Holiday Hare '95, Jazz Jackrabbit CD con The Lost Episodes, la edición Complete o la Jazz Jackrabbit Collection de GOG, que según el autor es totalmente compatible. Van junto al ejecutable o en una carpeta que se le pasa como parámetro. Además, Windows, Linux, macOS o BSD."
  en: "The files from your own copy of Jazz Jackrabbit, not Jazz Jackrabbit 2: the free shareware version, the Christmas Edition, Holiday Hare ’95, Jazz Jackrabbit CD with The Lost Episodes, the Complete edition, or GOG’s Jazz Jackrabbit Collection, which the author says is fully compatible, all work. They go next to the executable or in a folder passed as a command-line argument. Plus Windows, Linux, macOS, or BSD."
