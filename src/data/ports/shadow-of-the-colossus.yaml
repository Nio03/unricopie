name: Shadow of the Colossus
category: native-layer
console: ps4
status: playable
repo: AjncSystem/ShadowOfTheColossus-PC
author: AjncSystem
originalDeveloper: Bluepoint Games
year: 2018
desc:
  es: "Port nativo para Windows del Shadow of the Colossus de PS4, el remake de Bluepoint de 2018: el código x86-64 del propio juego corre directamente en la CPU del PC y la GPU de la PS4 se traduce a Vulkan. No es un emulador completo, sino un cargador con las funciones del sistema que el juego necesita, al estilo del port de Bloodborne para Windows. Trae un launcher con biblioteca de juegos y opciones de imagen y controles; teclado y mando a la vez, con la cámara en el ratón; modo de 60 fps, filtro anisotrópico 16x, modo PS4 Pro y salida de hasta 4K. Su autor publica correcciones casi a diario, y todavía hay problemas conocidos, por ejemplo con las tarjetas gráficas de AMD."
  en: "Native Windows port of Shadow of the Colossus for PS4, Bluepoint’s 2018 remake: the game’s own x86-64 code runs directly on the PC’s CPU, and the PS4 GPU is translated to Vulkan. It isn’t a full emulator but a loader with the system functions the game needs, in the style of the Bloodborne Windows port. It comes with a launcher with a game library and display and control options; keyboard and controller at the same time, with mouse camera; a 60 fps mode, 16x anisotropic filtering, a PS4 Pro mode, and output up to 4K. Its author ships fixes almost daily, and there are still known issues, for example on AMD graphics cards."
requirements:
  es: "Tu propio volcado de la versión de PS4 (CUSA08809; mejor la europea 1.01, la única en la que funcionan los parches de 60 fps y del filtro 16x) y, para tener sonido, dos módulos del sistema de tu propia consola (libSceNgs2.sprx y libSceUlt.sprx). Además, Windows 10 u 11 de 64 bits y una tarjeta gráfica con Vulkan 1.3."
  en: "Your own dump of the PS4 version (CUSA08809; ideally the European 1.01, the only one where the 60 fps and 16x filtering patches work) and, for sound, two system modules from your own console (libSceNgs2.sprx and libSceUlt.sprx). Plus 64-bit Windows 10 or 11 and a Vulkan 1.3 graphics card."
tags:
  - x86
  - vulkan
