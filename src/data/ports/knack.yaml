name: "Knack"
games: [knack]
category: native-layer
console: ps4
status: experimental
repo: AbdelmoumenDeghbouche/knack_pc
originalDeveloper: "Japan Studio"
year: 2013
desc:
  es: "Port nativo para Windows 10 y 11 y Linux, al estilo de bbport: el código x86-64 original del juego se ejecuta directamente en el procesador del PC, un runtime sustituye las bibliotecas del sistema de la PS4 y el núcleo de vídeo de shadPS4 traduce los gráficos a Vulkan; no hay emulación de CPU. El repositorio empezó como copia del port de WipEout Omega Collection del mismo autor y comparte con él todo lo que queda por debajo. Según el README, los primeros capítulos se juegan de principio a fin a hasta 120 fps, con combates, supermovimientos, vídeos de la historia, música, efectos y partidas guardadas; los capítulos posteriores aún no se han probado. Se ha probado con el volcado estadounidense CUSA00068 con la actualización 01.10; las versiones europeas figuran sin probar. En Linux la AppImage se construye y abre en GitHub Actions, pero nadie la ha jugado todavía. La versión 0.1.4 es del 26 de octubre. El repositorio incluye un archivo con las claves RSA públicas de PKG falsos copiadas de shadPS4."
  en: "A native port for Windows 10 and 11 and Linux, in the style of bbport: the game’s original x86-64 code runs directly on the PC’s processor, a runtime replaces the PS4 system libraries, and shadPS4’s video core translates the graphics to Vulkan; there is no CPU emulation. The repository started as a copy of the same author’s WipEout Omega Collection port and shares everything beneath it. According to the README, the first chapters play from start to end at up to 120 fps, with fights, super moves, story videos, music, effects, and saves; later chapters have not been tested yet. It has been tested with the US dump CUSA00068 with update 01.10; the European versions are listed as untested. On Linux the AppImage is built and opened on GitHub Actions, but nobody has played it yet. Version 0.1.4 is from October 26. The repository includes a file with the public fake-PKG RSA keysets copied from shadPS4."
requirements:
  es: "Tu propia copia volcada de Knack de PS4 (probada: CUSA00068 de EE. UU. con la actualización 01.10), como carpeta con eboot.bin y, si la actualización está aparte, su carpeta. Una CPU de 64 bits con AVX, una GPU con Vulkan 1.3 y 16 GB de RAM recomendados (el juego usa de 5 a 6 GB). Windows 10 u 11, o Linux con glibc 2.39 o posterior."
  en: "Your own dump of Knack for PS4 (tested: US CUSA00068 with update 01.10), as a folder with eboot.bin and, if the update is separate, its folder. A 64-bit CPU with AVX, a Vulkan 1.3 GPU, and 16 GB of RAM recommended (the game uses 5 to 6 GB). Windows 10 or 11, or Linux with glibc 2.39 or later."
