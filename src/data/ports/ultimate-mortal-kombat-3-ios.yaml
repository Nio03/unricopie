desc:
  es: "Port nativo para PC de la versión de iPhone de 2011 (1.2.59), construido sobre una decompilación completa: las 2572 funciones del juego están transcritas a C y comprobadas con pruebas diferenciales frente a un recompilador estático de ARM a C que hace de referencia. El binario conservaba sus símbolos de depuración, con los nombres de las funciones y de los archivos de código originales. La descarga no trae nada del juego: el launcher recibe tu .ipa, extrae los recursos y las tablas de datos, descarga un compilador fijado y compila el juego en tu equipo, en 32 o en 64 bits. Se juega entero, con el Arcade hasta Shao Kahn y todos los remates, y añade formatos 3:2, 4:3 (la vista de la versión de iPad), 16:9 y 21:9, resolución y antialiasing ajustables, calidad de textura hasta sin comprimir, teclado y mando con controles reasignables y menús manejables con ellos, el duelo para dos jugadores en un mismo equipo que solo ofrecía la versión de iPad, un modo de entrenamiento, perfiles de jugador, juego en línea por ahora solo en el mismo equipo o en red local, y un menú de depuración con visor de cajas de golpe y estados guardados. Quedan errores de texturas en algunos escenarios y luchadores, y algunos modos aparte del Arcade pueden cerrar el juego. Las versiones publicadas son para Windows; en Linux y macOS se compila desde el código con su script. La última es la 0.1.5 (16 de octubre). Su documentación declara que la mayor parte del proyecto la hizo Claude bajo dirección humana, y 1075 de sus 1264 commits llevan una IA como coautora, casi siempre Claude."
  en: "A native PC port of the 2011 iPhone release (1.2.59), built on a complete decompilation: all 2,572 game functions are transcribed to C and checked with differential tests against a static ARM-to-C recompiler that serves as the reference. The binary kept its debug symbols, with the original function and source file names. The download has nothing from the game: the launcher takes your .ipa, extracts the resources and data tables, downloads a pinned compiler, and builds the game on your machine, as 32-bit or 64-bit. It’s playable in full, with Arcade up to Shao Kahn and every finisher, and adds 3:2, 4:3 (the iPad version’s view), 16:9, and 21:9 aspect ratios, adjustable resolution and anti-aliasing, texture quality up to uncompressed, keyboard and controller with rebindable controls and menus you can navigate with them, the two-player duel on one machine that only the iPad version offered, a training mode, player profiles, online play for now only on the same PC or local network, and a debug menu with a hitbox viewer and save states. Some texture errors remain on certain stages and fighters, and some modes other than Arcade can crash the game. The released builds are for Windows; on Linux and macOS you build it from source with its script. The latest is 0.1.5 (October 16). Its documentation states that most of the project was done by Claude under human direction, and 1,075 of its 1,264 commits list an AI as a co-author, almost always Claude."
requirements:
  es: "Tu propia copia de Ultimate Mortal Kombat 3 para iPhone, versión 1.2.59, como archivo .ipa (la parte armv7 con UUID 90d6f56a18e2303f8f2053b02a42742e); no sirve otra versión. Además, Windows para las versiones publicadas; la primera compilación descarga el compilador. En Linux y macOS, compilarlo desde el código."
  en: "Your own copy of Ultimate Mortal Kombat 3 for iPhone, version 1.2.59, as an .ipa (the armv7 slice with UUID 90d6f56a18e2303f8f2053b02a42742e); no other version works. Plus Windows for the released builds; the first build downloads the compiler. On Linux and macOS, building it from source."
