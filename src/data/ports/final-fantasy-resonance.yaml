year: 2026
desc:
  es: "Adaptación experimental para Mac con chip Apple de la edición asiática (versión de Hong Kong, actualización 1.0.1) de Final Fantasy Resonance, hecha sobre nxnative: el código original del juego se ejecuta de forma nativa con un entorno que sustituye a la Switch y sus gráficos NVN sobre Metal. El repositorio solo trae el parche del entorno de ejecución de nxnative, el perfil del juego (identificadores y hechos de shaders, sin programas de shader), scripts de preparación y construcción, un parche del menú de fotogramas y el launcher; la app se construye en tu Mac con tus archivos y claves. Según el README se ha ejecutado en un M1 Pro con macOS 26.5.1, con título, introducción, escena inicial, movimiento básico, carga de partidas, sonido, teclado, mandos de Xbox y Switch Pro y la opción de 30 o 60 fps del propio juego (60 es experimental). Quedan parpadeos negros en algunos efectos de fuego y partículas translúcidas y tirones con los primeros efectos de combate, y no se han probado todos los capítulos. El propio README avisa de que el nuevo punto de entrada de compilación no se ha validado de principio a fin ni reproducido en otra máquina. No tiene versiones publicadas. Ninguno de sus 3 commits lleva a Claude como coautor."
  en: "An experimental Apple Silicon Mac adaptation of the Asian edition (Hong Kong release, update 1.0.1) of Final Fantasy Resonance, built on nxnative: the game’s original code runs natively with a host that stands in for the Switch and its NVN graphics on Metal. The repository only carries the patch to nxnative’s runtime, the game profile (identifiers and shader facts, no shader programs), preparation and build scripts, a frame-rate menu patch, and the launcher; the app is built on your Mac from your own files and keys. According to the README it has run on an M1 Pro with macOS 26.5.1, with the title, opening, starting scene, basic movement, save loading, sound, keyboard, Xbox and Switch Pro controllers, and the game’s own 30 or 60 fps option (60 is experimental). Some fire and transparent-particle effects still flicker black and the first combat effects stutter, and not every chapter has been tested. The README itself warns that the new build entry point hasn’t been validated end to end or reproduced on another machine. It has no published releases. None of its 3 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de la edición asiática (versión de Hong Kong) en NSP, con título 0100B8A026F14000, más la actualización 1.0.1 (0100B8A026F14800, main con build ID b7f965b9d7227db8e29f04e84ea7331b) y tu propio prod.keys; opcionalmente, tu DLC. Otras versiones y regiones no se han probado y los scripts rechazan los módulos que no coincidan. Además, un Mac con Apple Silicon y macOS 26 o posterior (solo hay constancia de un M1 Pro), Xcode con su toolchain de Metal, Python 3.12 o posterior, .NET 10 SDK, spirv-cross y zstd, y entre 100 y 120 GiB libres, una estimación del autor sin medir."
  en: "Your own copy of the Asian edition (Hong Kong release) as an NSP, title 0100B8A026F14000, plus the 1.0.1 update (0100B8A026F14800, main build ID b7f965b9d7227db8e29f04e84ea7331b) and your own prod.keys; optionally, your DLC. Other versions and regions haven’t been tried and the scripts reject modules that don’t match. Plus an Apple Silicon Mac with macOS 26 or later (only an M1 Pro is on record), Xcode with its Metal toolchain, Python 3.12 or later, the .NET 10 SDK, spirv-cross, and zstd, and 100 to 120 GiB free, an unmeasured estimate by the author."
