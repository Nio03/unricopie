desc:
  es: "ReflectionHLE, conocido durante años como Reflection Keen: una serie de source ports de juegos de DOS inspirados en Chocolate Doom, que imitan el comportamiento de cada versión original, fallos incluidos, y son compatibles con sus partidas guardadas. Comparten una base común y cubren Keen Dreams; Catacomb 3-D y The Catacomb Adventure Series (Abyss, Armageddon y Apocalypse); Wolfenstein 3D, Spear of Destiny con sus packs de misiones y la versión de DOS de Super 3-D Noah's Ark, y BioMenace. Salvo BioMenace, que parte del código reconstruido que publicó K1n9_Duk3, se basan en el código fuente que se publicó de Keen Dreams, Catacomb 3-D, la serie Catacomb Adventure y Wolfenstein 3D, que sirve también para Spear of Destiny y Noah's Ark. Tiene un lanzador que encuentra instalaciones como las de GOG.com, dos esquemas de control para mando, controles táctiles y giro con giroscopio, y desde 2024 admite mods de Wolfenstein 3D y sus derivados que cambian los datos del juego, como paquetes de mapas. La versión 0.66.0 (6 de junio) añadió BioMenace, pasó a SDL3 y aprovecha el código de casco de realidad virtual de Wolfenstein 3D 1.4 y Spear of Destiny para girar con el ratón, el stick o el giroscopio mientras te desplazas en lateral."
  en: "ReflectionHLE, known for years as Reflection Keen: a set of DOS game source ports inspired by Chocolate Doom, which mimic the behavior of each original version, bugs included, and are compatible with its saved games. They share a common codebase and cover Keen Dreams; Catacomb 3-D and The Catacomb Adventure Series (Abyss, Armageddon, and Apocalypse); Wolfenstein 3D, Spear of Destiny with its mission packs, and the DOS version of Super 3-D Noah’s Ark; and BioMenace. Except for BioMenace, which builds on the reconstructed source code published by K1n9_Duk3, they’re based on the released source code of Keen Dreams, Catacomb 3-D, the Catacomb Adventure Series, and Wolfenstein 3D, which also serves Spear of Destiny and Noah’s Ark. It has a launcher that finds installations such as GOG.com’s, two controller schemes, touch controls, and gyro turning, and since 2024 it supports Wolfenstein 3D and derived mods that change the game data, such as map packs. Version 0.66.0 (June 6) added BioMenace, moved to SDL3, and uses the VR helmet code in Wolfenstein 3D 1.4 and Spear of Destiny to turn with the mouse, a stick, or the gyro while strafing."
requirements:
  es: "Los archivos de tu propia copia de cada juego, de alguna de sus versiones de DOS admitidas; el lanzador muestra qué versiones admite y qué archivos pide cada una. Sirven también versiones shareware gratuitas, como las de Wolfenstein 3D, las 1.13 y 1.20 de Keen Dreams o la 1.13 de The Catacomb Abyss. Además, Windows de 32 o 64 bits, Linux x86-64 o macOS."
  en: "The files from your own copy of each game, in one of its supported DOS versions; the launcher shows which versions are supported and which files each one needs. Free shareware releases work too, such as Wolfenstein 3D’s, Keen Dreams 1.13 and 1.20, or The Catacomb Abyss 1.13. Plus 32- or 64-bit Windows, x86-64 Linux, or macOS."
