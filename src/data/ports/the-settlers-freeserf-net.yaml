originalDeveloper: Blue Byte
year: 1994
desc:
  es: "Freeserf.net: reimplementación de The Settlers (Serf City), el juego de estrategia de Blue Byte, escrita en C# con .NET 9. Es un port y una ampliación de Freeserf, la reimplementación en C++ que también está en el catálogo: pasó todo su código, incluidos los arreglos de sus versiones 0.4 y 0.5, y le añade una IA propia. Dibuja con OpenGL a través de Silk.NET, admite pantallas panorámicas y ventanas redimensionables, y el sonido (MIDI, MOD y efectos) suena con BASS. Usa los datos de la versión de DOS o de la de Amiga, y se pueden mezclar, por ejemplo la música de Amiga con los gráficos de DOS; los textos están en inglés y alemán. Tiene las misiones, los seis tutoriales, el final del juego con las imágenes del original, mapas grandes y un multijugador en red local, todavía experimental, entre plataformas distintas, en el que se puede volver a entrar a una partida, el anfitrión guarda solo cada 10 minutos y la pausa y la velocidad se votan. Hay versiones para Windows, Linux y macOS (app universal) y otra para Android. Al proyecto le faltan algunas partes menores de la lógica de la IA. Publica versiones con frecuencia: la última es la 2.2.11 (20 de octubre). 18 de sus últimos 100 commits llevan a GitHub Copilot como coautor."
  en: "Freeserf.net: a reimplementation of The Settlers (Serf City), Blue Byte’s strategy game, written in C# on .NET 9. It’s a port and extension of Freeserf, the C++ reimplementation also in the catalog: it carried over all of its code, including the fixes from its 0.4 and 0.5 releases, and adds an AI of its own. It renders with OpenGL through Silk.NET, supports widescreen displays and resizable windows, and plays sound (MIDI, MOD, and effects) through BASS. It uses the data from the DOS or the Amiga version, and they can be mixed, for example the Amiga music with the DOS graphics; the text is in English and German. It has the missions, the six tutorials, the end of the game with the original’s pictures, large maps, and a still experimental local network multiplayer across different platforms, where players can rejoin a running game, the host autosaves every 10 minutes, and pausing and game speed are put to a vote. There are builds for Windows, Linux, and macOS (a universal app) and another for Android. Some minor parts of the AI logic are still missing. It releases often: the latest is 2.2.11 (October 20). 18 of its last 100 commits list GitHub Copilot as a co-author."
requirements:
  es: "Los archivos de datos de tu propia copia de The Settlers: de la versión de DOS, el archivo SPAx.PA de tu idioma (SPAE.PA en inglés), o de la de Amiga, las imágenes de disco .adf o los archivos ya extraídos, en el directorio de trabajo del juego. Según las notas de la versión de Android, también sirve el archivo de la demo gratuita. Además, Windows, Linux (probado en Ubuntu, con GLFW instalado) o macOS en Apple Silicon o Intel; las bibliotecas de sonido incluidas son de 64 bits."
  en: "The data files from your own copy of The Settlers: from the DOS version, the SPAx.PA file for your language (SPAE.PA for English), or from the Amiga version, the .adf disk images or the already extracted files, in the game’s working directory. According to the Android release notes, the free demo’s file works too. Plus Windows, Linux (tested on Ubuntu, with GLFW installed), or macOS on Apple silicon or Intel; the bundled sound libraries are 64-bit."
