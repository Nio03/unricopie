desc:
  es: "Port nativo para Windows de Gravity Rush Remastered de PS4 (CUSA01113). No es un emulador: el ejecutable x86-64 original del juego corre directamente en el procesador, un runtime escrito para este port sustituye a las bibliotecas del sistema de la PS4, y los gráficos pasan a Vulkan con el núcleo de vídeo de shadPS4. Con la 0.1.8 (23 de octubre de 2026) ya se jugó la historia entera de principio a fin, con sonido y partidas guardadas. Renderiza hasta 4K, con sombras de alta calidad, filtrado anisotrópico y, como antialiasing o reescalado, FXAA, TAA, FSR 3.1 o DLSS. Admite mandos por SDL3, teclado y ratón, el panel táctil y el giroscopio del DualSense, que mueve la cámara de la gravedad como en la PS4. El launcher está en inglés, italiano, francés, alemán y español, y busca e instala solo las versiones nuevas. Parte del port de God of War III y creció como fork del port de MediEvil de PS4. Solo se ha probado con tarjetas de Nvidia, y los trofeos todavía no se guardan. La primera versión de prueba salió el 17 de octubre, y la primera oficial, la 0.1.2, el 18."
  en: "A native Windows port of Gravity Rush Remastered for PS4 (CUSA01113). It isn’t an emulator: the game’s original x86-64 executable runs directly on the processor, a runtime written for this port replaces the PS4 system libraries, and the graphics go to Vulkan through the shadPS4 video core. With 0.1.8 (October 23, 2026) the whole story has been played from start to finish, with sound and saves. It renders at up to 4K, with high-quality shadows, anisotropic filtering, and FXAA, TAA, FSR 3.1, or DLSS for anti-aliasing or upscaling. It supports controllers through SDL3, keyboard and mouse, the touchpad, and the DualSense gyro, which steers the gravity camera as on the PS4. The launcher comes in English, Italian, French, German, and Spanish, and finds and installs new versions by itself. It builds on the God of War III port and grew out of a fork of the PS4 MediEvil port. It has only been tested on Nvidia graphics cards, and trophies aren’t saved yet. The first preview came out on October 17, and the first official release, 0.1.2, on the 18th."
requirements:
  es: "Tu propia copia de Gravity Rush Remastered para PS4, como carpeta del juego desempaquetada (eboot.bin, sce_module y sce_sys) que preparas con tus propias herramientas; no se incluye ningún archivo del juego. Se probó con la versión europea CUSA01113 en su versión 01.00, y los parches de resolución y de sombras solo se aplican a esa. Además, Windows 10 (1903 o posterior) u 11 de 64 bits y una tarjeta gráfica con Vulkan 1.3."
  en: "Your own copy of Gravity Rush Remastered for PS4, as an unpacked game folder (eboot.bin, sce_module, and sce_sys) that you prepare with your own tools; no game files are included. It was tested with the European release CUSA01113, version 01.00, and the resolution and shadow patches only apply to that one. Plus 64-bit Windows 10 (1903 or newer) or 11 and a graphics card with Vulkan 1.3."
tags:
