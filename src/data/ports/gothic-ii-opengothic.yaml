name: "Gothic II: Night of the Raven (OpenGothic)"
category: fan-remake
console: pc
status: fully
repo: Try/OpenGothic
originalDeveloper: Piranha Bytes
year: 2003
desc:
  es: "OpenGothic: reimplementación de código abierto de Gothic II: Night of the Raven, el RPG de Piranha Bytes, que funciona con los datos y los scripts del juego original; su meta es un cliente de Gothic completo y compatible con el juego original y sus mods. Según el proyecto, el juego ya está replicado por completo y se pueden terminar tanto la historia principal como la expansión. Está pensado para las tarjetas gráficas actuales: usa Direct3D 12 o Vulkan en Windows, Vulkan en Linux y Metal en macOS, y aprovecha los mesh shaders y el trazado de rayos cuando la tarjeta los tiene, también para la iluminación global. Reutiliza opciones del menú original para activar SSAO, niebla volumétrica y reflejos en espacio de pantalla, y deja bajar la resolución interna del 3D con la interfaz y el texto siempre a resolución completa. Admite mods de contenido (texturas, mundos, animaciones) que solo usan los scripts normales, pero no los que dependen de Ikarus/LeGo, Union, el renderizador DX11, el AST SDK o Ninja. Gothic 1 no tiene soporte oficial, aunque el proyecto acepta arreglos para él. Sus versiones son prepublicaciones; la última, la 0.92 (17 de mayo), rehízo la cámara y la IA de combate para que se parezcan más a las del original, y también las colisiones de los personajes."
  en: "OpenGothic: an open-source reimplementation of Gothic II: Night of the Raven, Piranha Bytes’ RPG, that runs on the original game’s data and scripts; its goal is a feature-complete Gothic client that’s compatible with the original game and its mods. According to the project, the game has been completely replicated, and both the main quest and the add-on can be finished. It’s designed for modern graphics cards: it uses Direct3D 12 or Vulkan on Windows, Vulkan on Linux, and Metal on macOS, and takes advantage of mesh shaders and ray tracing when the card has them, global illumination included. It reuses options from the original menu to turn on SSAO, volumetric fog, and screen-space reflections, and lets you lower the internal 3D resolution while the interface and text always render at full resolution. It supports content mods (retextures, new worlds, animations) that only use regular scripting, but not those that depend on Ikarus/LeGo, Union, the DX11 renderer, the AST SDK, or Ninja. Gothic 1 isn’t officially supported, though the project accepts fixes for it. Its releases are pre-releases; the latest, 0.92 (May 17), reworked the camera and the combat AI to be closer to the original’s, and the character collisions too."
requirements:
  es: "Tu propia copia de Gothic II: Night of the Raven instalada; encuentra sola las rutas de instalación más habituales (también la de Steam) y, si no, se le indica con el parámetro -g. En Linux, el juego se instala con Wine o Proton o se copia desde Windows. Además, Windows (Direct3D 12 o Vulkan), Linux (Vulkan; hay paquete .deb y en AUR) o macOS (Metal; las versiones para Mac las publica Mac Source Ports), con una tarjeta gráfica actual: el proyecto avisa de que no irá bien en tarjetas antiguas o de gama baja."
  en: "Your own installed copy of Gothic II: Night of the Raven; it finds the most common install paths on its own (Steam’s included) and otherwise takes the path through the -g parameter. On Linux, the game is installed with Wine or Proton or copied over from Windows. Plus Windows (Direct3D 12 or Vulkan), Linux (Vulkan; there’s a .deb package and an AUR package), or macOS (Metal; Mac builds are published by Mac Source Ports), with a modern graphics card: the project warns it won’t run well on low-end or outdated cards."
