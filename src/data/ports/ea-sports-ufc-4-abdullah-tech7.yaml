desc:
  es: "Fork comunitario de schans-arg/UFC4-PC-Port, el port nativo de la versión de PS4 para Windows, que añade soporte para las ediciones estadounidense (CUSA14204) y europea (CUSA14209), ambas con la actualización v28.00, cambios de rendimiento y estabilidad, un parche opcional del entorno de ejecución relacionado con los DLC y un launcher para configurar el port. El parche cambia lo que el port informa sobre los DLC disponibles; el README dice que no incluye ni distribuye archivos de DLC ni otros recursos del juego. Hereda del original el entorno de ejecución y el renderizador de UFC3Native 0.1.5, con licencia GPL-2.0, y el README lo trata como experimental: en las pruebas de su autor no hubo cierres, un resultado que presenta como una prueba personal limitada. Lleva 13 commits propios sobre el original. La última versión es la 1.0.1 (30 de octubre)."
  en: "A community fork of schans-arg/UFC4-PC-Port, the native Windows port of the PS4 version, that adds support for the US (CUSA14204) and European (CUSA14209) editions, both with update v28.00, performance and stability changes, an optional DLC-related runtime patch, and a launcher for configuring the port. The patch changes what the port reports about DLC availability; the README says it doesn’t include or distribute DLC files or other game assets. It inherits the original’s runtime and the UFC3Native 0.1.5 renderer, under the GPL-2.0 license, and the README treats it as experimental: no crashes were seen in its author’s testing, a result it presents as a limited personal test. It has 13 commits of its own on top of the original. The latest version is 1.0.1 (October 30)."
requirements:
  es: "Tu propio volcado extraído de EA SPORTS UFC 4 para PS4, de la edición estadounidense (CUSA14204) o europea (CUSA14209), con la actualización v28.00; el launcher pide el archivo de entrada del juego. Además, un Windows que cumpla lo que indique la versión que descargues."
  en: "Your own extracted dump of EA SPORTS UFC 4 for PS4, from the US (CUSA14204) or European (CUSA14209) edition, with update v28.00; the launcher asks for the game’s entry file. Plus a Windows system that meets what the release you download states."
