desc:
  es: "Fork comunitario de schans-arg/UFC4-PC-Port, el port nativo de la versión de PS4 para Windows, que añade soporte para las ediciones estadounidense (CUSA14204) y europea (CUSA14209), ambas con la actualización v28.00, y un launcher propio. Su README lo da por estable y jugable desde la 1.0.0 (29 de octubre), su primera versión estable. Deja usar a los luchadores de los DLC en el modo Carrera sin archivos de DLC aparte: un parche opcional cambia lo que el port informa sobre los DLC disponibles, y según el README no incluye ni distribuye archivos de DLC ni otros recursos del juego. Admite dos mandos, reduce los tirones y mejora el ritmo de fotogramas en los combates y la fluidez de los golpes, las animaciones de impacto y los efectos, y ofrece resoluciones de 720p, 2K y 4K, con ajuste automático en el modo de PS4 Pro. En el sonido, sube 3 dB el canal central de los comentarios, el árbitro y las voces de los luchadores y añade un limitador suave para que los golpes fuertes no saturen; el launcher regula el volumen, del 75 % al 200 %, además de la resolución y los gráficos. La 1.0.0 corrigió también un fallo de los combates de entrenamiento del modo Carrera y los cierres al abrirlo por primera vez y al elegir luchador. La 1.0.1 (30 de octubre) arregla cuelgues en algunos equipos y, para los más modestos, añade una resolución interna de 540p y gasta menos memoria. Al actualizar hay que copiar a mano la carpeta User/SAVEDATA de la versión anterior para no perder las partidas. Hereda del original el entorno de ejecución y el renderizador de UFC3Native 0.1.5, con licencia GPL-2.0. Sus 18 commits sobre el original solo cambian el README y añaden capturas: el código de sus cambios no está en el repositorio y llega con las descargas de cada versión."
  en: "A community fork of schans-arg/UFC4-PC-Port, the native Windows port of the PS4 version, that adds support for the US (CUSA14204) and European (CUSA14209) editions, both with update v28.00, and its own launcher. Its README calls it stable and playable since 1.0.0 (October 29), its first stable release. It lets you use DLC fighters in Career mode without separate DLC files: an optional patch changes what the port reports about DLC availability, and the README says it doesn’t include or distribute DLC files or other game assets. It supports two controllers, reduces stutter and improves frame pacing during fights and the smoothness of strikes, hit animations, and effects, and offers 720p, 2K, and 4K resolutions, with automatic handling in PS4 Pro mode. On the audio side, it boosts the center channel carrying commentary, the referee, and fighter dialogue by 3 dB and adds a soft limiter so heavy impacts don’t clip; the launcher sets the volume, from 75% to 200%, as well as the resolution and graphics. 1.0.0 also fixed a Career mode sparring bug and the crashes on first launch and when picking a fighter. 1.0.1 (October 30) fixes freezes on some systems and, for lower-end machines, adds a 540p internal resolution and uses less memory. When updating, you have to copy the User/SAVEDATA folder from the previous version by hand to keep your progress. It inherits the original’s runtime and the UFC3Native 0.1.5 renderer, under the GPL-2.0 license. Its 18 commits on top of the original only change the README and add screenshots: the code for its changes isn’t in the repository and comes with each release’s downloads."
requirements:
  es: "Tu propio volcado extraído de EA SPORTS UFC 4 para PS4, de la edición estadounidense (CUSA14204) o europea (CUSA14209), con la actualización v28.00; el launcher pide el archivo de entrada del juego. Además, un Windows que cumpla lo que indique la versión que descargues."
  en: "Your own extracted dump of EA SPORTS UFC 4 for PS4, from the US (CUSA14204) or European (CUSA14209) edition, with update v28.00; the launcher asks for the game’s entry file. Plus a Windows system that meets what the release you download states."
