desc:
  es: "D2R Metal convierte tu copia de la versión de Switch de Diablo II: Resurrected, con la expansión Reign of the Warlock, en una app nativa para Mac, iPhone y iPad. Parte de d2r-mobile, el proyecto que ideó esta forma de ejecutar juegos de Switch: el código del juego corre directamente en el chip de Apple y cada fotograma se dibuja con Metal 4; no es un emulador, ni un streaming, ni un remake. Dibuja a la resolución de tu pantalla, con MetalFX, SMAA, filtro de texturas x16, sombras de entorno y 60 fps, y con ratón y teclado reproduce la interfaz y los atajos de la versión de PC; hay controles para mando y táctiles. Juega sin conexión. Se instala con un lanzador para Mac, firmado y notarizado, que construye el juego en tu equipo a partir de tus archivos en unos 10 a 15 minutos; para iPhone y iPad se compila desde el código. Los paquetes publicados (el lanzador de 5 MB y el runtime de 7,6 MB) no llevan el juego. Publicó 8 versiones entre el 31 de octubre y el 4 de noviembre, la última la 1.4.0; 99 de sus últimos 100 commits llevan a Claude como coautor."
  en: "D2R Metal turns your copy of the Switch version of Diablo II: Resurrected, with the Reign of the Warlock expansion, into a native app for Mac, iPhone, and iPad. It builds on d2r-mobile, the project that devised this way of running Switch games: the game’s code runs directly on the Apple chip and every frame is drawn with Metal 4; it is not an emulator, a stream, or a remake. It draws at your screen’s resolution, with MetalFX, SMAA, x16 texture filtering, environment shadows, and 60 fps, and with mouse and keyboard it reproduces the PC version’s interface and shortcuts; there are controller and touch controls. It plays offline. It installs through a Mac launcher, signed and notarized, that builds the game on your machine from your files in about 10 to 15 minutes; for iPhone and iPad you build from source. The published packages (the 5 MB launcher and the 7.6 MB runtime) don’t contain the game. It published 8 releases between October 31 and November 4, the latest being 1.4.0; 99 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de la versión de Switch de Diablo II: Resurrected con Reign of the Warlock, actualizada a la 1.0.34.0 y volcada de tu propia consola: los paquetes (NSP o XCI) del juego base y de la actualización con tu prod.keys, o una carpeta ya extraída. Además, un Mac con Apple silicon (M1 o posterior) y macOS 27, o un iPhone o iPad con iOS o iPadOS 27 (A17 Pro o chip M; con un pack de dispositivos antiguos, A14 a A16), y unos 30 GB libres durante la instalación."
  en: "Your own copy of the Switch version of Diablo II: Resurrected with Reign of the Warlock, updated to 1.0.34.0 and dumped from your own console: the base game and update packages (NSP or XCI) with your prod.keys, or an already extracted folder. Plus an Apple silicon Mac (M1 or later) on macOS 27, or an iPhone or iPad on iOS or iPadOS 27 (A17 Pro or M chip; with a legacy device pack, A14 to A16), and about 30 GB free during installation."
