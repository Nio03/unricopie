desc:
  es: "Port de Paper Mario 64 hecho por Harbour Masters, los de Ship of Harkinian, construido sobre la decompilación Paper Mario DX. Es un port de una decompilación, no una recompilación estática, a diferencia del otro proyecto de Paper Mario del catálogo, que sí recompila el binario. Incluye un comprobador para verificar que tu volcado es compatible antes de empezar."
  en: "Paper Mario 64 port by Harbour Masters, the Ship of Harkinian team, built on the Paper Mario DX decompilation. It’s a decomp port, not a static recompilation, unlike the other Paper Mario project in the catalog, which does recompile the binary. A compatibility checker lets you verify your dump is supported before you start."
