name: "Ultima Underworld / Ultima Underworld II (UnderworldGodot)"
games: [ultima-underworld-the-stygian-abyss, ultima-underworld-ii-labyrinth-of-worlds]
category: fan-remake
console: dos
status: experimental
repo: hankmorgan/UnderworldGodot
originalDeveloper: Blue Sky Productions / Looking Glass Technologies
year: 1992
desc:
  es: "UnderworldGodot: recreación del motor de Ultima Underworld y Ultima Underworld II en Godot, escrita en C#, que sustituye al proyecto anterior basado en Unity y reinicia el código para que funcione más como los juegos originales. Se apoya en años de ingeniería inversa de otros fans, a los que acredita. Su autor lo define como prealfa, «un visor de mapas interactivo con mucha lógica de juego implementada», y avisa de que no se espere poder jugarlo con normalidad. Ya tiene conversaciones completas, casi todos los disparadores y trampas, trueque, inventario, hechizos con la lógica original, combate cuerpo a cuerpo y a distancia, IA y búsqueda de caminos de los PNJ, creación de personaje, subida de nivel, automapa con notas, escenas, natación, muerte y resurrección, voces y efectos de sonido, y música sintetizada en tiempo real a partir de los XMI originales con una MT-32 o CM-32L emulada (con tus propias ROM), una SoundFont libre incluida o síntesis FM. Carga partidas por completo, pero el guardado es parcial. Publica compilaciones de prueba para Windows y Linux, la última, la 31, del 20 de junio; en macOS con Apple Silicon se compila y funciona. Su política descarta recursos reescalados o generados con IA; dos de sus últimos 100 commits llevan a Claude o a Cursor como coautor."
  en: "UnderworldGodot: an engine recreation of Ultima Underworld and Ultima Underworld II in Godot, written in C#, that supersedes the earlier Unity-based project and reboots the code to work more like the original games did. It builds on years of reverse engineering by other fans, whom it credits. Its author calls it pre-alpha, “an interactive map viewer with a lot of game logic implemented,” and warns not to expect it to be playable as normal. It already has full conversations, almost all triggers and traps, bartering, inventory, spells with the original logic, melee and missile combat, NPC AI and pathfinding, character creation, leveling up, an automap with notes, cutscenes, swimming, death and resurrection, speech and sound effects, and music synthesized in real time from the original XMI files through an emulated MT-32 or CM-32L (with your own ROMs), a bundled free SoundFont, or FM synthesis. Loading saves is fully supported, saving only partly. It publishes test builds for Windows and Linux, the latest, build 31, on June 20; on Apple silicon macOS it builds and runs. Its policy rules out AI-upscaled or AI-generated assets; two of its last 100 commits list Claude or Cursor as a co-author."
requirements:
  es: "Los archivos de tu propia copia de Ultima Underworld, de Ultima Underworld II o de los dos: la carpeta del juego con las subcarpetas DATA, CRIT, CUTS y SOUND (en las versiones de GOG, el archivo game.gog es una imagen ISO que hay que abrir o extraer antes). Para la música con MT-32 o CM-32L, las ROM de tu propio sintetizador. Además, Windows o Linux; en macOS, compilándolo con Godot 4.3 para .NET."
  en: "The files from your own copy of Ultima Underworld, Ultima Underworld II, or both: the game folder with the DATA, CRIT, CUTS, and SOUND subfolders (in the GOG versions, the game.gog file is an ISO image you need to open or extract first). For MT-32 or CM-32L music, the ROMs from your own synthesizer. Plus Windows or Linux; on macOS, by building it with the .NET version of Godot 4.3."
