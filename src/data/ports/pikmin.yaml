desc:
  es: "Open Nectar: port nativo y de código abierto (CC0) de Pikmin para Linux y Windows, construido sobre la decompilación projectPiki. Ejecuta el código del juego directamente en el sistema anfitrión y traduce el GX de GameCube. Casi todo el juego se puede jugar de principio a fin, a 30, 60 o 120 fps, con el motor de audio JAudio original sobre un DSP por software, un modo panorámico real (el HUD y el descarte de geometría se adaptan a 16:9, sin estirar la imagen), los dos discos comerciales (el estadounidense Rev 1 y el europeo en cinco idiomas) y posprocesado opcional."
  en: "Open Nectar: a native, open-source (CC0) port of Pikmin for Linux and Windows, built on the projectPiki decompilation. It runs the game code directly on the host and translates GameCube GX. Most of the game is playable from start to finish, at 30, 60, or 120 fps, with the original JAudio engine on a software DSP, true widescreen (HUD and culling at 16:9, not stretched), both retail discs (US Rev 1 and the European release in five languages), and optional post-processing."
requirements:
  es: "Tu propio disco de Pikmin (GameCube): el estadounidense Rev 1 o el europeo."
  en: "Your own Pikmin disc (GameCube): US Rev 1 or European."
