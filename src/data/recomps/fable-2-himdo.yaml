name: Fable II (himdo)
console: x360
status: playable
repo: himdo/Fable-2-Recomp
originalDeveloper: Lionhead Studios
year: 2008
toolchain: ReXGlue
desc:
  es: "Recompilación de Fable II sobre el SDK de ReXGlue: el código PowerPC se traduce a C++ al compilar. Es un proyecto distinto del otro recomp de Fable II que ya está en el catálogo, que usa XenonRecomp. Su autor cuenta que lo empezó para medir de qué era capaz una IA local y de código abierto (Qwen3), que en una hora consiguió que el juego arrancara, y que el resto fue ensayo y error humano hasta poder completarlo. Añade tasa de fotogramas desbloqueada, teclado y ratón, y scripts en Lua. 15 de sus últimos 100 commits llevan a Claude como coautor."
  en: "Recompilation of Fable II on the ReXGlue SDK: the PowerPC code is translated to C++ at build time. A separate project from the other Fable II recomp already in the catalog, which uses XenonRecomp. Its author says they started it to gauge what a local, open-source AI (Qwen3) could do, that it got the game booting within an hour, and that the rest was human trial and error until it could be completed. It adds an uncapped frame rate, keyboard and mouse support, and Lua scripting. 15 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Fable II para Xbox 360 (edición GOTY estadounidense o europea, título 4D5307F1)."
  en: "Your own copy of Fable II for Xbox 360 (US or European GOTY edition, title 4D5307F1)."
tags:
  - powerpc
  - ai-assisted
