originalDeveloper: "EA Sports"
year: 2009
toolchain: ReXGlue
desc:
  es: "Port nativo para Windows y Linux de 3 on 3 NHL Arcade (Xbox Live Arcade, 2009), recompilado estáticamente desde el ejecutable de Xbox 360 con ReXGlue. Funciona sin emulador, con resoluciones y cuadros por segundo más altos, soporte ultrapanorámico (en desarrollo) y juego en línea. Incluye un lanzador con ajustes de pantalla (relaciones 16:9, 21:9 y 32:9, límite de 60 a 240 cuadros por segundo o sin límite), de gráficos (resolución interna de 720p a 2160p, filtrado anisotrópico, MSAA 2× nativo) y del juego, y un modo en línea con un servidor comunitario que retransmite el tráfico para no tener que abrir puertos; hasta tres jugadores de campo y un portero por equipo. Los paquetes son portátiles y la última versión es la 0.3.1 (28 de octubre)."
  en: "A native Windows and Linux port of 3 on 3 NHL Arcade (Xbox Live Arcade, 2009), statically recompiled from the Xbox 360 executable with ReXGlue. It runs without an emulator, at higher resolutions and frame rates, with ultrawide support (in progress) and online play. It includes a launcher with display settings (16:9, 21:9, and 32:9 aspect ratios, a frame-rate cap from 60 to 240 or unlocked), graphics settings (internal resolution from 720p to 2160p, anisotropic filtering, native 2× MSAA), and game settings, and an online mode with a community server that relays traffic so no port forwarding is needed; up to three skaters and a goalie per team. The packages are portable and the latest release is 0.3.1 (October 28)."
requirements:
  es: "Tu propia copia de 3 on 3 NHL Arcade para Xbox 360: el paquete STFS (un archivo de nombre hexadecimal de 40 caracteres, ID de título 58410975) o los archivos extraídos con default.xex, en la carpeta game. Windows 10 u 11 con una tarjeta Direct3D 12, o un Linux reciente (glibc 2.38) con controlador Vulkan; la CPU debe tener AVX2."
  en: "Your own copy of 3 on 3 NHL Arcade for Xbox 360: the STFS package (a file with a 40-character hexadecimal name, title ID 58410975) or the extracted files with default.xex, in the game folder. Windows 10 or 11 with a Direct3D 12 card, or a recent Linux (glibc 2.38) with a Vulkan driver; the CPU must support AVX2."
