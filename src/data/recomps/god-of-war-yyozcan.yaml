desc:
  es: "Tobiichi Port: port nativo para Linux y Windows de la versión estadounidense de PS2 (SCUS-97399), por recompilación estática con PS2Recomp. El código del juego (unas 6400 funciones) se traduce a C++, y el resto del hardware se sustituye por código nativo: los programas de la VU1 y los módulos del IOP se compilan de antemano, y el GS se dibuja con OpenGL a resolución interna de 1x a 4x. Reúne el trabajo de Waffle565 (renderizador, IOP, VU1, vídeos y sonido) y de KIexster (la cadena de recompilación). Un instalador extrae tu disco, genera el código, compila el juego y el launcher, y lo optimiza jugando solo durante cuatro minutos; la primera vez tarda de 30 a 90 minutos. Añade pantalla panorámica real (16:9, 16:10 y 21:9) con los vídeos panorámicos del propio juego, filtros de imagen y FXAA, teclado y ratón reasignables con fijación de objetivo, un combate algo más ágil, un menú de trucos y un contador de fotogramas. La lógica del juego va a 60 fps como en la consola. 11 de sus 14 commits llevan a Claude como coautor."
  en: "Tobiichi Port: a native Linux and Windows port of the US PS2 release (SCUS-97399), made by static recompilation with PS2Recomp. The game’s code (about 6,400 functions) is translated to C++, and the rest of the hardware is replaced with native code: the VU1 programs and the IOP modules are compiled ahead of time, and the GS is drawn with OpenGL at 1x to 4x internal resolution. It brings together the work of Waffle565 (renderer, IOP, VU1, movies, and sound) and KIexster (the recompilation pipeline). An installer extracts your disc, generates the code, builds the game and the launcher, and optimizes it by playing by itself for four minutes; the first time takes 30 to 90 minutes. It adds true widescreen (16:9, 16:10, and 21:9) with the game’s own widescreen movies, image filters and FXAA, remappable keyboard and mouse with lock-on, slightly more responsive combat, a cheat menu, and an FPS counter. The game logic runs at 60 fps, as on the console. 11 of its 14 commits list Claude as a co-author."
requirements:
  es: "Tu propia imagen de disco estadounidense de God of War para PS2 (SCUS-97399) en .iso. Además, Windows 10 u 11 de 64 bits (con un procesador con AVX2) o Linux, 8 GB de RAM, una tarjeta gráfica con OpenGL 4.3 y unos 20 GB libres."
  en: "Your own US God of War PS2 disc image (SCUS-97399) as an .iso. Plus 64-bit Windows 10 or 11 (with an AVX2 CPU) or Linux, 8 GB of RAM, a graphics card with OpenGL 4.3, and about 20 GB of free space."
