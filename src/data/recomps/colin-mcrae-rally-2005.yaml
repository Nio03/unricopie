desc:
  es: "Port nativo no oficial a PC de la versión de la Xbox original de Colin McRae Rally 2005, con opciones gráficas ampliadas y otras mejoras, hecho con Xbox XBE Recomp; existe una versión de PC, pero sin soporte de mandos modernos ni de 64 bits. Una superposición de ajustes (F1) cambia el modo de pantalla, la resolución, el filtro anisótropo (hasta 16x), el antialiasing (FXAA o SMAA), el brillo y el ritmo de fotogramas, fijo a 60. Admite mandos de Xbox, PlayStation y Switch, paquetes de texturas en PNG y archivos de reemplazo. La primera vez que se arranca compila el código del juego en tu equipo; la única versión, la v0.1.0-beta (28 de octubre), es un zip de unos 69 MB. Sus 70 commits llevan a Claude como coautor."
  en: "An unofficial native PC port of the original Xbox version of Colin McRae Rally 2005, with extended graphics options and other enhancements, made with Xbox XBE Recomp; a PC version exists, but without modern controller support or 64-bit support. A settings overlay (F1) changes display mode, resolution, anisotropic filtering (up to 16x), anti-aliasing (FXAA or SMAA), brightness, and the frame pacing, locked at 60. It supports Xbox, PlayStation, and Switch controllers, PNG texture packs, and file overrides. The first start compiles the game’s code on your PC; the only release, v0.1.0-beta (October 28), is a zip of about 69 MB. All 70 of its commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Colin McRae Rally 2005 para la Xbox original, solo la de EE. UU. (NTSC), con default.xbe de SHA-1 fea919b18610e640aa0a40e41c566a4a453eaccb, como imagen ISO o archivos extraídos en la carpeta assets; la versión de PC no sirve. Windows 10 de 64 bits y una tarjeta gráfica con Direct3D 12."
  en: "Your own copy of Colin McRae Rally 2005 for the original Xbox, the US (NTSC) one only, with a default.xbe of SHA-1 fea919b18610e640aa0a40e41c566a4a453eaccb, as an ISO image or extracted files in the assets folder; the PC version doesn’t work. 64-bit Windows 10 and a Direct3D 12 graphics card."
