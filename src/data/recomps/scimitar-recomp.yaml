desc:
  es: "Recompilación estática de los juegos de Ubisoft de 32 bits para Intel hechos con el motor Scimitar (Anvil) a código nativo arm64 para Mac con Apple silicon, iPhone e iPad: el ejecutable de cada juego se traduce, función por función, a C++ y se compila junto con sustitutos nativos de todo lo que el juego esperaba del sistema, con un renderizador en Metal. Empezó por las versiones de Mac de Assassin’s Creed II (1.0.1) y Brotherhood (1.0.0), apps de Intel de 32 bits que macOS no ejecuta desde Catalina (2019) y que ningún Mac con Apple silicon pudo ejecutar; sus tablas de símbolos completas fueron la clave. Las dos se pueden jugar en Mac y en iPhone o iPad (allí, con mando o con teclado y ratón): AC2 desde el principio hasta Florencia y Brotherhood hasta la llegada a Roma, sin multijugador. Después llegaron las versiones de Windows de Assassin’s Creed (el comienzo y el tutorial del Animus), Revelations (los menús y la isla del Animus) y Prince of Persia de 2008 (hasta el primer cañón), con una capa de Win32 y Direct3D 9 sobre Metal. Añade cualquier proporción de pantalla, distancia de dibujado hasta 6x, sombras de 4096 × 4096 y filtrado anisótropo de 16x. No hay versiones publicadas: se compila en un Mac con Xcode. Las pruebas del repositorio incluyen unos 2 KB de la función de descompresión LZO (una librería libre) sacados del ejecutable de AC2. El README dice que el proyecto está hecho «100% vibe-coded»: todo su código lo escribió Claude Code, y sus últimos 100 commits llevan a Claude como coautor."
  en: "A static recompilation of Ubisoft’s 32-bit Intel games on the Scimitar (Anvil) engine into native arm64 code for Apple silicon Macs, iPhone, and iPad: each game’s executable is translated, function by function, into C++ and compiled together with native replacements for everything the game expected from the system, with a Metal renderer. It started with the Mac versions of Assassin’s Creed II (1.0.1) and Brotherhood (1.0.0), 32-bit Intel apps that macOS hasn’t run since Catalina (2019) and that no Apple silicon Mac could ever run; their full symbol tables were the key. Both are playable on Mac and on iPhone or iPad (there, with a controller or keyboard and mouse): AC2 from the start to Florence, and Brotherhood up to the arrival in Rome, without multiplayer. The Windows versions of Assassin’s Creed (the opening and the Animus tutorial), Revelations (the menus and Animus Island), and 2008’s Prince of Persia (up to the first canyon) came later, with a Win32 and Direct3D 9 layer on Metal. It adds any screen shape, draw distance up to 6x, 4096 × 4096 shadows, and 16x anisotropic filtering. There are no releases: you build it on a Mac with Xcode. The repository’s tests include about 2 KB of the LZO decompression routine (a free library) taken from the AC2 executable. The README calls the project “100% vibe-coded”: all of its code was written by Claude Code, and its last 100 commits list Claude as a co-author."
requirements:
  es: "Tus propias copias: las versiones de Mac de Steam de Assassin’s Creed II (la 1.0.1, que se descarga desde la consola de Steam con el comando que da el README; la instalación normal trae la 1.0.0, que no sirve) y de Brotherhood; y, para los de Windows, Assassin’s Creed de Ubisoft Connect, Revelations de Steam y Prince of Persia de su versión de Mac (Cider), que trae el ejecutable de Windows. Un Mac con Apple silicon (los Mac con Intel no sirven), Xcode y los paquetes de Homebrew que pide el README (cmake y zydis; ffmpeg para los vídeos)."
  en: "Your own copies: the Steam Mac versions of Assassin’s Creed II (1.0.1, downloaded from the Steam console with the command in the README; a normal install brings 1.0.0, which doesn’t work) and Brotherhood; and, for the Windows ones, Assassin’s Creed from Ubisoft Connect, Revelations from Steam, and Prince of Persia from its Mac (Cider) release, which carries the Windows executable. An Apple silicon Mac (Intel Macs aren’t supported), Xcode, and the Homebrew packages the README lists (cmake and zydis; ffmpeg for the videos)."
