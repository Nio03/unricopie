desc:
  es: "Port nativo para Windows y Linux por recompilación estática con N64Recomp, N64ModernRuntime y RT64, pensado sobre todo para jugar en panorámico de verdad: dibuja la vista 16:9 o más ancha a la resolución de tu pantalla, con los jugadores y el balón visibles hasta los bordes y el cielo del estadio extendido, sin bandas negras, y deja el marcador en su sitio original. Acepta la versión estadounidense Rev 1 y las dos europeas, que desde la 1.2 (18 de octubre) traen sus idiomas, la Copa Internacional y su dificultad propia, y corren a 50 Hz como en una consola PAL. Tiene MSAA 4x, partidas del Controller Pak compatibles con Project64, un launcher que elige la ROM y mando o teclado; todavía no hay vibración ni reasignación de controles. Sus 8 commits llevan a Claude como coautor."
  en: "A native Windows and Linux port by static recompilation with N64Recomp, N64ModernRuntime, and RT64, built above all for true widescreen: it draws the 16:9 or wider view at your screen’s resolution, with the players and the ball visible right to the edges and the stadium sky extended, no black bars, and the HUD left in its original layout. It accepts the US Rev 1 release and both European ones, which since 1.2 (October 18) bring their own languages, the International Cup, and their harder single-player game, and run at 50 Hz like on a PAL console. It has 4x MSAA, Project64-compatible Controller Pak saves, a launcher that picks the ROM, and controller or keyboard input; there’s no rumble or control remapping yet. All 8 of its commits list Claude as a co-author."
requirements:
  es: "Tu propia ROM de International Superstar Soccer 2000: la estadounidense Rev 1 o cualquiera de las dos europeas (en .z64, .n64 o .v64). Además, Windows 10 u 11 de 64 bits con Direct3D 12 o Vulkan, o Linux (glibc 2.34 o posterior) con Vulkan."
  en: "Your own International Superstar Soccer 2000 ROM: the US Rev 1 or either European release (as .z64, .n64, or .v64). Plus 64-bit Windows 10 or 11 with Direct3D 12 or Vulkan, or Linux (glibc 2.34 or later) with Vulkan."
