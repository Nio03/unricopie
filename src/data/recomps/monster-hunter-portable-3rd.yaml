name: Monster Hunter Portable 3rd HD
games: [monster-hunter-portable-3rd]
console: psp
status: experimental
repo: TeamGDB/Yakumo
originalDeveloper: Capcom
year: 2011
desc:
  es: "Yakumo: port nativo por recompilación estática, con Vulkan y SDL3. El código de PSP del juego se traduce por adelantado a C++, se compila para tu máquina y funciona sobre una reimplementación del software de sistema de la PSP. Su README es tajante en los dos sentidos: no es un emulador, porque no hay intérprete ni JIT en su núcleo, y tampoco es una decompilación. En YouTube, Video Game Esoterica lo presentó como el primer recomp de PSP terminado al 100 %. 66 de sus últimos 100 commits llevan a Codex como coautor."
  en: "Yakumo: a native port by static recompilation, with Vulkan and SDL3. The game’s PSP code is translated ahead of time into C++, compiled for your machine, and run on a reimplementation of the PSP system software. Its README is emphatic in both directions: it isn’t an emulator, since there’s no interpreter or JIT at its core, and it isn’t a decompilation either. On YouTube, Video Game Esoterica covered it as the first 100% complete PSP recomp. 66 of its last 100 commits list Codex as a co-author."
requirements:
  es: "Los archivos de tu propia copia de Monster Hunter Portable 3rd HD Ver. (NPJB-40001). El instalador comprueba la copia y solo acepta la versión original."
  en: "The files from your own copy of Monster Hunter Portable 3rd HD Ver. (NPJB-40001). The installer checks your copy and accepts only the original release."
