name: "Burnout 3: Takedown (gomesvieira)"
console: ps2
status: playable
repo: danielgomesvieira2000/burnout3-pc
originalDeveloper: Criterion Games
year: 2004
toolchain: ps2-port-engine
desc:
  es: "Port nativo para Windows de la versión norteamericana de PS2, distinto de los recomps de la versión de Xbox que ya están en el catálogo. Está hecho con ps2-port-engine, la herramienta del mismo autor, que descompila el programa del juego a C++, comprueba su comportamiento contra el código máquina original y lo compila para x64, con un entorno que hace de EE, IOP, sonido, VU y GS, dibujado con Vulkan. El código del juego se genera en tu equipo a partir de tu imagen de disco y no se sube al repositorio. Funciona el juego entero: menús, carreras, modo choque, la carrera World Tour, partidas guardadas, sonido y música. Añade resolución de hasta 4 veces la de la PS2, panorámico con el HUD en su sitio y un editor del HUD, 60 o 120 fps o la frecuencia de tu pantalla (hasta 240) sin que el juego vaya más rápido, FXAA, SMAA o SSAA 2x, opciones de bloom, desenfoque de movimiento, sombras y partículas, controles reasignables con los iconos de tus teclas o de un mando de PlayStation o Xbox, ratón en los menús, vibración, pantalla dividida para dos jugadores, juego en red local con el modo en línea del propio juego, tus canciones en MP3 en EA Trax y paquetes de texturas de PCSX2. Un menú PC SETTINGS ocupa el lugar de ONLINE, con el menú de desarrollador oculto y una página de MODS que trae parches de PCSX2 de Nehalem, como km/h, modo espejo, sin tráfico o Crash Breaker en todos los modos. Es una alfa: el juego en línea por los servidores de EA no funciona y la pantalla dividida vertical aún coloca mal parte del HUD. El README remite a un zip para Windows en la página de versiones, pero ahora mismo no hay ninguna publicada; la última etiqueta es la 0.6.1-alpha (21 de octubre). Su autor declara que el port lo escribe Claude Code bajo su dirección, y sus últimos 100 commits llevan a Claude como coautor."
  en: "A native Windows port of the North American PS2 release, separate from the Xbox version recomps already in the catalog. It’s built with ps2-port-engine, the same author’s tool, which decompiles the game’s program to C++, checks its behavior against the original machine code, and compiles it for x64, with a runtime standing in for the EE, IOP, sound, VUs, and GS, drawn with Vulkan. The game’s code is generated on your machine from your disc image and never committed to the repository. The whole game works: menus, races, crash mode, the World Tour career, saves, sound, and music. It adds resolution up to 4x the PS2’s, widescreen with the HUD kept in place and a HUD editor, 60 or 120 fps or your display’s refresh rate (up to 240) without speeding up the game, FXAA, SMAA, or SSAA 2x, bloom, motion blur, shadow, and particle options, rebindable controls with button prompts for your keys or a PlayStation or Xbox controller, a mouse in the menus, rumble, two-player splitscreen, local network play through the game’s own online mode, your own MP3s in EA Trax, and PCSX2 texture packs. A PC SETTINGS menu takes ONLINE’s place, with the hidden developer menu and a MODS page that brings in Nehalem’s PCSX2 patches, such as km/h, mirror mode, no traffic, or Crash Breaker in every mode. It’s an alpha: online play through EA’s servers doesn’t work, and vertical splitscreen still misplaces part of the HUD. The README points to a Windows zip on the releases page, but none is published right now; the latest tag is 0.6.1-alpha (October 21). Its author states that the port is written by Claude Code under their direction, and its last 100 commits list Claude as a co-author."
requirements:
  es: "Una imagen de disco de tu propia copia norteamericana (NTSC-U) de Burnout 3: Takedown para PS2, SLUS-21050; las demás regiones todavía no funcionan. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Vulkan 1.3 (GeForce GTX 900, Radeon RX 400, Intel UHD 600 o posteriores) y un procesador con AVX2, o uno más antiguo con la versión SSE4 que se incluye. Para compilarlo, Visual Studio 2022 con C++, Python 3.10 o posterior y, si quieres, LLVM."
  en: "A disc image of your own North American (NTSC-U) copy of Burnout 3: Takedown for PS2, SLUS-21050; other regions don’t work yet. Plus 64-bit Windows 10 or 11, a graphics card with Vulkan 1.3 (GeForce GTX 900, Radeon RX 400, Intel UHD 600, or newer), and a CPU with AVX2, or an older one with the bundled SSE4 build. To build it, Visual Studio 2022 with C++, Python 3.10 or later, and, optionally, LLVM."
