originalDeveloper: Valve
year: 2011
desc:
  es: "Recompilación estática de las versiones de Linux de Portal 2 y Half-Life 2 (con Episode One, Episode Two y Lost Coast) a aplicaciones nativas para Mac con Apple Silicon y para iPhone, sin emulador, Wine ni Rosetta: cada función x86 de los módulos del juego (engine.so, client.so…) se traduce a C y se compila para ARM64 junto a un runtime que implementa lo que importan los binarios (libc, hilos, SDL2, OpenGL, Direct3D 9 y Steam). Las llamadas a Steam pasan a la libsteam_api.dylib oficial de Valve para arm64, sin emular Steam. Dibuja por defecto con Metal a través de mtld3d, un Direct3D 9 nativo sobre Metal, con OpenGL de reserva; en un M3 Pro, una escena va a 122 fps con Metal y a 81 con OpenGL (2560×1440, MSAA 4x). El README da Portal 2 por totalmente jugable en Mac y en un iPhone 15 Pro Max, a 60 fps estables, con controles táctiles y portales que se disparan tocando la parte de atrás del teléfono. Funcionan los mandos físicos, y hay cooperativo en red local en el que un Mac hace de anfitrión y se une un iPhone u otra copia en el mismo Mac (solo se ha comprobado la conexión y la carga del mapa). Half-Life 2 es experimental: se ha jugado unas horas en Mac, a 120 fps con Metal en un M3 Pro, y los episodios y Lost Coast cargan sus primeros mapas sin haberse jugado enteros. El instalador Natif Installer o el script setup.sh lo compilan en tu Mac a partir de tus copias de Steam, unos 10 minutos para Portal 2 y de 10 a 20 para Half-Life 2, y descargan la libsteam_api.dylib de Valve (de Steamworks.NET); para iPhone, setup.sh --ios firma e instala las aplicaciones y copia los datos del juego. La v0.3.0 (8 de noviembre) es la última de 2 versiones del instalador. El README dice que agentes de IA (Claude Code, de Anthropic, y Codex, de OpenAI) escribieron la mayor parte del código bajo la dirección del autor. 88 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A static recompilation of the Linux versions of Portal 2 and Half-Life 2 (with Episode One, Episode Two, and Lost Coast) into native apps for Apple silicon Macs and the iPhone, with no emulator, Wine, or Rosetta: every x86 function in the game’s modules (engine.so, client.so…) is translated to C and compiled for ARM64 along with a runtime that implements what the binaries import (libc, threads, SDL2, OpenGL, Direct3D 9, and Steam). Steam calls go to Valve’s official arm64 libsteam_api.dylib, with no Steam emulation. It renders with Metal by default through mtld3d, a native Direct3D 9 on Metal, with OpenGL as a fallback; on an M3 Pro, a scene runs at 122 fps with Metal and 81 with OpenGL (2560×1440, 4x MSAA). The README calls Portal 2 fully playable on Mac and on an iPhone 15 Pro Max, at a steady 60 fps, with touch controls and portals fired by tapping the back of the phone. Physical controllers work, and there’s local network co-op where a Mac hosts and an iPhone or a second copy on the same Mac joins (only the connection and the map load have been checked). Half-Life 2 is experimental: it has been played for a few hours on Mac, at 120 fps with Metal on an M3 Pro, and the episodes and Lost Coast load their first maps without having been played through. The Natif Installer app or the setup.sh script builds it on your Mac from your Steam copies, in about 10 minutes for Portal 2 and 10 to 20 for Half-Life 2, and downloads Valve’s libsteam_api.dylib (from Steamworks.NET); for the iPhone, setup.sh --ios signs and installs the apps and copies the game data. v0.3.0 (November 8) is the latest of 2 installer releases. The README says AI coding agents (Anthropic’s Claude Code and OpenAI’s Codex) wrote most of the code under the author’s direction. 88 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tus propias copias de Steam de Portal 2 (la carpeta del juego, que también puede ser la de Windows, y sus binarios de Linux, que se bajan desde la consola de Steam con download_depot 620 661, unos 90 MB) o de Half-Life 2 instalado en el Mac (con hl2_complete, y sus binarios de Linux con download_depot 220 224, unos 320 MB), y Steam abierto con la cuenta dueña del juego para jugar en Mac. Un Mac con Apple Silicon y macOS 13 o posterior con las herramientas de línea de comandos de Xcode. Para el iPhone, Xcode con tu Apple ID (una cuenta gratuita obliga a reinstalar cada 7 días), xcodegen, cmake y ninja de Homebrew y un iPhone con iOS 17 o posterior en modo desarrollador, con unos 12 GB libres."
  en: "Your own Steam copies of Portal 2 (the game folder, which can also be the Windows one, plus its Linux binaries, fetched from the Steam console with download_depot 620 661, about 90 MB) or of Half-Life 2 installed on the Mac (with hl2_complete, plus its Linux binaries with download_depot 220 224, about 320 MB), and Steam running with the account that owns the game to play on Mac. An Apple silicon Mac on macOS 13 or newer with the Xcode command line tools. For the iPhone, Xcode with your Apple ID (a free account means reinstalling every 7 days), Homebrew’s xcodegen, cmake, and ninja, and an iPhone on iOS 17 or newer in Developer Mode, with about 12 GB free."
