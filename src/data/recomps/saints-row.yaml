name: Saints Row
console: x360
status: fully
repo: whompay/SaintsReborn
originalDeveloper: Volition
year: 2006
toolchain: ReXGlue
desc:
  es: "Saints Reborn (antes SaintsRowPC): port nativo no oficial para Windows por recompilación estática con el SDK de ReXGlue, que traduce a C++ todo el código PowerPC del juego y reimplementa el núcleo, la GPU (sobre Direct3D 12), el sonido y la entrada de la Xbox 360. El repositorio no trae nada del juego: el instalador toma tu imagen o tu carpeta del juego, descarga las herramientas de compilación (unos 1,5 GB, sin Visual Studio) y compila el juego en tu equipo en 10 a 60 minutos; las actualizaciones solo recompilan lo que cambió. Según su autor, se juega de principio a fin: los vídeos, el editor de personaje, la historia entera, las misiones secundarias y el mundo abierto, con sonido. Trae cooperativo para la historia y el mundo abierto por red local, por IP directa o en línea con un código, y partidas en línea (Quick Match, Custom Match, clasificatorias) a través de Epic Online Services; el 19 de octubre la cooperativa pasó a admitir hasta 12 jugadores en un mismo mundo. Con el mod de 60 fps incluido va a 60 fps o más (tope de 30, 60, 90 o 120, o sin tope), dibuja por defecto al doble de la resolución original y tiene un menú de opciones propio para la escala de resolución, las sombras y la sensibilidad del ratón. El teclado y el ratón siguen a Saints Row 2 para PC, los iconos cambian entre mando y teclado, y la V activa una vista en primera persona. Incluye Whompay’s Mod Loader, con mods que sustituyen archivos, ejecutan guiones Lua o enganchan código C/C++ al juego. La última versión, la 1.2.2, es del 2 de octubre."
  en: "Saints Reborn (formerly SaintsRowPC): an unofficial native Windows port by static recompilation with the ReXGlue SDK, which translates all of the game’s PowerPC code to C++ and reimplements the Xbox 360 kernel, GPU (on Direct3D 12), audio, and input. The repository holds nothing from the game: the installer takes your disc image or game folder, downloads the build tools (about 1.5 GB, no Visual Studio needed), and builds the game on your machine in 10 to 60 minutes; updates only rebuild what changed. According to its author, it’s playable from start to finish: the intro videos, the character creator, the whole story, side missions, and free roam, with sound. It has co-op for the story and free roam over LAN, by direct IP, or online with a join code, and online matches (Quick Match, Custom Match, ranked) through Epic Online Services; on October 19, co-op grew to up to 12 players in one shared world. With the bundled 60 fps mod it runs at 60 fps and above (capped at 30, 60, 90, or 120, or uncapped), it renders at twice the original resolution by default, and it has its own options menu for resolution scale, shadows, and mouse sensitivity. Keyboard and mouse follow Saints Row 2 on PC, the prompts switch between controller and keyboard, and V toggles a first-person view. It includes Whompay’s Mod Loader, with mods that replace files, run Lua scripts, or hook C/C++ code into the game. The latest version, 1.2.2, came out on October 2."
requirements:
  es: "Tu propio disco de Saints Row para Xbox 360, como imagen .iso o como carpeta con default.xex y packfiles; solo sirve la versión del disco con la que se hizo el port, y el instalador avisa si tu default.xex es distinto. Además, Windows 10 u 11 de 64 bits y una tarjeta gráfica con Direct3D 12; para la compilación manual, unos 15 GB libres y 16 GB de RAM. En procesadores sin AVX2 se compila una versión compatible."
  en: "Your own Saints Row Xbox 360 disc, as an .iso image or a folder with default.xex and packfiles; only the disc version the port was made with is supported, and the installer warns if your default.xex differs. Plus 64-bit Windows 10 or 11 and a Direct3D 12 graphics card; a manual build takes about 15 GB of free space and 16 GB of RAM. On CPUs without AVX2, a compatible build is made."
