desc:
  es: "Ports nativos y no oficiales de 31 recreativas de Capcom, de la placa CPS-2 y algunas de CPS-1, para Windows, macOS, Linux (también la Steam Deck y ARM64) y Android, en una sola descarga con un launcher. El programa de cada juego se traduce a C++ antes de jugar con cps2recomp y corre sobre una máquina escrita para el proyecto, no un emulador. Los de lucha suman un modo de entrenamiento completo, juego en línea con rollback entre sistemas, pantalla panorámica 16:9 y modos nuevos; los beat'em up, empezar en cualquier fase y ataque de puntuación; y los matamarcianos, entrenamiento, cajas de impacto reales y ataques de jefes. Reúne Super Street Fighter II, Super Turbo y Hyper Street Fighter II, Street Fighter Alpha, Alpha 2 (con la revisión Zero 2 Alpha) y Alpha 3, Super Gem Fighter Mini Mix, X-Men: Children of the Atom, Marvel Super Heroes, X-Men vs. Street Fighter, Marvel Super Heroes vs. Street Fighter, Marvel vs. Capcom, Super Puzzle Fighter II Turbo, los dos primeros Darkstalkers, Cyberbots, Vampire Savior (que tiene ficha propia), Vampire Savior 2 y Vampire Hunter 2, Alien vs. Predator, Giga Wing, Progear y Dimahoo, y de CPS-1 los tres Street Fighter II, Ghouls'n Ghosts, Final Fight, Cadillacs and Dinosaurs y The Punisher; además, Vampire Savior Definitive, en beta, con los dieciocho personajes y escenarios de otros juegos. No incluye ningún archivo de los juegos. Está en beta. 55 de sus últimos 100 commits llevan a Claude como coautor. La v1.6.0-beta.2 es del 17 de noviembre."
  en: "Unofficial native ports of 31 Capcom arcade games, on the CPS-2 board and a few on CPS-1, for Windows, macOS, Linux (Steam Deck and ARM64 included) and Android, in one download with one launcher. Each game's program is translated to C++ ahead of time with cps2recomp and runs on a machine written for the project, not an emulator. The fighting games add a full training mode, cross-platform online play with rollback, 16:9 widescreen and new modes; the beat 'em ups, starting at any stage and score attack; and the shoot 'em ups, training, true hit boxes and boss rushes. It covers Super Street Fighter II, Super Turbo and Hyper Street Fighter II, Street Fighter Alpha, Alpha 2 (with the Zero 2 Alpha revision) and Alpha 3, Super Gem Fighter Mini Mix, X-Men: Children of the Atom, Marvel Super Heroes, X-Men vs. Street Fighter, Marvel Super Heroes vs. Street Fighter, Marvel vs. Capcom, Super Puzzle Fighter II Turbo, the first two Darkstalkers, Cyberbots, Vampire Savior (which has its own entry), Vampire Savior 2 and Vampire Hunter 2, Alien vs. Predator, Giga Wing, Progear and Dimahoo, and on CPS-1 the three Street Fighter IIs, Ghouls'n Ghosts, Final Fight, Cadillacs and Dinosaurs and The Punisher; plus Vampire Savior Definitive, in beta, with all eighteen characters and other games' stages. It includes no game files. It's in beta. 55 of its last 100 commits list Claude as a co-author. Version 1.6.0-beta.2 is from November 17."
requirements:
  es: "Tu propio set de ROM de MAME de cada juego que quieras, en la versión que nombra la tabla del README (por ejemplo sfa2u, de EE. UU., para Street Fighter Alpha 2), en zip o en carpeta; los de CPS-2, con su archivo de clave. Otras regiones de la misma versión sirven en varios juegos; otras revisiones, no. Vampire Savior Definitive pide vsavj y vsav2. macOS 13 o posterior, Linux x86-64 o ARM64 (SteamOS incluido), Windows 10 u 11 de 64 bits, o Android 9 o posterior en ARM de 64 bits, con Vulkan."
  en: "Your own MAME ROM set of each game you want, at the version named in the README's table (for example sfa2u, USA, for Street Fighter Alpha 2), as a zip or a folder; CPS-2 games with their key file. Other regions of the same release work for several games; other revisions don't. Vampire Savior Definitive needs vsavj and vsav2. macOS 13 or later, Linux x86-64 or ARM64 (SteamOS included), 64-bit Windows 10 or 11, or Android 9 or later on 64-bit ARM, with Vulkan."
