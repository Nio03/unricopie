desc:
  es: "God Hand: Rearmed (antes Kamite): port nativo no oficial de God Hand (PS2) para Windows por recompilación estática, bifurcado de LasVola/godhand-recomp con 895 commits propios. El código del juego se reconstruye como programa de Windows y el hardware de PS2 se reimplementa en runtime/, con el renderizador por hardware de PCSX2 (Vulkan, o Direct3D 11 de respaldo) de 1x a 8x la resolución. Es una beta: según su README se juega de principio a fin, con algún fallo suelto. Todo lo que cambia el juego original es opcional y se elige con cuatro preajustes (Classic, Remastered, Rearmed y Sleazy Mode): 60 fps de verdad, cualquier relación de aspecto hasta 32:9 con el HUD en los bordes o donde lo tenía la PS2, controles modernos con cámara libre, cambio de estilo de lucha con la cruceta, opciones de cámara, paquetes de texturas HD en formato PCSX2 y mejoras de comodidad. El launcher instala el juego, comprueba tu disco, lo actualiza y lo añade a Steam. Su sistema de personajes cambia el modelo del jugador; trae a Xavier, de Xavier: Renegade Angel (propiedad de Adult Swim), que se genera a partir de tu disco. El README habla de una versión para Linux y Steam Deck, pero por ahora sus releases solo traen el zip de Windows. La v0.6.9.5 es del 22 de noviembre. 96 de sus últimos 100 commits llevan a Claude como coautor, y su README dice que se hizo con ayuda de IA."
  en: "God Hand: Rearmed (formerly Kamite): an unofficial native Windows port of God Hand (PS2) by static recompilation, forked from LasVola/godhand-recomp with 895 commits of its own. The game’s code is rebuilt as a Windows program and the PS2 hardware is reimplemented in runtime/, with PCSX2’s hardware renderer (Vulkan, or Direct3D 11 as the fallback) at 1x to 8x resolution. It’s a beta: its README says it plays from start to credits, with the odd bug. Everything that changes the original game is optional and picked with four presets (Classic, Remastered, Rearmed, and Sleazy Mode): true 60 FPS, any aspect ratio up to 32:9 with the HUD at the screen edges or where the PS2 had it, modern controls with a free camera, fighting-style switching on the d-pad, camera options, HD texture packs in PCSX2 format, and quality-of-life changes. The launcher installs the game, checks your disc, updates it, and adds it to Steam. Its character system swaps the player model; it comes with Xavier, from Xavier: Renegade Angel (owned by Adult Swim), who is made from your own disc. The README mentions a Linux and Steam Deck version, but for now its releases only carry the Windows zip. Version 0.6.9.5 is from November 22. 96 of its last 100 commits list Claude as a co-author, and its README says it was built with AI assistance."
requirements:
  es: "Tu propia imagen de disco de God Hand (.iso o .chd), versión estadounidense, SLUS-21503 (las sumas de comprobación están en DISC_HASHES.md); otras versiones pueden funcionar, pero no se han probado. Windows 10 u 11, descomprimido en una carpeta con permiso de escritura (no en Archivos de programa)."
  en: "Your own disc image of God Hand (.iso or .chd), US version, SLUS-21503 (the checksums are in DISC_HASHES.md); other versions may work but are untested. Windows 10 or 11, unpacked to a folder you can write to (not Program Files)."
