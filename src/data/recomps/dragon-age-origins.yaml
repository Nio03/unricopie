desc:
  es: "Recompilación estática de la versión de Xbox 360 en un programa nativo de Windows para x86-64, con un renderizador de Direct3D 12 basado en el de Xenia. La descarga es un instalador sin nada del juego: comprueba tu ISO, descarga las herramientas, traduce el código del juego a C++ en tu equipo y lo compila (de 30 a 60 minutos la primera vez); después hace de launcher, con ajustes, mods y actualizaciones. Dibuja hasta en 4K o más, con escalado temporal y antialiasing por FSR 4, FSR 3.1, XeSS o DLSS 4.5 (experimental), generación de fotogramas con FSR 3.1, HDR y desenfoque de movimiento opcional; va a 60 fps (el original está fijo a 30) o, de forma experimental, hasta 240 o sin límite, con baja latencia por Anti-Lag 2 o Reflex y campo de visión ajustable. Añade una pestaña de gráficos en las opciones del propio juego, un modo foto, un menú de trucos que ejecuta los scripts de depuración que BioWare dejó en el juego, un teclado en pantalla para el mando, mandos por SDL3 (DualSense incluido), mods con un conversor para los de la versión de PC, copias de seguridad de las partidas, los DLC (Awakening incluido) desde tus propios paquetes y el texto en inglés, italiano o español. Como experimento, en las tarjetas RDNA 4 de AMD puede aplicar el renderizado neuronal de DLSS 5 portado por lmxxf, con los pesos de la red descargados aparte. En Linux corre con Wine o Proton, aún sin probar. La última versión es la 0.9.0 (14 de octubre), con versiones de desarrollo posteriores. 153 de sus 158 commits llevan a Claude como coautor."
  en: "A static recompilation of the Xbox 360 version into a native x86-64 Windows program, with a Direct3D 12 renderer based on Xenia’s. The download is an installer with nothing from the game: it checks your ISO, downloads the tools, translates the game’s code to C++ on your machine, and builds it (30–60 minutes the first time); afterwards it works as a launcher for settings, mods, and updates. It renders at up to 4K or more, with temporal upscaling and anti-aliasing through FSR 4, FSR 3.1, XeSS, or DLSS 4.5 (experimental), FSR 3.1 frame generation, HDR, and optional motion blur; it runs at 60 fps (the original is locked to 30) or, experimentally, up to 240 or uncapped, with low latency through Anti-Lag 2 or Reflex and an adjustable field of view. It adds a Graphics tab in the game’s own options, a photo mode, a cheats menu that runs the debug scripts BioWare left in the game, an on-screen keyboard for the controller, SDL3 controllers (DualSense included), mods with a converter for PC-version mods, save backups, the DLC (Awakening included) from your own packages, and the text in English, Italian, or Spanish. As an experiment, on AMD RDNA 4 cards it can apply DLSS 5’s neural rendering as ported by lmxxf, with the network’s weights downloaded separately. On Linux it runs through Wine or Proton, still untested. The latest release is 0.9.0 (October 14), with later development builds. 153 of its 158 commits list Claude as a co-author."
requirements:
  es: "Tu propia imagen ISO de Dragon Age: Origins para Xbox 360 (título 454108C0), la edición en inglés, italiano y español (medio 186A1115), que es también el disco 1 de su Ultimate Edition; las ediciones francesa y alemana no sirven. Para Awakening y otros DLC, la Title Update 6 o 7 y los paquetes de DLC de tu consola. Además, Windows 10 u 11 (o Linux con Wine o Proton) en un PC x86-64 con procesador con AVX y tarjeta gráfica con Direct3D 12, y unos 25 GB libres."
  en: "Your own ISO of Dragon Age: Origins for Xbox 360 (title 454108C0), the English, Italian, and Spanish edition (media 186A1115), which is also disc 1 of its Ultimate Edition; the French and German editions aren’t supported. For Awakening and other DLC, Title Update 6 or 7 and the DLC packages from your console. Plus Windows 10 or 11 (or Linux with Wine or Proton) on an x86-64 PC with an AVX CPU and a Direct3D 12 graphics card, and about 25 GB of free space."
