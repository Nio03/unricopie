name: "Super Mario Odyssey (toby-sym)"
games: [super-mario-odyssey]
console: switch
status: experimental
repo: toby-sym/smo2pc
originalDeveloper: "Nintendo"
year: 2017
desc:
  es: "Versión para Windows x64 de Super Mario Odyssey (1.4.1) hecha por recompilación estática: el código AArch64 del juego se pasa a C por adelantado con un traductor en Python y se compila con clang, y un runtime propio sustituye a las bibliotecas del sistema de Switch, con la API gráfica NVN sobre Vulkan y un traductor de shaders Maxwell. No es un emulador. Es un fork de desarrollo de smo-recomp, de Coz-0, que añade su propia identidad, la automatización de compilación y mucho trabajo en el renderizador Vulkan. El README admite que es un proyecto temprano e inacabado y dice sin rodeos qué ha medido y qué no: recorre con pruebas automáticas el Reino de la Gorra y más de 270 escenarios, y se ha jugado a mano desde ahí hasta el primer punto de control del Reino de la Cascada, a 60 fps en el equipo del autor; el audio, los vídeos, la Guía de acciones y los amiibo funcionan, y no hay juego en línea. No tiene versiones publicadas ni ejecutable: lo construyes tú con tu volcado. 62 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A Windows x64 version of Super Mario Odyssey (1.4.1) made by static recompilation: the game’s AArch64 code is turned into C ahead of time by a Python lifter and compiled with clang, and the project’s own runtime replaces the Switch system libraries, with the NVN graphics API on Vulkan and a Maxwell shader translator. It is not an emulator. It is a development fork of Coz-0’s smo-recomp that adds its own identity, build automation, and a lot of work on the Vulkan renderer. The README admits it is early and unfinished and says plainly what has been measured and what hasn’t: automated tests run through Cap Kingdom and more than 270 scenarios, and it has been played by hand from there to the first checkpoint of Cascade Kingdom, at 60 fps on the author’s PC; audio, videos, the Action Guide, and amiibo work, and there is no online play. It has no published releases or executable: you build it yourself from your own dump. 62 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Super Mario Odyssey 1.4.1 de tu propia consola: carpetas descifradas, o el NSP o XCI del juego base y de la actualización 1.4.1 con tu prod.keys (y title.keys si hace falta). Además, Windows 10 u 11 de 64 bits, una GPU con Vulkan 1.3, LLVM/clang 9.0.0, Visual Studio 2019 Build Tools, el SDK de Vulkan, SDL3, Python 3.13 y, para paquetes cifrados, el SDK de .NET 8 o posterior."
  en: "Your own copy of Super Mario Odyssey 1.4.1 from your own console: decrypted folders, or the NSP or XCI of the base game and the 1.4.1 update with your prod.keys (and title.keys if needed). Plus 64-bit Windows 10 or 11, a Vulkan 1.3 GPU, LLVM/clang 9.0.0, Visual Studio 2019 Build Tools, the Vulkan SDK, SDL3, Python 3.13, and, for encrypted packages, the .NET SDK 8 or later."
