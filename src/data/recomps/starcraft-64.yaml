year: 2000
toolchain: N64Recomp
desc:
  es: "Port nativo de la versión estadounidense (NTSC-U): N64Recomp traduce de antemano a C el código MIPS original, que corre sobre N64ModernRuntime; los gráficos los dibuja un renderizador por software hecho para las listas de dibujo de este juego, y una capa en SDL3 se ocupa de la ventana, el sonido y los controles. Las descargas son solo un launcher sin nada del juego: la primera vez que eliges tu ROM, compila el juego en tu equipo en unos minutos, con el compilador de C que encuentre o, si no hay ninguno, con una copia de zig que descarga (de 50 a 100 MB). Funcionan la campaña de un jugador, los menús originales y la enciclopedia, guardar y cargar y el sonido, y se juega con ratón (selección con recuadro, órdenes con el botón derecho, desplazamiento con el central y clics en el minimapa), teclado o mando; el juego sigue viendo un mando de N64. No tiene el modo para dos jugadores a pantalla partida ni opciones gráficas: la imagen es la original, escalada con bandas negras. También hay versión para Android. Su autor solo la ha usado de principio a fin en macOS con Apple Silicon; las de Windows y Linux se compilan y pasan sus comprobaciones, pero aún no se han probado en esos sistemas. La 0.1.0 salió el 13 de octubre."
  en: "A native port of the US (NTSC-U) release: N64Recomp translates the original MIPS code to C ahead of time, and it runs on N64ModernRuntime; graphics are drawn by a software renderer built for this game’s display lists, and an SDL3 shell handles the window, audio, and input. The downloads are just a launcher with nothing from the game: the first time you pick your ROM, it builds the game on your machine in a few minutes, with whatever C compiler it finds or, if there is none, with a copy of zig it downloads (50–100 MB). The single-player campaign, the original menus and the Encyclopedia, saving and loading, and sound all work, and you can play with the mouse (box selection, right-click orders, middle-button scrolling, and clicks on the minimap), keyboard, or controller; the game still sees an N64 controller. Two-player split screen and graphics options aren’t supported: the picture is the original, scaled with black bars. There’s an Android version too. The author has only used it end to end on Apple silicon macOS; the Windows and Linux packages build and pass their checks but haven’t been run on those systems yet. 0.1.0 came out on October 13."
requirements:
  es: "Tu propia ROM estadounidense (NTSC-U) de StarCraft 64; vale en .z64, .v64 o .n64, y una vez normalizada debe tener el SHA-1 a36d91b5aac7bb95df0d7de5f9814f5270e25c2b. Además, Windows o Linux x86-64 o macOS con Apple Silicon, y para compilar el juego la primera vez, un compilador de C (las herramientas de línea de comandos de Xcode, gcc o clang) o conexión a internet para descargar zig."
  en: "Your own US (NTSC-U) StarCraft 64 ROM; .z64, .v64, or .n64 work, and once normalized it must match SHA-1 a36d91b5aac7bb95df0d7de5f9814f5270e25c2b. Plus x86-64 Windows or Linux, or Apple silicon macOS, and, to build the game the first time, a C compiler (Xcode command line tools, gcc, or clang) or an internet connection to download zig."
