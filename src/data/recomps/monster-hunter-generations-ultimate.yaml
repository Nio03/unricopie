originalDeveloper: "Capcom"
year: 2018
desc:
  es: "Port nativo para PC de Monster Hunter Generations Ultimate (versión 1.4.0 de Switch), hecho recompilando estáticamente el código ARM de 32 bits del juego a C y ejecutándolo sobre un entorno propio: los servicios del sistema de la Switch y la API gráfica NVN se reimplementan en Windows, con Vulkan para el renderizado. El README lo describe como plenamente jugable, con posibles errores, y dice que el multijugador también funciona. Añade ajustes gráficos (resolución, MSAA, FXAA, supermuestreo, VSync), cualquier relación de aspecto ancha, límite de cuadros entre 30 y 240 por segundo, soporte para casi cualquier mando, controles de teclado y ratón experimentales, soporte de mods y códigos de trucos en el formato de Ryujinx y Atmosphère. La versión 0.11.0 añadió multijugador en línea; la última, la 0.11.1, es del 29 de octubre. 72 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A native PC port of Monster Hunter Generations Ultimate (Switch version 1.4.0), made by statically recompiling the game’s 32-bit ARM code to C and running it on a host runtime: the Switch’s system services and the NVN graphics API are reimplemented on Windows, with Vulkan for rendering. The README describes it as fully playable, with possible bugs, and says multiplayer also works. It adds graphics settings (resolution, MSAA, FXAA, supersampling, VSync), any widescreen aspect ratio, a frame rate cap from 30 to 240 fps, support for almost any controller, experimental keyboard and mouse controls, mod support, and cheat codes in the Ryujinx and Atmosphère format. Version 0.11.0 added online multiplayer; the latest, 0.11.1, is from October 29. 72 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Monster Hunter Generations Ultimate para Nintendo Switch, versión 1.4.0 (ID de título 0100770008DD8000; el ID de compilación del ejecutable main empieza por FB08F1D20FD1204F), con las carpetas exefs y romfs ya con las actualizaciones aplicadas. Windows 10 u 11 de 64 bits o Linux, una CPU con AVX2 (de 2014 o posterior), una GPU con Vulkan 1.2 y al menos 1 GB de VRAM, y 4 GB de RAM."
  en: "Your own copy of Monster Hunter Generations Ultimate for Nintendo Switch, version 1.4.0 (title ID 0100770008DD8000; the main executable’s build ID starts with FB08F1D20FD1204F), with the exefs and romfs folders and the updates already applied. 64-bit Windows 10 or 11, or Linux, an AVX2 CPU (2014 or newer), a GPU with Vulkan 1.2 and at least 1 GB of VRAM, and 4 GB of RAM."
