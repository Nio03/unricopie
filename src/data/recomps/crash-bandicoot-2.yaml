name: "Crash Bandicoot 2: Cortex Strikes Back"
games: [crash-bandicoot-2-cortex-strikes-back]
console: ps1
status: playable
repo: Zumbo06/Crash2Recomp
originalDeveloper: Naughty Dog
year: 1997
toolchain: psxrecomp
desc:
  es: "El juego, traducido a código nativo y ejecutado directamente sobre psxrecomp, sin emulación. Un launcher toma tu imagen de disco, la verifica y calcula su hash, traduce el juego a C y lo compila en tu propia máquina (entre cinco y veinte minutos la primera vez). Se puede completar de principio a fin, con pequeños fallos de sonido y de gráficos; su autor lo considera una versión preliminar."
  en: "The game, translated to native code and run directly on psxrecomp, with no emulation. A launcher takes your disc image, verifies and hashes it, translates the game to C, and compiles it on your own machine (five to twenty minutes the first time). It can be completed from start to finish, with minor sound and graphics issues; its author treats it as a preview."
requirements:
  es: "Tu propia imagen de disco de Crash Bandicoot 2 (edición norteamericana, SCUS-94154), en .cue/.bin o .chd. Windows 10 o posterior de 64 bits y unos 3 GB libres durante la compilación. No hace falta BIOS: incluye OpenBIOS."
  en: "Your own Crash Bandicoot 2 disc image (North American edition, SCUS-94154), as .cue/.bin or .chd. 64-bit Windows 10 or later and about 3 GB of free space during the build. No BIOS needed: OpenBIOS is included."
