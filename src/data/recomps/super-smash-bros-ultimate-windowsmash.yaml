name: "Super Smash Bros. Ultimate (WindowSmash)"
console: switch
status: experimental
repo: OpenSmash-Ultimate/WindowSmash
author: SNO2207
originalDeveloper: Bandai Namco Studios / Sora Ltd.
year: 2018
desc:
  es: "WindowSmash: port nativo y experimental para Windows de la versión 13.0.5 de Switch, la última actualización del juego, hecho con un recompilador estático y un entorno de ejecución propios. El recompilador encuentra las funciones del código AArch64 (NEON incluido), también las de los módulos de los luchadores, que se cargan cuando el juego los pide, y las traduce a C, que Clang compila en tu PC; el runtime implementa los servicios del sistema que usa el juego, pasa sus gráficos a Direct3D 11 y sus shaders a HLSL, que se compilan la primera vez que aparecen (una herramienta puede prepararlos antes). Un instalador instala Python, el compilador y SDL3 si faltan, busca tus archivos, aplica la actualización 13.0.5 y compila el juego, lo que tarda de 30 minutos a unas horas; el repositorio no publica versiones compiladas. Admite hasta ocho mandos y el teclado, ventana, sin bordes o pantalla completa en 16:9, los luchadores DLC que tengas y una herramienta que desbloquea en tu partida guardada la plantilla del juego base. El juego en red usa el modo inalámbrico local a través de un repetidor por internet, con salas abiertas, con código o alojadas por un jugador, y está en pruebas el propio modo Online del juego contra un servidor que forma parte del proyecto, sin conexión con Nintendo. Según el proyecto, los menús y los combates funcionan, pero gran parte no se ha probado a fondo; las partidas completas entre dos PC, por ejemplo, no se han verificado del todo. También se puede compilar, de forma experimental, en Linux, con DXVK sobre Vulkan, y en Mac con Apple Silicon, con un renderizador Metal propio. Es un proyecto distinto del recomp OpenSmash-Ultimate (ssbu-recomp), que adaptó con permiso parte de su código de red y el diseño de su lobby; los dos repositorios están ahora en la misma organización de GitHub. 64 de sus últimos 100 commits llevan a Claude como coautor."
  en: "WindowSmash: an experimental native Windows port of Switch version 13.0.5, the game’s last update, built with its own static recompiler and runtime. The recompiler finds the functions in the AArch64 code (NEON included), also those in the fighter modules, which are loaded when the game asks for them, and translates them to C, which Clang compiles on your PC; the runtime implements the system services the game uses, turns its graphics into Direct3D 11 and its shaders into HLSL, compiled the first time each one appears (a tool can prepare them ahead of time). An installer sets up Python, the compiler, and SDL3 if they’re missing, finds your files, applies the 13.0.5 update, and builds the game, which takes from 30 minutes to a few hours; the repository publishes no prebuilt game. It supports up to eight controllers plus the keyboard, windowed, borderless, or fullscreen at 16:9, the DLC fighters you own, and a tool that unlocks the base-game roster on your save. Online play uses Local Wireless through an internet relay, with open rooms, lobby codes, or player-hosted rooms, and the game’s own Online mode is being tested against a server that’s part of the project, with no connection to Nintendo. According to the project, menus and matches run, but much of it hasn’t been widely tested; complete matches between two PCs, for example, haven’t been fully verified. It can also be built, experimentally, on Linux, using DXVK on Vulkan, and on Apple silicon Macs, with a Metal renderer of its own. It’s a separate project from the OpenSmash-Ultimate recomp (ssbu-recomp), which adapted part of its network code and its lobby design with permission; both repositories now live in the same GitHub organization. 64 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propio volcado de Super Smash Bros. Ultimate en la versión 13.0.5: el juego (mejor la 1.0.0) con su actualización 13.0.5 en .nsp, un volcado con la 13.0.5 ya integrada o el juego instalado y actualizado en yuzu o Ryujinx; los DLC son opcionales. También las claves (prod.keys y title.keys) y el firmware de tu propia consola, del que se sacan las fuentes. Además, Windows 10 u 11 de 64 bits, un procesador con AVX2, una tarjeta gráfica con DirectX 11, 16 GB de RAM recomendados y unos 60 GB libres más espacio para tus archivos (unos 17 GB). Linux y macOS 14.5 o posterior en Apple Silicon, de forma experimental."
  en: "Your own dump of Super Smash Bros. Ultimate at version 13.0.5: the game (ideally 1.0.0) with its 13.0.5 update as an .nsp, a dump with 13.0.5 already merged in, or the game installed and updated in yuzu or Ryujinx; DLC is optional. Also your own console’s keys (prod.keys and title.keys) and firmware, which the fonts come from. Plus 64-bit Windows 10 or 11, a CPU with AVX2, a DirectX 11 graphics card, 16 GB of RAM recommended, and about 60 GB free plus room for your files (about 17 GB). Linux and macOS 14.5 or later on Apple silicon, experimentally."
