name: Ridge Racer
console: ps1
status: playable
repo: RobGreenUK/Ridge-Racer-PS1-Recomp
author: RobGreenUK
originalDeveloper: Namco
year: 1994
toolchain: psxrecomp
desc:
  es: "Recompilación de Ridge Racer (edición estadounidense SCUS-94300) con un renderizador propio para Mac con Apple Silicon y Windows 11 x64: resoluciones altas, salida 4:3 y 16:9, texturas con corrección de perspectiva, más escenario visible y renderizado interpolado a la tasa de fotogramas que elijas. El juego original sigue gestionando la física, el tiempo de simulación, el audio y las repeticiones: subir la tasa de fotogramas del renderizado no acelera la física. No hay versiones publicadas: se compila en tu máquina. Su autor declara que lo desarrolló con OpenAI Codex, dirigiendo el trabajo y probándolo personalmente."
  en: "Recompilation of Ridge Racer (US edition SCUS-94300) with its own renderer for Apple Silicon Macs and Windows 11 x64: higher resolutions, 4:3 and 16:9 output, perspective-correct textures, more visible scenery, and interpolated rendering at a frame rate you pick. The original game still drives physics, simulation timing, audio, and replays: raising the render frame rate doesn’t speed up the physics. There are no releases: you build it on your own machine. Its author states they developed it with OpenAI Codex, directing the work and playtesting it themselves."
requirements:
  es: "Tu propia copia de Ridge Racer (PS1, SCUS-94300). Hay que compilarlo en tu equipo: no hay binarios publicados."
  en: "Your own copy of Ridge Racer (PS1, SCUS-94300). It has to be built locally: no binaries are published."
