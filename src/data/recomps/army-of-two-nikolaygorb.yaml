originalDeveloper: EA Montreal
year: 2008
toolchain: ReXGlue
desc:
  es: "Recompilación estática de la versión de Xbox 360 a Windows y Linux x86-64, con el SDK de ReXGlue: el código PowerPC del default.xex pasa a C++ nativo, y los archivos, la GPU, el sonido y los hilos van por el entorno de ReXGlue, con Direct3D 12 o Vulkan. Sus versiones dicen funcionar del todo en Windows 11 y Ubuntu 26.04. Añade vista directa con el ratón a pie, con la sensibilidad ajustada al zoom, y lleva como ganchos tres parches de la comunidad de Xenia Canary: desbloqueo de fotogramas (60 por defecto, 30 o sin límite), la corrección del sombreado negro, que desactiva el MSAA, y filtrado anisotrópico 16x. El juego se puede poner en inglés, japonés, alemán, francés, español o italiano. Su autor lo presenta como una demostración casera del uso del SDK. La 1.3 (18 de octubre) mejoró los gráficos y arregló el renderizado con Vulkan."
  en: "A static recompilation of the Xbox 360 version to x86-64 Windows and Linux, with the ReXGlue SDK: the PowerPC code in default.xex becomes native C++, and file I/O, GPU, audio, and threading go through the ReXGlue runtime, with Direct3D 12 or Vulkan. Its releases claim full compatibility on Windows 11 and Ubuntu 26.04. It adds direct mouse look on foot, with sensitivity scaled to the zoom, and carries three Xenia Canary community patches as hooks: a frame rate unlock (60 by default, 30, or uncapped), the black shading fix, which disables MSAA, and 16x anisotropic filtering. The game can be set to English, Japanese, German, French, Spanish, or Italian. Its author presents it as a home-made demo of the SDK’s use. Version 1.3 (October 18) improved the graphics and fixed Vulkan rendering."
requirements:
  es: "Tu propia copia de Army of Two para Xbox 360 (Title ID 4541084C, Media ID 7E3E9BEA, hash del módulo AA1EA03FEC9A549C), volcada con ABGX360 o extraída de la ISO con extract-xiso. Además, Windows o Linux de 64 bits y una tarjeta gráfica con Direct3D 12 o Vulkan."
  en: "Your own copy of Army of Two for Xbox 360 (Title ID 4541084C, Media ID 7E3E9BEA, module hash AA1EA03FEC9A549C), dumped with ABGX360 or extracted from the ISO with extract-xiso. Plus 64-bit Windows or Linux and a Direct3D 12 or Vulkan graphics card."
