originalDeveloper: Sonic Team
year: 1998
toolchain: KatanaRecomp
desc:
  es: "Port nativo no oficial de la versión de Dreamcast, sobre KatanaRecomp, para Windows, Linux y Steam Deck. Conserva la aventura original y añade panorámico, controles de cámara modernos y presentación nativa. Su autor declara que usó herramientas de IA como asistentes de código y para documentación, y avisa en el README de que el desarrollo está detenido desde finales de septiembre de 2026 por motivos personales."
  en: "Unofficial native port of the Dreamcast version, on KatanaRecomp, for Windows, Linux and Steam Deck. It preserves the original adventure and adds widescreen, modern camera controls and native presentation. Its author states that AI tools were used as coding assistants and for documentation, and notes in the README that development has been halted since late September 2026 for personal reasons."
