name: "Naughty Bear: Panic in Paradise"
games: [naughty-bear-panic-in-paradise]
console: x360
status: experimental
repo: MaxDeadBear/restuff_inParadise
originalDeveloper: "Behaviour Interactive"
year: 2012
toolchain: ReXGlue
desc:
  es: "Proyecto de recompilación de Naughty Bear: Panic in Paradise de Xbox 360 para Windows, hecho con ReXGlue. El repositorio no tiene README: solo contiene el código del programa (controlador de audio XAudio2, ganchos, un módulo de mods en Lua y un menú de logros) y los archivos de configuración y de manifiesto del proyecto. El manifiesto, generado por ReXGlue el 16 de junio, espera el default.xex del juego en una carpeta assets, y el código recompilado no está en el repositorio. Las versiones publicadas traen ya compilado el ejecutable (un restuff_inparadise.exe de unos 76 MB y un zip de unos 22 MB) que no hemos comprobado por dentro; la última, release_v1.1 del 27 de junio, añadió logros. No se puede saber más de su estado sin documentación. Ninguno de sus 2 commits lleva a Claude como coautor."
  en: "A recompilation project of Naughty Bear: Panic in Paradise for Xbox 360 on Windows, made with ReXGlue. The repository has no README: it only holds the program’s code (an XAudio2 audio driver, hooks, a Lua mod module, and an achievements menu) and the project’s configuration and manifest files. The manifest, generated by ReXGlue on June 16, expects the game’s default.xex in an assets folder, and the recompiled code isn’t in the repository. The published releases ship the already compiled executable (a restuff_inparadise.exe of about 76 MB and a zip of about 22 MB) that we haven’t checked inside; the latest, release_v1.1 from June 27, added achievements. Nothing more can be said about its state without documentation. Neither of its 2 commits lists Claude as a co-author."
requirements:
  es: "Sin README: el manifiesto del proyecto indica que usa el default.xex de tu propia copia de Naughty Bear: Panic in Paradise para Xbox 360, colocado en una carpeta assets. No se han comprobado versión ni región."
  en: "No README: the project manifest indicates it uses the default.xex from your own copy of Naughty Bear: Panic in Paradise for Xbox 360, placed in an assets folder. Version and region haven’t been checked."
tags:
