desc:
  es: "openNG2: port nativo para Windows de la versión mundial de Xbox 360 (ID de medio 69F555CB), por recompilación estática con el SDK de ReXGlue. Desde la v1.1.0 dibuja por defecto con un renderizador nativo en Vulkan, sin emular la GPU, que según el autor gasta un 64 % menos de tiempo de GPU por fotograma que la vía Direct3D 12, que sigue disponible. La lógica del juego va a 60 fps, y una opción genera un fotograma intermedio para llegar a 120. Ofrece cualquier resolución y modo de ventana, formatos 21:9 y 32:9 con el HUD en los bordes, campo de visión, resolución interna de 1x a 5x, escalado con FSR (temporal en el renderizador nativo; FSR 1.0 y CAS en Direct3D 12), FXAA, perfiles de calidad, mandos de Xbox, PS4 y PS5 con sus iconos, teclado y ratón con teclas reasignables y los avisos del juego con tus teclas, ajustes dentro de los menús del juego, saltar la intro y cualquier escena, copias de las partidas, el Mission Mode y los trajes de los DLC, trucos (todas las dificultades y trajes desbloqueados) y la precompilación de los shaders. Solo se ha probado en los primeros capítulos y en el Mission Mode; el ratón no sirve en los menús, y el cielo puede emborronarse en los giros rápidos de cámara. El launcher comprueba tus archivos, descarga su compilador, construye e instala el juego y lo mantiene al día recompilando solo lo que cambia. Tomó como referencia el proyecto Ninja's Dawn y, a diferencia del port de gamboozino, pide la Title Update 2 y no la 3. La v1.1.0 (5 de noviembre) es la última de 7 versiones. Sus últimos 100 commits llevan todos a Claude como coautor."
  en: "openNG2: a native Windows port of the World Xbox 360 release (media ID 69F555CB), by static recompilation with the ReXGlue SDK. Since v1.1.0 it renders by default with a native Vulkan renderer, with no GPU emulation, which the author says takes 64% less GPU time per frame than the Direct3D 12 path, still available. Game logic runs at 60 fps, and an option generates an in-between frame to reach 120. It offers any resolution and window mode, 21:9 and 32:9 with the HUD at the screen edges, field of view, internal resolution from 1x to 5x, FSR upscaling (temporal on the native renderer; FSR 1.0 and CAS on Direct3D 12), FXAA, quality presets, Xbox, PS4, and PS5 controllers with matching icons, keyboard and mouse with remappable keys and the game’s prompts showing your keys, settings inside the game’s own menus, skipping the intro and any cutscene, save backups, Mission Mode and the DLC costumes, cheats (every difficulty and costume unlocked), and shader precompilation. It has only been tested through the early chapters and Mission Mode; the mouse doesn’t work in menus, and the sky may smear during fast camera turns. The launcher checks your files, downloads its own compiler, builds and installs the game, and keeps it up to date by rebuilding only what changed. It used the Ninja’s Dawn project as a reference and, unlike gamboozino’s port, needs Title Update 2 rather than 3. v1.1.0 (November 5) is the latest of 7 releases. All of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Ninja Gaiden II para Xbox 360, versión mundial (ID de medio 69F555CB, la que se vendió fuera de Japón), como paquete Games on Demand C1200E9B558D04454FA6 con su carpeta .data, imagen .iso o carpeta extraída, y su Title Update 2 (TU_1A461UL_000000G000000.00000000000G4); no sirven la Title Update 3, la versión japonesa, Ninja Gaiden Sigma 2 ni la Master Collection. Los DLC (Mission Mode y los trajes) son opcionales. Además, Windows 10 (1803 o posterior) u 11 de 64 bits, una GPU con Direct3D 12 (Vulkan 1.3 para el renderizador nativo), unos 22 GB libres y conexión para la primera compilación."
  en: "Your own copy of Ninja Gaiden II for Xbox 360, World release (media ID 69F555CB, the one sold outside Japan), as the Games on Demand package C1200E9B558D04454FA6 with its .data folder, an .iso image, or an extracted folder, plus its Title Update 2 (TU_1A461UL_000000G000000.00000000000G4); Title Update 3, the Japanese release, Ninja Gaiden Sigma 2, and the Master Collection won’t work. The DLC (Mission Mode and the costumes) is optional. Plus 64-bit Windows 10 (1803 or newer) or 11, a Direct3D 12 GPU (Vulkan 1.3 for the native renderer), about 22 GB free, and a connection for the first build."
