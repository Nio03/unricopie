desc:
  es: "Marchwind 64: recompilación estática no oficial de la versión japonesa de Super Robot Wars 64, hecha con N64Recomp y con RT64 como renderizador. Trae traducción completa al inglés y al chino junto al japonés original, que se cambian dentro del juego; según las notas de la 0.4.10, las dos son sobre todo traducción automática con una pasada de corrección. Admite de 4:3 a 16:9 ampliando el escenario a los lados sin estirar la imagen, recompone los diálogos con una fuente en alta resolución y añade historial, lectura automática y avance rápido, una pantalla previa al combate al estilo de los Super Robot Wars modernos, opciones dentro del juego, controles reasignables, más ranuras de guardado y autoguardado, una biblioteca de unidades y personajes, filtros de RetroArch (todavía no en Windows) y correcciones de fallos del original, desactivables una a una. Hay versiones para Windows, Linux (también Steam Deck), macOS y Android; las de Windows, Steam Deck y Android son experimentales. La 0.4.10 salió el 20 de octubre; según sus notas, todo el juego se puede jugar, aunque todavía le falta pulido. 743 de sus 813 commits llevan a Claude como coautor. Aparte publica, como descarga opcional de 509 MB, un paquete HD: los retratos, los fondos, los mapas y parte de los cut-ins están generados con modelos de imagen de IA (de Alibaba y de OpenAI) a partir de los gráficos originales, y las unidades, los cut-ins y los suelos y cielos de los combates están reescalados del pixel art original. Sin él se usan los gráficos originales, y se puede cambiar entre ambos en cualquier momento."
  en: "Marchwind 64: an unofficial static recompilation of the Japanese release of Super Robot Wars 64, built with N64Recomp and with RT64 as its renderer. It has full English and Chinese translations alongside the original Japanese, switchable in game; according to the 0.4.10 notes, both are mostly machine-translated with one polishing pass. It supports 4:3 to 16:9, extending the scenery to the sides without stretching the picture, re-typesets dialogue in a high-resolution font, and adds a history, auto-play and fast-forward, a pre-battle screen in the style of modern Super Robot Wars games, in-game settings, remappable controls, extra save slots and autosaves, a unit and character library, RetroArch filters (not on Windows yet), and fixes for bugs in the original that can be turned off one by one. There are builds for Windows, Linux (Steam Deck too), macOS, and Android; the Windows, Steam Deck, and Android builds are experimental. Version 0.4.10 came out on October 20; according to its notes, the whole game is playable, though it’s still rough. 743 of its 813 commits list Claude as a co-author. Separately, it offers an HD pack as an optional 509 MB download: the portraits, backgrounds, maps, and some cut-ins are generated with AI image models (Alibaba’s and OpenAI’s) from the original graphics, and the units, cut-ins, and battle grounds and skies are upscaled from the original pixel art. Without it the original graphics are used, and you can switch between the two at any time."
requirements:
  es: "Tu propia ROM japonesa de Super Robot Wars 64 (Super Robot Taisen 64), revisión 0 (NS4J), en .z64, .v64 o .n64; en .z64 su SHA-256 es ee5f4a21d8e5f7827d21199e27800edf250df9a8e4d10befb1a6992df597b13e, y no acepta otras revisiones. En Windows, Windows 10 (2004) u 11 de 64 bits, una tarjeta gráfica con Direct3D 12 (Shader Model 6.0) o Vulkan 1.2 (como mínimo, GeForce GT 630, Radeon HD 7750 o Intel HD Graphics 510) y un procesador x86-64-v2; en Linux, 64 bits con glibc 2.35 o posterior (Ubuntu 22.04 o Debian 12) y Vulkan 1.2; en macOS, la versión 14 o posterior con Apple silicon."
  en: "Your own Japanese Super Robot Wars 64 (Super Robot Taisen 64) ROM, revision 0 (NS4J), as .z64, .v64, or .n64; as .z64 its SHA-256 is ee5f4a21d8e5f7827d21199e27800edf250df9a8e4d10befb1a6992df597b13e, and no other revision is accepted. On Windows, 64-bit Windows 10 (2004) or 11, a graphics card with Direct3D 12 (Shader Model 6.0) or Vulkan 1.2 (at least a GeForce GT 630, Radeon HD 7750, or Intel HD Graphics 510), and an x86-64-v2 CPU; on Linux, 64-bit with glibc 2.35 or later (Ubuntu 22.04 or Debian 12) and Vulkan 1.2; on macOS, version 14 or later on Apple silicon."
