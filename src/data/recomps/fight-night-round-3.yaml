desc:
  es: "Recompilación no oficial para PC de Fight Night Round 3, de Xbox 360, hecha con ReXGlue y el renderizador Xenos sobre Vulkan, en Linux y Windows. La versión 1.0 trae 60 cuadros por segundo nativos conservando la velocidad original del juego, con resolución configurable (de 720p a 2160p), FXAA, filtrado de texturas y una página de opciones gráficas propia. La versión publicada lleva el código del juego ya traducido y compilado; los datos salen de tu copia. El README avisa de que quedan problemas intermitentes de carga, texto y audio, y de que no se garantiza la compatibilidad completa. La 1.0.3 (26 de octubre) mejora el arranque, el escalado de escritorio y el guardado de perfiles."
  en: "An unofficial PC recompilation of Fight Night Round 3 for Xbox 360, built with ReXGlue and the Xenos renderer on Vulkan, for Linux and Windows. Version 1.0 brings native 60 frames per second while preserving the original gameplay speed, with configurable resolution (720p to 2160p), FXAA, texture filtering, and its own graphics options page. The published release ships the game’s code already translated and compiled; the data comes from your copy. The README warns that intermittent loading, text, and audio issues remain and that complete compatibility is not guaranteed. Version 1.0.3 (October 26) improves startup, desktop scaling, and profile saving."
requirements:
  es: "Tu propia ISO de Fight Night Round 3 para Xbox 360 (datos de la versión estadounidense compatible), que la configuración inicial pide y verifica. Windows 10 u 11 de 64 bits o Linux, Python 3.12 o superior, una CPU x86-64-v2 y una GPU con controlador Vulkan 1.3."
  en: "Your own Fight Night Round 3 ISO for Xbox 360 (a supported USA release), which first-run setup asks for and verifies. 64-bit Windows 10 or 11 or Linux, Python 3.12 or newer, an x86-64-v2 CPU, and a GPU with a Vulkan 1.3 driver."
