name: The Binding of Isaac
console: pc
status: playable
repo: whylurking/IsaacRecomp
originalDeveloper: Edmund McMillen / Florian Himsl
year: 2011
desc:
  es: "IsaacRecomp: recompilación estática del juego original en Flash, con su expansión Wrath of the Lamb y la Eternal Edition, como programa nativo para Windows y Linux de 64 bits, con versiones también para Android y para Switch como homebrew. Las herramientas del proyecto descifran el SWF que va dentro de tu Isaac.exe de Steam y traducen cada bloque del bytecode de ActionScript 2 (AVM1) a una función de C++, con la semántica de Flash Player 8 tomada de Ruffle, y un motor nuevo con SDL2 y OpenGL lee al arrancar los gráficos, los sonidos y la música de tu Isaac.exe. La lógica sigue a 30 ciclos por segundo, como en el original, y la imagen se interpola a la frecuencia de tu pantalla (60, 120, 144 Hz…); los gráficos vectoriales se dibujan a la resolución nativa de la pantalla, sin costuras entre zonas de color. Reconoce las tres versiones por su contenido y deja elegir al arrancar, cada una con su partida guardada, y añade mando sin programas externos, movimiento analógico como en Rebirth (desactivable), controles reasignables, pantalla completa o ventana y un conversor de partidas desde la versión Flash. La 1.4.0 (20 de octubre) se comparó fotograma a fotograma con el original ejecutado en Ruffle, con todos los enemigos, jefes, objetos, píldoras, cartas y baratijas de las tres versiones, y corrigió las pocas diferencias encontradas. Su autor declara que lo hizo con ayuda de IA (Claude). El repositorio incluye el C++ generado a partir del código del juego de las tres versiones, unos 10 MB para cada uno de sus dos tamaños de escenario (1440×1080 y 960×720)."
  en: "IsaacRecomp: a static recompilation of the original Flash game, with its Wrath of the Lamb expansion and the Eternal Edition, as a native 64-bit program for Windows and Linux, with Android and Switch homebrew builds as well. The project’s tools decrypt the SWF inside your Steam Isaac.exe and translate every block of ActionScript 2 (AVM1) bytecode into a C++ function, with Flash Player 8 semantics taken from Ruffle, and a new SDL2 and OpenGL engine reads the graphics, sounds, and music from your Isaac.exe at startup. Game logic still runs at 30 ticks per second, as in the original, and the picture is interpolated to your display’s refresh rate (60, 120, 144 Hz…); vector art is drawn at the screen’s native resolution, with no seams between colored areas. It recognizes the three versions by their content and lets you pick one at startup, each with its own save file, and it adds controller support without external tools, Rebirth-style analog movement (can be turned off), remappable controls, fullscreen or windowed play, and a converter for saves from the Flash version. Version 1.4.0 (October 20) was checked frame by frame against the original running in Ruffle, with every enemy, boss, item, pill, card, and trinket of the three versions, and fixed the few differences found. Its author states it was made with the help of AI (Claude). The repository includes the C++ generated from the game’s code for all three versions, about 10 MB for each of its two stage sizes (1440×1080 and 960×720)."
requirements:
  es: "El Isaac.exe de tu propia copia de The Binding of Isaac en Steam (y de Wrath of the Lamb, si quieres la expansión), copiado junto al programa; no sirve Binding_of_Isaac.exe, que es solo el lanzador de Steam. Además, Windows o Linux de 64 bits y una tarjeta gráfica con OpenGL 3.3."
  en: "The Isaac.exe from your own Steam copy of The Binding of Isaac (and of Wrath of the Lamb, for the expansion), copied next to the program; Binding_of_Isaac.exe, which is just the Steam launcher, won’t do. Plus 64-bit Windows or Linux and an OpenGL 3.3 graphics card."
