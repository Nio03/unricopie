name: "Ninja Gaiden II (TheSaltTrader)"
games: [ninja-gaiden-ii]
console: x360
status: playable
repo: FermataRest/Ninja-s-Dawn-A-Ninja-Gaiden-2-Recompilation-Project
author: TheSaltTrader
originalDeveloper: Team Ninja
year: 2008
toolchain: ReXGlue
desc:
  es: "Ninja's Dawn: recompilación estática de Ninja Gaiden II (título 544307D5) en un ejecutable nativo de Windows, sobre el SDK de ReXGlue. No es un emulador: el código PowerPC se traduce por adelantado a x86-64, así que no hay intérprete ni espera de calentamiento del JIT. El juego arranca como cualquier programa de Windows, a 60 fps y con ajustes propios de PC. Lo hizo TheSaltTrader, cuya cuenta y repositorio ya no están en GitHub; la copia más reciente que sigue en línea es la de FermataRest, con el código hasta la versión 1.0.24 (22 de septiembre), pero sin las versiones compiladas, así que hay que compilarlo siguiendo su README."
  en: "Ninja's Dawn: a static recompilation of Ninja Gaiden II (title 544307D5) into a native Windows executable, on the ReXGlue SDK. It isn’t an emulator: the PowerPC code is translated ahead of time to x86-64, so there’s no interpreter and no JIT warm-up. The game runs like any Windows program, at 60 fps, with PC-style settings. TheSaltTrader made it; that account and its repository are no longer on GitHub, and the most recent copy still online is FermataRest’s, with the code up to version 1.0.24 (September 22) but without the compiled releases, so you have to build it following its README."
requirements:
  es: "Tu propia copia de Ninja Gaiden II para Xbox 360, como imagen .iso o como carpeta ya extraída con su default.xex. El proyecto no distribuye ningún dato del juego. Para compilarlo, Windows 10 u 11 de 64 bits con Visual Studio 2022 Build Tools, LLVM/Clang, Ninja, CMake, Python 3.12 y el SDK de ReXGlue."
  en: "Your own copy of Ninja Gaiden II for Xbox 360, as an .iso image or an already extracted folder with its default.xex. The project ships no game data of any kind. To build it, 64-bit Windows 10 or 11 with Visual Studio 2022 Build Tools, LLVM/Clang, Ninja, CMake, Python 3.12, and the ReXGlue SDK."
tags:
  - powerpc
