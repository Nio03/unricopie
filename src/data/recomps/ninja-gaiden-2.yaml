name: Ninja Gaiden II
console: x360
status: playable
repo: TheSaltTrader/Ninja-s-Dawn---A-Ninja-Gaiden-2-Recompilation-Project
originalDeveloper: Team Ninja
year: 2008
toolchain: ReXGlue
desc:
  es: "Ninja's Dawn: recompilación estática de Ninja Gaiden II (título 544307D5) en un ejecutable nativo de Windows, sobre el SDK de ReXGlue. No es un emulador: el código PowerPC se traduce por adelantado a x86-64, así que no hay intérprete ni espera de calentamiento del JIT. El juego arranca como cualquier programa de Windows, a 60 fps y con ajustes propios de PC."
  en: "Ninja's Dawn: a static recompilation of Ninja Gaiden II (title 544307D5) into a native Windows executable, on the ReXGlue SDK. It isn’t an emulator: the PowerPC code is translated ahead of time to x86-64, so there’s no interpreter and no JIT warm-up. The game runs like any Windows program, at 60 fps, with PC-style settings."
requirements:
  es: "Tu propia copia de Ninja Gaiden II para Xbox 360, como imagen .iso o como carpeta ya extraída con su default.xex. El proyecto no distribuye ningún dato del juego."
  en: "Your own copy of Ninja Gaiden II for Xbox 360, as an .iso image or an already extracted folder with its default.xex. The project ships no game data of any kind."
tags:
  - powerpc
