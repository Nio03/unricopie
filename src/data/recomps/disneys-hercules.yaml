desc:
  es: "Hercules Recompiled: port nativo para Windows y Linux de las cinco versiones europeas del juego (inglesa, francesa, alemana, italiana y española), hecho con psxrecomp y once cambios propios al framework, junto con la decompilación en la que se apoya, del ejecutable principal y sus overlays, que se recompila idéntica byte a byte. La lógica del juego corre sin cambios como código recompilado estáticamente y solo se sustituye la capa de la plataforma: 1080p, 16:9 real (el juego dibuja también el decorado, el fondo, el HUD y, desde la 0.5.4, los personajes y objetos de los márgenes), sprites, texturas de los niveles y HUD en HD, simulación de CRT, estados de guardado y un launcher con el estilo de los menús del juego, en cinco idiomas, que arranca directamente en el nivel que elijas. Con Esc se abre un menú dentro del juego en el que todos los ajustes cambian al momento. Desde la 0.5.5 (18 de octubre), las versiones PAL van por defecto a la velocidad de la estadounidense, con 30 imágenes por segundo en lugar de 25; los 60 fps no son posibles, explica el autor, porque el juego espera dos fotogramas por paso. El launcher se actualiza solo. Tras la primera partida ofrece descargar el paquete HD de tu versión (unos 1,6 GB, con los gráficos del juego reescalados) desde una publicación del propio repositorio en GitHub, o dejarlo para más tarde; si no hay paquete para tu disco, lo genera en tu PC a partir de él, en unas 4 horas. 118 de sus 120 commits llevan a Claude como coautor."
  en: "Hercules Recompiled: a native Windows and Linux port of all five European releases of the game (English, French, German, Italian, and Spanish), built with psxrecomp plus eleven changes of its own to the framework, along with the decompilation it draws on, which covers the main executable and its overlays and rebuilds byte for byte. The game logic runs unchanged as statically recompiled code and only the platform layer is replaced: 1080p, true 16:9 (the game also draws the scenery, background, HUD and, since 0.5.4, the characters and objects in the side margins), HD sprites, level textures, and HUD, a CRT simulation, save states, and a launcher styled after the game’s menus, in five languages, that boots straight into the level you pick. Esc opens an in-game menu where everything changes live. Since 0.5.5 (October 18), the PAL releases run at the US release’s speed by default, with 30 pictures per second instead of 25; 60 fps isn’t possible, the author explains, because the game waits two frames per step. The launcher updates itself. After your first game it offers to download the HD pack for your release (about 1.6 GB, with the game’s graphics upscaled) from a release in the project’s own GitHub repository, or to leave it for later; if there’s no pack for your disc, it makes one on your PC from it in about 4 hours. 118 of its 120 commits list Claude as co-author."
requirements:
  es: "Tu propia imagen de disco (.cue con su .bin) de una de las versiones PAL: SCES-00891 (inglesa), SCES-00892 (francesa), SCES-00893 (alemana), SCES-00894 (italiana) o SCES-00895 (española); las versiones estadounidense y japonesa no funcionan. Además, Windows 10 u 11 de 64 bits o Linux x64 con glibc 2.35 o posterior (Ubuntu 22.04, Debian 12, Fedora 36 o más recientes). Para generar el paquete HD en tu equipo hacen falta 6 GB libres mientras dura."
  en: "Your own disc image (.cue with its .bin) of one of the PAL releases: SCES-00891 (English), SCES-00892 (French), SCES-00893 (German), SCES-00894 (Italian), or SCES-00895 (Spanish); the US and Japanese releases don’t work. Plus 64-bit Windows 10 or 11, or x64 Linux with glibc 2.35 or later (Ubuntu 22.04, Debian 12, Fedora 36, or newer). Making the HD pack on your machine needs 6 GB of free space while it runs."
