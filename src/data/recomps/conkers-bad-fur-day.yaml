  en: "Native port of the US version, statically recompiled with N64Recomp starting from the game’s decompilation. Ready-to-play builds are available for Windows, Linux, and Apple Silicon macOS: unpack it, run it, and pick your ROM in the launcher the first time. The package contains nothing from the game; everything is extracted from your ROM, on your machine, during the build."
