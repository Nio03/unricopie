desc:
  es: "SpaceAnimalsRecomp: recompilación estática del Star Fox de Switch 2 (el de 2026, con la actualización 2.0.0) en un programa nativo de Windows, sin emulador. El código ARM64 del juego se traduce a C++ con un recompilador propio y se compila para tu PC; la API gráfica de la consola (NVN) corre sobre Vulkan y los shaders del juego se traducen a SPIR-V. Según el README, el juego se puede terminar de principio a fin, aunque el proyecto se declara experimental: solo se probó en un PC, todavía faltan por traducir 80 de sus 2.468 etapas de shaders y los modos de 90 y 120 cuadros por segundo no son estables. Trae un launcher con opciones de imagen para PC, teclado y mando, los textos y voces en cualquiera de sus idiomas, y FSR y DLSS. El zip trae las herramientas para construir el juego en tu PC a partir de tu copia; ni el repositorio ni sus versiones traen archivos ni código del juego, aunque desde la 1.0.2 los zips incluyen como fondo del launcher unos vídeos cortos que el autor grabó jugando. El README dice que está hecho casi por completo con IA (Claude Code), y 18 de sus 22 commits llevan a Claude como coautor. La v1.1.0 es del 14 de noviembre."
  en: "SpaceAnimalsRecomp: a static recompilation of the Switch 2 Star Fox (the 2026 one, with update 2.0.0) into a native Windows program, with no emulator. The game’s ARM64 code is translated to C++ with its own recompiler and compiled for your PC; the console’s graphics API (NVN) runs on Vulkan and the game’s shaders are translated to SPIR-V. According to the README the game can be finished from start to end, though the project calls itself experimental: it has been tested on a single PC, 80 of its 2,468 shader stages are still untranslated, and the 90 and 120 frames-per-second modes aren’t stable. It comes with a launcher with PC display options, keyboard and controller support, the text and voices in any of the game’s languages, and FSR and DLSS. The zip carries the tools to build the game on your PC from your copy; neither the repository nor its releases contain the game’s files or code, though since 1.0.2 the zips include short clips the author recorded while playing, as the launcher’s background. The README says it’s made almost entirely with AI (Claude Code), and 18 of its 22 commits list Claude as a co-author. Version 1.1.0 is from November 14."
requirements:
  es: "Tu propia copia de Star Fox para Switch 2 con la actualización 2.0.0 (v131072), en un solo archivo .nup. Windows 10 u 11 de 64 bits con una CPU con AVX2, una GPU con Vulkan 1.3 (probado en NVIDIA; mejorado en AMD, sin probar en Intel), mejor con 32 GB de RAM, y unos 6 GB libres."
  en: "Your own copy of Star Fox for Switch 2 with update 2.0.0 (v131072), as a single .nup file. 64-bit Windows 10 or 11 with an AVX2 CPU, a Vulkan 1.3 GPU (tested on NVIDIA; improved on AMD, untested on Intel), ideally 32 GB of RAM, and about 6 GB free."
