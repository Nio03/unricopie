name: "Revelations: Persona"
games: [revelations-persona]
console: ps1
status: experimental
repo: NJH-1001/RevPRecompile
originalDeveloper: "Atlus"
year: 1996
toolchain: psxrecomp
desc:
  es: "Proyecto no oficial y no comercial de recompilación con psxrecomp de Revelations: Persona (versión estadounidense, SLUS-00339). Sus versiones públicas son a propósito kits de compilación y no ejecutables jugables: no traen datos del disco, BIOS comercial, código del juego generado ni un ejecutable ya compilado, y el código se genera y se compila en tu equipo a partir de tu disco. Su README da por comprobados el arranque con OpenBIOS, la secuencia de apertura, la pantalla de título, el reparto del mando digital y la configuración de teclado, y aclara que no afirma haber completado el juego. La 0.1.1 (28 de agosto) incluye un zip de Windows de unos 30 MB; el README solo da Windows como objetivo, aunque la release también publica zips para Linux y macOS."
  en: "An unofficial, noncommercial recompilation project with psxrecomp for Revelations: Persona (US version, SLUS-00339). Its public releases are deliberately build kits and not playable executables: they contain no disc data, retail BIOS, generated game code, or prebuilt executable, and the code is generated and built on your PC from your disc. Its README lists as verified booting on OpenBIOS, the opening sequence, the title screen, digital controller routing, and the keyboard configuration, and it states that it makes no claim of having completed the game. Version 0.1.1 (August 28) includes a Windows zip of about 30 MB; the README names only Windows as a target, though the release also publishes Linux and macOS zips."
requirements:
  es: "Tu propio volcado de la versión estadounidense (SLUS-00339) en CUE/BIN estilo Redump, con una sola pista de datos MODE2/2352. Windows 10 u 11 de 64 bits (x86-64, Intel o AMD); la primera compilación necesita Python 3 y una cadena CMake/Ninja, que el asistente descarga si falta. Usa OpenBIOS por defecto."
  en: "Your own dump of the US version (SLUS-00339) as a Redump-style CUE/BIN with a single MODE2/2352 data track. 64-bit Windows 10 or 11 (x86-64, Intel or AMD); the first build needs Python 3 and a CMake/Ninja toolchain, which the setup wizard downloads if missing. It uses OpenBIOS by default."
tags:
  - mips
  - rpg
