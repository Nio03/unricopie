desc:
  es: "Port nativo de la versión estadounidense de Xbox, por recompilación estática con XboxXBE-Recomp, para Windows con Direct3D 12 y, desde la 0.6.0 (20 de octubre), para Linux con Vulkan. Llega al juego libre por la ciudad: crear tu Urb, cargar la ciudad, los diálogos y las acciones sociales. Los barrios van a 60 fps con cualquier distancia de cámara, y a cualquier tasa de fotogramas el juego corre a su velocidad real, porque se corrigió cómo el motor mide el tiempo. Un panel de ajustes reúne la resolución, el formato y el ultrapanorámico, el HDR (solo en Windows), la escala de renderizado, el filtrado anisotrópico, una interfaz moderna y los trucos de consola del propio juego. Se juega con teclado y ratón o con mandos de Xbox, PlayStation y Switch."
  en: "A native port of the US Xbox release by static recompilation with XboxXBE-Recomp, for Windows with Direct3D 12 and, since 0.6.0 (October 20), for Linux with Vulkan. It reaches the free-roam city game: creating your Urb, loading the city, dialogue, and social moves. The districts hold 60 fps at any camera distance, and at any frame rate the game runs at its real speed, because the way the engine measures time was fixed. A settings panel gathers resolution, aspect ratio and ultrawide, HDR (Windows only), render scale, anisotropic filtering, a modern HUD, and the game’s own console cheats. It plays with keyboard and mouse or with Xbox, PlayStation, and Switch controllers."
requirements:
  es: "Tu propio disco estadounidense de The Urbz: Sims in the City para Xbox, como imagen o con los archivos extraídos; solo funciona con el ejecutable de esa versión. Además, Windows 10 u 11 de 64 bits con Direct3D 12, o Linux x86-64 con Vulkan 1.3."
  en: "Your own US The Urbz: Sims in the City Xbox disc, as an image or as extracted files; it only works with that release’s executable. Plus 64-bit Windows 10 or 11 with Direct3D 12, or x86-64 Linux with Vulkan 1.3."
