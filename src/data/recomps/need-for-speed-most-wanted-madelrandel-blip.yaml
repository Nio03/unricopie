desc:
  es: "Recompilación estática de la versión de Xbox 360 (Title ID 454107D9), hecha con el SDK de ReXGlue: el código PowerPC del default.xex se traduce a C++ por adelantado y se compila para x86-64, y el SDK aporta las llamadas al kernel, el sistema de archivos, el audio, los controles y la traducción de la GPU Xenos a Direct3D 12. El proyecto lo da por jugable «con asperezas»: pasa el prólogo y llega al mundo abierto, y se ha probado sobre todo en una gráfica integrada Intel Iris 540, a entre 18 y 38 fps a 854×480. Casi todos sus arreglos son parches al SDK: el atasco del descodificador de audio que dejaba el juego sin sonido y lo colgaba al volver al menú, la sincronización vertical y el límite de fotogramas, que el SDK no traía, y la velocidad del juego ajustable del 0 al 200 %. Un lanzador para Windows acepta la ISO, la extrae la primera vez y deja elegir el tamaño de la ventana, la resolución interna hasta x4, ventana o pantalla completa, el límite de fotogramas y la API gráfica. Vulkan sale en negro en gráficas Intel y el multijugador no funciona. La última versión para Windows es la 0.0.2 (18 de septiembre); la más reciente, del 8 de octubre, es solo para Android. Aunque el README dice lo contrario, el repositorio incluye el C++ generado a partir del default.xex del juego, más de 130 MB, y la versión de Android lleva dentro una caché con 136 shaders del juego extraídos de su archivo ZZDATA0.BIN."
  en: "A static recompilation of the Xbox 360 version (title ID 454107D9), built with the ReXGlue SDK: the PowerPC code in default.xex is translated to C++ ahead of time and compiled for x86-64, and the SDK provides the kernel calls, the file system, audio, input, and the translation of the Xenos GPU to Direct3D 12. The project calls it “playable, with rough edges”: it gets through the prologue into free roam, and it has mostly been tested on an Intel Iris 540 integrated GPU, at 18–38 fps at 854×480. Nearly all of its fixes are patches to the SDK: the audio decoder deadlock that left the game silent and froze it on returning to the menu, v-sync and a frame limiter, which the SDK lacked, and an adjustable 0–200% game speed. A Windows launcher takes the ISO, extracts it on first use, and lets you pick the window size, internal resolution up to 4x, windowed or fullscreen, a frame cap, and the graphics API. Vulkan renders black on Intel GPUs and multiplayer doesn’t work. The latest Windows release is 0.0.2 (September 18); the newest one, from October 8, is Android-only. Although the README says otherwise, the repository includes the C++ generated from the game’s default.xex, over 130 MB of it, and the Android build carries a cache of 136 of the game’s shaders extracted from its ZZDATA0.BIN file."
requirements:
  es: "Una ISO de tu propia copia de Need for Speed: Most Wanted para Xbox 360 en su versión PAL española, o la carpeta extraída; la PAL inglesa y la NTSC no sirven por ahora. Además, Windows 10 u 11 de 64 bits y una tarjeta gráfica con Direct3D 12 (nivel 11_0); si no la hay, intenta arrancar con WARP, el rasterizador por software de Windows, muy lento. Para compilarlo hacen falta las Build Tools de Visual Studio 2022, CMake 3.28, Ninja, Clang 20 y Python 3.10 o posteriores."
  en: "An ISO of your own copy of Need for Speed: Most Wanted for Xbox 360, Spanish PAL release, or the extracted folder; the English PAL and NTSC releases don’t work for now. Plus 64-bit Windows 10 or 11 and a Direct3D 12 graphics card (feature level 11_0); without one it tries WARP, Windows’ software rasterizer, which is very slow. Building it requires Visual Studio 2022 Build Tools, CMake 3.28, Ninja, Clang 20, and Python 3.10 or later."
