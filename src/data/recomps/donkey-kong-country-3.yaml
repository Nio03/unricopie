name: "Donkey Kong Country 3: Dixie Kong's Double Trouble!"
games: [donkey-kong-country-3-dixie-kongs-double-trouble]
console: snes
status: experimental
repo: elliotttate/DKC3Recomp
originalDeveloper: Rare
year: 1996
toolchain: snesrecomp
desc:
  es: "Recompilación de DKC3 hecha igual que DKC2Recomp: snesrecomp recompila estáticamente el código a C a partir de una configuración de bancos sacada de un desensamblado público, el entorno de ejecución compartido interpreta lo que el análisis no puede demostrar, y el proyecto tiene sus propias aplicaciones para ejecutar el juego en macOS y Windows. Está en plena puesta en marcha: su autor todavía no asegura que se pueda completar."
  en: "Recompilation of DKC3, built the same way as DKC2Recomp: snesrecomp statically recompiles the code to C from a bank configuration derived from a public disassembly, the shared runtime interprets whatever the analysis can’t prove, and the project’s own host apps run the game on macOS and Windows. Still in bring-up: its author doesn’t yet claim it can be completed."
requirements:
  es: "Tu propia ROM de Donkey Kong Country 3 (SNES, versión norteamericana en inglés y francés, sin cabecera, 4 MiB)."
  en: "Your own Donkey Kong Country 3 ROM (SNES, North American English/French version, headerless, 4 MiB)."
