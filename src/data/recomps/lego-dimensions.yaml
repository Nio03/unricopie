repo: NeverCookFirst/DimensionsRecomp
originalDeveloper: TT Games
year: 2015
desc:
  es: "Recompilación estática de la versión de Xbox 360 y, hasta donde sabemos, el primer recomp de un juego con figuras físicas (toys-to-life). Arranca, se juega, guarda la partida, carga los DLC y se comunica con el Toy Pad, real o emulado, como cualquier programa de Windows, con tasa de fotogramas desbloqueada, mods y varios idiomas. Su autor explica sin rodeos el porqué: quería comprobar si un juego de figuras podía recompilarse, y dice que la emulación sigue siendo una opción perfectamente válida para quien le funcione mejor."
  en: "Static recompilation of the Xbox 360 release and, as far as we know, the first recomp of a toys-to-life game. It boots, plays, saves, loads DLC, and talks to a Toy Pad (real or emulated) like any ordinary Windows program, with an unlocked frame rate, mods, and multilingual support. Its author is explicit about why: they wanted to find out whether a figures game could be recompiled, and they say emulation remains a perfectly valid option for anyone it works better for."
requirements:
