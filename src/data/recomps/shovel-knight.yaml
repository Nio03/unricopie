desc:
  es: "Recompilación estática de la versión estadounidense de PS Vita (1.00) con Project Nativ, que convierte el juego en un programa nativo para Windows, macOS y Linux (también la Steam Deck): el código del juego se traduce a C y las bibliotecas de Sony se recompilan a partir de tu firmware. Fue la primera prueba de la plataforma, y las notas de la primera versión aclaran que este juego no tiene mejoras y que se hizo sobre todo como prueba de concepto. Es el que menos tarda en compilarse la primera vez, unos dos minutos. La actualización 1.08 (Treasure Trove) todavía no está soportada: el juego funciona sin ella."
  en: "A static recompilation of the US PS Vita release (1.00) with Project Nativ, which turns the game into a native program for Windows, macOS, and Linux (Steam Deck included): the game’s code is translated to C and Sony’s libraries are recompiled from your firmware. It was the platform’s first proof, and the first release’s notes say this game isn’t enhanced and was mainly a proof of concept. It’s the quickest to build the first time, about two minutes. The 1.08 update (Treasure Trove) isn’t supported yet: the game runs without it."
requirements:
  es: "Tu propia copia estadounidense de Shovel Knight para PS Vita (PCSE00640), versión 1.00: la carpeta del juego copiada de tu Vita, con su licencia, o sus PKG, cuya licencia Nativ pide a tu Vita por wifi una sola vez. Además, el archivo de actualización del sistema de PS Vita (PSVUPDAT.PUP), gratis en la web de Sony. Windows 10 u 11 de 64 bits, macOS 11 o posterior en un Mac con Apple silicon, o Linux x86-64, Steam Deck incluida."
  en: "Your own US copy of Shovel Knight for PS Vita (PCSE00640), version 1.00: the game folder copied from your Vita, with its license, or its PKG files, whose license Nativ fetches from your Vita over Wi-Fi once. Plus the PS Vita system software update file (PSVUPDAT.PUP), free from Sony’s website. 64-bit Windows 10 or 11, macOS 11 or later on an Apple silicon Mac, or x86-64 Linux, Steam Deck included."
