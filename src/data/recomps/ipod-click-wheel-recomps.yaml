desc:
  es: "Seis juegos de los iPod Classic con rueda (Mini Golf, Cubis 2, Texas Hold’em, Lost, The Sims Bowling y Vortex) llevados a Windows, macOS y Linux. Apple vendió 54 juegos de este tipo en iTunes entre 2006 y 2009 y dejó de venderlos en 2011. El código ARM que corría en el iPod pasa a C++ compilable, sobre una base común con el renderizador por software, el entorno de ejecución, la capa de plataforma y el recompilador. Mini Golf es el más avanzado y el único terminado: todo su código está decompilado a mano, sin nada traducido a máquina; en los otros cinco, la traducción del binario se genera en tu equipo a partir de tu copia. La rueda se maneja con las flechas, un stick o la cruceta, con teclas reasignables en macOS y Windows. Añade escala de renderizado de hasta 8x, texto dibujado a la resolución de tu pantalla, 30 o 60 fps o sin límite, y trucos en algunos juegos, como desbloquear todos los campos de Mini Golf o todos los capítulos de Lost. En Linux no hay ventana de ajustes ni música de fondo. Mini Golf tiene además versiones para Switch y Android. La última versión, la 1.0.1, salió el 6 de septiembre. Su autor declara que se apoyó mucho en Claude, y 10 de sus 34 commits lo llevan como coautor."
  en: "Six click wheel iPod Classic games (Mini Golf, Cubis 2, Texas Hold’em, Lost, The Sims Bowling, and Vortex) brought to Windows, macOS, and Linux. Apple sold 54 such games on iTunes between 2006 and 2009 and stopped selling them in 2011. The ARM code the iPod ran becomes compilable C++, on a shared base with the software renderer, the runtime, the platform layer, and the recompiler. Mini Golf is the furthest along and the only finished one: all its code is decompiled by hand, with nothing machine-translated left; for the other five, the translation of the binary is generated on your machine from your copy. The wheel is handled with the arrow keys, a stick, or the D-pad, with rebindable keys on macOS and Windows. It adds a render scale of up to 8x, text drawn at your screen’s resolution, 30 or 60 fps or uncapped, and cheats in some games, such as unlocking every Mini Golf course or every Lost chapter. On Linux there’s no settings window and no background music. Mini Golf also has Switch and Android builds. The latest release, 1.0.1, came out on September 6. Its author states they relied heavily on Claude, and 10 of its 34 commits list it as a co-author."
requirements:
  es: "La carpeta descifrada de cada juego, sacada de tu propia copia (88888 para Mini Golf, 99999 para Cubis 2, 33333 para Texas Hold’em, 1B200 para Lost, 1500C para The Sims Bowling y 12345 para Vortex); el programa comprueba cada archivo por su tamaño y su suma de verificación. Además, Windows de 64 bits, macOS 11 o posterior (Apple Silicon o Intel) o Linux x86-64 con glibc 2.38 o posterior."
  en: "Each game’s decrypted folder, taken from your own copy (88888 for Mini Golf, 99999 for Cubis 2, 33333 for Texas Hold’em, 1B200 for Lost, 1500C for The Sims Bowling, and 12345 for Vortex); the program checks every file by size and checksum. Plus 64-bit Windows, macOS 11 or later (Apple silicon or Intel), or x86-64 Linux with glibc 2.38 or later."
tags:
