name: "Saw II: Flesh & Blood"
games: [saw-ii-flesh-and-blood]
console: x360
status: playable
repo: Matt-code-d/Saw2Recomp
originalDeveloper: "Zombie Studios"
year: 2009
toolchain: ReXGlue
desc:
  es: "Port nativo no oficial para PC de la versión de Xbox 360, hecho con el SDK de ReXGlue (v0.10.0): el código PowerPC de Default.xex, un juego de Unreal Engine 3, se traduce por adelantado a C++ y se enlaza con el runtime de ReXGlue (GPU Xenos, audio, entrada y sistema de archivos), sin JIT en el camino de juego. Según el README se puede jugar en Windows, con un launcher en WPF para instalar desde la ISO, detectar el idioma y activar opciones de ejecución habituales; sigue siendo temprano, con funciones PPC que faltan por indicar y algunos defectos gráficos, y los logros se desbloquean y se guardan aunque el aviso en pantalla está desactivado porque bloqueaba el juego. El repositorio no incluye juego, ISO ni XEX. El zip de la release (unos 32 MB) trae el programa ya construido. La versión 0.1.7 es del 27 de octubre."
  en: "An unofficial native PC port of the Xbox 360 version, made with the ReXGlue SDK (v0.10.0): the PowerPC code of Default.xex, an Unreal Engine 3 game, is translated ahead of time to C++ and linked against the ReXGlue runtime (Xenos GPU, audio, input, and filesystem), with no JIT in the play path. According to the README it is playable on Windows, with a WPF launcher to install from the ISO, detect the language, and set common runtime flags; it is still early, with missing PPC function hints to be added and some graphics quirks, and achievements unlock and persist though the on-screen toast is disabled because it crashed the game. The repository includes no game, ISO, or XEX. The release zip (about 32 MB) ships the program already built. Version 0.1.7 is from October 27."
requirements:
  es: "Tu propia copia de Saw II: Flesh & Blood para Xbox 360 (Title ID 4B4E0822), como ISO. Windows de 64 bits y el runtime de escritorio de .NET 8; para compilar desde el código, además, el SDK de .NET 8, extract-xiso y el SDK de ReXGlue."
  en: "Your own copy of Saw II: Flesh & Blood for Xbox 360 (Title ID 4B4E0822), as an ISO. 64-bit Windows and the .NET 8 Desktop Runtime; to build from source, also the .NET 8 SDK, extract-xiso, and the ReXGlue SDK."
tags:
