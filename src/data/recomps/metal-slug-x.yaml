name: "Metal Slug X"
games: [metal-slug-x]
console: ps1
status: experimental
repo: TechnicallyComputers/Metal-Slug-X-Recomp
originalDeveloper: "SNK"
year: 2001
toolchain: "psxrecomp"
desc:
  es: "Versión nativa no oficial de Metal Slug X para PC, hecha por recompilación estática con PSXRecomp y el lanzador recomp-ui; no es un emulador. El proyecto del juego guarda la configuración, las semillas de funciones y el pegamento de compilación. El repositorio incluye el código C generado a partir del ejecutable del juego (unos 99 MB, carpeta generated), y las versiones publicadas lo llevan ya compilado; los datos del juego salen de tu disco. Hay compilaciones para Windows, Linux y macOS (Intel y Apple Silicon); la v0.1.21 (1 de octubre) es la última. El README no indica qué funciona y qué no. 2 de sus 69 commits llevan a Claude como coautor."
  en: "An unofficial native PC version of Metal Slug X, made by static recompilation with PSXRecomp and the recomp-ui launcher; it is not an emulator. The game project holds the configuration, function seeds, and build glue. The repository includes the C code generated from the game’s executable (about 99 MB, generated folder), and the published releases ship it already compiled; the game’s data comes from your disc. There are builds for Windows, Linux, and macOS (Intel and Apple Silicon); v0.1.21 (October 1) is the latest release. The README does not say what works and what doesn’t. 2 of its 69 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Metal Slug X de EE. UU. (SLUS-01212) como imagen .cue/.bin."
  en: "Your own US copy of Metal Slug X (SLUS-01212) as a .cue/.bin image."
