name: "The Legend of Zelda: Ocarina of Time 3D (TriAevum)"
games: [the-legend-of-zelda-ocarina-of-time-3d]
console: 3ds
status: experimental
repo: coccofresco/TriAevum
originalDeveloper: Grezzo
year: 2011
desc:
  es: "TriAevum: recompilación estática por adelantado (AOT) del remake de 3DS, con su propio renderizador NRI/Vulkan, una interfaz de una sola pantalla y ajustes gráficos. No recompila el original de N64, sino la versión de Grezzo. Se apoya en código de proyectos ya maduros (Azahar, Ship of Harkinian, NRI), y su autor declara que el trabajo propio de TriAevum está hecho por completo con asistencia de IA, bajo dirección humana. Está en alfa."
  en: "TriAevum: an ahead-of-time static recompilation of the 3DS remake, with its own NRI/Vulkan renderer, a single-screen interface, and graphics options. It doesn’t recompile the N64 original but Grezzo’s version. It leans on code from mature projects (Azahar, Ship of Harkinian, NRI), and its author states that the TriAevum-specific work is entirely AI-assisted, under human direction. In alpha."
requirements:
  es: "Tu propia ROM de Ocarina of Time 3D (versión europea o estadounidense), descifrada y en formato .3ds o .cci. Windows x64 y una tarjeta gráfica compatible con Vulkan."
  en: "Your own Ocarina of Time 3D ROM (European or US version), decrypted and in .3ds or .cci format. Windows x64 and a Vulkan-capable GPU."
