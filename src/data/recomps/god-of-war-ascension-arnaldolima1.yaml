name: "God of War: Ascension (arnaldolima1)"
console: ps3
status: experimental
repo: arnaldolima1/gow-ascension-pc
author: arnaldolima1
originalDeveloper: SIE Santa Monica Studio
year: 2013
toolchain: ps3recomp
desc:
  es: "Ascension: experimento de recompilación estática de la versión europea de PS3 para Windows, con un fork de ps3recomp que traduce a C++ el código del procesador principal y de las SPU. Todavía no se juega de principio a fin: llega del arranque al primer nivel, con Kratos encadenado, pero el nivel va a unos 9 fps (el menú principal, a unos 28), y el límite está en el código SPU recompilado. Tiene dos renderizadores: el RSX de RPCS3 (Vulkan u OpenGL), que dibuja el juego correctamente, y uno propio en Direct3D 12. Un launcher en portugués, inglés y español reúne el vídeo, los controles de teclado, ratón y mando, nueve idiomas con subtítulos, copias de seguridad de las partidas y mods; uno de ellos monta el portugués de Brasil a partir de tu disco estadounidense. Todavía no hay versión publicada. Es hermano de los ports de los God of War de PSP del mismo autor. 93 de sus últimos 100 commits llevan a Claude como coautor."
  en: "Ascension: an experiment in static recompilation of the European PS3 release for Windows, with a fork of ps3recomp that translates the main processor’s and the SPUs’ code to C++. It isn’t playable from start to finish yet: it gets from boot to the first level, with Kratos in chains, but the level runs at about 9 fps (the main menu at about 28), and the bottleneck is the recompiled SPU code. It has two renderers: RPCS3’s RSX code (Vulkan or OpenGL), which draws the game correctly, and its own Direct3D 12 one. A launcher in Portuguese, English, and Spanish covers video, keyboard, mouse, and controller controls, nine languages with subtitles, save backups, and mods; one of them builds Brazilian Portuguese from your US disc. There’s no release yet. It’s a sibling of the same author’s ports of the PSP God of War games. 93 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia europea de God of War: Ascension para PS3 (BCES-01741, versión 1.00), sacada de tu disco, con el EBOOT.BIN descifrado con RPCS3 o con tu propio archivo de claves; para el mod en portugués de Brasil, también tu disco estadounidense. Para compilarlo, Windows 10 u 11 de 64 bits, Visual Studio 2022 (clang-cl), CMake, Ninja, el SDK de Vulkan y 16 GB de memoria; la primera compilación tarda de 20 a 40 minutos."
  en: "Your own European copy of God of War: Ascension for PS3 (BCES-01741, version 1.00), taken from your disc, with EBOOT.BIN decrypted using RPCS3 or your own keys file; for the Brazilian Portuguese mod, your US disc too. To build it, 64-bit Windows 10 or 11, Visual Studio 2022 (clang-cl), CMake, Ninja, the Vulkan SDK, and 16 GB of memory; the first build takes 20 to 40 minutes."
