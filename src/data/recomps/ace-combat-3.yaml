desc:
  es: "Port nativo para Windows de la versión japonesa de PlayStation, hecho por recompilación estática del código MIPS a C, enlazado con versiones reescritas de las bibliotecas Psy-Q que usaba el juego, sin emulador de CPU debajo; los overlays pasan por un intérprete. El repositorio no trae código del juego: la traducción a C se genera en tu equipo a partir de tu disco al configurar la compilación. Salen dos programas: ac3.exe dibuja el juego por software, píxel a píxel como la consola, y ac3_enhanced.exe añade un renderizador Vulkan con escala de resolución de 1x a 8x, 16:9, texturas con corrección de perspectiva y, en vuelo, más distancia de dibujado, atmósfera, nubes, océano y bosque, con un menú de ajustes en F1. Monta los dos discos a la vez, así que nunca pide cambiar de disco, y admite mando por SDL y teclado. Incluye la traducción al inglés de Team NEMO (v0.9b3), que se aplica en memoria sin tocar tus imágenes. Hay una versión ya compilada, la V0.5 BETA (2 de octubre): algunas escenas se ven mal con la panorámica y algunos vídeos de las misiones quedan tapados por el terreno y las nubes, cosas que se evitan desactivando esas opciones. Es del mismo autor que la recompilación de Ace Combat 6."
  en: "A native Windows port of the Japanese PlayStation release, made by statically recompiling the MIPS code to C and linking it against rewritten versions of the Psy-Q libraries the game used, with no CPU emulator underneath; overlays run through an interpreter. The repository contains no game code: the C translation is generated on your machine from your disc when you configure the build. It produces two programs: ac3.exe draws the game in software, pixel for pixel as the console did, and ac3_enhanced.exe adds a Vulkan renderer with a 1–8x resolution scale, 16:9, perspective-correct textures and, in flight, longer draw distance, atmosphere, clouds, ocean, and forest, with a settings menu on F1. It mounts both discs at once, so it never asks for a disc swap, and supports SDL controllers and keyboard. It includes Team NEMO’s English fan translation (v0.9b3), applied in memory without touching your images. There’s a prebuilt release, V0.5 BETA (October 2): some cutscenes look wrong in widescreen and some in-mission videos get covered by terrain and clouds, which turning those options off avoids. It’s by the author of the Ace Combat 6 recompilation."
requirements:
  es: "Los dos discos de tu propia copia japonesa de Ace Combat 3: Electrosphere (SLPS-02020 y SLPS-02021), en la revisión «Rev 1», como .bin con sectores de 2352 bytes y con los nombres de Redump. Además, Windows de 64 bits y una tarjeta gráfica con controlador Vulkan. Para compilarlo hacen falta Visual Studio 2022 o sus Build Tools, LLVM (clang), CMake, Ninja, Python 3, el SDK de Vulkan y SDL3."
  en: "Both discs of your own Japanese copy of Ace Combat 3: Electrosphere (SLPS-02020 and SLPS-02021), the “Rev 1” revision, as .bin files with 2352-byte sectors and their Redump names. Plus 64-bit Windows and a graphics card with a Vulkan driver. Building it requires Visual Studio 2022 or its Build Tools, LLVM (clang), CMake, Ninja, Python 3, the Vulkan SDK, and SDL3."
