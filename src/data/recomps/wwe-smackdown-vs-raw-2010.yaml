desc:
  es: "Port nativo para Windows de la versión de Xbox 360, por recompilación estática con el SDK de ReXGlue y con un renderizador nativo adaptado del de re:Blue, que en lugar de emular la GPU de la consola observa la biblioteca Direct3D del juego y dibuja las mismas escenas con Direct3D 12 o Vulkan; en Linux y Steam Deck funciona con Proton. Mantiene el modo propio del juego a 60 fps también en los combates, donde la consola bajaba a 30, con resolución de 480p a 8K y el desenfoque de bordes y el de fondo desactivados por defecto, aunque se pueden volver a activar. Los combates cargan en unos 15 segundos y no hay tirones la primera vez. Deja elegir el idioma del texto entre inglés, español, francés, alemán e italiano (los comentarios, solo en inglés), usar tus propias canciones como música de entrada, como hacía la consola con las del disco duro, y cargar tus propios DLC. Funciona con mandos de Xbox, PlayStation, Switch Pro y Steam Deck; el teclado está sin probar. Se actualiza desde el propio juego cuando tú lo decides, con copia de las partidas. Road to WrestleMania con un luchador creado puede cerrarse tras el segundo combate. La 2.0 salió el 21 de octubre. La descarga incluye, dentro del ejecutable, los shaders del juego ya convertidos para PC."
  en: "A native Windows port of the Xbox 360 version, by static recompilation with the ReXGlue SDK and a native renderer adapted from re:Blue’s, which instead of emulating the console’s GPU watches the game’s Direct3D library and draws the same scenes with Direct3D 12 or Vulkan; on Linux and Steam Deck it runs through Proton. It keeps the game’s own 60 fps mode in matches too, where the console dropped to 30, with 480p to 8K resolution and the edge blur and background blur off by default, though both can be turned back on. Matches load in about 15 seconds and there are no first-time stutters. You can pick the text language among English, Spanish, French, German, and Italian (commentary is English only), use your own songs as entrance music, as the console did with songs from its hard drive, and load your own DLC. It works with Xbox, PlayStation, Switch Pro, and Steam Deck controllers; keyboard controls are untested. It updates from inside the game when you choose to, backing up your saves first. Road to WrestleMania with a created superstar can crash after the second match. 2.0 came out on October 21. The download includes, inside the executable, the game’s shaders already converted for PC."
requirements:
  es: "Una imagen .iso de tu propio disco de WWE SmackDown vs. Raw 2010 para Xbox 360, versión de EE. UU. o Europa (Title ID 54510844, Media ID 518DE415, unos 7,3 GB); los DLC, opcionales, también de tu consola. Además, Windows 10 u 11 de 64 bits y una tarjeta gráfica con Direct3D 12 o Vulkan, o Linux o Steam Deck con Proton Experimental."
  en: "A .iso image of your own WWE SmackDown vs. Raw 2010 disc for Xbox 360, US or European release (Title ID 54510844, Media ID 518DE415, about 7.3 GB); optional DLC also from your console. Plus 64-bit Windows 10 or 11 and a Direct3D 12 or Vulkan graphics card, or Linux or Steam Deck with Proton Experimental."
