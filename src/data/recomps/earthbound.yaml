name: "EarthBound / Mother 2 (Phase Distorter)"
console: snes
status: playable
repo: TheRunaway5/Phase-Distorter
originalDeveloper: Ape / HAL Laboratory
year: 1994
forkOf:
  label: Herringway/ebsrc
  url: https://github.com/Herringway/ebsrc
desc:
  es: "Phase Distorter: port nativo para Linux y Windows de EarthBound (versión estadounidense) y Mother 2 (versión japonesa), escrito en C++20. El programa del 65816 se traduce a C++ a partir del desensamblado ebsrc, conservando los nombres de archivo y los números de línea del original para poder rastrear de dónde sale cada parte; los recursos del juego se importan de tu propia ROM. Incluye modo panorámico 16:9, 21:9 y 32:9 con el escenario ampliado, filtro CRT opcional, compatibilidad con mando, guardado persistente y una ventana de ajustes."
  en: "Phase Distorter: a native Linux and Windows port of EarthBound (US) and Mother 2 (Japanese), written in C++20. The 65816 program is translated to C++ from the ebsrc disassembly, keeping the original’s file names and line numbers so every part can be traced back; the game’s assets are imported from your own ROM. It ships 16:9, 21:9, and 32:9 widescreen with expanded scenery, an optional CRT filter, controller support, persistent saves, and a settings window."
requirements:
  es: "Tu propia ROM de EarthBound (estadounidense, en inglés) o de Mother 2 (japonesa). No se incluyen ROMs ni paquetes de recursos extraídos."
  en: "Your own EarthBound (US, English) or Mother 2 (Japanese) ROM. Neither ROMs nor extracted asset packs are included."
tags:
  - "65816"
