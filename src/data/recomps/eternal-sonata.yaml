desc:
  es: "«Eternal Sonata: Reprise», recompilación estática de la versión de Xbox 360 hecha con el SDK de ReXGlue. Funciona con los datos de la versión de Xbox 360 o de la de PS3, de cualquier región; desde la 1.3.1 (16 de octubre) acepta todas las versiones de PS3, y con sus datos Crescendo y Serenade se unen al grupo y luchan en los combates. Desde la 1.2.0 (18 de septiembre) usa un renderizador propio en lugar del de Xenia y tiene versiones para Windows, Linux y macOS, además de una experimental para Android. Ofrece cualquier resolución y formato de pantalla, FPS sin límite, teclado y ratón, multijugador local con varios mandos y un lanzador propio con gestor de mods. También se instala desde Goopie, el launcher del mismo autor."
  en: "“Eternal Sonata: Reprise,” a static recompilation of the Xbox 360 version built with the ReXGlue SDK. It runs on the data from either the Xbox 360 or the PS3 version, from any region; since 1.3.1 (October 16) it accepts every PS3 version, and with that data Crescendo and Serenade join the party and fight in battle. Since 1.2.0 (September 18) it uses its own renderer instead of Xenia’s, with builds for Windows, Linux, and macOS, plus an experimental Android one. It offers any resolution and aspect ratio, an unlocked frame rate, keyboard and mouse, local multiplayer with several controllers, and its own launcher with a mod manager. It can also be installed from Goopie, the same author’s launcher."
requirements:
  es: "Tu propia copia de Eternal Sonata, de Xbox 360 o de PS3, de cualquier región (PAL, EE. UU. o Japón). Para compilar el ejecutable tú mismo hace falta la versión PAL de Xbox 360."
  en: "Your own copy of Eternal Sonata, Xbox 360 or PS3, from any region (PAL, US, or Japan). Building the executable yourself requires the Xbox 360 PAL version."
