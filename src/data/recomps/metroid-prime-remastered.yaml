originalDeveloper: "Retro Studios"
year: 2023
desc:
  es: "PrimeRecomp ejecuta Metroid Prime Remastered, de Nintendo Switch, de forma nativa en Windows, macOS (Apple Silicon) y Linux, incluida la Steam Deck. El código del juego se recompila estáticamente del ARM64 de la Switch a C y se compila para tu PC, y los servicios del sistema y los gráficos NVN de la consola se reimplementan con Vulkan; no hay ningún emulador. Está construido sobre LAS Recomp, de Peiikai, que el README reconoce como la base de casi todo lo que lo hace posible. Ofrece ratón con puntería directa, pantalla ultraancha y cualquier relación de aspecto, 30, 60 o 120 cuadros por segundo, presets para la Steam Deck, puntería con giroscopio y poder saltar cualquier escena. El README avisa de numerosos problemas gráficos. La última versión, la 0.0.4 (29 de octubre), es una beta temprana. 97 de sus últimos 100 commits llevan a Claude como coautor."
  en: "PrimeRecomp runs Metroid Prime Remastered, from the Nintendo Switch, natively on Windows, macOS (Apple Silicon), and Linux, including the Steam Deck. The game’s code is statically recompiled from the Switch’s ARM64 to C and compiled for your PC, and the console’s system services and NVN graphics are reimplemented with Vulkan; no emulator runs. It is built on Peiikai’s LAS Recomp, which the README credits for nearly everything that makes it possible. It offers mouse aiming that aims directly, ultrawide and any aspect ratio, 30, 60, or 120 frames per second, Steam Deck presets, gyro aiming, and skippable cutscenes. The README warns of numerous graphics issues. The latest release, 0.0.4 (October 29), is an early beta. 97 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Metroid Prime Remastered para Nintendo Switch, versión 1.0.0 (sin actualizaciones), volcada de tu consola y extraída en una carpeta con exefs y romfs. Windows 10 u 11 de 64 bits, Linux de 64 bits con glibc 2.35 o superior, o un Mac con Apple Silicon y macOS 15 o superior; en Windows y Linux, una CPU con AVX2 y una GPU con controlador Vulkan 1.3. Unos 15 GB libres."
  en: "Your own copy of Metroid Prime Remastered for Nintendo Switch, version 1.0.0 (no updates), dumped from your console and extracted into a folder holding exefs and romfs. 64-bit Windows 10 or 11, 64-bit Linux with glibc 2.35 or newer, or a Mac with Apple Silicon and macOS 15 or newer; on Windows and Linux, an AVX2 CPU and a GPU with a Vulkan 1.3 driver. About 15 GB free."
