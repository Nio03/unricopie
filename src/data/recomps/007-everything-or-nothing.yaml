toolchain: XboxXBE-Recomp
desc:
  es: "Port nativo no oficial a PC de la versión de la Xbox original de 007: Everything or Nothing, con opciones gráficas ampliadas y otras mejoras. El código x86 del juego se recompila de forma estática con Xbox XBE Recomp a ejecutables de Windows, uno para el juego a pie y los menús (EoN.exe) y otro para las misiones de conducción (EoNDriving.exe), y las bibliotecas de gráficos, sonido y sistema de la consola se reimplementan (Direct3D 12 u 11, XAudio2, SDL); no es un emulador. Se juega a pie y en las misiones de conducción, con partidas guardadas, hasta la última misión, y trae pantalla ancha y ultrapanorámica, teclado y ratón y 60 FPS en la conducción. La única descarga es EoNLauncher.exe (unos 2 MB; la 1.0.2 es del 29 de octubre), que construye el juego en tu equipo a partir de tu disco: el código del juego nunca se descarga. Sus últimos 100 commits llevan a Claude como coautor."
  en: "An unofficial native PC port of the original Xbox version of 007: Everything or Nothing, with extended graphics options and other enhancements. The game’s x86 code is statically recompiled with Xbox XBE Recomp into Windows executables, one for on-foot play and the menus (EoN.exe) and another for the driving missions (EoNDriving.exe), and the console’s graphics, sound, and system libraries are reimplemented (Direct3D 12 or 11, XAudio2, SDL); it is not an emulator. It plays on foot and in the driving missions, with saves, up to the last mission, and brings widescreen and ultrawide, keyboard and mouse, and 60 FPS driving. The only download is EoNLauncher.exe (about 2 MB; 1.0.2 is from October 29), which builds the game on your PC from your disc: the game’s code is never downloaded. Its last 100 commits all list Claude as a co-author."
requirements:
  es: "Tu propia copia de 007: Everything or Nothing para la Xbox original, europea (PAL) o estadounidense (NTSC), como imagen .iso o carpeta; el README da las sumas SHA-1 del default.xbe y del driving.xbe de cada edición. Windows 10 u 11 de 64 bits con una tarjeta gráfica con Direct3D 12 u 11."
  en: "Your own copy of 007: Everything or Nothing for the original Xbox, European (PAL) or US (NTSC), as an .iso image or folder; the README gives the SHA-1 sums of each edition’s default.xbe and driving.xbe. 64-bit Windows 10 or 11 with a Direct3D 12 or 11 graphics card."
