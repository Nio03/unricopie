name: "Luigi's Mansion"
console: gamecube
status: playable
repo: rob646464/luigis-mansion-recompiled
originalDeveloper: Nintendo EAD
year: 2001
desc:
  es: "Luigi's Mansion Recompiled: port nativo para Windows y Linux. La primera vez que arranca te pide tu imagen de disco, y su propio recompilador traduce el main.dol del juego a C++ y lo compila con el clang que trae incluido, en unos 20 a 60 segundos; los límites de cada función salen del mapa de símbolos de la decompilación lm-decomp, y las funciones del SDK de la GameCube se sustituyen por implementaciones propias sobre Aurora. Funciona a cualquier resolución, en panorámica y ultrapanorámica Hor+ con el HUD pegado a los bordes, y mantiene la lógica a 30 actualizaciones por segundo con fotogramas intermedios interpolados hasta 320 fps, compatible con VRR. Reproduce con precisión el renderizado de la GameCube (copias del EFB, texturas de profundidad, sombras en tiempo real, efectos indirectos, mezcla a 6 bits) y precompila los sombreadores antes de empezar. Añade una iluminación mejorada opcional (luces por píxel y de color, sombras suaves, una linterna realista, bloom), la Mansión Oculta europea con sus cambios en los jefes si también das el disco europeo, contenido descartado restaurado y desactivado por defecto (el modo para dos jugadores está sin terminar), un visor de modelos y ajustes de dificultad. La 1.1 (21 de octubre) añadió actualizaciones automáticas, una nueva oclusión ambiental y un filtro CRT con varios tipos de señal. 554 de sus 641 commits llevan a Claude como coautor."
  en: "Luigi’s Mansion Recompiled: a native port for Windows and Linux. On first launch it asks for your disc image, and its own recompiler translates the game’s main.dol to C++ and compiles it with the bundled clang in about 20 to 60 seconds; function boundaries come from the lm-decomp decompilation’s symbol map, and the GameCube SDK functions are replaced with host implementations on Aurora. It runs at any resolution, in Hor+ widescreen and ultrawide with the HUD anchored to the screen edges, and keeps game logic at 30 updates per second with interpolated in-between frames up to 320 fps, VRR-aware. It reproduces GameCube rendering accurately (EFB copies, depth textures, real-time shadows, indirect effects, 6-bit blending) and precompiles shaders before the game starts. It adds optional enhanced lighting (per-pixel and colored lights, soft shadows, a realistic flashlight, bloom), the European Hidden Mansion with its boss changes if you also supply the European disc, restored unused content that’s off by default (the two-player mode is unfinished), a model viewer, and difficulty settings. Version 1.1 (October 21) added automatic updates, new ambient occlusion, and a CRT filter with several signal types. 554 of its 641 commits list Claude as co-author."
requirements:
  es: "Tu propia imagen de disco de Luigi's Mansion para GameCube, versión estadounidense (GLME01) o europea (GLMP01), o las dos, que es lo recomendable para tener todo el contenido; admite ISO, GCM, RVZ, WIA, GCZ, CISO, NFS y TGC, y rechaza otras revisiones o imágenes modificadas. Además, Windows 10 u 11 de 64 bits con Direct3D 12, o Linux x86-64 con glibc 2.34 o posterior y Vulkan, y unos 2 GB libres."
  en: "Your own Luigi’s Mansion disc image for GameCube, US (GLME01) or European (GLMP01), or both, which is recommended to get all the content; ISO, GCM, RVZ, WIA, GCZ, CISO, NFS, and TGC are accepted, and other revisions or modified images are rejected. Plus 64-bit Windows 10 or 11 with Direct3D 12, or x86-64 Linux with glibc 2.34 or later and Vulkan, and about 2 GB of free space."
