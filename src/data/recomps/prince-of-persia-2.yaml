name: "Prince of Persia 2: The Shadow and the Flame"
console: dos
status: fully
repo: Supermedo/prince-of-persia-2-windows
originalDeveloper: Brøderbund
year: 1993
desc:
  es: "Recompilación estática del PRINCE.EXE de DOS a C, enlazada con un pequeño entorno para Windows: la lógica del juego, el dibujo, la introducción y el controlador de música son el código original, y solo el hardware del PC (VGA, temporizador, teclado, Sound Blaster/AdLib) se sustituye por código nativo, sin DOSBox ni emulador. El repositorio tiene el recompilador, escrito en Python, que decodifica el código 8086, el entorno y el launcher; el C del juego se genera en tu equipo a partir de tu copia, y la versión publicada trae pop2.exe ya compilado, sin datos, gráficos ni música del juego. Imita una Sound Blaster Pro: el controlador FM del juego, recompilado, toca la música en un OPL2 emulado sin importar cómo se configuró tu copia en el SETUP de DOS, y los efectos suenan como muestras digitales. Dibuja con OpenGL, con filtros (Sharp, que mantiene los píxeles nítidos a cualquier tamaño, Pixel, Soft y Smooth HQ) y vistas 4:3, estirada o panorámica que solo estira los lados, y admite mandos de Xbox, PlayStation y Switch. Los 14 niveles, la introducción, los finales, las partidas guardadas y el límite de 75 minutos funcionan igual que en DOS; lo único nuevo son puntos de control opcionales en cada sala, desactivados por defecto. La 1.0 salió el 23 de septiembre."
  en: "A static recompilation of the DOS PRINCE.EXE to C, linked with a small Windows runtime: the game logic, rendering, intro, and music driver are the original code, and only the PC hardware (VGA, timer, keyboard, Sound Blaster/AdLib) is replaced with native code, with no DOSBox or emulator. The repository holds the recompiler, written in Python, which decodes the 8086 code, plus the runtime and the launcher; the game’s C code is generated on your machine from your copy, and the published release ships a prebuilt pop2.exe with no game data, art, or music. It emulates a Sound Blaster Pro: the game’s own FM driver, recompiled, plays the music on an emulated OPL2 no matter how your copy was set up in the DOS SETUP, and effects play as digital samples. It draws with OpenGL, with filters (Sharp, which keeps pixels crisp at any size, Pixel, Soft, and Smooth HQ) and 4:3, stretched, or panorama views, the last stretching only the sides, and supports Xbox, PlayStation, and Switch controllers. All 14 levels, the intro, the endings, saved games, and the 75-minute limit behave just as under DOS; the only addition is optional per-room checkpoints, off by default. Version 1.0 came out on September 23."
requirements:
  es: "Tu propia copia de Prince of Persia 2 para DOS: la carpeta con PRINCE.EXE y los archivos .DAT. Además, Windows 10 u 11 de 64 bits. Para compilarlo hacen falta clang y llvm-rc (LLVM para Windows) y Python 3."
  en: "Your own copy of the DOS Prince of Persia 2: the folder with PRINCE.EXE and the .DAT files. Plus 64-bit Windows 10 or 11. Building it takes clang and llvm-rc (LLVM for Windows) and Python 3."
tags:
