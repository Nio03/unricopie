desc:
  es: "Port nativo para Windows del arcade de Sega de 1998, para la placa Sega Model 3 Step 2.1. El README dice que no es un emulador: el código PowerPC original se recompila a C++ (3.407 funciones) y corre con un renderizador Vulkan moderno; se apoya en el código del port de The Lost World del mismo autor. Según su documentación, se juega de principio a fin, todas las fases, con sonido, música y voces de la Digital Sound Board. Ofrece pantalla ancha de verdad (16:9, 21:9, 32:9 y 48:9 para tres monitores), sombras de sol con trazado de rayos, oclusión ambiental, bruma, resplandor y HDR, un espacio y una Estrella de la Muerte redibujados para este port, MSAA o DLAA de NVIDIA, texto en alta definición, movimiento fluido a 120 o 144 Hz dibujando la imagen entre los fotogramas del juego, sonido envolvente, ratón, mando (también con giroscopio y ayuda al apuntado) o pistola de luz, la vibración del mueble como vibración del mando, ajustes de calidad, logros y estadísticas. Prepara un modo nuevo, Dogfight. No publica versiones: install.bat instala lo necesario y compila el juego a partir de tu ROM, y update.bat lo actualiza. Código bajo licencia MIT. 41 de sus 68 commits llevan a Claude como coautor."
  en: "A native Windows port of Sega’s 1998 arcade game, for the Sega Model 3 Step 2.1 board. The README says it is not an emulator: the original PowerPC code is recompiled to C++ (3,407 functions) and runs with a modern Vulkan renderer; it builds on the code of the same author’s The Lost World port. According to its documentation, it plays from start to end, every stage, with sound, music, and the Digital Sound Board’s voices. It offers true widescreen (16:9, 21:9, 32:9, and 48:9 for three monitors), ray-traced sun shadows, ambient occlusion, haze, bloom, and HDR, space and a Death Star redrawn for this port, MSAA or NVIDIA DLAA, HD text, smooth motion at 120 or 144 Hz by drawing the image between the game’s frames, surround sound, mouse, gamepad (with gyro and aim assist too) or light gun, the cabinet’s force feedback as rumble, quality presets, achievements, and stats. A new mode, Dogfight, is in the works. It publishes no releases: install.bat installs what’s needed and builds the game from your ROM, and update.bat updates it. The code is under the MIT license. 41 of its 68 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia del ROM arcade swtrilgy.zip, el juego Rev. A (Sega Model 3 Step 2.1), con archivos como epr-21379a.17 y mpr-21339.01, y también epr-21119.ic8, el programa de la placa de vibración, que falta en algunos volcados antiguos; otras versiones no funcionan. Además, Windows 10 u 11 de 64 bits y una tarjeta gráfica con Vulkan 1.3. install.bat instala con winget Python 3 y las Build Tools de Visual Studio 2022 (unos GB), y la compilación descarga SDL3 y el DLSS de NVIDIA."
  en: "Your own copy of the arcade ROM swtrilgy.zip, the Rev. A set (Sega Model 3 Step 2.1), with files such as epr-21379a.17 and mpr-21339.01, and also epr-21119.ic8, the force feedback board’s program, which some older sets lack; other versions will not work. Plus 64-bit Windows 10 or 11 and a graphics card with Vulkan 1.3. install.bat installs Python 3 and the Visual Studio 2022 Build Tools (a few GB) with winget, and the build downloads SDL3 and NVIDIA DLSS."
