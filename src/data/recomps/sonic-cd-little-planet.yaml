name: "Sonic CD (Little Planet)"
console: megacd
status: playable
repo: carlosrmz009/littleplanet
originalDeveloper: Sonic Team
year: 1993
desc:
  es: "Little Planet: port nativo para Windows, macOS y Linux (x86-64 y ARM64) de la versión de Mega-CD (Sega CD). Lleva un desensamblado de todo el código del juego que, al volver a ensamblarse, da exactamente los mismos bytes que el disco, y un recompilador estático que lo convierte en C, que es lo que se ejecuta; se comprueba fotograma a fotograma contra un intérprete. El resto de la máquina está escrito desde cero: los dos 68000, el Z80, el VDP, el sonido FM, PSG y PCM, la unidad de CD y el chip gráfico del Mega-CD, y no hace falta la BIOS, porque las llamadas del juego se sustituyen por una implementación de alto nivel. Añade un modo panorámico True16:9 que muestra más nivel en lugar de estirar la imagen (activado por defecto), filtros como CRT o Scale4x, controles reasignables, estados de guardado, avance rápido y un guardado automático tras cada zona. Sustituye el vídeo de apertura por la remasterización en 4K y 60 fps de LuanUP, incluida con su permiso; el original sigue disponible en los ajustes. Acepta imágenes cue/bin, iso, ccd/img, chd y cue con las pistas de audio en wav, flac, ogg o mp3. La versión 1.0 salió el 11 de octubre y se vuelve a generar con cada cambio del código; la última es del 19 de octubre. De sus 36 commits, 27 llevan a Claude como coautor. El repositorio incluye el desensamblado de los 112 archivos ejecutables del disco, solo el código: los gráficos, el sonido y los niveles se leen de tu copia."
  en: "Little Planet: a native port of the Mega-CD (Sega CD) version for Windows, macOS, and Linux (x86-64 and ARM64). It carries a disassembly of all the game’s code that reassembles byte-identical to the disc, and a static recompiler that turns it into C, which is what runs; it’s checked frame by frame against an interpreter. The rest of the machine is written from scratch: both 68000s, the Z80, the VDP, FM, PSG, and PCM sound, the CD drive, and the Mega-CD graphics chip, and no BIOS is needed, since the game’s calls are replaced by a high-level implementation. It adds a True16:9 widescreen mode that shows more of the level instead of stretching the picture (on by default), filters such as CRT or Scale4x, remappable controls, save states, fast-forward, and an automatic save after every zone. It replaces the opening movie with LuanUP’s 4K 60 fps remaster, included with their permission; the original is still available in the settings. It accepts cue/bin, iso, ccd/img, chd, and cue images with wav, flac, ogg, or mp3 audio tracks. Version 1.0 came out on October 11 and is rebuilt with every code change; the latest build is from October 19. Of its 36 commits, 27 list Claude as co-author. The repository includes the disassembly of the disc’s 112 executable files, code only: graphics, sound, and levels are read from your copy."
requirements:
  es: "Tu propia imagen de disco de Sonic CD para Mega-CD. La versión probada es la japonesa (G-6021, con el SHA-1 de la pista de datos que indica el README); las demás arrancan, pero no están probadas. Además, Windows de 64 bits, macOS 11 o posterior (Apple Silicon o Intel) o Linux x86-64 o ARM64."
  en: "Your own Sonic CD disc image for Mega-CD. The tested release is the Japanese one (G-6021, with the data-track SHA-1 given in the README); other releases boot but are untested. Plus 64-bit Windows, macOS 11 or later (Apple silicon or Intel), or x86-64 or ARM64 Linux."
