desc:
  es: "Conker: Live & Recompiled: port nativo para Windows del Conker: Live & Reloaded de Xbox, por recompilación estática con xboxrecomp, el kit de Ned Heller (sp00nznet), a través de un fork propio. El programa original del juego se traduce a C y se compila como un programa normal de Windows. No es un emulador: un pequeño entorno de ejecución sustituye al sistema de la Xbox, a su chip gráfico (ahora con Direct3D 11), al de sonido (emulado como en xemu) y a los mandos. Según el README, la historia se juega entera, el multijugador funciona contra bots y las partidas se guardan y se cargan; el autor lo comparó fotograma a fotograma con el juego original en xemu. Va a cualquier resolución y proporción, con una escala de renderizado del 50 al 200 % (con FSR 1 por debajo del 100 %), a 60 fps con el juego a su velocidad correcta (o a 30, como el original), con filtrado anisotrópico, FXAA o SMAA y nitidez CAS, y con un arreglo que mantiene a la vista la hierba, el pelaje y los personajes lejanos; el desenfoque, el brillo, la neblina y la viñeta se pueden ajustar o quitar. Añade teclado y ratón con vista libre en todo el juego, mandos de PS4 y PS5 sin programas aparte, vibración, un modo foto, textos en seis idiomas (las voces siguen en inglés), texturas propias en PNG y arreglos de fallos que también tenía la versión de Xbox. El launcher importa tu copia desde una imagen de disco, el default.xbe o un .zip, .7z o .rar, comprueba que es la edición PAL o la estadounidense y se actualiza solo; si lo pides, también baja el parche de descensura hecho por fans de nastys, Vaani y Theconker64. Xbox Live y System Link no funcionan. El README dice que la mayor parte del código la escribió IA, como Claude Code, bajo la dirección del autor. La última versión es la 0.1.3 (31 de octubre)."
  en: "Conker: Live & Recompiled: a native Windows port of the Xbox’s Conker: Live & Reloaded, statically recompiled with xboxrecomp, Ned Heller’s (sp00nznet) toolkit, through its author’s own fork. The game’s original program is translated to C and built as a normal Windows program. It isn’t an emulator: a small runtime stands in for the Xbox’s system, its graphics chip (now Direct3D 11), its sound chip (emulated as in xemu), and its controllers. According to the README, the story plays from start to finish, multiplayer works against bots, and saving and loading work; the author checked it frame by frame against the original game running in xemu. It runs at any resolution and aspect ratio, with a 50–200% render scale (FSR 1 below 100%), at 60 fps with the game running at its correct speed (or at 30, like the original), with anisotropic filtering, FXAA or SMAA, and CAS sharpening, and with a fix that keeps grass, fur, and distant characters in view; depth of field, glow, haze, and the vignette can be adjusted or turned off. It adds keyboard and mouse with mouse look everywhere, PS4 and PS5 controllers with no extra programs, rumble, a photo mode, text in six languages (the voices stay in English), custom PNG textures, and fixes for glitches the Xbox version had too. The launcher imports your copy from a disc image, the default.xbe, or a .zip, .7z, or .rar, checks that it’s the PAL or US edition, and updates itself; if you want, it also downloads the fan-made decensor patch by nastys, Vaani, and Theconker64. Xbox Live and System Link don’t work. The README says most of the code was written by AI, such as Claude Code, under the author’s direction. The latest version is 0.1.3 (October 31)."
requirements:
  es: "Tu propia copia de Conker: Live & Reloaded para la Xbox original, de la edición PAL o la estadounidense: una imagen de disco (.iso de Redump o XISO), el default.xbe del disco o un .zip, .7z o .rar con cualquiera de los dos. El launcher comprueba la edición y copia unos 4,5 GB. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con DirectX 11 y unos 5 GB libres; las ediciones N de Windows necesitan el Media Feature Pack de Microsoft para los vídeos."
  en: "Your own copy of Conker: Live & Reloaded for the original Xbox, PAL or US edition: a disc image (a Redump .iso or XISO), the disc’s default.xbe, or a .zip, .7z, or .rar holding either. The launcher checks the edition and copies about 4.5 GB. Plus 64-bit Windows 10 or 11, a DirectX 11 graphics card, and about 5 GB of free space; Windows N editions need Microsoft’s Media Feature Pack for the movies."
