name: "Sega Superstars Tennis"
games: [sega-superstars-tennis]
console: x360
status: playable
repo: m1ndcrap/Sega-Superstars-Tennis-ReMatch
originalDeveloper: "Sumo Digital"
year: 2008
toolchain: ReXGlue
desc:
  es: "Port nativo para Windows y Linux de la versión de Xbox 360 de Sega Superstars Tennis, recompilada con el SDK ReXGlue 0.10.0. El código del juego corre como x64 nativo y los gráficos usan un renderizador propio (Direct3D 12 y Vulkan) que traduce los shaders de Xbox 360; no es un emulador. Añade una página de vídeo en los ajustes y en el menú de pausa (resolución interna de hasta 2160p, FXAA y MSAA, sombras, bloom, calidad de shaders, límite de 30 o 60 cuadros por segundo), relaciones de aspecto de 4:3 a 32:9 con la vista 3D ensanchada, teclado y ratón con teclas reasignables, indicaciones de botones de Xbox, PlayStation o teclado y una opción de salir en el menú principal. El juego en línea aparece desactivado. La última versión es la 0.6.1 (24 de octubre), con paquetes para Windows y Linux. El autor declara que usó IA para entender el port de Mac y los shaders de Xbox 360 y para depurar, y que escribió a mano la mayor parte del código."
  en: "A native Windows and Linux port of the Xbox 360 version of Sega Superstars Tennis, recompiled with ReXGlue SDK 0.10.0. The game’s code runs as native x64 and the graphics use a custom renderer (Direct3D 12 and Vulkan) that translates the Xbox 360 shaders; it is not an emulator. It adds a video page to the settings and the pause menu (internal resolution up to 2160p, FXAA and MSAA, shadows, bloom, shader quality, a 30 or 60 frames-per-second limit), aspect ratios from 4:3 to 32:9 with the 3D view widened, keyboard and mouse with rebindable keys, Xbox, PlayStation, or keyboard button prompts, and a quit option on the main menu. Online play is shown greyed out. The latest release is 0.6.1 (October 24), with Windows and Linux packages. The author states that AI was used to understand the Mac port and the Xbox 360 shaders and to debug, and that most of the code was handwritten."
requirements:
  es: "Tu propia copia de Sega Superstars Tennis para Xbox 360; para compilar, el README pide poner el juego extraído en la carpeta assets, de modo que exista assets/default.xex. Además, Windows 10 u 11 de 64 bits con una tarjeta gráfica Direct3D 12, o Linux de 64 bits con glibc 2.38 o superior y un controlador Vulkan 1.3."
  en: "Your own copy of Sega Superstars Tennis for Xbox 360; to build, the README asks for the extracted game in the assets folder so that assets/default.xex exists. Plus 64-bit Windows 10 or 11 with a Direct3D 12 graphics card, or 64-bit Linux with glibc 2.38 or newer and a Vulkan 1.3 driver."
