desc:
  es: "Port nativo no oficial de Super Mario Odyssey (versión 1.0.0) para Windows, Linux y macOS, llamado Power Moon Recomp. Está hecho por recompilación estática sobre LAS Recomp: el código ARM64 del juego se traduce a C por adelantado y se compila en tu equipo, mientras que el núcleo, los servicios, el audio y la API gráfica NVN de Switch se reimplementan, con Vulkan en Windows y Linux y Metal en macOS. No es un emulador. Según el README, en Windows y Linux se ha jugado el juego entero, con jefes, secciones en 2D y 8 bits, final y posjuego, a 60 fps; la versión de Mac es una compilación de prueba, con problemas esperables. Ofrece resolución interna de hasta 4x, FSR 1, pantalla ultrapanorámica, interpolación de fotogramas experimental para pantallas de 120 Hz o más y mods. Las descargas (un zip para Windows y un AppImage para Linux) no traen código ni datos del juego: el instalador recompila el código en tu equipo la primera vez; no hemos comprobado su contenido. Su repositorio está en GitLab, porque su autor dice que GitHub le cerró la cuenta; la 0.2.0 es del 3 de noviembre y publicó 8 versiones entre el 2 y el 3 de noviembre. Declara que se hizo con mucha ayuda de Claude; 4 de sus 22 commits lo llevan como coautor."
  en: "An unofficial native port of Super Mario Odyssey (version 1.0.0) for Windows, Linux, and macOS, called Power Moon Recomp. It is made by static recompilation on top of LAS Recomp: the game’s ARM64 code is translated into C ahead of time and compiled on your PC, while the Switch kernel, services, audio, and the NVN graphics API are reimplemented, with Vulkan on Windows and Linux and Metal on macOS. It is not an emulator. According to the README, the whole game has been played through on Windows and Linux, with bosses, the 2D and 8-bit sections, the ending, and the post-game, at 60 fps; the Mac version is a test build, with problems to be expected. It offers internal resolution up to 4x, FSR 1, ultrawide support, experimental frame interpolation for displays at 120 Hz or more, and mods. The downloads (a zip for Windows and an AppImage for Linux) carry no game code or data: the setup recompiles the code on your PC the first time; we haven’t checked their contents. Its repository is on GitLab, because its author says GitHub closed their account; version 0.2.0 is from November 3, and it published 8 releases between November 2 and November 3. It states it was made with heavy help from Claude; 4 of its 22 commits list it as a co-author."
requirements:
  es: "Tu propia copia de Super Mario Odyssey 1.0.0, sin actualizaciones, extraída (carpetas exefs y romfs) de tu propia consola. Además, Windows 10 u 11 (x64) o Linux (x64, glibc 2.35 o posterior) con una CPU con AVX2 y una GPU con Vulkan 1.3, o macOS 15 o posterior con Apple silicon; 8 GB de RAM (16 GB recomendados) y unos 7 GB libres de disco."
  en: "Your own copy of Super Mario Odyssey 1.0.0, with no updates, extracted (exefs and romfs folders) from your own console. Plus Windows 10 or 11 (x64) or Linux (x64, glibc 2.35 or later) with an AVX2 CPU and a Vulkan 1.3 GPU, or macOS 15 or later on Apple silicon; 8 GB of RAM (16 GB recommended) and about 7 GB of free disk space."
