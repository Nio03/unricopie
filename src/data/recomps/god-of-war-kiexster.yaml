desc:
  es: "Port nativo para PC de God of War (PS2, NTSC-U, SCUS-97399), por recompilación estática a C++ del ejecutable SCUS_973.99 con PS2Recomp, compilado como un programa de Windows. Desde octubre de 2026 usa el runtime del port nativo de Waffle565, que sustituye cada pieza de hardware de la PS2 por código nativo: la CPU, el VU1 y los módulos del IOP se compilan con antelación, el GS se dibuja con un renderizador OpenGL a doble resolución interna y los archivos se leen del disco extraído en lugar de la ISO. El repositorio solo contiene lo específico del juego (el mapa de 6.414 funciones, la configuración del recompilador, parches y herramientas), no archivos del juego ni el C++ generado. Según su README arranca, carga los datos y llega al juego con teclado o mando (menús, partida nueva y la pelea en el barco, con HUD) a velocidad exacta; los 60 fps aún no se alcanzan en escenas pesadas, un cuelgue intermitente del hilo de la ventana está en investigación y falta la partida completa. Declara que se hizo con IA (Claude Code y OpenAI Codex); 49 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A native PC port of God of War (PS2, NTSC-U, SCUS-97399), by static recompilation of the SCUS_973.99 executable to C++ with PS2Recomp, compiled into a Windows program. Since October 2026 it uses the runtime of Waffle565’s native port, which replaces every piece of PS2 hardware with native code: the CPU, VU1, and the IOP modules are compiled ahead of time, the GS is drawn with an OpenGL renderer at double internal resolution, and files are read from the extracted disc instead of the ISO. The repository only holds what is specific to the game (the map of 6,414 functions, the recompiler configuration, patches, and tools), no game files and no generated C++. According to its README it boots, loads its data, and reaches gameplay with keyboard or gamepad (menus, new game, and the fight on the ship, with HUD) at exact game speed; 60 fps isn’t reached in heavy scenes yet, an intermittent hang of the window thread is under investigation, and a full playthrough is pending. It states it was made with AI (Claude Code and OpenAI Codex); 49 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de God of War para PS2, NTSC-U (SCUS-97399), de la que se extraen los archivos del disco (unos 8,5 GB). Windows 10 u 11 de 64 bits, Visual Studio 2022 Build Tools con C++, Git y Python 3, unos 20 GB libres y 16 GB de RAM recomendados."
  en: "Your own copy of God of War for PS2, NTSC-U (SCUS-97399), from which the disc’s files are extracted (about 8.5 GB). 64-bit Windows 10 or 11, Visual Studio 2022 Build Tools with C++, Git, and Python 3, about 20 GB free, and 16 GB of RAM recommended."
