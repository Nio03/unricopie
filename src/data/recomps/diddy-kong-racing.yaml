desc:
  es: "Recompilación del juego de karts y aventura de Rare en una fase temprana: arranca y llega al mundo central, pero se cierra. Usa su propia emulación de alto nivel (HLE) del microcódigo, y el audio está desactivado. 38 de sus 40 commits llevan a Claude como coautor."
  en: "Early recompilation of Rare’s kart and adventure game: it boots to the hub world but then crashes. It uses its own high-level emulation (HLE) of the microcode, and audio is disabled. 38 of its 40 commits list Claude as a co-author."
