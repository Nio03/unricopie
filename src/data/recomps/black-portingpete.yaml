desc:
  es: "Black 2006 Recomp: recompilación estática para Windows de la versión de Xbox, independiente de las de TGP482 y Spark198rus y hecha con xboxrecomp; en Linux funciona con Wine o Proton, y desde la alpha.2 se puede compilar entero en Linux. Dibuja con Direct3D 11 y tiene teclado y ratón, mandos XInput y audio nativo. Su launcher comprueba tu disco, lo copia, instala con winget las herramientas que falten y compila el juego en tu equipo; también tiene ajustes, reasignación de teclas, un editor de partidas para desbloquear misiones y menús en seis idiomas. Añade oclusión ambiental (SSAO, HBAO, HBAO+ o GTAO), reflejos en pantalla en lugar de los mapas de entorno de 128×128, campo de visión más amplio, modo foto, puntos de control que se conservan entre sesiones, mira y marcadores de impacto opcionales y pantalla partida para dos jugadores, en pruebas. Admite como opción el paquete de texturas BLACK HD Reimagined, hecho para la versión de PS2 y que se descarga aparte de ModDB, gracias a una tabla que empareja 1161 texturas del juego con las del paquete. Está probado hasta la primera misión; el resto no se ha jugado entero. La última versión publicada, la 0.1.0-alpha.2, es del 14 de octubre. Su README dice que se desarrolló con ayuda de Claude Code y de Codex de OpenAI. El repositorio incluye traducciones de los 1724 textos de los menús del juego a cinco idiomas y subtítulos de nueve escenas, con la transcripción de sus diálogos en inglés y sus traducciones; los textos originales de los menús se toman de tu copia."
  en: "Black 2006 Recomp: a static recompilation of the Xbox version for Windows, separate from TGP482’s and Spark198rus’s ports and built with xboxrecomp; on Linux it runs through Wine or Proton, and since alpha.2 it can be built entirely on Linux. It draws with Direct3D 11 and has keyboard and mouse, XInput controllers, and native audio. Its launcher checks your disc, copies it, installs any missing tools with winget, and builds the game on your machine; it also has settings, key rebinding, a save editor to unlock missions, and menus in six languages. It adds ambient occlusion (SSAO, HBAO, HBAO+, or GTAO), screen-space reflections in place of the 128×128 environment maps, a wider field of view, a photo mode, checkpoints kept between sessions, an optional crosshair and hit markers, and experimental two-player split screen. It optionally supports the BLACK HD Reimagined texture pack, made for the PS2 version and downloaded separately from ModDB, through a table that pairs 1,161 game textures with the pack’s files. It has been tested through the first mission; the rest hasn’t been played through. The latest published release, 0.1.0-alpha.2, came out on October 14. Its README says it was developed with help from Claude Code and OpenAI Codex. The repository includes translations of the game’s 1,724 menu texts into five languages and subtitles for nine cutscenes, with an English transcript of their dialogue and its translations; the original menu text is taken from your copy."
requirements:
  es: "Tu propia copia de Black para Xbox, la versión compatible (el default.xbe tiene que dar el SHA-256 que indica el README), como ISO (XISO o volcado completo de Redump) o carpeta extraída; las demás versiones y la de PS2 no sirven. Además, Windows de 64 bits, un procesador con AVX2 y una tarjeta gráfica con Direct3D 11; para compilar, las herramientas de C++ de Visual Studio 2022, CMake, Python y Rust, que el launcher puede instalar. En Linux, Wine o Proton con d3dcompiler_47 nativo."
  en: "Your own copy of Black for Xbox, the supported release (default.xbe must match the SHA-256 given in the README), as an ISO (XISO or a full Redump dump) or an extracted folder; other releases and the PS2 version won’t work. Plus 64-bit Windows, a CPU with AVX2, and a Direct3D 11 graphics card; building needs Visual Studio 2022’s C++ tools, CMake, Python, and Rust, which the launcher can install. On Linux, Wine or Proton with native d3dcompiler_47."
