desc:
  es: "Tekken 6 Native Online: Tekken 6 de Xbox 360 recompilado para Windows, sin emulador, con netcode de rollback (al estilo de GGPO) y una sala en línea en el launcher. El launcher comprueba tu imagen de disco, copia los datos del juego, traduce su código a partir de tu copia y lo compila en tu PC en unos 3 a 10 minutos, según el procesador. Está pensado para los combates en línea: el juego arranca directamente en la pelea, gana quien se lleva tres rondas y hay partidas igualadas por MMR, clasificación, historial de las últimas 100 partidas y aspecto personalizado del personaje. Desde la 2.3.2 tiene un modo de práctica, y la 2.3.4 (20 de octubre) le sumó datos de fotogramas como los de Tekken 8 y la lista de controles. El launcher se actualiza solo, y la mayoría de las actualizaciones no obligan a volver a compilar el juego. El código fuente está publicado en un repositorio aparte (Ekspym/tekken6-native-online-source), sin todo el historial: cada versión se añade como un commit. Su autor agradece a mahmoud-mess su recompilación de Tekken 6, que le dio un código recompilado más rápido."
  en: "Tekken 6 Native Online: Tekken 6 for Xbox 360 recompiled for Windows, with no emulator, rollback netcode (on the GGPO principle), and an online lobby in the launcher. The launcher checks your disc image, copies the game data, translates the game’s code from your copy, and compiles it on your PC in about 3 to 10 minutes, depending on the CPU. It’s built for online matches: the game starts straight into the fight, the first player to win three rounds takes the match, and there’s MMR-based ranked matchmaking, a leaderboard, a history of your last 100 matches, and custom character looks. Since 2.3.2 it has a practice mode, and 2.3.4 (October 20) added Tekken 8-style frame data and the move list. The launcher updates itself, and most updates don’t require rebuilding the game. The source code is published in a separate repository (Ekspym/tekken6-native-online-source), without the full history: each release is added as one commit. Its author credits mahmoud-mess’s Tekken 6 recompilation for faster recompiled code."
requirements:
  es: "Tu propia imagen de disco de Tekken 6 para Xbox 360, la versión de Estados Unidos y Europa en su revisión 1 (.iso o la carpeta del disco extraída); el launcher rechaza las demás. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con DirectX 12 y unos 10 GB libres (6,7 GB de datos del juego más la compilación). Los dos jugadores deben usar la misma versión."
  en: "Your own Tekken 6 Xbox 360 disc image, the USA and Europe release, revision 1 (.iso or the extracted disc folder); the launcher refuses other versions. Plus 64-bit Windows 10 or 11, a DirectX 12 graphics card, and about 10 GB of free space (6.7 GB of game data plus the build). Both players must use the same version."
