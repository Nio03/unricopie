desc:
  es: "Port nativo para Windows y Linux de la versión mundial de Xbox 360 (título 544307D5), por recompilación estática con el SDK de ReXGlue y XenosRecomp para los shaders. En lugar de emular la GPU, un renderizador propio en Vulkan, inspirado en el de Unleashed Recompiled, recoge las llamadas gráficas del juego. Va a 60 fps estables, también en la Steam Deck, con escala de render de 1x a 8x, MSAA hasta 8x, filtrado anisotrópico, bloom y formatos 4:3, 16:9, 16:10, 21:9 y 32:9 con el HUD en las esquinas. Añade teclado y ratón con los dibujos de las teclas en los avisos del juego, iconos de Xbox, PlayStation y Nintendo, opciones de la Master Edition de alicenotmech, saltar la intro y cualquier escena, trucos (salud y ninpo infinitos, dificultades y trajes desbloqueados), mods por carpeta y un modo portable. La primera vez instala el juego desde tu disco, después pide el Title Update 3 y, si quieres, los DLC. Algunas escenas pueden tener un pequeño desfase de audio, y el ratón en los menús está pendiente. Se ha probado en Linux, la Steam Deck y Proton, y el autor pide informes desde Windows. La v0.5.57 (7 de noviembre) es la última de 13 versiones. 42 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A native Windows and Linux port of the World Xbox 360 release (title 544307D5), by static recompilation with the ReXGlue SDK and XenosRecomp for the shaders. Instead of emulating the GPU, its own Vulkan renderer, inspired by Unleashed Recompiled’s, picks up the game’s graphics calls. It runs at a steady 60 fps, on the Steam Deck too, with render scale from 1x to 8x, up to 8x MSAA, anisotropic filtering, bloom, and 4:3, 16:9, 16:10, 21:9, and 32:9 with the HUD in the corners. It adds keyboard and mouse with the keys’ own pictures in the game’s prompts, Xbox, PlayStation, and Nintendo icons, options from alicenotmech’s Master Edition, skipping the intro and any cutscene, cheats (infinite health and ninpo, difficulties and costumes unlocked), folder mods, and a portable mode. On first run it installs the game from your disc, then asks for Title Update 3 and, if you want, the DLC. Some cutscenes may have a slight audio delay, and mouse support in the menus is still to come. It’s been tested on Linux, the Steam Deck, and Proton, and the author asks for reports from Windows. v0.5.57 (November 7) is the latest of 13 releases. 42 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Ninja Gaiden II, versión mundial (544307D5), como imagen .iso, paquete Games on Demand o carpeta extraída con su default.xex, y su Title Update 3 (TU_1A461UL_000000G000000.00000000000O4); la TU3 japonesa no sirve. Los DLC (Mission Mode y los trajes) son opcionales. Además, Windows 10 u 11 de 64 bits o Linux x86-64 (glibc 2.35 o posterior), con una CPU con SSE4.2 y una GPU con Vulkan 1.3."
  en: "Your own copy of Ninja Gaiden II, World release (544307D5), as an .iso image, a Games on Demand package, or an extracted folder with its default.xex, plus its Title Update 3 (TU_1A461UL_000000G000000.00000000000O4); the Japanese TU3 won’t work. The DLC (Mission Mode and the costumes) is optional. Plus 64-bit Windows 10 or 11 or x86-64 Linux (glibc 2.35 or newer), with an SSE4.2 CPU and a Vulkan 1.3 GPU."
