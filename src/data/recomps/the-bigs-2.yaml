name: The Bigs 2
console: x360
status: playable
repo: mdomangue26/thebigs2
author: mdomangue26
originalDeveloper: Blue Castle Games
year: 2009
toolchain: ReXGlue
desc:
  es: "Port nativo para Linux y Windows de la versión de Xbox 360, por recompilación estática con la rama de desarrollo del SDK de ReXGlue y una serie de arreglos propios al SDK. Según su autor, arranca, se juega, guarda y carga en Linux; la versión de Windows se compila desde Linux y solo se ha probado con Wine. Hay una AppImage específica para la Steam Deck, donde va a 30 fps. La primera vez, una pantalla de configuración elige tu imagen de disco y la extrae. Corre a 30 fps en los partidos, como la consola, con un modo experimental a 60; la resolución interna sube hasta 4K y el teclado hace de mando del jugador 1. Sus 37 commits llevan a Claude como coautor."
  en: "A native Linux and Windows port of the Xbox 360 version, by static recompilation with the ReXGlue SDK’s development branch plus a set of the author’s own SDK fixes. According to its author, it boots, plays, saves, and loads on Linux; the Windows build is cross-compiled on Linux and has only been tested under Wine. There’s a dedicated AppImage for the Steam Deck, where it runs at 30 fps. On first launch, a setup screen picks your disc image and extracts it. It runs at 30 fps in games, like the console, with an experimental 60 fps mode; the internal resolution goes up to 4K and the keyboard acts as player 1’s controller. All 37 of its commits list Claude as a co-author."
requirements:
  es: "Tu propio disco de The Bigs 2 para Xbox 360, como imagen de disco o extraído, con un default.xex idéntico al de la versión compatible. Además, Linux de 64 bits o Windows 10 u 11 de 64 bits con un controlador Vulkan."
  en: "Your own The Bigs 2 Xbox 360 disc, as a disc image or extracted, with a default.xex identical to the supported version’s. Plus 64-bit Linux or 64-bit Windows 10 or 11 with a Vulkan driver."
