desc:
  es: "Recompilación estática de The Legend of Zelda: Tears of the Kingdom a una aplicación nativa de Windows x86-64. El instalador construye el juego en tu equipo a partir de tus archivos, y el resultado contiene el juego, por lo que es solo para uso propio. El README la describe como un desarrollo temprano: se puede jugar en Windows, pero se esperan errores visuales y cierres. Admite las actualizaciones 1.2.1 y 1.4.3 con partidas guardadas compatibles entre ambas, 60 cuadros por segundo por defecto (hasta 144 o la frecuencia del monitor, de forma experimental), resoluciones personalizadas con supermuestreo y AMD FSR 1, teclado, ratón y mando con giroscopio, y shaders preparados durante la instalación. La primera versión salió el 29 de octubre. El 31, la 0.1.9 añadió las resoluciones ultrapanorámicas y la 0.2.1, una versión nativa para Linux en AppImage, con ajustes de partida para la Steam Deck que todavía no se han medido en una; los mods hechos para emuladores siguen como plan. 66 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A static recompilation of The Legend of Zelda: Tears of the Kingdom into a native Windows x86-64 application. The installer builds the game on your PC from your files, and the result contains the game, so it is for your own use only. The README describes it as early development: it is playable on Windows, but visual bugs and crashes are expected. It supports updates 1.2.1 and 1.4.3 with saves that carry over between them, 60 fps by default (up to 144 or the monitor’s refresh rate, experimentally), custom resolutions with supersampling and AMD FSR 1, keyboard, mouse, and gamepad with gyro, and shaders prepared at install time. The first release came out on October 29. On the 31st, 0.1.9 added ultrawide resolutions and 0.2.1 a native Linux build as an AppImage, with Steam Deck defaults that haven’t been measured on one yet; mods made for emulators are still planned. 66 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de The Legend of Zelda: Tears of the Kingdom para Nintendo Switch, volcada de tu consola: el juego base y la actualización 1.2.1 o 1.4.3. Windows 10 o posterior, una CPU x86-64 con AVX2, una GPU con Vulkan 1.3 y VK_EXT_external_memory_host, y unos 36 GiB libres durante la instalación (20 GiB después)."
  en: "Your own copy of The Legend of Zelda: Tears of the Kingdom for Nintendo Switch, dumped from your console: the base game and the 1.2.1 or 1.4.3 update. Windows 10 or later, an x86-64 CPU with AVX2, a GPU with Vulkan 1.3 and VK_EXT_external_memory_host, and about 36 GiB free during setup (20 GiB after)."
