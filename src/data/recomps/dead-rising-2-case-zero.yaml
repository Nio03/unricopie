desc:
  es: "Port nativo del prólogo de Dead Rising 2 exclusivo de Xbox 360 (XBLA) para Windows, Linux, Steam Deck y Mac con Apple Silicon. El código del juego, 57.822 funciones PowerPC, se tradujo de antemano con XenonRecomp y XenosRecomp, y corre sobre un motor propio con renderizador Vulkan, sonido XMA real y teclado y ratón con los iconos de las teclas en pantalla; también admite cualquier mando que reconozca SDL, con vibración. Su autor lo da por terminado con la versión 1.1.3 (14 de octubre): se puede jugar de principio a fin, solo o en cooperativo en línea para dos, un modo que el juego de Xbox tenía en el código pero nunca mostró y que funciona a través del launcher de XenonLive. Sube el nivel máximo de 5 a 50 con las quince habilidades, activa el modo oculto a 60 fps y recupera el menú de opciones de PC que el juego traía desactivado, con resolución hasta 5K, calidad de sombras y, desde la 1.1.3, más distancia de dibujado para zombis, edificios y sombras. Añade imagen ultrapanorámica 21:9, MSAA 2x, campo de visión ajustable y, como opción, el menú de depuración de los desarrolladores. La versión para Mac es preliminar. El autor ha dejado el desarrollo y deja el código y la documentación para quien quiera seguirlo. Casi todos sus commits (1.709 de 1.738) llevan a Claude como coautor."
  en: "Native port of the Xbox 360 (XBLA) exclusive prologue to Dead Rising 2 for Windows, Linux, Steam Deck, and Apple Silicon Macs. The game’s code, 57,822 PowerPC functions, was translated ahead of time with XenonRecomp and XenosRecomp, and runs on a purpose-built engine with a Vulkan renderer, real XMA audio, and keyboard and mouse with key icons in the on-screen prompts; any controller SDL recognizes also works, with vibration. Its author calls it finished with version 1.1.3 (October 14): it’s playable from start to finish, solo or in two-player online co-op, a mode the Xbox build carried in its code but never showed, which works through the XenonLive launcher. It raises the level cap from 5 to 50 with all fifteen skills, surfaces the game’s hidden 60 fps mode, and revives the PC options menu the game shipped dormant, with resolutions up to 5K, shadow quality, and, since 1.1.3, longer draw distance for zombies, buildings, and shadows. It adds 21:9 ultrawide, 2x MSAA, an adjustable field of view, and, optionally, the developers’ debug menu. The Mac build is an early one. The author has stopped development and leaves the code and documentation for anyone who wants to carry it on. Nearly all of its commits (1,709 of 1,738) list Claude as a co-author."
requirements:
  es: "Tu propia copia de Dead Rising 2: Case Zero: el paquete XBLA de Xbox 360 (unos 825 MB, sin extensión, en Content/0000000000000000/58410A8D/000D0000/). Ni el repositorio ni las descargas incluyen datos del juego. Además, una tarjeta gráfica con Vulkan 1.3, unos 2 GB libres y Windows 10 o posterior x86-64, Linux x86-64 con glibc 2.35 o posterior, Steam Deck o un Mac con Apple Silicon y macOS 13 o posterior. El juego en línea necesita el launcher de XenonLive."
  en: "Your own copy of Dead Rising 2: Case Zero: the Xbox 360 XBLA package (about 825 MB, no file extension, under Content/0000000000000000/58410A8D/000D0000/). Neither the repository nor the downloads include any game data. Plus a Vulkan 1.3 graphics card, about 2 GB of free space, and x86-64 Windows 10 or later, x86-64 Linux with glibc 2.35 or newer, a Steam Deck, or an Apple Silicon Mac on macOS 13 or later. Online play needs the XenonLive launcher."
