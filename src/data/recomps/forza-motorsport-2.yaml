desc:
  es: "Recompilación estática de la versión de Xbox 360 para Windows de 64 bits, hecha con ReXGlue: el código PowerPC del juego se traduce de antemano a C++ y se compila para x86-64, sin emulación de CPU ni compilador JIT. Dibuja con Vulkan, con una versión del SDK de ReXGlue compilada desde su código y parcheada, porque la publicada (la 0.10.0) solo funciona con Direct3D 12, y decodifica el audio de forma nativa. Un launcher en inglés y español importa tu ISO, extrae el juego y comprueba cada archivo por su SHA-256, gestiona perfiles con partidas separadas y precompila los sombreadores antes de jugar. Ofrece resolución interna hasta 4K, carreras a 60 fps o, con un monitor de 120 Hz y un procesador rápido, a 120 fps (los menús van a la mitad, como en la consola), el MSAA 2x propio del juego, filtrado anisótropo, AMD FSR y CAS, mandos compatibles con Xbox y teclado reasignable, y el juego en inglés, español, francés, alemán o italiano. Instala además el contenido descargable del disco extra de la Limited Edition (ocho paquetes, con coches y los circuitos de Road America y Motegi) y el mod Project Forza Plus 2, cuyo modo carrera, IA y campo de visión de cada cámara se ajustan desde el launcher. Las carreras en línea usan el menú System Link del juego a través de un servidor de retransmisión, sin abrir puertos; el programa del servidor, un script de Python, está en el repositorio para quien quiera montar el suyo. Xbox Live no está disponible, el modo carrera y la pantalla partida no se han probado a fondo, y con tres o más jugadores en línea a veces falla la entrada a una carrera. La 0.3.1 (20 de octubre), siete días después de la primera versión, pasó a Vulkan y añadió el juego en línea. Dos de sus ocho commits llevan a Claude como coautor. El repositorio incluye el código C++ generado a partir del ejecutable del juego (unos 130 MB)."
  en: "A static recompilation of the Xbox 360 version for 64-bit Windows, built with ReXGlue: the game’s PowerPC code is translated ahead of time into C++ and compiled for x86-64, with no CPU emulation and no JIT compiler. It renders through Vulkan, using a ReXGlue SDK built from source and patched, since the released one (0.10.0) only works with Direct3D 12, and decodes audio natively. A launcher in English and Spanish imports your ISO, extracts the game and checks every file by SHA-256, manages profiles with separate saves, and precompiles shaders before you play. It offers internal resolutions up to 4K, races at 60 fps or, with a 120 Hz monitor and a fast CPU, at 120 fps (menus run at half rate, as on the console), the game’s own 2x MSAA, anisotropic filtering, AMD FSR and CAS, Xbox-compatible controllers and remappable keyboard controls, and the game in English, Spanish, French, German, or Italian. It also installs the downloadable content from the Limited Edition bonus disc (eight packs, with cars and the Road America and Motegi tracks) and the Project Forza Plus 2 mod, whose career mode, AI, and per-camera field of view are set from the launcher. Online races use the game’s own System Link menu through a relay server, with no port forwarding; the server software, a Python script, is in the repository for anyone who wants to host their own. Xbox Live isn’t available, career mode and split-screen haven’t been fully tested, and with three or more players online, joining a race occasionally fails. Version 0.3.1 (October 20), seven days after the first release, moved to Vulkan and added online play. Two of its eight commits list Claude as a co-author. The repository includes the C++ code generated from the game’s executable (about 130 MB)."
requirements:
  es: "Tu propia copia europea o estadounidense de Forza Motorsport 2 para Xbox 360 (ID de título 4D5307EA) como imagen de disco (.iso). Si quieres, la ISO del disco extra de la Limited Edition y los .zip de Project Forza Plus 2, que necesita la versión estadounidense. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Vulkan y unos 5 GB libres; el runtime de Visual C++ viene incluido."
  en: "Your own European or US copy of Forza Motorsport 2 for Xbox 360 (title ID 4D5307EA) as a disc image (.iso). Optionally, the Limited Edition bonus disc ISO and the Project Forza Plus 2 .zip files, which need the US release. Plus 64-bit Windows 10 or 11, a Vulkan-capable graphics card, and about 5 GB of free space; the Visual C++ runtime is bundled."
