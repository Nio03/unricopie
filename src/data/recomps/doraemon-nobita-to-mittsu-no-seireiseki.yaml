name: "Doraemon: Nobita to Mittsu no Seireiseki"
games: [doraemon-nobita-to-mittsu-no-seireiseki]
console: n64
status: fully
repo: citrongames/Dora64
year: 1997
toolchain: N64Recomp
desc:
  es: "Dora64: recompilación nativa de Doraemon: Nobita to Mittsu no Seireiseki para Windows, Linux y Android. Recompila el código MIPS del juego a código nativo y usa N64ModernRuntime y RT64 para plataforma, audio, entrada y dibujo; no es un emulador. Ofrece texto en japonés, inglés y ruso, pantalla ancha, una cámara moderna opcional, más fotogramas por segundo mediante interpolación, autoguardado, controles reasignables, distancia de dibujo ajustable y trampas opcionales, con un perfil moderno y otro original. En Android, su autor dice haber hecho una partida completa con todos los objetos, y hay mando táctil configurable. La 1.0.5 para escritorio es del 25 de septiembre, publicada junto con la 1.0.3 de Android. El README dice que se desarrolló con mucha ayuda de ChatGPT y Codex de OpenAI."
  en: "Dora64: a native recompilation of Doraemon: Nobita to Mittsu no Seireiseki for Windows, Linux, and Android. It recompiles the game’s MIPS code to native code and uses N64ModernRuntime and RT64 for platform, audio, input, and rendering; it is not an emulator. It offers Japanese, English, and Russian text, widescreen, an optional modern camera, higher frame rates through interpolation, autosave, remappable controls, adjustable draw distance, and optional cheats, with a Modern and an Original profile. On Android, its author says to have completed a full playthrough with all items, and there is a configurable touch controller. The desktop version 1.0.5 is from September 25, published together with Android 1.0.3. The README says it was developed with extensive help from OpenAI’s ChatGPT and Codex."
requirements:
  es: "Tu propia copia de Doraemon: Nobita to Mittsu no Seireiseki para Nintendo 64 en japonés, como .z64; el juego comprueba el archivo completo con un hash XXH3 y rechaza otras ROM. Además, Windows (la plataforma principal de pruebas) o Linux x86-64 con Ubuntu 24.04 o posterior, o bien Android 7.0 o posterior en ARM de 64 bits."
  en: "Your own copy of Doraemon: Nobita to Mittsu no Seireiseki for Nintendo 64 in Japanese, as a .z64; the game checks the whole file against an XXH3 hash and rejects other ROMs. Plus Windows (the main test platform) or x86-64 Linux with Ubuntu 24.04 or later, or Android 7.0 or later on 64-bit ARM."
