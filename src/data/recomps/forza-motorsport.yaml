desc:
  es: "Redline Recompiled: port para Windows de 64 bits de la versión estadounidense de Xbox (Rev 1), por recompilación estática con herramientas propias: un traductor de x86 a C convierte el código del juego en código nativo, y una capa nueva sustituye los gráficos, con Direct3D 11, el sonido y la entrada de la consola. Según sus notas, encuentra 22.205 funciones y traduce el 99,59 % de las instrucciones; si el juego llega a una parte sin traducir, se cierra. Funcionan el arranque, los menús, las carreras Arcade y Free Run (los 20 circuitos), la Carrera con la compra de coches y mejoras, la pintura y los vinilos, el Drivatar, las contrarrelojes, las repeticiones, los vídeos, el sonido y las partidas guardadas; Xbox Live, System Link y el juego en línea no funcionan, y la pantalla dividida no se ha probado. El README la presenta como una versión temprana, con rendimiento inestable, errores y cierres. Ofrece 30, 60, 120 o 144 fps, escala de render de 1x a 4x con FSR 1, DLSS o FSR 3, panorámica y ultrapanorámica (21:9 y 32:9) con el HUD en los bordes, sonido envolvente 5.1 y 7.1, dos juegos de teclas reasignables y cualquier mando. Un paquete de texturas a 4x y vídeos escalados, ambos opcionales, se generan en tu equipo a partir de tu disco. Un launcher extrae el disco, traduce el código y compila el juego en tu PC. La 0.1.0 (6 de noviembre) es la primera versión. Su único commit lleva a Claude como coautor, y el README dice que Claude escribió y probó buena parte del código, las herramientas y la documentación."
  en: "Redline Recompiled: a 64-bit Windows port of the US Xbox release (Rev 1), by static recompilation with its own tools: an x86-to-C translator turns the game’s code into native code, and a new layer replaces the console’s graphics, with Direct3D 11, sound, and input. According to its notes, it finds 22,205 functions and translates 99.59% of the instructions; if the game reaches an untranslated part, it closes. Boot, menus, Arcade and Free Run races (all 20 tracks), Career with buying cars and upgrades, paint and vinyls, the Drivatar, time trials, replays, videos, sound, and saves work; Xbox Live, System Link, and online play don’t, and split screen hasn’t been tried. The README presents it as an early version, with unstable performance, bugs, and crashes. It offers 30, 60, 120, or 144 fps, 1x to 4x render scale with FSR 1, DLSS, or FSR 3, widescreen and ultrawide (21:9 and 32:9) with the HUD at the screen’s edges, 5.1 and 7.1 surround sound, two sets of rebindable keys, and any controller. A 4x texture pack and upscaled videos, both optional, are made on your machine from your disc. A launcher extracts the disc, translates the code, and builds the game on your PC. 0.1.0 (November 6) is the first release. Its only commit lists Claude as a co-author, and the README says Claude wrote and tested much of the code, the tools, and the documentation."
requirements:
  es: "Tu propia imagen de disco de Forza Motorsport para Xbox, versión estadounidense Rev 1, como .iso o carpeta con Forza.xbe y media; el launcher comprueba la versión. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica dedicada con DirectX 11.1 (DLSS pide una RTX de NVIDIA y FSR 3, una tarjeta con DirectX 12), Python 3 (el launcher instala capstone, Pillow y numpy), las Build Tools de Visual Studio con el desarrollo para escritorio con C++, unos 6 GB libres y conexión durante la compilación, que descarga DLSS y FSR de sus páginas de GitHub."
  en: "Your own disc image of Forza Motorsport for Xbox, US release Rev 1, as an .iso or a folder with Forza.xbe and media; the launcher checks the version. Plus 64-bit Windows 10 or 11, a dedicated DirectX 11.1 graphics card (DLSS needs an NVIDIA RTX card, and FSR 3 a DirectX 12 card), Python 3 (the launcher installs capstone, Pillow, and numpy), the Visual Studio Build Tools with Desktop development with C++, about 6 GB free, and a connection during the build, which downloads DLSS and FSR from their GitHub pages."
