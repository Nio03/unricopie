name: Sonic the Hedgehog (2006)
console: x360
status: experimental
repo: sonicnext-dev/MarathonRecomp
author: sonicnext-dev (ga2mer, squidbus, …)
originalDeveloper: Sonic Team / Sega
toolchain: XenonRecomp
desc:
  es: "«Marathon Recompiled»: recompilación estática de Sonic ’06 (versión de Xbox 360) para PC, con Windows, Linux y macOS como objetivo. En desarrollo activo y todavía sin versión pública. Es el recomp de verdad de Sonic ’06, y complementa a P-06, que es un remake."
  en: "“Marathon Recompiled”: a static recompilation of Sonic ’06 (Xbox 360 version) for PC, targeting Windows, Linux, and macOS. Actively developed, with no public release yet. It’s the actual Sonic ’06 recomp, and it complements P-06, which is a remake."
requirements:
  es: "Tu propia copia de Sonic ’06 (Xbox 360): el disco y el Title Update de la misma región. La versión de PS3 no sirve."
  en: "Your own copy of Sonic ’06 (Xbox 360): the disc plus the Title Update for the same region. The PS3 version won’t work."
