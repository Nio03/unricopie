desc:
  es: "Port nativo para Windows y Linux de Budokai 3 tal como viene en la colección HD de Xbox 360, hecho con el SDK de ReXGlue: el código PowerPC se recompila estáticamente y se enlaza en un ejecutable con su propio launcher y un sistema de mods. Un solo ejecutable lleva recompiladas la versión estadounidense y la europea, reconoce la tuya por su suma de comprobación y puede jugar directamente desde la ISO. Añade FSR 1, CAS, FXAA, MSAA y resolución interna aplicados en directo, DLSS y FSR 3 en beta, límite de fotogramas y VRR, un menú rápido dentro del juego (F1), teclado reasignable y un launcher en cinco idiomas que se maneja con el mando. Los mods sustituyen o añaden entradas de los archivos AFS sin tocar los originales, lo que permite cambiar modelos y meter personajes nuevos en casillas propias de la pantalla de selección; un kit importa personajes de Budokai 1, Budokai 2 e Infinite World desde tus propias ISO de PS2. Suma también modos propios, todos en beta o experimentales: el centro Dragon HUB, combates por parejas, juego en línea, un modo héroe y campañas de Infinite World y Budokai 2 que leen esas ISO. La última versión es la 1.5.1.3 (20 de octubre). La pestaña Nova’s Mods del launcher descarga a petición, desde un repositorio privado del autor en GitHub, un paquete HD de SSGPrinceVegeta con unas 5300 texturas del juego reescaladas y una veintena de personajes y trajes, varios con modelos, golpes y voces sacados de otros juegos de la serie (Budokai 2, Infinite World, Shin Budokai: Another Road y Super Dragon Ball Heroes); un paquete aparte con siete personajes nuevos, con modelos de @ArielPVB, se descarga de Google Drive. 45 de sus 199 commits llevan a Claude como coautor."
  en: "A native Windows and Linux port of Budokai 3 as it comes in the Xbox 360 HD Collection, built with the ReXGlue SDK: the PowerPC code is statically recompiled and linked into an executable with its own launcher and a mod system. A single executable carries recompilations of both the US and European releases, recognizes yours by its checksum, and can play straight from the ISO. It adds FSR 1, CAS, FXAA, MSAA, and internal resolution applied live, DLSS and FSR 3 in beta, a frame cap and VRR, an in-game quick menu (F1), rebindable keyboard controls, and a five-language launcher you can drive with a controller. Mods replace or add entries in the AFS archives without touching the originals, which allows model swaps and new characters in their own slots on the select screen; a kit imports characters from Budokai 1, Budokai 2, and Infinite World from your own PS2 ISOs. It also adds modes of its own, all in beta or experimental: the Dragon HUB, tag team fights, online play, a hero mode, and Infinite World and Budokai 2 campaigns that read those ISOs. The latest release is 1.5.1.3 (October 20). The launcher’s Nova’s Mods tab downloads on request, from a private GitHub repository of the author’s, an HD pack by SSGPrinceVegeta with about 5,300 upscaled game textures and some twenty characters and costumes, several with models, moves, and voices taken from other games in the series (Budokai 2, Infinite World, Shin Budokai: Another Road, and Super Dragon Ball Heroes); a separate pack with seven new characters, with models by @ArielPVB, is downloaded from Google Drive. 45 of its 199 commits list Claude as co-author."
requirements:
  es: "Los archivos de tu propia copia de Dragon Ball Z: Budokai HD Collection para Xbox 360, versión estadounidense o europea: la ISO completa, o el ejecutable de Budokai 3 (default.xex) y los archivos de datos de tu región (los .afs y los vídeos .sfd); baserom.md da sus tamaños y SHA-256. Los mods necesitan la carpeta extraída, y los personajes nuevos, la versión estadounidense. Para importar personajes o jugar las campañas de PS2, tus propias ISO de Budokai 1, Budokai 2 o Infinite World. Además, Windows o Linux de 64 bits, un procesador x64 con SSSE3 y una tarjeta gráfica con Direct3D 12 o Vulkan."
  en: "The files from your own copy of Dragon Ball Z: Budokai HD Collection for Xbox 360, US or European release: the full ISO, or the Budokai 3 executable (default.xex) and your region’s data files (the .afs archives and the .sfd videos); baserom.md lists their sizes and SHA-256 hashes. Mods need the extracted folder, and the new characters need the US release. To import characters or play the PS2 campaigns, your own Budokai 1, Budokai 2, or Infinite World ISOs. Plus 64-bit Windows or Linux, an x64 CPU with SSSE3, and a Direct3D 12 or Vulkan graphics card."
