desc:
  es: "Recompilación y decompilación en curso de F-117A Nighthawk Stealth Fighter 2.0 (MicroProse, 1991) para DOS, que lo ejecuta en Windows sin emulador de DOS. El código de máquina original se traduce instrucción a instrucción a C y se compila de forma nativa, y esas rutinas se van sustituyendo por C escrito a mano y con nombres, cada una comprobada contra el original (registros, memoria y reloj, en 63 rutas de prueba); no recompone el EXE byte a byte. Trae 33 arreglos de errores del original que se pueden desactivar, repetición de cada vuelo, remapeo de teclas, mando, una imagen mejorada y otra «remasterizada» con vista panorámica, y sonido AdLib, de altavoz o Roland con tus ROM de MT-32. Es solo código: el recompilador lee tu instalación de GOG o Steam al compilar y escribe el C generado fuera del repositorio, así que ni este ni sus releases llevan datos del juego ni código generado. Se declara dirigido por una persona, con IA que ayuda. La v2026.11.18 es del 18 de noviembre."
  en: "A work-in-progress recompilation and decompilation of MicroProse’s F-117A Nighthawk Stealth Fighter 2.0 (1991) for DOS, running it on Windows without a DOS emulator. The original machine code is translated instruction by instruction into C and compiled natively, and those routines are progressively replaced by hand-written, named C, each checked against the original (registers, memory and clock, over 63 scripted routes); it does not rebuild the EXE byte for byte. It adds 33 switchable fixes for the original’s bugs, a recording of every flight, key remapping, controller support, an enhanced picture and a “remastered” 3D view with a widescreen mode, and AdLib, PC speaker or Roland sound using your own MT-32 ROMs. It is code only: the recompiler reads your GOG or Steam install at build time and writes the generated C outside the repository, so neither the repository nor its releases carry game data or generated code. It says it is directed by one person, with AI helping. Version 2026.11.18 is from November 18."
requirements:
  es: "Tu propia instalación de F-117A Nighthawk Stealth Fighter 2.0 de GOG o de Steam (la versión de DOS 473.04, igual en las dos; el instalador comprueba cada archivo y rechaza otras copias). Windows 10 u 11 de 64 bits. No hay ejecutable ya compilado: el instalador compila el juego en tu PC en 5 a 15 minutos, y necesita internet y unos 1,5 GB libres. Opcionales: tus ROM de MT-32 para el sonido Roland y una tarjeta gráfica con Direct3D 12 para el modo «remasterizado»."
  en: "Your own GOG or Steam install of F-117A Nighthawk Stealth Fighter 2.0 (the DOS version 473.04, identical in both; the installer checks every file and rejects other copies). 64-bit Windows 10 or 11. There’s no prebuilt executable: the installer builds the game on your PC in 5 to 15 minutes, and needs an internet connection and about 1.5 GB of free space. Optional: your own MT-32 ROMs for Roland sound, and a Direct3D 12 graphics card for the “remastered” mode."
