desc:
  es: "Recompilación estática de The Legend of Zelda: Tears of the Kingdom a una aplicación nativa de x86-64 para Windows y Linux, con un renderizador Vulkan; en el repositorio se llama TotK Recomp. No es un emulador: el código del juego se traduce a C en tu equipo durante la instalación, y el instalador se encarga de todo el proceso, incluido preparar los shaders. Admite las actualizaciones 1.1.0, 1.2.1 y 1.4.3, con partidas compatibles entre las dos últimas, y lee NSP, XCI, NSZ y XCZ. Según el README, el juego es jugable en Windows y Linux, aunque se esperan fallos visuales y cierres. Ofrece 60 fps por defecto y hasta 144 o la tasa del monitor (experimental), resoluciones personalizadas, FSR 1, DLSS y DLAA (el instalador descarga el DLL de NVIDIA), HDR10, formatos 16:10, 3:2, 21:9 y 32:9, filtro anisótropo, mandos con rumble y giroscopio, mods hechos para emuladores y trucos de Atmosphère. Las descargas son un zip de unos 143 MB para Windows y un AppImage de unos 229 MB para Linux, que dicen no traer datos ni código derivado del juego y que no hemos comprobado por dentro. Publicó 8 versiones entre el 30 de octubre y el 4 de noviembre, la última la 0.3.7. Declara que casi todo el código lo escriben agentes de IA (Claude Code); 83 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A static recompilation of The Legend of Zelda: Tears of the Kingdom into a native x86-64 application for Windows and Linux, with a Vulkan renderer; the repository calls it TotK Recomp. It is not an emulator: the game’s code is translated into C on your PC during setup, and the installer handles the whole process, including preparing the shaders. It supports updates 1.1.0, 1.2.1, and 1.4.3, with saves interchangeable between the last two, and reads NSP, XCI, NSZ, and XCZ files. According to the README, the game is playable on Windows and Linux, though visual bugs and crashes are expected. It offers 60 fps by default and up to 144 or the monitor’s refresh rate (experimental), custom resolutions, FSR 1, DLSS and DLAA (the setup downloads NVIDIA’s DLL), HDR10, 16:10, 3:2, 21:9, and 32:9 formats, anisotropic filtering, controllers with rumble and gyro, mods made for emulators, and Atmosphère cheats. The downloads are a zip of about 143 MB for Windows and an AppImage of about 229 MB for Linux, which say they carry no game data or code derived from it and which we haven’t checked inside. It published 8 releases between October 30 and November 4, the latest being 0.3.7. It states that most of the code is written by AI coding agents (Claude Code); 83 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Tears of the Kingdom de tu propia consola: el juego base (NSP, XCI, NSZ o XCZ) y la actualización 1.1.0, 1.2.1 o 1.4.3, con tu prod.keys. Además, Windows 10 o posterior o Linux 6.7 o posterior con glibc 2.34 o posterior, una CPU x86-64 con SSE4.2 (mejor con AVX2 y FMA), una GPU con Vulkan 1.3 y VK_EXT_external_memory_host, y unos 36 GiB libres durante la instalación (20 GiB después)."
  en: "Your own copy of Tears of the Kingdom from your own console: the base game (NSP, XCI, NSZ, or XCZ) and the 1.1.0, 1.2.1, or 1.4.3 update, with your prod.keys. Plus Windows 10 or later, or Linux 6.7 or later with glibc 2.34 or later, an x86-64 CPU with SSE4.2 (better with AVX2 and FMA), a GPU with Vulkan 1.3 and VK_EXT_external_memory_host, and about 36 GiB free during setup (20 GiB afterwards)."
