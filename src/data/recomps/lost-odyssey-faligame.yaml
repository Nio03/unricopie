originalDeveloper: Mistwalker / feelplus
year: 2007
toolchain: ReXGlue
desc:
  es: "Lost Odyssey HD Remaster: recompilación estática de la versión de Xbox 360 para Windows, hecha sobre el SDK de ReXGlue, con un fork de su plugin de GPU Xenos y con los parches de boma para Xenia Canary convertidos en opciones que se cambian en marcha. El código recompilado no se publica: se genera en tu equipo a partir de tu disco. Un instalador con el aspecto de los menús del juego comprueba los cuatro discos y los copia en la carpeta del juego (unos 17 GB), y después cambia de disco solo. Ofrece de 720p a 4K y dos modos 21:9, con la interfaz siempre a la resolución de la pantalla, DLSS y FSR 3.1 en Direct3D 12 y Vulkan, 60 fps, todos los sombreadores preparados antes de jugar, las fuentes redibujadas a cuatro veces su resolución, guardar en cualquier sitio, turbo hasta 8x, encuentros aleatorios desactivables, seis idiomas, teclado y ratón, y botones de PlayStation, todo en pestañas nuevas del menú de configuración del propio juego. Corrige los cierres conocidos de la celda de la prisión, la escena tras el primer jefe y el tren congelado, aunque nadie llegó a terminarlo de principio a fin. La 0.2.0 (13 de octubre) sumó multiplicadores de experiencia y oro, un anillo de ataque que sale perfecto solo y ganar un combate con un botón. El 18 de octubre sus autores lo cancelaron y archivaron el repositorio, y remiten al port de freefrank, que también está en el catálogo. El instalador ofrece además descargar, desde archive.org y de forma opcional, un paquete de texturas HD cifrado de unos 28 GB que solo se abre con tus discos. 19 de sus 27 commits llevan a Claude como coautor."
  en: "Lost Odyssey HD Remaster: a static recompilation of the Xbox 360 version for Windows, built on the ReXGlue SDK, with a fork of its Xenos GPU plugin and with boma’s Xenia Canary patches turned into options you can switch while playing. The recompiled code isn’t published: it’s generated on your machine from your own disc. An installer styled like the game’s menus checks all four discs and copies them into the game folder (about 17 GB), and afterwards it changes discs by itself. It offers 720p to 4K and two 21:9 modes, with the interface always at the screen’s resolution, DLSS and FSR 3.1 on Direct3D 12 and Vulkan, 60 fps, every shader prepared before you play, the fonts redrawn at four times their resolution, save anywhere, turbo up to 8x, optional random encounters, six languages, keyboard and mouse, and PlayStation button prompts, all in new tabs of the game’s own Configuration menu. It fixes the known crashes in the prison cell, the cutscene after the first boss, and the frozen train, though nobody had played it from start to finish. Version 0.2.0 (October 13) added experience and gold multipliers, an attack ring that comes out perfect on its own, and winning a battle with one button. On October 18 its authors cancelled it and archived the repository, pointing to freefrank’s port, which is also in the catalog. The installer can also download, from archive.org and optionally, an encrypted HD texture pack of about 28 GB that only opens with your discs. 19 of its 27 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Lost Odyssey para Xbox 360, la edición «USA, Europe» multilingüe (título 4D5307FA), con los cuatro discos (el primero es obligatorio) como carpetas extraídas, imágenes .iso o paquetes Games on Demand; el instalador los comprueba con sus hashes, y la edición asiática no se admite. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Direct3D 12 o Vulkan (DLSS, solo en RTX), 16 GB de RAM recomendados y unos 17 GB libres para los discos, más unos 28 GB si quieres el paquete HD. Solo se probó en un equipo, con un Core i9-10850K y una RTX 3080."
  en: "Your own copy of Lost Odyssey for Xbox 360, the multi-language “USA, Europe” release (title 4D5307FA), with all four discs (disc 1 is required) as extracted folders, .iso images, or Games on Demand packages; the installer checks them against their hashes, and the Asian release isn’t supported. Plus 64-bit Windows 10 or 11, a Direct3D 12 or Vulkan graphics card (DLSS on RTX only), 16 GB of RAM recommended, and about 17 GB free for the discs, plus about 28 GB if you want the HD pack. It was only tested on one PC, with a Core i9-10850K and an RTX 3080."
