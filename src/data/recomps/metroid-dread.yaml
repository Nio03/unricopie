status: experimental
repo: yozander2009-stack/Metroid-Dread-Recomp
originalDeveloper: "MercurySteam"
year: 2021
desc:
  es: "Un único ejecutable de Windows que prepara, configura y ejecuta una versión nativa para PC de tu propia copia de Metroid Dread 2.1.0. Es el entorno de ejecución SwitchRecomp (de MZ Labs) con una interfaz propia de Metroid Dread: una primera configuración que compila el juego con un GCC incluido, una pantalla de Jugar y ajustes, y un menú dentro del juego. El renderizador es el Vulkan nativo de ScarletNX, incluido en el repositorio, con código propio para DLSS. El repositorio no contiene archivos de Nintendo: solo parches anclados que se aplican al C generado a partir del ExeFS del jugador y un manifiesto con los nombres, tamaños y hashes del RomFS para verificarlo. El README advierte de que es un trabajo en curso y de que las compilaciones 0.x son versiones preliminares, con cierres y asperezas. La 0.5.0, del 30 de octubre, llegó a Linux y a la Steam Deck, donde se ha probado, con un AppImage que se actualiza solo. Declara que buena parte del proyecto se escribió con Claude; 38 de sus 41 commits llevan a Claude como coautor."
  en: "A single Windows executable that sets up, configures, and runs a native PC build of your own copy of Metroid Dread 2.1.0. It is the SwitchRecomp runtime (by MZ Labs) with a Metroid Dread front end: a first-run setup that compiles the game with a bundled GCC, a Play and settings screen, and an in-game menu. The renderer is ScarletNX’s native Vulkan renderer, vendored in the repository, with the project’s own DLSS code. The repository contains no Nintendo files: only anchored patches applied to the C that setup generates from the player’s ExeFS, and a manifest of RomFS file names, sizes, and hashes used to verify it. The README warns that it is a work in progress and that the 0.x builds are early previews, with crashes and rough edges. Version 0.5.0, from October 30, reached Linux and the Steam Deck, where it was tested, with a self-updating AppImage. It states that large parts of the project were written with Claude; 38 of its 41 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia volcada de Metroid Dread 2.1.0 para Nintendo Switch, con las dos partes: el ExeFS (el código del juego) y el RomFS (los datos, con la actualización 2.1.0 ya integrada). Un RomFS por sí solo no basta. Windows, o Linux y la Steam Deck desde la 0.5.0, con su AppImage."
  en: "Your own dumped copy of Metroid Dread 2.1.0 for Nintendo Switch, with both parts: the ExeFS (the game code) and the RomFS (the data, with the 2.1.0 update merged in). A RomFS alone is not enough. Windows, or Linux and the Steam Deck since 0.5.0, with its AppImage."
