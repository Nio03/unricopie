name: Dead or Alive Xtreme Beach Volleyball
console: xbox
status: experimental
repo: NoRain211/doaxvb-re
originalDeveloper: Team Ninja
year: 2003
desc:
  es: "Port nativo a Windows, macOS y Linux por recompilación estática: el ejecutable original de Xbox se traduce a C y se enlaza con un entorno de ejecución escrito a mano que sustituye las importaciones del kernel de Xbox, la salida de audio y las API principales de Direct3D 8 y DirectSound por equivalentes nativos. El resto del juego, incluidas las bibliotecas que lleva enlazadas estáticamente, sigue funcionando como código generado. El objetivo declarado va más allá del port: sustituir la lógica del juego por código fuente legible escrito a mano, un grupo de estructuras de datos cada vez, sin que el juego deje de funcionar."
  en: "Native Windows, macOS, and Linux port by static recompilation: the original Xbox executable is lifted to C and linked against a hand-written runtime that replaces the Xbox kernel imports, the audio output, and the main Direct3D 8 and DirectSound APIs with native equivalents. The rest of the game, including its statically linked libraries, still runs as generated code. The stated goal goes beyond the port: to replace the game logic with readable, hand-written source code, one cluster of data structures at a time, while the game keeps running."
requirements:
  es: "Tu propia copia legal de la edición estadounidense para Xbox. El proyecto no distribuye ningún archivo del juego."
  en: "Your own legally obtained copy of the US Xbox release. The project ships no game files."
tags:
  - x86
