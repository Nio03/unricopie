name: Dead or Alive Xtreme Beach Volleyball
console: xbox
status: experimental
repo: NoRain211/doaxvb-re
originalDeveloper: Team Ninja
year: 2003
desc:
  es: "Port nativo a Windows, macOS y Linux por recompilación estática: el ejecutable original de Xbox se eleva a C y se enlaza contra un runtime escrito a mano que sustituye los imports del kernel de Xbox, la salida de audio y las APIs principales de Direct3D 8 y DirectSound por equivalentes nativos. El resto del juego, incluidas sus librerías enlazadas estáticamente, sigue corriendo como código generado. El objetivo declarado va más allá del port: reemplazar la lógica del juego por fuente legible escrita a mano, un grupo de estructuras de datos a la vez, mientras el juego sigue funcionando."
  en: "Native Windows, macOS and Linux port by static recompilation: the original Xbox executable is lifted to C and linked against a hand-written runtime that replaces the Xbox kernel imports, audio output and the main Direct3D 8 and DirectSound APIs with native equivalents. The rest of the game, including its statically linked libraries, still runs as generated code. The stated goal goes beyond the port: to replace the game logic with readable, hand-written source one data-structure cluster at a time while the game keeps running."
requirements:
  es: "Tu propia copia legal de la edición estadounidense de Xbox. El proyecto no distribuye ningún archivo del juego."
  en: "Your own legally obtained copy of the US Xbox release. The project ships no game files."
tags:
  - x86
