desc:
  es: "Recompilación estática del Donkey Kong Country original (versión estadounidense 1.0) sobre un fork de snesrecomp, siguiendo el modelo de DKC2Recomp. A diferencia de la mayoría de los recomps, no tuvo que descubrir el código a ciegas: parte del desensamblado de Yoshifanatic1, que reconstruye la ROM byte a byte, y de él saca cada instrucción y cada tabla de saltos. Genera el 100 % del código del juego, con aplicaciones nativas para Windows y macOS, audio continuo y un modo panorámico opcional de 342 × 224."
  en: "Static recompilation of the original Donkey Kong Country (US version 1.0) on a snesrecomp fork, following the DKC2Recomp template. Unlike most recomps, it didn’t have to discover the code blind: it starts from Yoshifanatic1’s disassembly, which rebuilds the ROM byte for byte, and derives every instruction and jump table from it. It generates 100% of the game’s code, with native Windows and macOS hosts, continuous audio, and an optional 342×224 widescreen mode."
requirements:
  es: "Tu propia ROM de Donkey Kong Country (SNES, versión estadounidense 1.0)."
  en: "Your own Donkey Kong Country ROM (SNES, US version 1.0)."
