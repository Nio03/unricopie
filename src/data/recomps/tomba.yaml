name: Tomba!
console: ps1
status: experimental
repo: mstan/TombaRecomp
originalDeveloper: Whoopee Camp
toolchain: psxrecomp
desc:
  es: "Tomba! llevado por completo a psxrecomp. Llega a la partida de verdad (saltar, agarrar, cumplir misiones), pero con fallos de sincronización del audio y bloqueos que impiden avanzar."
  en: "Tomba! driven end to end through psxrecomp. It reaches real gameplay (jumping, grabbing, quests), but with audio timing glitches and softlocks."
requirements:
  es: "Una imagen de disco de Tomba! (PS1) y la BIOS SCPH1001.BIN."
  en: "A Tomba! disc image (PS1) and the SCPH1001.BIN BIOS."
tags:
  - mips
