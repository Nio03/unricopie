desc:
  es: "Port nativo no oficial para Windows de la versión de PlayStation 3 (la de PSN), hecho por recompilación estática con ps3recomp: el código PowerPC (PPU) y el de las SPU del juego se traducen por adelantado a C y C++. No es un emulador y no necesita el firmware de la PS3 ni RPCS3. Trae un launcher en 13 idiomas que sigue abierto como menú de opciones durante la partida, resoluciones de hasta 4K, FXAA o SMAA, filtro anisótropo, nitidez con FSR 1, 60 fps interpolando las poses de personajes y objetos mientras la lógica sigue a 30 Hz, generación de fotogramas con FSR 3.1 hasta 120 fps y herramientas para practicar speedruns: un SRT propio, selección de salas y guardado en cualquier punto. Su autor terminó el juego de principio a fin en su equipo de pruebas, aunque avisa de fallos gráficos y de iluminación y de que casi todas las pruebas son con la versión japonesa. El README dice que la descarga no trae datos del juego, ni su ejecutable, ni código generado a partir de él; aun así, la release publica un ejecutable ya compilado para cada región, en un zip de unos 291 MB que no hemos comprobado por dentro. También enlaza un pack opcional de texturas HD de la comunidad, alojado en Google Drive. Publicó 18 versiones entre el 24 y el 29 de octubre. Declara que se hizo con ayuda de Claude y de Codex; 52 de sus últimos 100 commits llevan a Claude como coautor."
  en: "An unofficial native Windows port of the PlayStation 3 version (the PSN release), made by static recompilation with ps3recomp: the game’s PowerPC (PPU) and SPU code is translated ahead of time into C and C++. It isn’t an emulator and needs neither the PS3 firmware nor RPCS3. It comes with a launcher in 13 languages that stays open as the options menu during play, resolutions up to 4K, FXAA or SMAA, anisotropic filtering, FSR 1 sharpening, 60 fps by interpolating character and object poses while the game logic stays at 30 Hz, FSR 3.1 frame generation up to 120 fps, and speedrun practice tools: its own SRT, room selection, and saving anywhere. Its author finished the game from start to finish on the test PC, but warns of graphics and lighting glitches and that most testing was done on the Japanese version. The README says the download contains no game data, no game executable, and no code generated from it; still, the release ships a prebuilt executable for each region, in a zip of about 291 MB that we haven’t checked inside. It also links an optional community HD texture pack, hosted on Google Drive. It published 18 releases between October 24 and October 29. It states it was made with the help of Claude and Codex; 52 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de la versión de PSN 01.00, como carpeta (con PARAM.SFO y USRDIR\\EBOOT.BIN): la europea (NPEB00553) o la estadounidense (NPUB30467), con su licencia .rap, o la japonesa (NPJB00135, BIOHAZARD CODE: Veronica Kanzenban), que no la necesita. Las versiones en disco y las actualizaciones no sirven. El PKG se extrae con la herramienta del propio proyecto o instalándolo en RPCS3. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Direct3D 12 y el redistribuible de Visual C++ (x64)."
  en: "Your own copy of the PSN version 01.00, as a folder (with PARAM.SFO and USRDIR\\EBOOT.BIN): the European (NPEB00553) or US (NPUB30467) release with its .rap license, or the Japanese one (NPJB00135, BIOHAZARD CODE: Veronica Kanzenban), which doesn’t need it. Disc versions and updates don’t work. The PKG is extracted with the project’s own tool or by installing it in RPCS3. Plus 64-bit Windows 10 or 11, a Direct3D 12 graphics card, and the Visual C++ Redistributable (x64)."
