originalDeveloper: "CyberConnect2"
year: 2013
toolchain: XenonRecomp
desc:
  es: "Port nativo de Naruto Shippuden: Ultimate Ninja Storm 3 Full Burst (Xbox 360) para Windows x64 y Android ARM64, hecho por recompilación estática del default.xex, con un backend Vulkan adaptado a las GPU de móvil. El proyecto es de código cerrado: el repositorio solo contiene documentación y capturas, y los ejecutables están en sus versiones. Hay un zip para Windows en la 0.3 y en la 0.3.2 (esta, preliminar); la 0.4 (18 de octubre de 2026, preliminar) solo trae el APK de Android. Combates a 30 fps con el contenido de Full Burst, un modo de rendimiento a 24 fps para móviles, resoluciones de hasta 4K en PC, FXAA, FSR 1 y CAS, y controles en pantalla editables en Android. Los 6 commits recientes del repositorio llevan a Claude como coautor."
  en: "A native port of Naruto Shippuden: Ultimate Ninja Storm 3 Full Burst (Xbox 360) for Windows x64 and Android ARM64, made by static recompilation of default.xex, with a Vulkan backend adapted to phone GPUs. The project is closed source: the repository only holds documentation and screenshots, and the executables are in its releases. There’s a Windows zip in 0.3 and in 0.3.2 (the latter a pre-release); 0.4 (October 18, 2026, a pre-release) only has the Android APK. It has fights at 30 fps with the Full Burst content, a 24 fps performance mode for phones, resolutions up to 4K on PC, FXAA, FSR 1, and CAS, and editable on-screen controls on Android. The repository’s 6 recent commits list Claude as a co-author."
requirements:
  es: "Tu propia copia del disco norteamericano (NTSC-U) de Naruto Shippuden: Ultimate Ninja Storm 3 Full Burst para Xbox 360, con un default.xex idéntico al de la versión 0.0.0.9 (ID de título 4E4D085C; el README da el SHA-1). Windows 10 de 64 bits con una CPU x86-64 con AVX y una GPU con Vulkan 1.1, o Android 11 o posterior con ARM64."
  en: "Your own copy of the North American (NTSC-U) disc of Naruto Shippuden: Ultimate Ninja Storm 3 Full Burst for Xbox 360, with a default.xex identical to version 0.0.0.9 (title ID 4E4D085C; the README gives the SHA-1). 64-bit Windows 10 with an x86-64 CPU with AVX and a Vulkan 1.1 GPU, or Android 11 or later on ARM64."
