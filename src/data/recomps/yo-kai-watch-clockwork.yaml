name: Yo-kai Watch (Clockwork)
console: 3ds
status: playable
repo: clockwork-recompdev/clockwork
author: clockwork-recompdev
originalDeveloper: Level-5
year: 2013
desc:
  es: "Clockwork: versiones nativas para Windows, Linux y macOS de los Yo-kai Watch de 3DS, por recompilación estática del código ARM a C, con el hardware y los servicios de la consola sustituidos por código nativo sobre SDL3, sin emulador ni firmware. Cubre Yo-kai Watch, Yo-kai Watch 2 (Psychic Specters y Bony Spirits / Fleshy Souls), Yo-kai Watch Blasters, Yo-kai Watch 3 y la japonesa Yo-kai Watch Busters 2, en varias regiones; Psychic Specters es la más probada, y las versiones estadounidenses y Busters 2 son las comprobadas. Las versiones publicadas traen el launcher y el runtime, sin juego: al añadir tu volcado, compila ese juego en tu equipo. Ofrece hasta 4x de resolución interna, pantalla superior panorámica 16:9, diseños de una sola pantalla, interpolación a 60 fps, actualizaciones del juego, mods instalables desde GameBanana, importación de partidas de 3DS y salas para jugar en línea la conexión local inalámbrica (combates, intercambios y cooperativo)."
  en: "Clockwork: native Windows, Linux, and macOS versions of the 3DS Yo-kai Watch games, made by statically recompiling the ARM code to C, with the console’s hardware and services replaced by native code on SDL3, no emulator and no firmware. It covers Yo-kai Watch, Yo-kai Watch 2 (Psychic Specters and Bony Spirits / Fleshy Souls), Yo-kai Watch Blasters, Yo-kai Watch 3, and the Japan-only Yo-kai Watch Busters 2, in several regions; Psychic Specters is the most tested, and the US releases and Busters 2 are the verified ones. The releases contain the launcher and runtime, with no game: when you add your dump, it builds that game on your machine. It offers up to 4x internal resolution, a 16:9 widescreen top screen, one-screen layouts, 60 fps interpolation, game updates, mods installable from GameBanana, 3DS save import, and online rooms for local wireless play (battles, trades, and co-op)."
requirements:
  es: "Volcados descifrados de tus propios cartuchos de Yo-kai Watch para 3DS (hechos con GodMode9) y, si quieres, sus actualizaciones. Además, Windows x86-64, Linux x86-64 o macOS con Apple Silicon, y el compilador de C del sistema (las Build Tools de Visual Studio en Windows, las herramientas de línea de comandos de Xcode en macOS o gcc o clang en Linux)."
  en: "Decrypted dumps of your own Yo-kai Watch 3DS cartridges (made with GodMode9) and, optionally, their updates. Plus x86-64 Windows, x86-64 Linux, or Apple Silicon macOS, and the system C compiler (Visual Studio Build Tools on Windows, the Xcode command line tools on macOS, or gcc or clang on Linux)."
