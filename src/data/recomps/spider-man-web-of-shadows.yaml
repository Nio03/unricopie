toolchain: ReXGlue
desc:
  es: "Port nativo no oficial para Windows de la versión de Xbox 360, por recompilación estática con el SDK de ReXGlue: traduce a C++ las más de 18 600 funciones del default.xex y lo compila para procesadores con AVX2 y FMA3. Según su autor, se puede jugar: arranca, reproduce los vídeos y permite balancearse por todo Manhattan, combatir, cambiar de traje y guardar y cargar. Dibuja con Direct3D 12 y añade escalado FSR con nitidez RCAS o CAS, un modo que se activa con F4 y presenta las imágenes al doble de cadencia (60 o 120 Hz) para suavizar el ritmo, oclusión por hardware y perfiles de caché de texturas para tarjetas de 4, 6 u 8 GB. Mando y teclado y ratón funcionan a la vez, con cámara con el ratón y teclas reasignables. El launcher, en inglés y turco, ofrece tres preajustes gráficos, extrae y comprueba tu ISO, hace copias de las partidas guardadas y prepara un informe de errores con los registros. El repositorio guarda los ejecutables ya compilados y el código de los ganchos, pero no los archivos de proyecto para compilarlo. La 2.0.4 (21 de octubre) corrigió que el personaje se quedara quieto al pulsar Mayús, Ctrl o Alt mientras se movía y un cierre al usar el ratón."
  en: "An unofficial native Windows port of the Xbox 360 version, by static recompilation with the ReXGlue SDK: it translates the more than 18,600 functions in default.xex to C++ and compiles them for CPUs with AVX2 and FMA3. According to its author it’s playable: it boots, plays the videos, and lets you swing across all of Manhattan, fight, switch suits, and save and load. It renders with Direct3D 12 and adds FSR upscaling with RCAS or CAS sharpening, a mode toggled with F4 that presents frames at twice the cadence (60 or 120 Hz) to smooth pacing, hardware occlusion culling, and texture cache profiles for 4, 6, or 8 GB cards. Controller and keyboard and mouse work at the same time, with mouse camera and rebindable keys. The launcher, in English and Turkish, has three graphics presets, extracts and verifies your ISO, backs up your saves, and builds a bug report from the logs. The repository holds the compiled executables and the hook code, but not the project files to build it. 2.0.4 (October 21) fixed the character freezing when Shift, Ctrl, or Alt was held while moving, and a crash when using the mouse."
requirements:
  es: "Una ISO o los archivos extraídos de tu propia copia de Spider-Man: Web of Shadows para Xbox 360 (Title ID 41560815). Además, Windows 10 (1909 o posterior) u 11 de 64 bits, un procesador con AVX2 y FMA3 (Intel Haswell, AMD Excavator o Ryzen, o posteriores), una tarjeta gráfica con Direct3D 12 y Rasterizer Ordered Views (ROV), 8 GB de RAM y unos 8 GB libres."
  en: "An ISO or the extracted files of your own Spider-Man: Web of Shadows copy for Xbox 360 (Title ID 41560815). Plus 64-bit Windows 10 (1909 or later) or 11, a CPU with AVX2 and FMA3 (Intel Haswell, AMD Excavator or Ryzen, or newer), a Direct3D 12 graphics card with Rasterizer Ordered Views (ROV), 8 GB of RAM, and about 8 GB of free space."
