desc:
  es: "SPR Recomp: recompilación estática de Splatoon Raiders, de Switch 2, en un programa nativo de Windows x86-64 con un renderizador Vulkan. El código ARM64 del juego se traduce a C de antemano y se compila con Clang; un anfitrión reimplementa los servicios del sistema de la consola, y sus llamadas gráficas NVN 2 se responden con Vulkan. Es un fork, con toda su historia, de DKB Recomp, la recompilación de Donkey Kong Bananza que también está en el catálogo, adaptado a este juego. Según el README se puede jugar en parte: el título, la escena inicial, el creador de personaje, la zona central y la primera zona de juego, a unos 60 cuadros por segundo; no dice que se pueda terminar. La descarga es un instalador que trae el compilador, Python y el traductor de shaders, y construye el juego en tu PC a partir de tu copia; ni el repositorio ni sus versiones traen nada del juego. El README avisa de que está «HEAVILY Vibecoded», y 45 de sus últimos 100 commits llevan a Claude como coautor. La v0.1.9 es del 17 de noviembre."
  en: "SPR Recomp: a static recompilation of Splatoon Raiders, for Switch 2, into a native Windows x86-64 program with a Vulkan renderer. The game’s ARM64 code is translated to C ahead of time and compiled with Clang; a host reimplements the console’s system services, and its NVN 2 graphics calls are answered with Vulkan. It’s a fork, with its whole history, of DKB Recomp, the Donkey Kong Bananza recompilation that is also in the catalog, retargeted to this game. According to the README it’s playable in parts: the title, the opening cutscene, the character creator, the hub, and the first gameplay zone, at about 60 frames per second; it doesn’t say the game can be finished. The download is an installer that bundles the compiler, Python, and the shader translator, and builds the game on your PC from your copy; neither the repository nor its releases contain anything from the game. The README warns that it’s “HEAVILY Vibecoded”, and 45 of its last 100 commits list Claude as a co-author. Version 0.1.9 is from November 17."
requirements:
  es: "Tu propia copia de Splatoon Raiders para Switch 2 con la actualización 65536, como archivo .nup o como ExeFS y RomFS extraídos; no hacen falta claves. Windows 10 u 11 con una CPU con AVX2, una GPU con Vulkan 1.3 (solo probado en NVIDIA), 16 GB de RAM con un archivo de paginación grande (mejor 32 GB) y unos 6 GB libres."
  en: "Your own copy of Splatoon Raiders for Switch 2 with update 65536, as a .nup file or as extracted ExeFS and RomFS; no keys needed. Windows 10 or 11 with an AVX2 CPU, a Vulkan 1.3 GPU (tested on NVIDIA only), 16 GB of RAM with a large page file (32 GB is better), and about 6 GB free."
