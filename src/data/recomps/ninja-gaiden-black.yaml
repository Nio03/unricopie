name: Ninja Gaiden Black
console: xbox
status: playable
repo: gamboozino/ngbrecomp
author: gamboozino
originalDeveloper: Team Ninja
year: 2005
toolchain: xboxrecomp
desc:
  es: "Port nativo para Linux y Windows de la versión estadounidense de Xbox, por recompilación estática con una versión adaptada de xboxrecomp y con un renderizador propio en Vulkan que recoge las llamadas Direct3D del juego en lugar de emular la GPU. Va a 60 fps estables incluso en la Steam Deck, con resolución de renderizado de hasta 10x, filtrado anisotrópico, MSAA, sombras más nítidas y formatos 4:3, 16:9, 16:10 y 21:9. Añade teclado y ratón con los iconos de las teclas en pantalla, controles reasignables, ratón en los menús, vídeos que se pueden saltar, opciones para desbloquear dificultades y trajes, y trucos. La primera vez instala el juego desde tu imagen de disco. La recreativa de Ninja Gaiden del bar de Han no funciona, porque en el disco es otro programa. Hay una versión experimental para Mac con Apple Silicon que hay que compilar. 9 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A native Linux and Windows port of the US Xbox release by static recompilation with an adapted version of xboxrecomp, with its own Vulkan renderer that takes the game’s Direct3D calls instead of emulating the GPU. It runs at a steady 60 fps even on the Steam Deck, with render resolution up to 10x, anisotropic filtering, MSAA, sharper shadows, and 4:3, 16:9, 16:10, and 21:9 aspect ratios. It adds keyboard and mouse with on-screen key prompts, rebindable controls, mouse support in menus, skippable movies, options to unlock difficulties and costumes, and cheats. On first launch it installs the game from your disc image. The Ninja Gaiden arcade cabinet in Han’s bar doesn’t work, since on the disc it’s a separate program. There’s an experimental Apple Silicon Mac build you have to compile yourself. 9 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propio disco estadounidense (NTSC-U, title ID 5443000D) de Ninja Gaiden Black para Xbox, como imagen o extraído. Además, Windows 10 u 11 de 64 bits o Linux de 64 bits (glibc 2.35 o posterior), con Vulkan 1.3, y unos 6 GB libres."
  en: "Your own US (NTSC-U, title ID 5443000D) Ninja Gaiden Black Xbox disc, as an image or extracted. Plus 64-bit Windows 10 or 11 or 64-bit Linux (glibc 2.35 or later), with Vulkan 1.3, and about 6 GB of free space."
