desc:
  es: "XC2 Recomp: recompilación estática de Xenoblade Chronicles 2, el juego de Switch de 2017, a una aplicación nativa de Windows x86-64 con un renderizador Vulkan. Es una bifurcación de XCX Recomp, que a su vez parte de TotK Recomp, la recompilación de Tears of the Kingdom de Valiantsin Dzerakh; ambas están en el catálogo. Su instalador, XC2-Setup, construye el juego en tu equipo a partir de tus archivos con un llvm-mingw incluido, y el resultado contiene el juego, así que es solo para uso propio. El README lo describe como un desarrollo temprano: empezar una partida nueva, las escenas y la jugabilidad funcionan en Windows con sonido, textos y menús, a 60 fps por defecto (de 30 a 360 en los ajustes; por encima de 60, de forma experimental). Admite la actualización 3.0.1 y el contenido adicional del pase de expansión, y trae un menú de ajustes dentro del juego (F1), un indicador de rendimiento (F10), teclado, ratón y mando, y cualquier resolución, incluida la ultrapanorámica. Los mods hechos para emuladores y el VRR siguen como plan. Publicó cuatro versiones el 4 de noviembre, de la 0.1.0 a la 0.1.3, con paquetes para Windows y un AppImage para Linux. Según el README, la mayor parte del código y de la documentación la escriben agentes de programación con IA (Claude Code) bajo la dirección de su autor; 32 de sus 71 commits llevan a Claude como coautor."
  en: "XC2 Recomp: a static recompilation of Xenoblade Chronicles 2, the 2017 Switch game, into a native Windows x86-64 application with a Vulkan renderer. It is a fork of XCX Recomp, itself built on TotK Recomp, Valiantsin Dzerakh’s Tears of the Kingdom recompilation; both are in the catalog. Its installer, XC2-Setup, builds the game on your PC from your files with a bundled llvm-mingw, and the result contains the game, so it is for your own use only. The README describes it as early development: starting a new game, cutscenes, and gameplay work on Windows with sound, text, and menus, at 60 fps by default (30 to 360 in the settings; above 60 is experimental). It supports update 3.0.1 and the Expansion Pass add-on content, and has an in-game settings menu (F1), a performance overlay (F10), keyboard, mouse, and gamepad support, and any resolution, ultrawide included. Mods made for emulators and VRR remain planned. It published four releases on November 4, 0.1.0 to 0.1.3, with Windows packages and a Linux AppImage. According to the README, most of the code and documentation is written by AI coding agents (Claude Code) under its author’s direction; 32 of its 71 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Xenoblade Chronicles 2 para Switch, volcada de tu consola: el juego base y la actualización 3.0.1 en archivos NSP (el contenido adicional es opcional) y las claves de tu consola (prod.keys). Windows 10 o posterior, una CPU x86-64 con AVX2, una GPU con Vulkan 1.3 y VK_EXT_external_memory_host, y unos 36 GiB libres durante la instalación (20 GiB después). También hay un AppImage para Linux."
  en: "Your own copy of Xenoblade Chronicles 2 for Switch, dumped from your console: the base game and the 3.0.1 update as NSP files (the add-on content is optional), plus your console’s keys (prod.keys). Windows 10 or later, an x86-64 CPU with AVX2, a GPU with Vulkan 1.3 and VK_EXT_external_memory_host, and about 36 GiB free during setup (20 GiB after). There is also a Linux AppImage."
