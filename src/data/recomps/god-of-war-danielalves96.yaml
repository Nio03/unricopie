name: "God of War (danielalves96)"
games: [god-of-war]
console: ps2
status: playable
repo: danielalves96/gow-pc-port
originalDeveloper: "Santa Monica Studio"
year: 2005
desc:
  es: "Port nativo no oficial para Windows, con compatibilidad experimental con Linux, de la edición norteamericana (SCUS-97399), hecho por recompilación estática: un recompilador escrito en Rust traduce el código MIPS del juego a C++, que se compila como un programa normal, y el hardware de la PS2 (sintetizador gráfico, VU1, IOP, sonido, mando y tarjeta de memoria) se implementa de forma nativa, sin intérprete, sin emulación y sin BIOS. Ofrece un renderizador OpenGL 4.6 con resolución interna de 1× a 6×, pantalla ancha 16:9, 16:10 y 21:9, vídeos MPEG-2 decodificados de forma nativa, mandos y teclado reasignables, un menú de trucos, partidas compatibles con PCSX2, paquetes de texturas de PCSX2 y un launcher con asistente. Su documentación de estado reconoce que no hay pruebas automáticas, que queda abierto un cuelgue tras guardar y que Linux está preparado pero no soportado. El instalador construye el juego en tu equipo a partir de tu disco. La versión 0.2.0 del launcher es del 1 de noviembre."
  en: "An unofficial native port for Windows, with experimental Linux support, of the North American edition (SCUS-97399), made by static recompilation: a recompiler written in Rust translates the game’s MIPS code to C++, which is compiled as a normal program, and the PS2 hardware (graphics synthesizer, VU1, IOP, sound, pad, and memory card) is implemented natively, with no interpreter, no emulation, and no BIOS. It offers an OpenGL 4.6 renderer with internal resolution from 1x to 6x, 16:9, 16:10, and 21:9 widescreen, natively decoded MPEG-2 movies, remappable keyboard and gamepad controls, a cheat menu, PCSX2-compatible saves, PCSX2 texture packs, and a launcher with a setup wizard. Its status document admits there are no automated tests, a hang after saving is still open, and Linux is prepared but not supported. The installer builds the game on your PC from your disc. Launcher version 0.2.0 is from November 1."
requirements:
  es: "Tu propia copia de la edición norteamericana de God of War para PS2 (SCUS-97399), de la que el instalador extrae lo necesario una sola vez. Windows de 64 bits (objetivo principal) o Linux x86-64 (experimental); una GPU con OpenGL 4.6."
  en: "Your own copy of the North American God of War for PS2 (SCUS-97399), from which the installer extracts what it needs once. 64-bit Windows (primary target) or x86-64 Linux (experimental); a GPU with OpenGL 4.6."
