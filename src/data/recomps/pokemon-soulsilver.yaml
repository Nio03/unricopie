desc:
  es: "ssrecomp: versión nativa de la edición estadounidense pensada para jugar en una sola pantalla. El código ARM9 del juego se recompila estáticamente a C++, a partir de tu ROM o de una compilación de la decompilación pokeheartgold, y el núcleo de melonDS hace de hardware de la DS (gráficos, sonido, cartucho y el ARM7); un modo de comprobación ejecuta a la vez el intérprete y el código recompilado y compara los registros tras cada instrucción. La vista por defecto junta en una sola imagen lo útil de las dos pantallas según lo que esté haciendo el juego: en el campo, el mundo en 3D ocupa toda la pantalla panorámica a alta resolución (de 192 a 1440 líneas), y en los combates los botones de la pantalla táctil pasan a una franja inferior que se maneja con el mando. Añade 60 fps con fotogramas intermedios para la escena en 3D, avance rápido, estados guardados y un menú de pausa con las opciones. Un programa de instalación compila el juego en tu equipo (la primera vez tarda de 20 a 40 minutos) y también puede generar un APK para Android; hay versiones para Linux (x86-64 y ARM64) y Windows, y en fase experimental para macOS, que hizo DarthMDev. Su README declara que casi todo el código, la documentación y las pruebas los hizo Claude, bajo la dirección de quien mantiene el proyecto, y 20 de sus 36 commits llevan a Claude como coautor. La 0.4.2 (18 de octubre) dejó en la mitad el tiempo de procesador que gasta la imagen panorámica en 3D."
  en: "ssrecomp: a native build of the US release, designed for single-screen play. The game’s ARM9 code is statically recompiled to C++, from your ROM or from a build of the pokeheartgold decompilation, and the melonDS core stands in for the DS hardware (graphics, sound, cartridge, and the ARM7); a lockstep mode runs the interpreter and the recompiled code side by side and compares registers after every instruction. The default view merges the useful parts of both screens into one picture depending on what the game is doing: in the field, the 3D world fills the whole widescreen view at high resolution (192 to 1440 lines), and in battle the touch-screen buttons move to a strip along the bottom that you drive with a controller. It adds 60 fps with in-between frames for the 3D scene, fast forward, save states, and a pause menu with the settings. A setup program builds the game on your machine (the first build takes 20–40 minutes) and can also make an Android APK; there are builds for Linux (x86-64 and ARM64) and Windows, and experimental ones for macOS, ported by DarthMDev. Its README states that nearly all the code, documentation, and testing were done by Claude, directed by the project’s maintainer, and 20 of its 36 commits list Claude as co-author. Version 0.4.2 (October 18) halved the CPU time the widescreen 3D picture takes."
requirements:
  es: "Tu propia ROM estadounidense de Pokémon SoulSilver en formato .nds, volcada de tu cartucho (SHA-1 f8dc38ea20c17541a43b58c5e6d18c1732c7e582); no acepta HeartGold ni otras regiones. Además, Windows con MSYS2 y su compilador, Linux con CMake, Ninja, g++, SDL2, libpng y zlib, o macOS 11 o posterior con las Command Line Tools de Xcode y Python 3 con Tk; el programa de instalación dice qué falta. Compilarlo ocupa unos 3 GB y pide alrededor de 1,5 GB de RAM por cada tarea en paralelo."
  en: "Your own US Pokémon SoulSilver ROM as a .nds file, dumped from your cartridge (SHA-1 f8dc38ea20c17541a43b58c5e6d18c1732c7e582); HeartGold and other regions aren’t accepted. Plus Windows with MSYS2 and its compiler, Linux with CMake, Ninja, g++, SDL2, libpng, and zlib, or macOS 11 or later with Xcode Command Line Tools and Python 3 with Tk; the setup program tells you what’s missing. Building takes about 3 GB of disk space and around 1.5 GB of RAM per parallel job."
