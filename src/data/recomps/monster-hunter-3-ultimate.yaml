desc:
  es: "Port nativo para Windows y Linux de la versión de Wii U, hecho por recompilación estática: el código PowerPC del juego se traduce a C++ por adelantado y se compila para tu PC, sobre una reimplementación propia de las bibliotecas del sistema de la Wii U, con gráficos en Vulkan y entrada y audio con SDL3; no es un emulador ni lleva código de emulador. Respecto al original añade juegos de objetos como los de Monster Hunter Generations Ultimate, escalado de la vida de los monstruos cuando se caza con menos de cuatro cazadores en Puerto Tanzia, misiones de eventos y de desafío descargables y paquetes de texturas con volcado de texturas. Entre lo que sigue figuran el juego en red local y un servidor de salas propio en lugar del servicio de Nintendo, ya retirado. La 0.1.0 (28 de octubre) trae un zip para Windows y un AppImage de Linux. Los 3 commits del repositorio llevan a Claude como coautor."
  en: "A native port of the Wii U version for Windows and Linux, made by static recompilation: the game’s PowerPC code is translated to C++ ahead of time and compiled for your PC, on a reimplementation of the Wii U system libraries of its own, with graphics on Vulkan and input and audio on SDL3; it is not an emulator and has no emulator code. Compared with the original it adds item sets like those of Monster Hunter Generations Ultimate, monster HP scaling when hunting in Port Tanzia with fewer than four hunters, downloadable event and challenge quests, and texture packs with texture dumping. Planned next are local network play and a lobby server of its own in place of Nintendo’s retired service. Version 0.1.0 (October 28) provides a Windows zip and a Linux AppImage. All 3 of the repository’s commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Monster Hunter 3 Ultimate de Wii U, de EE. UU. con la actualización v32 (el programa comprueba el ejecutable y lee los archivos donde estén, sin copiarlos). Además, Windows 10 u 11 de 64 bits o Linux x86-64 con glibc 2.35 o posterior, y un controlador Vulkan 1.3."
  en: "Your own copy of Monster Hunter 3 Ultimate for the Wii U, US release with update v32 (the program checks the executable and reads the files where they are, without copying them). Plus 64-bit Windows 10 or 11, or x86-64 Linux with glibc 2.35 or newer, and a Vulkan 1.3 driver."
