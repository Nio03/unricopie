desc:
  es: "Port nativo por recompilación estática con N64Recomp, distinto del otro recomp de Beetle Adventure Racing que ya está en el catálogo. Llega hasta las carreras a 60 fps con teclado, mando y sonido, y trae un launcher con ajustes y reasignación de controles, modo panorámico con un HUD que se adapta a la relación de aspecto, distancia de dibujado 1x, 2x o 4x, escalado de la resolución interna, MSAA con filtro de costuras e interpolación a alta tasa de fotogramas."
  en: "Native port by static recompilation with N64Recomp, separate from the other Beetle Adventure Racing recomp already in the catalog. It boots through to races at 60 fps with keyboard, gamepad, and audio, and ships a launcher with settings and remapping, widescreen with a HUD that adapts to the aspect ratio, 1x/2x/4x draw distance, internal resolution scaling, MSAA with a seam filter, and high-frame-rate interpolation."
requirements:
  es: "Tu propia ROM de Beetle Adventure Racing (N64, versión estadounidense)."
  en: "Your own Beetle Adventure Racing ROM (N64, US version)."
