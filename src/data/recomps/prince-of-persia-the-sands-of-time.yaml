toolchain: xboxrecomp
desc:
  es: "reSOT: recompilación estática de las versiones de Xbox de The Sands of Time para Windows, con una copia modificada de xboxrecomp que traduce a C todo el default.xbe; los comandos gráficos de la NV2A se dibujan con Direct3D 11. Una persona ya jugó la demo del E3 2003 hasta el tercer nivel, y la versión comercial NTSC llega a su primer nivel jugable. Las dos siguen en pruebas: hay cuelgues y fallos de imagen, el sonido sale demasiado agudo, dentro de los niveles no llega a 60 fps y en la comercial guardar la partida todavía falla. Tiene imagen panorámica 16:9 y un menú propio de opciones gráficas y de controles; en la demo se juega con teclado (con la distribución de la versión de PC), ratón o mando, y hay un menú «Load Map» que el autor recuperó de los archivos del juego. El objetivo es poder jugar las dos versiones enteras desde tus propios discos. 13 de sus 28 commits llevan a Claude como coautor."
  en: "reSOT: a static recompilation of the original Xbox builds of The Sands of Time for Windows, using a patched copy of xboxrecomp that lifts all of default.xbe to C; the NV2A graphics commands are drawn with Direct3D 11. A person has played the E3 2003 demo up to the third level, and the NTSC retail version reaches its first playable level. Both are still being tested: there are crashes and visual glitches, the sound is pitched too high, in-level frame rates stay below 60 fps, and saving still fails in the retail version. It has 16:9 widescreen and its own graphics and controls options menu; the demo plays with keyboard (in the PC version’s layout), mouse, or gamepad, and has a Load Map menu the author recovered from the game files. The goal is both versions fully playable from your own discs. 13 of its 28 commits list Claude as a co-author."
requirements:
  es: "Los archivos de tus propios discos de Xbox: la demo del E3 2003 o la versión comercial NTSC, identificadas por el SHA-256 de su default.xbe. No hay releases: hay que compilarlo en Windows con MSVC y CMake."
  en: "Files from your own Xbox discs: the E3 2003 demo or the NTSC retail version, identified by the SHA-256 of their default.xbe. There are no releases: you build it on Windows with MSVC and CMake."
