desc:
  es: "P3FES Decompilation: port nativo para Windows x64 de la versión estadounidense de PS2 (SLUS_216.21), por recompilación estática: un recompilador propio traduce a C++ las 14.500 funciones del ejecutable MIPS del juego, que corren sobre un runtime hecho para este juego, con los gráficos en Direct3D 11 y los 114 microprogramas de la VU1 compilados de antemano. Según el README, el juego se completa de principio a fin, aunque el autor avisa de que no es el producto terminado: la lectura del disco, el sonido, la reproducción de ADX y otras partes de la PS2 siguen emuladas. Desde la v0.2.0 hay capas nativas opcionales, apagadas por defecto, que sustituyen esas piezas una a una: archivos con carga instantánea, entrada, sonido, vídeos, gráficos y núcleo. Ofrece un renderizador nativo para los modelos de RenderWare, imágenes intermedias interpoladas a 60 o 120 fps o a la frecuencia del monitor (la lógica sigue a 30), teclado y mandos XInput, capturas de pantalla y un contador de tiempos de fotograma; las partidas se guardan en una tarjeta de memoria de PS2 estándar. Cada cambio se valida contra PCSX2 con seis recorridos grabados que deben dar la misma memoria y la misma imagen byte a byte. El repositorio incluye el código del juego ya traducido: las 14.500 funciones, pasadas a C++ con sus nombres de IDA en la carpeta game/ (unos 53 MB). La única versión publicada, marcada como de prueba, es el ejecutable de la v0.2.0, actualizado el 31 de octubre. El README dice que el autor ha usado mucho Claude en el proyecto."
  en: "P3FES Decompilation: a native Windows x64 port of the US PS2 release (SLUS_216.21), by static recompilation: its own recompiler translates all 14,500 functions of the game’s MIPS executable into C++, which run on a runtime written for this game, with graphics in Direct3D 11 and the 114 VU1 microprograms compiled ahead of time. According to the README, the game can be played from start to finish, though the author warns that it isn’t the finished product: disc reads, sound, ADX playback, and other parts of the PS2 are still emulated. Since v0.2.0 there are optional native layers, off by default, that replace those pieces one at a time: files with instant loading, input, sound, movies, graphics, and kernel. It offers a native renderer for the RenderWare models, interpolated in-between frames at 60 or 120 fps or at the monitor’s refresh rate (game logic stays at 30), keyboard and XInput controllers, screenshots, and a frame-time overlay; saves go to a standard PS2 memory card image. Every change is validated against PCSX2 with six recorded routes that must produce the same memory and the same picture byte for byte. The repository includes the game’s translated code: all 14,500 functions, moved into C++ under their IDA names in the game/ folder (about 53 MB). The only published release, marked as a prerelease, is the v0.2.0 executable, updated on October 31. The README says the author has used Claude a lot on the project."
requirements:
  es: "Tu propia imagen .iso de Persona 3 FES, versión estadounidense (SLUS_216.21), en input\\persona3fes.iso, y su contenido extraído en extracted\\disc; el recompilador comprueba el SHA-256 del ELF y rechaza otras regiones e imágenes modificadas, y el sonido nativo necesita los archivos de LIB31. Además, Windows x64. Para compilarlo, MSVC 14.44 (Build Tools de Visual Studio 2022 17.14) o clang-cl, CMake 3.25 o posterior, Ninja y el SDK de Windows 10.0.26100."
  en: "Your own .iso image of Persona 3 FES, US release (SLUS_216.21), at input\\persona3fes.iso, plus its contents extracted to extracted\\disc; the recompiler checks the ELF’s SHA-256 and refuses other regions and modified images, and native sound needs the LIB31 files. Plus Windows x64. To build it, MSVC 14.44 (Visual Studio 2022 17.14 Build Tools) or clang-cl, CMake 3.25 or newer, Ninja, and Windows SDK 10.0.26100."
