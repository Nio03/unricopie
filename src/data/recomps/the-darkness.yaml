name: The Darkness
console: x360
status: playable
repo: portingpete/The-Darkness-Recomp
originalDeveloper: Starbreeze Studios
year: 2007
toolchain: XenonRecomp
desc:
  es: "Port nativo a Windows x64: el ejecutable de Xbox 360 se traduce a C++ por adelantado y se compila en DarkRecomp.exe, con su propio renderizador en D3D11 y sin emulación durante la ejecución. Hoy se puede jugar de principio a fin, con vista con el ratón, compatibilidad con mando, ajustes de vídeo (resolución, campo de visión, gamma, bloom, límite de fotogramas y sincronización vertical), audio XMA y guardado de partidas."
  en: "Native Windows x64 port: the Xbox 360 executable is translated to C++ ahead of time and built into DarkRecomp.exe, with its own D3D11 renderer and no emulation at run time. Playable today from start to finish, with mouse look, controller support, video settings (resolution, FOV, gamma, bloom, frame cap, and VSync), XMA audio, and saves."
requirements:
  es: "Tu propio volcado de The Darkness (Xbox 360): el default.xex original y las carpetas Content y System. El repositorio no incluye código, recursos ni binarios del juego."
  en: "Your own The Darkness dump (Xbox 360): the original default.xex plus the Content and System folders. The repository ships no game code, assets, or binaries."
tags:
  - powerpc
  - ai-assisted
