name: Daytona USA (recreativa)
games: [daytona-usa]
console: arcade
status: experimental
repo: alphanu1/daytona-arcade-recomp
originalDeveloper: Sega AM2
year: 1994
desc:
  es: "Recompilación estática del Daytona USA original de recreativa (placa Sega Model 2). Es distinta del otro recomp del catálogo, que se centra en el relanzamiento XBLA de 2011. Recompila a C++ portable tanto el programa del i960 como el programa TGP que este carga, y reescribe en C++ nativo el hardware de función fija (el geometrizador, el rasterizador y los mapas de teselas). Sin intérprete y sin núcleo de emulación: MAME solo se usa como referencia para comprobar los resultados."
  en: "Static recompilation of the original arcade Daytona USA (Sega Model 2 board). It’s separate from the other recomp in the catalog, which targets the 2011 XBLA re-release. It recompiles both the i960 program and the TGP program it uploads into portable C++, and rewrites the fixed-function hardware (geometrizer, rasterizer, and tilemaps) in native C++. No interpreter and no emulation core: MAME is only used as a reference to check the results."
requirements:
  es: "Tu propio conjunto de ROMs en formato MAME (.zip o .7z): daytona93 (Deluxe ’93), daytona (revisión A, 1994) o ambos. El repositorio no incluye datos del juego."
  en: "Your own MAME-format ROM set (.zip or .7z): daytona93 (Deluxe ’93), daytona (Revision A, 1994), or both. The repository ships no game data."
