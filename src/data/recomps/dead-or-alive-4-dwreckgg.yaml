desc:
  es: "Dead or Alive 4 de Xbox 360 en Windows, recompilado de forma estática con el SDK de ReXGlue y con juego en línea para dos jugadores: cada equipo envía sus pulsaciones al otro, el anfitrión es el jugador 1 y se conecta con un código; el modo en línea del propio juego, el de Xbox Live, no funciona. Es una bifurcación de parkerallan/doa4-recomp que suma ritmo de imagen, un menú con Esc (juego, controles, fotos, extras y red), opciones gráficas, idioma y subtítulos guardados, saltar la intro, un aviso de versión nueva, fotos de máxima calidad y una configuración inicial que busca o extrae los archivos del juego. También construye en tu equipo 34 trajes de baño de Dead or Alive Xtreme 2 desde tu propio disco, unos 300 MB que se escriben en la carpeta de guardados. El repositorio sube el C++ generado por el recompilador (unos 90 archivos de 2 MB en generated/default) y sus releases traen el ejecutable ya compilado, sin datos del juego. Usa licencia MIT y declara que se usaron herramientas de IA para escribir y probar el código y la documentación. Sigue en alfa: la alpha-v0.3.5 es del 17 de noviembre."
  en: "Dead or Alive 4 for Xbox 360 on Windows, statically recompiled with the ReXGlue SDK and with two-player online play: each PC sends its inputs to the other, the host is player 1 and players connect with a code; the game’s own Xbox Live online mode does not work. It is a fork of parkerallan/doa4-recomp that adds frame pacing, an Esc menu (game, controls, photo, extras and online), graphics options, saved language and subtitles, an option to skip the intro, a notice when a new version is out, full-quality photos and a first-run setup that finds or extracts the game files. It also builds 34 swimsuits from Dead or Alive Xtreme 2 on your PC from your own disc, about 300 MB written to the saves folder. The repository commits the C++ generated by the recompiler (about 90 files of 2 MB in generated/default) and its releases ship the already built executable, with no game data. It is MIT-licensed and states that AI tools were used to help write and test the code and documentation. It is still an alpha: alpha-v0.3.5 is from November 17."
requirements:
  es: "Tu propia copia de Dead or Alive 4 (EE. UU., Europa) (Rev 1), como imagen de disco (.iso) o carpeta extraída; para los trajes de baño, tu propio disco estadounidense de Dead or Alive Xtreme 2. Windows 10 u 11 de 64 bits con un procesador con AVX2 y al menos dos núcleos, y el runtime de Visual C++ 2015-2022 x64. Para jugar en línea, los dos jugadores necesitan la misma versión y, si el router no abre el puerto solo, UPnP o el puerto UDP 7200 reenviado."
  en: "Your own copy of Dead or Alive 4 (USA, Europe) (Rev 1), as a disc image (.iso) or an extracted folder; for the swimsuits, your own US disc of Dead or Alive Xtreme 2. 64-bit Windows 10 or 11 with an AVX2 CPU and at least two cores, and the Visual C++ 2015-2022 x64 runtime. For online play, both players need the same release and, if the router doesn’t open the port itself, UPnP or UDP port 7200 forwarded."
