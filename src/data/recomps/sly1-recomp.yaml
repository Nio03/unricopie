name: Sly Cooper and the Thievius Raccoonus
console: ps2
status: experimental
repo: chrisking1981/sly1-recomp
originalDeveloper: Sucker Punch
desc:
  es: "Intento muy temprano de port nativo del primer Sly Cooper mediante recompilación de PS2. Ejecuta más de 100 funciones (de memoria y de entrada/salida) antes de topar con partes del hardware GS y DMA sin implementar; todavía no muestra gráficos."
  en: "A very early attempt at a native port of the first Sly Cooper via PS2 recompilation. It runs over 100 functions (memory and I/O) before hitting unimplemented GS and DMA hardware; no graphics yet."
requirements:
  es: "El ELF «SCUS_971.98» de tu disco de Sly Cooper and the Thievius Raccoonus (PS2)."
  en: "The “SCUS_971.98” ELF from your Sly Cooper and the Thievius Raccoonus disc (PS2)."
