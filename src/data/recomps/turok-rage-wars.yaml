name: "Turok: Rage Wars"
console: n64
status: playable
repo: wootbeer/PaxDino
author: wootbeer
originalDeveloper: Acclaim Studios Austin
year: 1999
toolchain: N64Recomp
desc:
  es: "PaxDino: port nativo de Turok: Rage Wars para Windows, por recompilación estática con N64Recomp, N64ModernRuntime y RT64; las versiones de Linux y Steam Deck son experimentales. Está en beta. Añade panorámico, más resolución y fotogramas, bloom y antialiasing, ratón y teclado con apuntado (también en los menús), controles de mando modernos, multijugador local de hasta 4 jugadores, medallas en las partidas contra bots, ajustes predefinidos clásico y moderno, filtros CRT, de líneas de barrido y LCD, música propia, reverberación ajustable, trucos y desbloqueos sin códigos, punteros personalizados y un botón para añadirlo a Steam. Corrige un fallo del modo cooperativo Frag Tag con la ROM estadounidense 1.0. 6 de sus 8 commits llevan a Claude como coautor."
  en: "PaxDino: a native Turok: Rage Wars port for Windows, by static recompilation with N64Recomp, N64ModernRuntime, and RT64; the Linux and Steam Deck builds are experimental. It’s in beta. It adds widescreen, higher resolutions and frame rates, bloom and anti-aliasing, mouse and keyboard with mouse aim (in menus too), a modern controller layout, local multiplayer for up to 4 players, medals in bot matches, Classic and Modern presets, CRT, scanline, and LCD filters, custom music, adjustable reverb, unlocks and cheats without codes, custom crosshairs, and an Add to Steam button. It fixes a co-op Frag Tag bug with the 1.0 US ROM. 6 of its 8 commits list Claude as a co-author."
requirements:
  es: "Tu propia ROM estadounidense de Turok: Rage Wars (.n64, .z64 o .v64). Además, Windows; en Linux y Steam Deck, de forma experimental."
  en: "Your own US Turok: Rage Wars ROM (.n64, .z64, or .v64). Plus Windows; Linux and Steam Deck are experimental."
