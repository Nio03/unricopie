name: "Yo-kai Watch 4++"
games: [yo-kai-watch-4-plus-plus]
console: switch
status: experimental
repo: ILFforever/YW4Recomp
originalDeveloper: "Level-5"
year: 2019
desc:
  es: "Recompilación estática no oficial de Yo-kai Watch 4++ (actualización 2.2.0 de Switch) a un programa nativo de Windows, al estilo de N64Recomp: el código del juego se traduce a C y se compila en tu equipo, con un runtime propio y NVN sobre Vulkan. Va más allá de lo que hace un emulador porque sustituye partes del renderizador del juego por código propio: resolución de hasta 4K, formatos 16:10, 21:9 y 32:9 con la interfaz centrada, sombras suaves PCSS, TAA y SMAA, filtro de texturas x16, escalado con DLSS o FSR, generación de fotogramas y 60, 120 o 144 fps. Es un trabajo en curso que aún no se puede jugar entero: funciona desde el arranque hasta el comienzo de una partida nueva (presentación, nombre, escenas iniciales, la casa Amano, el pueblo, los menús y los combates) y desde partidas avanzadas, pero casi todo el juego no se ha probado y se esperan efectos que faltan y cierres. Solo Windows; Linux está previsto. No tiene versiones publicadas. Declara que Claude escribió la mayor parte del repositorio, y 100 de sus últimos 100 commits lo llevan como coautor."
  en: "An unofficial static recompilation of Yo-kai Watch 4++ (Switch update 2.2.0) into a native Windows program, in the style of N64Recomp: the game’s code is translated into C and compiled on your PC, with its own runtime and NVN on Vulkan. It goes further than an emulator does by replacing parts of the game’s renderer with its own code: resolution up to 4K, 16:10, 21:9, and 32:9 formats with the interface kept centered, PCSS soft shadows, TAA and SMAA, x16 texture filtering, upscaling with DLSS or FSR, frame generation, and 60, 120, or 144 fps. It is a work in progress that can’t yet be played from start to finish: it runs from boot through the start of a new game (logos, name entry, opening scenes, the Amano house, the town, the menus, and battles) and from late-game saves, but most of the game hasn’t been tried and missing effects and crashes are expected. Windows only; Linux is planned. It has no published releases. It states that Claude wrote most of the repository, and 100 of its last 100 commits list it as a co-author."
requirements:
  es: "Tu propia copia de Yo-kai Watch 4++ con la última actualización, la 2.2.0, de tu propia consola: carpetas ExeFS y RomFS ya extraídas, o el NSP o XCI con tu prod.keys (y title.keys para un NSP). El proyecto solo acepta esa versión, comprobada por el hash del ejecutable. Además, Windows con una GPU con Vulkan 1.3 y una CPU con FMA3, Python 3.11 o posterior, un compilador de C11 (mejor Clang) y, en la primera compilación, la descarga de unos 550 MB de FSR, DLSS y Streamline."
  en: "Your own copy of Yo-kai Watch 4++ with the last update, 2.2.0, from your own console: already extracted ExeFS and RomFS folders, or the NSP or XCI with your prod.keys (and title.keys for an NSP). The project only accepts that version, checked by the executable’s hash. Plus Windows with a Vulkan 1.3 GPU and an FMA3 CPU, Python 3.11 or later, a C11 compiler (Clang preferred), and, on the first build, a download of about 550 MB of FSR, DLSS, and Streamline."
