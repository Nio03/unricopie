name: Ridge Racer 6
console: x360
status: experimental
repo: Sirhalo23/RidgeRacer6-Recompilation
originalDeveloper: Namco
year: 2005
desc:
  es: "Versión nativa de Windows hecha por aficionados: el programa PowerPC de la Xbox 360 se traduce a C++ y se compila en un ejecutable de Windows. Su autor lo da como prueba temprana. Es el tercer Ridge Racer del catálogo y son tres juegos distintos: el de PS1, Revolution y este."
  en: "Fan-made native Windows version: the Xbox 360's PowerPC program is translated to C++ and compiled into a Windows executable. Its author calls it an early test. It is the third Ridge Racer in the catalogue, and they are three different games: the PS1 one, Revolution and this."
requirements:
  es: "Tu propia copia de Ridge Racer 6 para Xbox 360 (disco estadounidense, título 4E4D07D3). El repositorio no contiene código ni datos del juego: pistas, coches, sonido y vídeo salen de tu propia imagen de disco."
  en: "Your own copy of Ridge Racer 6 for Xbox 360 (US disc, title ID 4E4D07D3). The repository holds no game code and no game data: tracks, cars, sound and video all come from your own disc image."
