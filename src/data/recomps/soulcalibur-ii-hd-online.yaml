name: Soulcalibur II HD Online
console: ps3
status: playable
repo: n0madic/Soulcalibur2HD-recomp
author: n0madic
originalDeveloper: Project Soul
year: 2013
toolchain: ps3recomp
desc:
  es: "Recompilación estática de la versión de PSN para PS3 (NPUB31366) con ps3recomp: el código PowerPC y SPU se traduce a C/C++ y se compila en tu equipo. Funciona en Mac con Apple Silicon (Metal) y en Windows (Vulkan, probado en un portátil con Intel Arc); en Linux compila y arranca, pero solo se ha probado con un rasterizador por software. La primera vez, el launcher instala tu copia con su licencia, la traduce y la compila en pocos minutos, y si hace falta descarga un compilador, pidiendo permiso antes. Admite las versiones 1.00 y 1.01, pantalla completa y opciones para desbloquear todos los personajes, y en Mac suma FXAA y filtrado anisotrópico. El modo en línea no está disponible, y la imagen se queda en 1280×720, sin escalado interno. 13 de sus 35 commits llevan a Claude como coautor."
  en: "A static recompilation of the PSN release for PS3 (NPUB31366) with ps3recomp: the PowerPC and SPU code is translated to C/C++ and compiled on your machine. It works on Apple Silicon Macs (Metal) and on Windows (Vulkan, tested on an Intel Arc laptop); on Linux it builds and runs, but has only been tried on a software rasterizer. On first run, the launcher installs your copy with its license, translates it, and compiles it in a few minutes, downloading a compiler if needed after asking. It supports versions 1.00 and 1.01, fullscreen, and options to unlock every character, and on Mac it adds FXAA and anisotropic filtering. Online Mode isn’t available, and the picture stays at 1280×720, with no internal scaling. 13 of its 35 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Soulcalibur II HD Online de PSN (NPUB31366, EE. UU.): el paquete del juego y su licencia .rap; la actualización 1.01 es opcional. Además, Python 3.10 o posterior, unos 1,5 GB libres y conexión a internet la primera vez. Hay versiones para Mac con Apple Silicon, Windows x86-64 y Linux x86-64."
  en: "Your own PSN copy of Soulcalibur II HD Online (NPUB31366, US): the game package and its .rap license; the 01.01 update is optional. Plus Python 3.10 or later, about 1.5 GB of free space, and an internet connection on first run. There are builds for Apple Silicon Macs, x86-64 Windows, and x86-64 Linux."
tags:
  - powerpc
