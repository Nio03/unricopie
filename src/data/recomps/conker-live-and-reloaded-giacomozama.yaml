desc:
  es: "Live & Recompiled: port nativo y no oficial para Windows y Linux del Conker: Live & Reloaded de la Xbox original, hecho con una versión muy modificada de Xbox XBE Recomp, de TGP482 (es otro proyecto que el Conker: Live & Recompiled de cdetv, que usa xboxrecomp). Las releases no traen ni el código ni los recursos del juego: su Setup extrae y recompila el juego en tu PC en unos minutos. Según el README, la recompilación está completa, en un jugador y en multijugador. Suma 60, 120, 180 o 240 fps en lugar de los 30 originales, cualquier proporción de pantalla, Vulkan a cualquier resolución con SMAA o MSAA, FSR 1.0, iluminación por píxel y oclusión ambiental, mando y teclado con ratón, multijugador a pantalla partida, por LAN y por IP directa, una capa para instalar mods (como el parche de descensura de nastys), saltarse cargas y escenas, y modo portable con un portable.txt. Sobre él se monta Conker: Recomped & Reloaded, de Mabec-games. El README avisa de que todo su código propio lo generó un LLM y no se revisó línea a línea. La v4.0.0 es del 14 de noviembre."
  en: "Live & Recompiled: an unofficial native port for Windows and Linux of the original Xbox's Conker: Live & Reloaded, built on a heavily modified version of TGP482's Xbox XBE Recomp (a different project from cdetv's Conker: Live & Recompiled, which uses xboxrecomp). The releases include neither the game's code nor its assets: its Setup extracts and recompiles the game on your PC in a few minutes. According to the README, the recompilation is complete, in single player and multiplayer. It adds 60, 120, 180 or 240 fps instead of the original 30, any aspect ratio, Vulkan at any resolution with SMAA or MSAA, FSR 1.0, per-pixel lighting and ambient occlusion, gamepad and keyboard and mouse, split-screen, LAN and direct-IP multiplayer, a layer for installing mods (such as nastys' decensor patch), skippable loading screens and cutscenes, and a portable mode with a portable.txt. Mabec-games' Conker: Recomped & Reloaded is built on it. The README warns that all its first-party code was generated by an LLM and not reviewed line by line. Version 4.0.0 is from November 14."
requirements:
  es: "Tu propia copia de Conker: Live & Reloaded de EE. UU.: el disco (una .iso o los archivos extraídos; SHA-1 del default.xbe 2232a1b3874d67b4bb4cf53a940420d2dab59535) o la versión digital retrocompatible de la tienda de Xbox (su DefaultPackage). Windows o Linux de 64 bits y unos 5 GB libres."
  en: "Your own US copy of Conker: Live & Reloaded: the disc (an .iso or the extracted files; default.xbe SHA-1 2232a1b3874d67b4bb4cf53a940420d2dab59535) or the digital backward-compatible Xbox Store release (its DefaultPackage). 64-bit Windows or Linux and about 5 GB free."
