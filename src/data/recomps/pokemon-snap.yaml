name: Pokémon Snap
console: n64
status: playable
repo: JackandBeans/Snap64Recomp
originalDeveloper: HAL Laboratory
year: 1999
toolchain: N64Recomp
desc:
  es: "Snap64 Recomp: port nativo a Windows de Pokémon Snap (edición estadounidense). N64Recomp traduce el código MIPS a C, N64ModernRuntime sustituye al sistema operativo de la consola, RT64 se encarga del renderizado y SDL2 de la ventana, la entrada y el audio. La regla del port: ejecuta el código original del juego, y cualquier cambio en el aspecto visual viene desactivado hasta que lo activas."
  en: "Snap64 Recomp: a native Windows port of Pokémon Snap (US release). N64Recomp translates the MIPS code to C, N64ModernRuntime stands in for the console’s operating system, RT64 handles rendering, and SDL2 provides the window, input, and audio. The port’s rule: the game’s own code runs, and every change to how it looks is off until you turn it on."
requirements:
  es: "Tu propio volcado del cartucho de Pokémon Snap (N64, versión estadounidense)."
  en: "Your own Pokémon Snap cartridge dump (N64, US version)."
tags:
