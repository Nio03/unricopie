name: "The Legend of Zelda: Tears of the Kingdom (kuraeow)"
games: [the-legend-of-zelda-tears-of-the-kingdom]
console: switch
status: experimental
repo: kuraeow/ultratears
originalDeveloper: "Nintendo EPD"
year: 2023
desc:
  es: "UltraTears es un port nativo no oficial para Windows de la versión 1.4.3 de la Switch. No es un emulador: el código del juego se traduce por adelantado (recompilación estática, ARM64 a C a x86-64), y el sistema y la API gráfica NVN de la consola se sustituyen por implementaciones propias sobre Windows y Vulkan; shaders y texturas se convierten al construir el juego, no al jugar. No se publica ningún ejecutable con el juego: se descarga un constructor que traduce y compila el juego en tu equipo a partir de tu volcado, o se construye desde el código fuente. El README lo da por temprano: se juega el título, una partida nueva, el prólogo y la Gran Isla del Cielo, a los 30 cuadros del propio juego con tirones mientras se compilan shaders nuevos. Steam Deck y Linux están previstos. La única versión, la v0.1.0-beta, es del 25 de octubre. 1 de sus 3 commits lleva a Claude como coautor."
  en: "UltraTears is an unofficial native Windows port of version 1.4.3 for the Switch. It isn’t an emulator: the game’s code is translated ahead of time (static recompilation, ARM64 to C to x86-64), and the console’s system and NVN graphics API are replaced by the port’s own implementations on Windows and Vulkan; shaders and textures are converted when the game is built, not while playing. No executable with the game is published: you download a builder that translates and compiles the game on your PC from your own dump, or build from source. The README calls it early: the title screen, a new game, the prologue and the Great Sky Island play, at the game’s own 30 fps with hitches while new shaders compile. Steam Deck and Linux are planned. The only release, v0.1.0-beta, is from October 25. 1 of its 3 commits lists Claude as a co-author."
requirements:
  es: "Tu propia copia de The Legend of Zelda: Tears of the Kingdom con la actualización 1.4.3, como dos carpetas normales: exefs (main, subsdk0, sdk, main.npdm…) y romfs (unos 304.000 archivos, 16 GB). No sirven .nsp, .xci, .nca ni paquetes cifrados, y no usa claves. Además, Windows 10 u 11 de 64 bits, una CPU con AVX2, una GPU con Vulkan 1.3 y VK_EXT_shader_object, 16 GB de RAM y unos 32 GB libres para la compilación."
  en: "Your own copy of The Legend of Zelda: Tears of the Kingdom with update 1.4.3, as two ordinary folders: exefs (main, subsdk0, sdk, main.npdm…) and romfs (about 304,000 files, 16 GB). .nsp, .xci, .nca and other encrypted packages don’t work, and it reads no keys. Plus 64-bit Windows 10 or 11, a CPU with AVX2, a GPU with Vulkan 1.3 and VK_EXT_shader_object, 16 GB of RAM, and about 32 GB free for the build."
