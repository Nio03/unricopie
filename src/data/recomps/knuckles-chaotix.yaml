name: "Knuckles' Chaotix"
console: 32x
status: playable
repo: YuutaTsubasa/ChaotixRecompiled
originalDeveloper: Sega
year: 1995
desc:
  es: "Recompilación estática del juego de 32X a C++: el código del 68000 y de los dos SH-2 se traduce por adelantado, y una pequeña capa de compatibilidad (registros de 32X y Mega Drive, los dos VDP, interrupciones, temporizadores y chips de sonido) más un frontend en SDL3 lo convierten en un programa nativo. No necesita la BIOS de 32X. Arranca, los menús funcionan y los niveles se juegan con sonido. En los niveles tiene panorámica real: el dibujado del propio juego se amplía para pintar casillas, objetos y sprites en la zona extra, de 4:3 a 2:1, y los 320 píxeles centrales quedan idénticos al original, cosa que comprueba un test; fuera de los niveles sigue en 4:3. Añade un menú propio con TIME ATTACK, que entra en cualquier nivel con las opciones de la pantalla de selección de fase que el juego trae pero nunca muestra, controles configurables para dos jugadores, 22 logros locales, trucos (99 anillos, zapatillas de velocidad y códigos de Action Replay), volúmenes separados de música y efectos, sustitución de la música con archivos WAV y controles táctiles. Hay versiones para Windows, que su autor ha compilado y jugado, para Linux x64, probada solo en WSL, y para Android. La última es la 0.4.5 (21 de octubre), que hace correr las fases especiales como código recompilado. 81 de sus 89 commits llevan a Claude como coautor."
  en: "A static recompilation of the 32X game to C++: the code for the 68000 and both SH-2s is translated ahead of time, and a small compatibility layer (32X and Mega Drive registers, both VDPs, interrupts, timers, and sound chips) plus an SDL3 frontend turn it into a native program. It needs no 32X BIOS. It boots, the menus work, and the levels are playable with sound. Levels get true widescreen: the game’s own renderer is extended to draw tiles, objects, and sprites in the extra area, from 4:3 up to 2:1, and the center 320 pixels stay identical to the original, which a test checks; outside levels it stays 4:3. It adds its own menu with TIME ATTACK, which drops you into any level with the options of the stage-select screen the game carries but never shows, per-player controls for two players, 22 local achievements, cheats (99 rings, speed shoes, and Action Replay codes), separate music and effects volumes, music replacement with WAV files, and touch controls. There are builds for Windows, which the author has built and played, for x64 Linux, tested only under WSL, and for Android. The latest is 0.4.5 (October 21), which makes the special stages run as recompiled code. 81 of its 89 commits list Claude as a co-author."
requirements:
  es: "Tu propia ROM de Knuckles' Chaotix (Japan, USA), con SHA-1 0c2fff7bc79ed26507c08ac47464c3af19f7ced7; la primera vez se comprueba y se copia a la carpeta de datos del programa. No hace falta la BIOS de 32X. Además, Windows de 64 bits o Linux x64 con glibc 2.35 o posterior (la versión se compila en Ubuntu 22.04). Para compilarlo, CMake 3.20 o posterior, un compilador de C++17, SDL3 y SDL_ttf."
  en: "Your own Knuckles' Chaotix (Japan, USA) ROM, SHA-1 0c2fff7bc79ed26507c08ac47464c3af19f7ced7; on first launch it’s verified and copied into the program’s data folder. No 32X BIOS is needed. Plus 64-bit Windows, or x64 Linux with glibc 2.35 or later (the release is built on Ubuntu 22.04). Building it requires CMake 3.20 or later, a C++17 compiler, SDL3, and SDL_ttf."
