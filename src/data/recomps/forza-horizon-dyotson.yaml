desc:
  es: "«Forza Horizon 1: ReImagined»: recompilación estática de la versión de Xbox 360 para Linux y Windows, con el SDK de ReXGlue y parches propios. Es un proyecto aparte de Pinyon Shift: parte del recomp de Halo: Reach del mismo autor, y de Pinyon Shift adapta solo algunas piezas, como el presentador HDR. El launcher genera y compila el juego en tu equipo a partir de tu copia, en unos 4 minutos con 8 núcleos; no se publica ningún binario del juego. La campaña se ha jugado entera, del primer trayecto al final del festival. Incluye la actualización 4 con Horizon Rally y el 1000 Club, los 23 DLC, de 60 a 144 fps (hasta 240) sin alterar la física ni los tiempos, teclado y ratón, volantes, ultrapanorámico, FSR, DLSS y DLAA en NVIDIA, y partidas guardadas de Xenia Canary. Como Xbox Live ya no existe, trae Forza Live, un servidor que puedes alojar tú, con una instancia pública: carreras en línea, Horizon World (un mundo abierto compartido de ocho jugadores), clasificaciones, Rivales, clubes y el Message Center. El launcher es experimental, y la versión de macOS para Apple Silicon solo se compila a mano. La v0.1.24 (19 de octubre) añadió una galería de fotos al launcher. Unos 60 de sus commits llevan a Claude como coautor."
  en: "“Forza Horizon 1: ReImagined”: a static recompilation of the Xbox 360 version for Linux and Windows, with the ReXGlue SDK and its own patches. It’s a separate project from Pinyon Shift: it builds on the same author’s Halo: Reach recomp, and takes only a few pieces from Pinyon Shift, such as the HDR presenter. The launcher generates and compiles the game on your machine from your copy, in about 4 minutes on 8 cores; no game binaries are published. The single-player game has been played through, from the opening drive to the end of the festival. It includes Title Update 4 with Horizon Rally and the 1000 Club, all 23 DLC packs, 60 to 144 fps (up to 240) without changing physics or timing, keyboard and mouse, racing wheels, ultrawide, FSR, DLSS and DLAA on NVIDIA, and saves from Xenia Canary. Since Xbox Live is gone, it ships Forza Live, a server you can host yourself, with a public instance: online races, Horizon World (a shared open world for eight players), leaderboards, Rivals, car clubs, and the Message Center. The launcher is experimental, and the macOS build for Apple silicon is source-only. v0.1.24 (October 19) added a photo gallery to the launcher. About 60 of its commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Forza Horizon para Xbox 360 (título 4D5309C9), versión base: el paquete de Games on Demand o la ISO del disco 1, de cualquier edición; si quieres, la actualización 4 (para Horizon Rally y el 1000 Club) y tus DLC. Además, Linux x86-64 o Windows 10 u 11 de 64 bits, una tarjeta gráfica con Vulkan 1.3, unos 4 GB de RAM libres y unos 15 GB de disco."
  en: "Your own copy of Forza Horizon for Xbox 360 (title 4D5309C9), base version: the Games on Demand package or the disc 1 ISO, any printing; optionally Title Update 4 (for Horizon Rally and the 1000 Club) and your DLC. Plus x86-64 Linux or 64-bit Windows 10 or 11, a Vulkan 1.3 graphics card, about 4 GB of free RAM, and about 15 GB of disk space."
