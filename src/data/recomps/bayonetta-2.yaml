name: Bayonetta 2
console: switch
status: playable
repo: K0NL/B2recomp
author: K0NL
originalDeveloper: PlatinumGames
year: 2014
desc:
  es: "B2recomp: recompilación estática no oficial de la versión de Switch para Windows. El código AArch64 se traduce a C en tu propio PC, a partir de tu volcado, y corre sobre una capa de sistema reimplementada (hilos, archivos, sonido, entrada y la API gráfica NVN sobre Vulkan). Nunca se publica el juego compilado: lo que se descarga es el código y un paquete con las herramientas para compilarlo, unos 5 minutos en un PC rápido. En las pruebas de su autor, el prólogo se juega entero sin cierres y el capítulo 1 se jugó a mano más allá de su primera parte; los capítulos siguientes se están probando. Tiene escala de resolución, ventana o pantalla completa y, en beta, hasta 120 fps. Hay una versión para Linux en pruebas. El recompilador y el runtime parten de los de OpenSmash-Ultimate, y su autor declara que usó IA para la ingeniería inversa."
  en: "B2recomp: an unofficial static recompilation of the Switch version for Windows. The AArch64 code is translated to C on your own PC, from your dump, and runs on a reimplemented system layer (threads, file system, audio, input, and the NVN graphics API on Vulkan). The compiled game is never published: what you download is the source and a package with the tools to build it, about 5 minutes on a fast PC. In its author’s tests, the prologue plays through with no crash and chapter 1 was played by hand past its first part; later chapters are being tested. It has resolution scaling, windowed or fullscreen modes, and, in beta, up to 120 fps. A Linux version is in testing. The lifter and runtime started from OpenSmash-Ultimate’s, and its author states that AI helped with the reverse engineering."
requirements:
  es: "Tu propia copia extraída de Bayonetta 2 con la actualización 1.2 aplicada (ExeFS y RomFS como archivos sueltos; los paquetes cifrados no sirven). Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Vulkan 1.3 y unos 1,5 GB libres para el paquete de compilación."
  en: "Your own extracted copy of Bayonetta 2 with update 1.2 applied (ExeFS and RomFS as plain files; encrypted packages aren’t accepted). Plus 64-bit Windows 10 or 11, a graphics card with Vulkan 1.3, and about 1.5 GB free for the builder package."
tags:
