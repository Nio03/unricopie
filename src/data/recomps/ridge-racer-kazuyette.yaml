name: "Ridge Racer (kazuyette)"
console: ps1
status: playable
repo: kazuyette/rr-decomp
originalDeveloper: Namco
year: 1994
desc:
  es: "rr-decomp: decompilación exacta de la versión japonesa (SLPS-00001) y, a la vez, una recompilación estática que la hace funcionar de forma nativa. La decompilación está completa desde el 10 de octubre: las 408 funciones del juego son C que GCC 2.5.7 vuelve a compilar en los mismos bytes, y el ejecutable resultante es idéntico al original. La parte jugable va por otro lado: un traductor propio convierte cada instrucción MIPS del PSX.EXE en C, y un modelo del hardware escrito para este juego hace el resto, sin imagen de BIOS, porque reimplementa las dieciséis funciones de la BIOS que el juego usa. La versión 0.1.0 (17 de agosto) arranca desde tu disco hasta la carrera, dibuja con un rasterizador por software, reproduce las doce pistas de audio del CD, sintetiza las 24 voces del chip de sonido y acepta teclado y mando; el stick y los gatillos se hacen pasar por un neGcon, el mando analógico que el juego ya reconocía, y F1 abre un menú de ajustes propio. Solo se han ejecutado 12 de los 40 estados del juego con un recorrido automático, y 17 jugando a mano. El plan es sustituir una a una las funciones traducidas por las decompiladas. No hay ejecutables publicados: se compila en Linux o WSL, y para Windows se genera un .exe con MinGW. El proyecto se declara muy asistido por IA: las herramientas, la división del código y la conversión a C las hace Claude, de Anthropic, bajo dirección y revisión humanas, y 42 de sus commits llevan a Claude como coautor."
  en: "rr-decomp: a matching decompilation of the Japanese release (SLPS-00001) and, alongside it, a static recompilation that runs it natively. The decompilation has been complete since October 10: all 408 game functions are C that GCC 2.5.7 compiles back to the same bytes, and the resulting executable is identical to the original. The playable part is separate: the project’s own translator turns every MIPS instruction of PSX.EXE into C, and a hardware model written for this game does the rest, with no BIOS image, since it reimplements the sixteen BIOS functions the game calls. Version 0.1.0 (August 17) boots from your disc to a race, draws with a software rasterizer, plays the CD’s twelve audio tracks, synthesizes the sound chip’s 24 voices, and takes keyboard and controller; the stick and triggers pose as a neGcon, the analog controller the game already supported, and F1 opens a settings menu of its own. Only 12 of the game’s 40 states have been exercised by a scripted run, and 17 by hand. The plan is to swap the translated functions for the decompiled ones one at a time. There are no published binaries: it’s built on Linux or WSL, and a Windows .exe can be produced with MinGW. The project describes itself as heavily AI-assisted: tooling, code splitting, and C conversion are driven by Anthropic’s Claude under human direction and review, and 42 of its commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de la versión japonesa de Ridge Racer para PS1 (SLPS-00001): su PSX.EXE (SHA-1 31ec5d36…) y una imagen de la pista de datos, que un script del proyecto saca de tu .bin. Además, Python 3 y un compilador de C en Linux o WSL, y SDL2 si quieres ventana, sonido y mando; para Windows, el .exe se compila con MinGW."
  en: "Your own copy of the Japanese release of Ridge Racer for PS1 (SLPS-00001): its PSX.EXE (SHA-1 31ec5d36…) and an image of the data track, which a script in the project makes from your .bin. Plus Python 3 and a C compiler on Linux or WSL, and SDL2 for a window, sound, and controller; for Windows, the .exe is cross-compiled with MinGW."
