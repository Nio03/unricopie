name: "Forza Horizon 2 (Xbox 360)"
games: [forza-horizon-2]
console: x360
status: experimental
repo: fabioap-cpu/Forza-Horizon-2-Recomp
originalDeveloper: "Sumo Digital"
year: 2014
toolchain: ReXGlue
desc:
  es: "Recompilación estática experimental de la versión de Xbox 360 con ReXGlue, con el SDK incluido en el repositorio. Trae el código del proyecto, los metadatos de recompilación, la configuración de compilación y el SDK, sin datos del juego, archivos del sistema de Xbox, partidas ni ejecutables compilados. El propio README dice que es un trabajo en curso sin resolver y que no es una compilación funcional: en el Windows AMD64 probado arranca y llega a la pantalla de carga, pero el hilo principal del invitado se queda parado esperando un semáforo del núcleo y el juego no avanza más; la causa no se ha encontrado. Se han corregido otros dos cierres reproducibles. Nada más allá de la pantalla de carga se ha probado. No tiene versiones publicadas."
  en: "An experimental static recompilation of the Xbox 360 version with ReXGlue, with the SDK vendored in the repository. It holds the project source, recompilation metadata, build configuration and the SDK, with no game data, Xbox system files, saves or compiled executables. The README itself says it is an early, unresolved work in progress and not a working build: on the tested Windows AMD64 system it boots and reaches the loading screen, but the main guest thread permanently stalls waiting on a kernel semaphore and the game never gets further; the root cause hasn’t been found. Two other reproducible crashes were fixed. Nothing past the loading screen has been tested. It has no published releases."
requirements:
  es: "Tu propia copia de Forza Horizon 2 para Xbox 360 como árbol de archivos extraído, con default.xex, XMediaFacade_default.xex y SpeechFacade_default.xex. Windows AMD64, Git, CMake 3.25 o posterior, Ninja y Clang."
  en: "Your own copy of Forza Horizon 2 for Xbox 360 as an extracted game tree, with default.xex, XMediaFacade_default.xex and SpeechFacade_default.xex. Windows AMD64, Git, CMake 3.25 or newer, Ninja and Clang."
tags:
