desc:
  es: "Port nativo para Windows de la versión de Xbox 360, por recompilación estática con el SDK de ReXGlue, con un launcher pensado para jugar desde el sofá. Supera la congelación de «VENTURE» que detiene a Xenia. Ofrece hasta 8K, cualquier tasa de fotogramas hasta 240 o sin límite, FSR 1 y NIS, oclusión ambiental, el aspecto original de Xbox 360 o uno moderno, campo de visión hasta 110 grados, teclado y ratón, los diez trucos como interruptores, logros con avisos y un botón para añadirlo a Steam. En Linux y Steam Deck va con Proton, de forma experimental. Está en desarrollo activo y todavía no se ha confirmado una partida completa. Su autor declara que lo hizo casi entero con Claude Code."
  en: "A native Windows port of the Xbox 360 version, by static recompilation with the ReXGlue SDK, with a launcher made for the couch. It gets past the “VENTURE” freeze that stops Xenia. It offers up to 8K, any frame rate up to 240 or uncapped, FSR 1 and NIS, ambient occlusion, the original Xbox 360 look or a modern one, up to a 110° field of view, keyboard and mouse, all ten cheats as switches, achievements with pop-ups, and an Add to Steam button. On Linux and the Steam Deck it runs through Proton, experimentally. It’s in active development and a full play-through hasn’t been confirmed yet. Its author states it was made almost entirely with Claude Code."
requirements:
  es: "Una imagen de tu propio disco de Peter Jackson's King Kong para Xbox 360, versión de EE. UU. y Europa (Title ID 555307D3, la versión original). Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con DirectX 12 y unos 7 GB libres."
  en: "An image of your own Peter Jackson's King Kong Xbox 360 disc, USA/Europe release (Title ID 555307D3, the original version). Plus 64-bit Windows 10 or 11, a DirectX 12 graphics card, and about 7 GB of free space."
