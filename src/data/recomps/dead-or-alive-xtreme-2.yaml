desc:
  es: "Port nativo para Windows de la versión de Xbox 360, hecho con ReXGlue SDK: el código PowerPC se traduce por adelantado a C++ y corre de forma nativa, a 30 cuadros por segundo o a 60 nativos con la velocidad original. Se dibuja en la GPU con Direct3D 12, emulando el hardware gráfico de la consola. El README avisa de que los gráficos integrados de Intel no están soportados y de que los requisitos del sistema son estimados. Trae un lanzador con jugar, ajustes, ajustes gráficos, entrada (experimental) y actualización automática desde la v1.1.3. Solo se admite el disco original, sin actualizaciones de título. La v1.1.4a (25 de octubre, «prueba experimental») publica un zip de unos 19 MB con el programa ya compilado, sin datos del juego, y otro con el código fuente; el README dice que no incluye código del juego. Sus 17 commits llevan todos a Claude como coautor."
  en: "A native Windows port of the Xbox 360 version, made with the ReXGlue SDK: the PowerPC code is translated ahead of time to C++ and runs natively, at 30 fps or at a native 60 with the original game speed. It is drawn on the GPU with Direct3D 12, emulating the console’s graphics hardware. The README warns that Intel integrated graphics are not supported and that the system requirements are estimates. It has a launcher with play, settings, graphics settings, input (experimental) and self-update since v1.1.3. Only the retail disc is supported, with no title updates. v1.1.4a (October 25, an “experimental test build”) publishes a zip of about 19 MB with the program already built, with no game data, and another with the source; the README says it includes no game code. All 17 of its commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Dead or Alive Xtreme 2 para Xbox 360, solo el disco original (ID de título 544307D2, ID de medio 21B9628E, default.xex versión 3 con SHA-256 c4a14853e1f7af951be34f380604113703638780b36d5e74e674fe7431992870), extraída en la carpeta «extracted game files here». Windows 10 u 11 de 64 bits y una gráfica con DirectX 12."
  en: "Your own copy of Dead or Alive Xtreme 2 for Xbox 360, the retail disc only (title ID 544307D2, media ID 21B9628E, default.xex version 3 with SHA-256 c4a14853e1f7af951be34f380604113703638780b36d5e74e674fe7431992870), extracted into the “extracted game files here” folder. 64-bit Windows 10 or 11 and a DirectX 12 graphics card."
