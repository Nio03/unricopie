desc:
  es: "Port nativo para Windows y Linux por recompilación con N64Recomp, construido sobre su decompilación exacta y con N64ModernRuntime, RT64 y SDL2. Ya se juegan los menús originales y la campaña, con imagen, sonido, teclado y mando, en cualquier formato de 4:3 a 32:9; el multijugador y una validación más amplia siguen en desarrollo."
  en: "Native Windows and Linux port by recompilation with N64Recomp, built on its matching decompilation and using N64ModernRuntime, RT64, and SDL2. The original menus and the campaign are playable, with graphics, sound, keyboard, and controller support, in any aspect ratio from 4:3 to 32:9; multiplayer and broader validation are still in development."
