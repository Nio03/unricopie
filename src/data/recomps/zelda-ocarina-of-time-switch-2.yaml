desc:
  es: "Hookshot: recompilación estática de The Legend of Zelda: Ocarina of Time de Switch 2 (la versión de 2026) en un programa nativo para Windows y Linux, sin emulador. El código ARM64 del juego se traduce a C y se compila junto con una reimplementación del sistema de la consola; las llamadas gráficas NVN2 se reproducen con Vulkan, y los shaders de Switch 2 se traducen a SPIR-V con el recompilador de shaders de Eden. El juego no viene hecho: Hookshot Builder lo construye una sola vez en tu PC a partir de tu copia (antes descarga unos 500 MB de herramientas, con su propio compilador), y después se arranca y se actualiza desde su launcher. Es experimental: el README dice que funcionan el Bosque Kokiri con su jugabilidad, el sonido, el mando, el teclado, las partidas guardadas, el menú del juego, la generación de fotogramas y el reescalado (DLSS, FSR 3.1 y FSR 4), y que hay jugadores que llegaron al Campo de Hyrule, la Ciudadela, la Aldea Kakariko y las mazmorras, con errores abiertos; las tarjetas sin mesh shaders no están soportadas. El repositorio trae listas de estados de pipelines de Vulkan grabadas por jugadores, que solo guardan hashes y formatos, sin código ni datos del juego. La versión 2.1.0 es del 11 de noviembre. 51 de sus últimos 100 commits llevan a Claude como coautor."
  en: "Hookshot: a static recompilation of The Legend of Zelda: Ocarina of Time for Switch 2 (the 2026 version) into a native program for Windows and Linux, with no emulator. The game’s ARM64 code is translated to C and compiled together with a reimplementation of the console’s system; the NVN2 graphics calls are replayed on Vulkan, and the Switch 2 shaders are translated to SPIR-V with Eden’s shader recompiler. The game doesn’t come ready-made: Hookshot Builder builds it once on your PC from your copy (first downloading about 500 MB of tools, its own compiler included), and afterwards you start and update it from its launcher. It’s experimental: the README says Kokiri Forest gameplay, sound, controller, keyboard, saves, the in-game menu, frame generation, and upscaling (DLSS, FSR 3.1, and FSR 4) work, and that players have reached Hyrule Field, Castle Town, Kakariko Village, and the dungeons, with open bugs; cards without mesh shaders aren’t supported. The repository holds lists of Vulkan pipeline states recorded by players, which only store hashes and formats, with no game code or data. Version 2.1.0 is from November 11. 51 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de The Legend of Zelda: Ocarina of Time para Switch 2, en la versión exacta que admite (programa 0400486024DEC000, actualización v131072, build e0f3ccfa), como archivo .nup o como carpetas romfs y exefs. Windows 10 u 11 o Linux de 64 bits (glibc 2.35 o posterior, y una CPU con AVX2 para la AppImage); una GPU con Vulkan 1.3 y mesh shaders (NVIDIA RTX 20 o posterior, AMD RX 6000 o posterior, Intel Arc), 16 GB de RAM, mejor con 8 GB de VRAM, y unos 60 GB libres mientras se construye."
  en: "Your own copy of The Legend of Zelda: Ocarina of Time for Switch 2, at the exact version it supports (program 0400486024DEC000, update v131072, build e0f3ccfa), as a .nup file or as romfs and exefs folders. 64-bit Windows 10 or 11 or Linux (glibc 2.35 or newer, and a CPU with AVX2 for the AppImage); a GPU with Vulkan 1.3 and mesh shaders (NVIDIA RTX 20 or newer, AMD RX 6000 or newer, Intel Arc), 16 GB of RAM, ideally 8 GB of VRAM, and about 60 GB free while building."
