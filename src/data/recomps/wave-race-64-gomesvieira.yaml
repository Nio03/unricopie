name: Wave Race 64 (gomesvieira)
console: n64
status: playable
repo: danielgomesvieira2000/wave-race-64-recomp
originalDeveloper: Nintendo EAD
year: 1996
toolchain: N64Recomp
desc:
  es: "Port nativo por recompilación estática con N64Recomp, que funciona sobre N64ModernRuntime, con RT64 para el renderizado y RecompFrontend para los menús y el mando. Es independiente de los otros dos recomps de Wave Race 64 del catálogo: a diferencia del que figura simplemente como «Wave Race 64», que se quedó en arrancar mostrando ruido, este tiene versiones beta jugables. El fork de elliotttate añade una versión para macOS en Apple Silicon, texturas en HD y una banda sonora alternativa. Los dos repositorios declaran que el port está programado con asistencia de IA."
  en: "Native port by static recompilation with N64Recomp, running on N64ModernRuntime, with RT64 for rendering and RecompFrontend for menus and controller support. It’s independent of the other two Wave Race 64 recomps in the catalog: unlike the one listed simply as “Wave Race 64,” which stalled at booting to noise, this one has playable beta builds. The elliotttate fork adds an Apple Silicon macOS build, HD textures, and a replacement soundtrack. Both repositories state that the port is AI-coded."
requirements:
  es: "Tu propia ROM de Wave Race 64, que tiene que ser la estadounidense Rev A (v1.1, .z64 de 8 MiB). Las versiones estadounidense v1.0, japonesa, europea y Shindou no funcionan: su código está dispuesto de otra forma, y todas las direcciones del proyecto dependen de la Rev A."
  en: "Your own Wave Race 64 ROM, which must be the US Rev A (v1.1, 8 MiB .z64). The US v1.0, Japanese, European, and Shindou versions won’t work: their code is laid out differently, and every address in the project is tied to Rev A."
tags:
  - mips
