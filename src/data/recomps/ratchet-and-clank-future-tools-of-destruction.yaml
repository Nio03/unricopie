desc:
  es: "Port nativo para Windows de la versión europea de PS3 (Ratchet & Clank: Tools of Destruction, BCES00052), por recompilación estática con ps3recomp: el código PPU y SPU del juego se traduce a C/C++ de antemano, las bibliotecas del sistema de la PS3 se sustituyen por implementaciones nativas y el RSX por Direct3D 12, sin emulación al ejecutarse. Su runtime es un fork del de soyjxck, y el instalador y la página de ajustes siguen el modelo de dod3-recomp. Se juega desde el primer planeta: todos los niveles cargan, guardar y cargar usa la lista de ranuras del propio juego y hay sonido, música y vídeos, aunque los últimos planetas se han jugado menos que los primeros. Apunta a 60 fps (el original va a 30 en muchos sitios), con resolución interna de 0,5x a 8x sobre 1280x720 y la escena 3D a resolución real, MSAA hasta 8x o FXAA, filtrado anisotrópico de 16x, oclusión ambiental por trazado de rayos opcional, las sombras de los personajes recuperadas, los shaders compilados antes de jugar y dos de los trabajos SPU más pesados (animación y colisiones) como código nativo. Tiene una página de ajustes (F1) con todas las teclas reasignables, mandos por SDL2 y XInput con los iconos del mando que uses, gatillos adaptativos del DualSense y de impulso del mando de Xbox, trucos, cambio de idioma, saltar los vídeos, una carpeta de mods y Discord Rich Presence; la pantalla ultrapanorámica y la cámara con ratón son experimentales. Quedan parpadeos en el menú de armas, algún chasquido de sonido, superficies de agua que no se ven y bajadas a unos 50 fps en los combates más cargados. No hay versión para Linux; la de Windows funciona con Proton según la guía de un jugador. La 1.2.0 (7 de noviembre) es la última de 3 versiones."
  en: "A native Windows port of the European PS3 release (Ratchet & Clank: Tools of Destruction, BCES00052), by static recompilation with ps3recomp: the game’s PPU and SPU code is translated to C/C++ ahead of time, the PS3’s system libraries are replaced by native implementations, and the RSX by Direct3D 12, with no emulation at run time. Its runtime is a fork of soyjxck’s, and the installer and settings page follow dod3-recomp’s model. It’s playable from the first planet on: every level loads, saving and loading use the game’s own slot list, and there’s sound, music, and movies, though the later planets have been played less than the early ones. It targets 60 fps (the original runs at 30 in many places), with internal resolution from 0.5x to 8x over 1280x720 and the 3D scene at true resolution, up to 8x MSAA or FXAA, 16x anisotropic filtering, optional ray-traced ambient occlusion, the characters’ ground shadows restored, shaders built before you play, and two of the heaviest SPU jobs (animation and collision) as native code. It has a settings page (F1) with every key remappable, SDL2 and XInput controllers with the icons of the pad you use, DualSense adaptive triggers and Xbox impulse triggers, cheats, a language choice, movie skipping, a mods folder, and Discord Rich Presence; ultrawide and the mouse camera are experimental. The weapons menu still flickers, there’s the odd audio crackle, some water surfaces don’t show, and the busiest fights drop to about 50 fps. There’s no Linux build; the Windows one runs through Proton, according to a player’s guide. 1.2.0 (November 7) is the latest of 3 releases."
requirements:
  es: "Tu propia copia del disco europeo de Ratchet & Clank: Tools of Destruction para PS3 (BCES00052, versión 01.00), descifrada, como .iso o como carpeta con PS3_GAME; no sirven otras regiones ni la versión de PSN, y el instalador comprueba el SHA-256 del EBOOT.BIN. Además, Windows 10 u 11 de 64 bits, una CPU con AVX2 y FMA (mejor de 6 núcleos o más), una GPU con Direct3D 12, 16 GB de RAM recomendados y unos 24 GB libres."
  en: "Your own copy of the European disc of Ratchet & Clank: Tools of Destruction for PS3 (BCES00052, version 01.00), decrypted, as an .iso or a folder with PS3_GAME; other regions and the PSN version won’t work, and the installer checks the EBOOT.BIN’s SHA-256. Plus 64-bit Windows 10 or 11, a CPU with AVX2 and FMA (ideally 6 cores or more), a Direct3D 12 GPU, 16 GB of RAM recommended, and about 24 GB free."
