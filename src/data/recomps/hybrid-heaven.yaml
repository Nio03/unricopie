desc:
  es: "Port nativo de Hybrid Heaven para Windows, Linux y Android, por recompilación estática con N64Recomp, N64ModernRuntime y RT64, con el mismo conjunto de herramientas que Goemon 64: Recompiled, del que toma el launcher, los menús y los controles. Se apoya en una decompilación propia que también está en el catálogo. Añade panorámico, más resolución interna, MSAA, V-Sync y opciones de fotogramas, una cámara analógica libre con el stick derecho, autoguardado opcional mediante la rutina del propio juego, importación de partidas, menú de mods y, en Android, controles táctiles y cambio de controlador gráfico. La ROM se comprueba y se copia una sola vez; no hay que descomprimir ni convertir nada. La 1.0 salió el 4 de octubre. Sus 7 commits llevan a Claude como coautor."
  en: "A native port of Hybrid Heaven for Windows, Linux, and Android, by static recompilation with N64Recomp, N64ModernRuntime, and RT64, on the same stack as Goemon 64: Recompiled, from which it takes the launcher, menus, and input layer. It builds on its own decompilation, also in this catalog. It adds widescreen, higher internal resolutions, MSAA, V-Sync and frame-rate options, a free analog camera on the right stick, optional autosave through the game’s own save routine, save import, a mods menu, and, on Android, touch controls and a GPU driver switcher. The ROM is verified and copied once; nothing has to be decompressed or converted. Version 1.0 came out on October 4. All 7 of its commits list Claude as a co-author."
requirements:
  es: "Tu propia ROM estadounidense de Hybrid Heaven, tal como se vuelca del cartucho. Además, Windows de 64 bits con Direct3D 12 o Vulkan, o Linux con Vulkan, SDL2 y GTK 3; en Android, la 9.0 o posterior en un equipo de 64 bits con Vulkan."
  en: "Your own US Hybrid Heaven ROM, as dumped from the cartridge. Plus 64-bit Windows with Direct3D 12 or Vulkan, or Linux with Vulkan, SDL2, and GTK 3; on Android, 9.0 or later on a 64-bit device with Vulkan."
