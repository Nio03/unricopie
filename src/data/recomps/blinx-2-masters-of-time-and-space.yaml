desc:
  es: "Recompilación estática de la versión estadounidense de Xbox: el código x86 del juego se traduce función por función a C y se compila con MSVC, sobre un fork de xboxrecomp que reimplementa el hardware y el núcleo de la consola. Por ahora se juega el comienzo: los vídeos de introducción, la pantalla de título, la base de los Time Sweepers, la fase 01-01 y las primeras fases de la banda Tom-Tom; lo que viene después casi no está probado. Dibuja con Vulkan a 30 fps y, si no hay Vulkan, con un renderizador por software. Tiene sonido, mando y teclado, partidas guardadas, juego en red de 2 a 4 jugadores para el modo versus (en red local o por VPN), un menú de trucos y una herramienta para exportar fases y personajes a glTF. Para instalarlo, un launcher extrae tu ISO, instala las herramientas y compila el juego en tu equipo. 100 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A static recompilation of the US Xbox release: the game’s x86 code is translated function by function into C and compiled with MSVC, on a fork of xboxrecomp that reimplements the console’s hardware and kernel. For now the early game is playable: the intro movies, the title screen, the Time Sweepers hub, stage 01-01, and the first Tom-Tom Gang stages; later parts are largely untested. It draws with Vulkan at 30 fps, falling back to a software renderer when Vulkan isn’t available. It has sound, controller and keyboard support, saves, 2-to-4-player network play for Vs. Mode (over a LAN or a VPN), a cheats menu, and a tool that exports stages and characters to glTF. To install it, a launcher extracts your ISO, installs the tools, and builds the game on your machine. 100 of its last 100 commits list Claude as a co-author."
requirements:
  es: "Una imagen (ISO o XISO) de tu propio disco estadounidense de Blinx 2 para Xbox. Para compilarlo, Windows 10 u 11 de 64 bits con Visual Studio 2022, CMake, Python 3.10 o posterior y Git; el launcher instala lo que falte, previa confirmación. También compila en Linux x86-64, aunque eso solo se ha probado en WSL2 y en contenedores."
  en: "An image (ISO or XISO) of your own US Blinx 2 Xbox disc. To build it, 64-bit Windows 10 or 11 with Visual Studio 2022, CMake, Python 3.10 or later, and Git; the launcher installs whatever is missing after asking. It also builds on x86-64 Linux, though that has only been tested under WSL2 and in containers."
