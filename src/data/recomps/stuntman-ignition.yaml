name: "Stuntman: Ignition"
console: x360
status: experimental
repo: giangra/stuntdouble-reignition
author: giangra
originalDeveloper: Paradigm Entertainment
year: 2007
toolchain: ReXGlue
desc:
  es: "Stunt Double: Reignition: port para Windows de la versión de Xbox 360, por recompilación estática con el SDK de ReXGlue. Está en desarrollo temprano: los menús, la carrera profesional y las pruebas se juegan, pero con fallos. Un instalador comprueba tu ISO, la extrae, instala lo que falte (las Build Tools de Visual Studio y un Git portátil), descarga el código y el SDK y compila el juego en tu equipo; la primera vez tarda de 30 a 60 minutos y ocupa unos 12 GB. El launcher ajusta la resolución, el supermuestreo, los filtros CAS y FSR, el idioma y los 30 o 60 fps, y muestra los logros y las partidas guardadas. En pantallas ultrapanorámicas la imagen se ve con bandas o estirada. Sus 8 commits llevan a Claude como coautor."
  en: "Stunt Double: Reignition: a Windows port of the Xbox 360 version, by static recompilation with the ReXGlue SDK. It’s in early development: menus, career, and events play, but with bugs. An installer checks your ISO, extracts it, installs what’s missing (the Visual Studio Build Tools and a portable Git), downloads the source and the SDK, and builds the game on your PC; the first time takes 30 to 60 minutes and about 12 GB. The launcher sets resolution, supersampling, CAS and FSR filters, language, and 30 or 60 fps, and shows achievements and saves. On ultrawide screens the picture is letterboxed or stretched. All 8 of its commits list Claude as a co-author."
requirements:
  es: "Tu propia ISO de Stuntman: Ignition para Xbox 360. Además, Windows 10 u 11 de 64 bits, una tarjeta gráfica con Direct3D 12 y unos 12 GB libres."
  en: "Your own Stuntman: Ignition Xbox 360 ISO. Plus 64-bit Windows 10 or 11, a Direct3D 12 graphics card, and about 12 GB of free space."
tags:
  - powerpc
