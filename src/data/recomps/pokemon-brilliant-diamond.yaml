desc:
  es: "Pokémon Diamante Brillante como aplicación nativa para iPad, iPhone, Mac, Linux y Windows, hecha por recompilación estática: el código ARM64 del propio juego se traduce por adelantado a código nativo y un entorno de ejecución pequeño sustituye al sistema operativo de la Switch y a su API gráfica (Metal en los dispositivos Apple, Vulkan en Linux y Windows). No es un emulador. Un instalador gráfico para macOS, Linux y Windows te guía con las claves, los archivos del juego y la compilación; las apps de iPhone y iPad se compilan en un Mac con Xcode y se firman con tu propio ID de Apple, y la exportación del IPA mete los datos de tu propio volcado (unos 5,3 GB, solo para tus dispositivos). Genera los iconos de la app a partir de tus datos del juego, admite mods de archivos (RomFS) intercambiables y de código (ExeFS) integrados, y usa el teclado del sistema de la Switch (necesita tu firmware al compilar). Linux aarch64 es experimental y Apple TV está previsto. El README dice que el repositorio no contiene datos del juego, claves ni código generado, que el iPhone se probó en un iPhone 11 Pro Max y que macOS solo se comprobó en macOS 26; los sistemas mínimos declarados no se han probado. Está construido a partir de partes de LASRecomp. Su última versión, del 4 de noviembre, es la 0.1.5 del instalador (el repositorio publica solo instaladores, en 8 versiones desde el 30 de octubre, de unos 100 MB que incluyen Python, y no los hemos comprobado por dentro). Ninguno de sus últimos 100 commits lleva a Claude como coautor. El repositorio sustituyó a una reimplementación en Unity que su autor dio por abandonada."
  en: "Pokémon Brilliant Diamond as a native app for iPad, iPhone, Mac, Linux, and Windows, made by static recompilation: the game’s own ARM64 code is translated ahead of time into native code and a small runtime replaces the Switch operating system and its graphics API (Metal on Apple devices, Vulkan on Linux and Windows). It is not an emulator. A graphical installer for macOS, Linux, and Windows guides you through keys, game files, and the build; the iPhone and iPad apps are built on a Mac with Xcode and signed with your own Apple ID, and the IPA export embeds the data from your own dump (about 5.3 GB, for your own devices only). It generates the app icons from your game data, supports swappable file mods (RomFS) and built-in code mods (ExeFS), and uses the Switch’s own system keyboard (it needs your firmware during the build). Linux aarch64 is experimental and Apple TV is planned. The README says the repository contains no game data, keys, or generated code, that the iPhone was tested on an iPhone 11 Pro Max and macOS only on macOS 26; the stated minimum systems haven’t been tried. It is built from parts of LASRecomp. Its latest release, from November 4, is installer 0.1.5 (the repository only publishes installers, in 8 releases since October 30, of about 100 MB each with Python included, and we haven’t checked inside them). None of its last 100 commits list Claude as a co-author. The repository replaced a Unity reimplementation that its author discontinued."
requirements:
  es: "Tu propia copia del juego (XCI y, opcionalmente, la actualización en NSP) y tu propio prod.keys. Para iPhone y iPad, un Mac con Xcode y tu ID de Apple, y unos 5,3 GB libres para el IPA con datos; iPhone 11 o posterior (A13, 4 GB de RAM o más) con iOS o iPadOS 17 o posterior. Para Mac, Apple Silicon y macOS 14 o posterior (probado solo en macOS 26). Para Linux, x86-64 con Vulkan 1.3; para Windows, 10 22H2 u 11 de 64 bits."
  en: "Your own copy of the game (XCI and, optionally, the update NSP) and your own prod.keys. For iPhone and iPad, a Mac with Xcode and your Apple ID, and about 5.3 GB free for the IPA with data; an iPhone 11 or newer (A13, 4 GB of RAM or more) with iOS or iPadOS 17 or later. For Mac, Apple Silicon and macOS 14 or later (tested only on macOS 26). For Linux, x86-64 with Vulkan 1.3; for Windows, 64-bit 10 22H2 or 11."
