  en: "Your own Mario’s Tennis cartridge dump for Virtual Boy (524,288 bytes, CRC32 7CE7460D, SHA-256 5dc5e6b5d5f538f56b3b9727db1c7931d9dfe1bbd0743f698897e0fd90e70101). Plus 64-bit Windows."
