desc:
  es: "Recompilación estática del Theme Park de DOS a programas nativos para Windows y Linux, hecha con pcrecomp, el kit del mismo autor: el código de 32 bits del juego (6517 funciones, sin errores) se traduce a C y corre sobre el entorno de DOS/4GW del kit, sin emulador ni DOSBox; también recompila INTRO.EXE, así que la película de introducción se ve con su música y sus voces. El parque se abre por defecto en el modo SVGA de 640×480 que el juego escondía tras la tecla R, y se puede ensanchar hasta 1920×480; lo muestra una ventana con Direct3D 11 con escalado por múltiplos enteros, nítido, suave, CRT o al vecino más próximo, y pantalla completa sin bordes. Añade un menú de ajustes con F10, nueve estados guardados, velocidad fija a 25 fps (el original no tenía limitador) ajustable de 12 a 120, ratón capturado, sonido sin Sound Blaster (los efectos por un mezclador propio y la música General MIDI por el sintetizador del sistema o con paquetes de grabaciones), mando de Xbox, mods en carpetas superpuestas, los cinco idiomas del CD, el modo en red para 2 a 4 jugadores que Bullfrog dejó oculto, ahora por TCP, y unas «reglas modernas» opcionales que corrigen a guardias, encargados de mantenimiento, mecánicos, animadores, visitantes atascados y al asesor. Es una alfa: llega a un parque en marcha, pero según su README aún no se ha jugado mucho tiempo. La 0.2.0-alpha.1, la primera con instaladores para Windows y Linux, salió el 21 de octubre, y la última, la 0.5.0-alpha.1, el 22 de octubre. 68 de sus 86 commits llevan a Claude como coautor."
  en: "A static recompilation of the DOS Theme Park into native Windows and Linux programs, built with pcrecomp, the same author’s toolkit: the game’s 32-bit code (6,517 functions, no errors) is translated to C and runs on the toolkit’s DOS/4GW host, with no emulator or DOSBox; it also recompiles INTRO.EXE, so the opening film plays with its music and voices. Parks open by default in the 640×480 SVGA mode the game hid behind the R key, and can be widened up to 1920×480; a Direct3D 11 window shows them with integer, sharp, smooth, CRT, or nearest-neighbor scaling, and borderless fullscreen. It adds an F10 settings menu, nine save states, a fixed 25 fps pace (the original had no frame limiter) adjustable from 12 to 120, a captured mouse, sound without a Sound Blaster (effects through its own mixer and the General MIDI score on the system synth or from packs of recordings), Xbox controller support, mods as overlaid folders, the CD’s five languages, the 2–4 player network mode Bullfrog left hidden, now over TCP, and optional “modern rules” that fix guards, handymen, engineers, entertainers, stuck guests, and the advisor. It’s an alpha: it gets into a running park, but according to its README it hasn’t been played for long yet. 0.2.0-alpha.1, the first with installers for Windows and Linux, came out on October 21, and the latest, 0.5.0-alpha.1, on October 22. 68 of its 86 commits list Claude as a co-author."
requirements:
  es: "Tu propia copia de Theme Park: la de GOG, instalada o como su instalador sin conexión (setup_theme_park_1.01_cs_(77027).exe), o el CD de 1994 en cualquiera de sus ediciones (Reino Unido y Europa, Estados Unidos, las reediciones de EA de 1996 y 1998, CD-ROM Classics y el disco japonés junto a Magic Carpet), también como ISO montada; no sirven la versión en disquetes, la asiática de 1996 ni las demos. Además, Windows 10 u 11 de 64 bits, donde la instalación instala Python, Visual Studio 2022 con C++, LLVM, CMake y Ninja si faltan, o Linux con gcc y SDL2; en Linux, la música necesita un sintetizador General MIDI como FluidSynth o TiMidity++."
  en: "Your own copy of Theme Park: GOG’s, installed or as its offline installer (setup_theme_park_1.01_cs_(77027).exe), or the 1994 CD in any of its editions (UK and Europe, US, EA’s 1996 and 1998 reissues, CD-ROM Classics, and the Japanese two-game disc with Magic Carpet), a mounted ISO included; the floppy release, the 1996 Asian release, and the demos don’t work. Plus 64-bit Windows 10 or 11, where setup installs Python, Visual Studio 2022 with C++, LLVM, CMake, and Ninja if they’re missing, or Linux with gcc and SDL2; on Linux, music needs a General MIDI synth such as FluidSynth or TiMidity++."
