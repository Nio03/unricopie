desc:
  es: "«ReCut»: port por recompilación del RPG de papel. Arranca y permite cambiar texturas en tiempo real; está hecho con asistencia de IA y el modo panorámico nunca llegó a funcionar. Su autor lo dio por terminado el 21 de octubre y recomienda pasarse a PaperBoat, que tiene su propia ficha."
  en: "“ReCut”: a recompiled port of the papercraft RPG. It boots and supports live texture replacement; it’s AI-assisted, and widescreen never worked. Its author retired it on October 21 and recommends switching to PaperBoat, which has its own entry."
