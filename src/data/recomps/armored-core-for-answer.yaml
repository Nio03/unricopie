desc:
  es: "Port nativo no oficial para Windows de la versión estadounidense de PS3 (BLUS30187), parte del Project Glintburn; comparte el runtime con el port de Armored Core 4. Un recompilador traduce a C++ los unos 4,5 millones de instrucciones PowerPC del juego, y los programas SPU también se traducen de antemano, con un intérprete de reserva. Los gráficos pasan a Direct3D 11, y algunas partes del firmware corren recompiladas desde tus propios archivos del sistema. Dibuja a la resolución de tu pantalla con escala del 50 al 200 %, va de 30 fps a sin límite con la misma velocidad de juego, usa el ratón con entrada directa y suma un menú PC SETTINGS dentro del propio juego. El launcher descifra con tu RPCS3 lo necesario, descarga las herramientas y compila el juego en tu equipo. La 0.7.2 (18 de octubre) subió mucho los fotogramas."
  en: "An unofficial native Windows port of the US PS3 release (BLUS30187), part of Project Glintburn; it shares its runtime with the Armored Core 4 port. A recompiler translates the game’s roughly 4.5 million PowerPC instructions to C++, and the SPU programs are translated ahead of time too, with an interpreter as a fallback. Graphics are turned into Direct3D 11, and a few firmware parts run recompiled from your own system files. It draws at your screen’s resolution with a 50–200% render scale, runs from 30 fps to uncapped at the same game speed, uses the mouse with raw input, and adds a PC SETTINGS menu inside the game itself. The launcher decrypts what it needs with your RPCS3, downloads the tools, and builds the game on your machine. Version 0.7.2 (October 18) greatly raised frame rates."
requirements:
  es: "Tu propia copia estadounidense de Armored Core for Answer para PS3 (BLUS30187), la carpeta con PS3_GAME; RPCS3, que se usa una vez para descifrar algunos archivos; el archivo PS3UPDAT.PUP del sistema 4.93, de la web de Sony, y, si quieres, la actualización 1.35. Además, Windows 10 (1903 o posterior) u 11 de 64 bits, un procesador con AVX2, una tarjeta gráfica con Direct3D 11, unos 4 GB libres y conexión a internet."
  en: "Your own US copy of Armored Core for Answer for PS3 (BLUS30187), the folder with PS3_GAME; RPCS3, used once to decrypt a few files; the system software 4.93 PS3UPDAT.PUP file from Sony’s website; and, optionally, the 1.35 update. Plus 64-bit Windows 10 (1903 or later) or 11, a CPU with AVX2, a Direct3D 11 graphics card, about 4 GB of free space, and an internet connection."
