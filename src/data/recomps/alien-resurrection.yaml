name: "Alien Resurrection (DiegoDeDios)"
console: ps1
status: playable
repo: DiegoDeDios/AlienReRecomp
author: DiegoDeDios
originalDeveloper: Argonaut Games
year: 2000
desc:
  es: "Port nativo para macOS, Windows y Linux de la versión estadounidense de PlayStation (SLUS-00633), hecho por recompilación estática del código MIPS a C, sobre un runtime que sustituye la BIOS y el hardware de la consola. Las versiones publicadas no traen código del juego: leen los ejecutables de tu imagen de disco y los ejecutan con un intérprete de MIPS propio, con las mismas mejoras; la versión recompilada se genera en tu equipo y es solo para uso personal. Añade pantalla panorámica de 16:9 a 32:9 que amplía el campo de visión, resolución interna hasta 8x, geometría de precisión que elimina el temblor de los polígonos, 60 fps estables, ratón y teclado con controles reasignables, sticks sin el retraso del original, carrera, daño de los enemigos ajustable, linterna infinita y guardado rápido. Funcionan los menús, el primer nivel, los vídeos y la tarjeta de memoria; los niveles siguientes no se han jugado enteros, y las versiones de Windows y Linux solo se han probado en Wine, una máquina virtual y contenedores. 16 de sus 35 commits llevan a Claude como coautor."
  en: "A native macOS, Windows, and Linux port of the US PlayStation release (SLUS-00633), made by statically recompiling the MIPS code to C, on a runtime that stands in for the console’s BIOS and hardware. The released builds contain no game code: they read the executables from your disc image and run them through the port’s own MIPS interpreter, with the same enhancements; the recompiled build is generated on your machine and is for personal use only. It adds widescreen from 16:9 to 32:9 that widens the field of view, up to 8x internal resolution, precision geometry that removes polygon wobble, a steady 60 fps, mouse and keyboard with rebindable controls, sticks without the original’s delay, sprinting, adjustable enemy damage, an infinite flashlight, and quick saves. The menus, the first level, the movies, and memory cards work; later levels haven’t been fully played through, and the Windows and Linux builds have only been tested under Wine, a virtual machine, and containers. 16 of its 35 commits list Claude as a co-author."
requirements:
  es: "Tu propia imagen de disco estadounidense de Alien Resurrection (SLUS-00633), como .cue con sus .bin. Hay versiones para macOS 11 o posterior, Windows 10 u 11 de 64 bits y Linux x86-64 (glibc 2.35 o posterior)."
  en: "Your own US Alien Resurrection disc image (SLUS-00633), as a .cue with its .bin files. There are builds for macOS 11 or later, 64-bit Windows 10 or 11, and x86-64 Linux (glibc 2.35 or later)."
