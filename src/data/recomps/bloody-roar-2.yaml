name: Bloody Roar II
console: ps1
status: experimental
repo: novapowers0/BloodyRoar2Recomp
originalDeveloper: Eighting / Hudson Soft
year: 1999
toolchain: psxrecomp
desc:
  es: "Port nativo de Bloody Roar II para Windows y Linux: el código MIPS original se recompila estáticamente a C y se compila en un ejecutable propio, sin emulador. Se puede generar para las dos versiones regionales (la europea, SLES-01722, y la estadounidense, SCUS-94424) y añade un modo panorámico hecho desde cero."
  en: "Native Windows and Linux port of Bloody Roar II: the original MIPS code is statically recompiled to C and built into a standalone executable, with no emulator involved. It builds both regional versions (European SLES-01722 and US SCUS-94424) and adds widescreen made from scratch."
requirements:
  es: "Tu propio disco de Bloody Roar II (PS1), edición europea o estadounidense."
  en: "Your own Bloody Roar II disc (PS1), European or US edition."
tags:
  - mips
