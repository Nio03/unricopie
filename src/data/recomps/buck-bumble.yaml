name: Buck Bumble
console: n64
status: playable
repo: riseio/project-bumble
originalDeveloper: Argonaut Software
year: 1998
desc:
  es: "Port nativo para PC y Steam Deck con modo panorámico, gráficos modernos, varias mejoras de comodidad y control con teclado, ratón o mando. En el primer arranque ofrece generar texturas mejoradas (unos 120 MB), y permite saltarse ese paso o recordar la elección. Su autor lo empezó para jugarlo y lo publicó después."
  en: "Native PC and Steam Deck port with widescreen, modern graphics, a range of quality-of-life features, and keyboard, mouse, and controller support. On first launch it offers to generate enhanced textures (about 120 MB), and lets you skip that step or remember your choice. Its author started it for their own playthrough and shared it afterward."
requirements:
  es: "Tu propia ROM de Buck Bumble (N64, edición estadounidense, revisión 0). Acepta los órdenes de bytes .z64, .n64 y .v64."
  en: "Your own Buck Bumble ROM (N64, US edition, revision 0). The .z64, .n64, and .v64 byte orders are accepted."
