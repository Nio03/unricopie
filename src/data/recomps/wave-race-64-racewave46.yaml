name: Wave Race 64 (RaceWave46)
console: n64
status: playable
repo: DomazinUS/RaceWave46
originalDeveloper: Nintendo EAD
year: 1996
desc:
  es: "El tercer proyecto independiente de Wave Race 64 del catálogo, sin relación con los otros dos. Lleva la versión estadounidense Rev 1 a PC con resoluciones altas, imagen interpolada, modo panorámico, nuevas opciones gráficas y multijugador local ampliado, y conserva los modos y la progresión del original: campeonato, contrarreloj, modo de acrobacias, dos jugadores y Dolphin Park. Su autor declara que está desarrollado con asistencia de IA."
  en: "The third independent Wave Race 64 project in the catalog, unrelated to the other two. It brings the US Rev 1 version to PC with higher resolutions, interpolated presentation, widescreen, new graphics options, and expanded local multiplayer, while keeping the original’s modes and progression: championship, time trials, stunt mode, two-player, and Dolphin Park. Its author states it’s AI-assisted."
requirements:
  es: "Tu propia ROM de Wave Race 64 (N64), versión estadounidense Rev 1."
  en: "Your own Wave Race 64 ROM (N64), US Rev 1 version."
