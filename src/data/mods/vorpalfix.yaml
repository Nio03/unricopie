name: VorpalFix
kind: mod
console: pc
game:
  es: "American McGee's Alice (remasterización de 2011, PC)"
  en: "American McGee's Alice (2011 remaster, PC)"
repo: Wemino/VorpalFix
status: usable
desc:
  es: "Parche no oficial para la remasterización de 2011 de American McGee's Alice, la que está pensada para arrancarse desde Alice: Madness Returns; no funciona con la versión de 2000. Es una DLL (winmm.dll) que se copia junto a alice.exe, sin sobrescribir ningún archivo del juego, y se configura en VorpalFix.ini y en un menú propio dentro del juego. Permite arrancar el juego por su cuenta, sin Madness Returns, y corrige los sonidos de armas y la invocación del Gato de Cheshire que la remasterización había roto, el aviso de disco lleno con más de 2 TB libres, cierres al guardar en resoluciones como 1366×768, las texturas remasterizadas de varios personajes que no cargaban por erratas en sus archivos, modelos negros y sombreado perdido en algunas zonas, y bandas en la niebla. En panorámico mantiene la proporción de menús, vídeos y HUD y ajusta el campo de visión. Añade mandos de PlayStation y Switch por SDL3 con apuntado por giroscopio e iconos de botones, ratón con entrada directa y botones laterales, filtrado anisótropo, MSAA y supermuestreo, modelos siempre al máximo detalle, ventana sin bordes, límite de fotogramas, el HUD colocado como en Xbox 360 y PS3, la pantalla de título de esas versiones, cambio entre los modelos remasterizados y los originales, elección de idioma (inglés, alemán, francés o español), la consola de desarrollador y un guardado más rápido. En Steam Deck y Linux funciona con Proton añadiendo una opción de arranque. La 4.2.1 salió el 22 de octubre."
  en: "An unofficial patch for the 2011 remaster of American McGee’s Alice, the one designed to be launched from Alice: Madness Returns; it doesn’t work with the 2000 version. It’s a DLL (winmm.dll) you copy next to alice.exe, without overwriting any game file, configured through VorpalFix.ini and its own in-game menu. It lets the game start on its own, without Madness Returns, and fixes the weapon sounds and Cheshire Cat summon the remaster broke, the “Hard Disk Full” error with more than 2 TB free, crashes when saving at resolutions such as 1366×768, remastered textures for several characters that didn’t load because of typos in their files, models rendered black and lost shading in some areas, and fog banding. In widescreen it keeps the menus, videos, and HUD in proportion and adjusts the field of view. It adds PlayStation and Switch controllers through SDL3 with gyro aiming and button prompts, raw mouse input and side buttons, anisotropic filtering, MSAA and supersampling, models always at full detail, borderless mode, a frame rate limit, the HUD placed as in the Xbox 360 and PS3 versions, those versions’ title screen, switching between the remastered and original models, language selection (English, German, French, or Spanish), the developer console, and faster saving. On Steam Deck and Linux it works through Proton with a launch option. 4.2.1 came out on October 22."
requirements:
  es: "Tu propia copia de la remasterización de 2011 de American McGee's Alice para PC; no vale la versión de 2000. Además, Windows, o Linux y Steam Deck con Proton."
  en: "Your own copy of the 2011 remaster of American McGee’s Alice for PC; the 2000 version won’t work. Plus Windows, or Linux and Steam Deck through Proton."
tags:
  - widescreen
