desc:
  es: "TemplePlus (Temple+): mod de mejoras del motor y de corrección de fallos para The Temple of Elemental Evil, el juego de rol de Troika Games de 2003. Se instala aparte, con un configurador que pide la carpeta del juego, y arranca el juego a través del temple.dll de tu instalación, del que engancha y sustituye funciones: su wiki documenta cómo acceder a los datos y las funciones de esa DLL y reemplazarlos, y muchos de sus sistemas están reescritos en C++. Pasa el juego a DirectX 11 con resoluciones HD, pantalla completa en ventana y fuentes con DirectWrite, carga más rápido, mejora la búsqueda de caminos y la IA, y corrige muchos cierres, cuelgues y fallos de conjuros y habilidades, además de sumar atajos en la interfaz. Añade 6 clases base y 12 de prestigio nuevas y más de 60 dotes, que son opcionales y se activan en el configurador, acciones de combate como desarmar o golpear con el escudo, reglas de la casa, un modo de Dungeon Master para crear, editar y controlar criaturas sobre la marcha y un grupo con proporción libre de personajes jugadores y no jugadores; también amplía mucho lo que se puede modificar con Python (clases, razas, acciones y estados nuevos) y admite carpetas de mods que sustituyen archivos. Es compatible con el Circle of Eight Modpack y con el módulo Keep on the Borderlands. Publica versiones desde abril de 2016; la última es la 1.0.98 (7 de agosto de 2025), con un instalador que se actualiza solo, y desde entonces ha seguido recibiendo cambios, el último en febrero. El repositorio incluye además versiones modificadas de scripts en Python y de diálogos del juego (con los arreglos del Circle of Eight), tablas de reglas, datos de mapas y modelos y texturas de armaduras y personajes, que se empaquetan en tpgamefiles.dat y co8fixes.dat."
  en: "TemplePlus (Temple+): an engine enhancement and bug-fix mod for The Temple of Elemental Evil, Troika Games’ 2003 RPG. It installs separately, with a configurator that asks for the game folder, and launches the game through your install’s temple.dll, hooking and replacing its functions: its wiki documents how to access and replace that DLL’s data and functions, and many of its systems are rewritten in C++. It moves the game to DirectX 11 with HD resolutions, fake fullscreen, and DirectWrite font rendering, loads faster, improves pathfinding and AI, and fixes many crashes, hangs, and spell and ability bugs, plus UI shortcuts. It adds 6 new base classes, 12 prestige classes, and over 60 feats, which are optional and enabled in the configurator, combat actions such as disarm and shield bash, house rules, a Dungeon Master mode to spawn, edit, and control creatures on the fly, and flexible PC/NPC party composition; it also greatly extends what can be modded with Python (new classes, races, actions, and conditions) and supports override folders for mods. It’s compatible with the Circle of Eight Modpack and the Keep on the Borderlands module. It has put out releases since April 2016; the latest is 1.0.98 (August 7, 2025), with a self-updating installer, and it has kept getting changes since then, the latest in February. The repository also includes modified versions of the game’s Python scripts and dialogue files (with the Circle of Eight fixes), rules tables, map data, and armor and character models and textures, which are packed into tpgamefiles.dat and co8fixes.dat."
requirements:
  es: "Tu propia copia instalada de The Temple of Elemental Evil para PC con el temple.dll del parche 2: sirve la versión de GOG, que es la que enlaza su web, y también una instalación con el Circle of Eight Modpack; el parche 3 no está admitido. Además, Windows."
  en: "Your own installed copy of The Temple of Elemental Evil for PC with the patch 2 temple.dll: the GOG version, the one its website links to, works, and so does an install with the Circle of Eight Modpack; patch 3 isn’t supported. Plus Windows."
