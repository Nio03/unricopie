desc:
  es: "sc2kfix: complemento para SimCity 2000 Special Edition para Windows 95 que lo hace funcionar bien en Windows 7 a 11 y en Wine o Proton, corrige fallos del juego original, añade mejoras de comodidad, recupera contenido perdido y activa, si quieres, funciones de juego nuevas. Es una sola DLL, winmm.dll, que se copia junto a simcity.exe con las bibliotecas que la acompañan. También es un proyecto de ingeniería inversa del motor: muchas funciones internas del juego están reimplementadas, y lo que se averigua se documenta en una wiki con licencia CC BY-SA. Arregla las animaciones por ciclo de paleta, que se quedaban congeladas en pantallas de color verdadero, cierres y corrupción en los diálogos de cargar y guardar, el crecimiento de las bases militares, las conexiones de tren y autopista con las ciudades vecinas al cargar una partida, la calificación crediticia de los bonos y el SCURK en Windows 11 24H2; recupera la introducción, las entrevistas de WillTV y música que nunca entraba en la lista aleatoria, y sustituye al instalador original, que ya no funciona. Añade un diálogo de ajustes, crecimiento de la ciudad en tiempo real con efectos de estación y de clima, modo oscuro para la vista subterránea, un diálogo de ciudad nueva con más variedad de terreno, colores de terreno inspirados en SimCity 3000 y vista previa del mapa, el indicador de estado flotante de las versiones de Mac y DOS, sonido rehecho con SDL3 (MIDI con FluidSynth, MP3 y volumen de música y efectos), sonidos de construcción de mejor calidad sacados de otras versiones del juego, copias de respaldo al guardar, atajos configurables, trucos de otras versiones, una consola de desarrollador con Lua, scripts en Lua y mods en DLL. Todo lo que no es del original se puede desactivar por separado. La última versión es la Release 11b (28 de agosto). El proyecto, parte de la OpenCity Foundation, declara que no usa IA generativa y que rechaza las contribuciones hechas con ella."
  en: "sc2kfix: a plugin for SimCity 2000 Special Edition for Windows 95 that makes it run properly on Windows 7 to 11 and under Wine or Proton, fixes bugs in the original game, adds quality-of-life features, restores missing content, and optionally enables new gameplay features. It’s a single DLL, winmm.dll, copied next to simcity.exe along with the libraries that ship with it. It’s also a reverse engineering project for the engine: many of the game’s internal functions are reimplemented, and the findings are documented in a wiki under CC BY-SA. It fixes palette-cycling animations, which froze on truecolor displays, crashes and corruption in the load and save dialogs, military base growth, rail and highway connections to neighboring cities after loading a save, bond credit ratings, and SCURK on Windows 11 24H2; it restores the intro, the WillTV interviews, and music that never made it into the random playlist, and replaces the original installer, which no longer works. It adds a settings dialog, real-time city growth with seasonal and weather effects, a dark mode for the underground view, a New City dialog with more varied terrain, SimCity 3000-inspired terrain colors, and a map preview, the floating status widget from the Mac and DOS versions, sound rebuilt on SDL3 (MIDI through FluidSynth, MP3, and music and effects volume), higher-quality construction sounds taken from other versions of the game, backups when saving, configurable hotkeys, cheats from other versions, a developer console with Lua, Lua scripts, and DLL mods. Everything that isn’t from the original can be turned off individually. The latest release is Release 11b (August 28). The project, part of the OpenCity Foundation, states that it uses no generative AI and rejects contributions made with it."
requirements:
  es: "Tu propia copia de SimCity 2000 Special Edition para Windows 95 (1996): la carpeta SC2K de la carpeta WIN95 del CD, copiada a un sitio con permiso de escritura; para la introducción y WillTV, los vídeos .SMK de la carpeta DATA del CD en una carpeta MOVIES. La edición CD Collection de 1995 está obsoleta y ya no recibe novedades. Además, Windows 7 a 11, o Linux con Wine o Proton, con winmm en orden «native, then builtin»."
  en: "Your own copy of SimCity 2000 Special Edition for Windows 95 (1996): the SC2K folder from the CD’s WIN95 folder, copied somewhere writable; for the intro and WillTV, the .SMK videos from the CD’s DATA folder in a MOVIES folder. The 1995 CD Collection release is deprecated and no longer gets updates. Plus Windows 7 to 11, or Linux with Wine or Proton, with winmm set to “native, then builtin”."
