desc:
  es: "Phobos: extensión del motor de Command & Conquer: Yuri's Revenge hecha por la comunidad, con funciones nuevas y arreglos pensados para quien hace mods. Es una DLL (Phobos.dll) que SyringeEx, una versión ampliada y de código abierto de Syringe, inyecta en el ejecutable del juego, gamemd.exe: su código se engancha en direcciones concretas del binario, localizadas al desensamblarlo. Está hecha para acompañar a Ares, la otra gran extensión del motor, sin crear incompatibilidades, pero no la necesita para funcionar, y es compatible con el spawner de CnCNet 5. Por sí sola apenas cambia nada salvo algunos arreglos: sus funciones se activan desde los INI de cada mod y están documentadas en su web, también en chino. Entre ellas hay trayectorias de proyectil nuevas, escudos, multiplicadores de daño, cola de producción de edificios, nuevas órdenes para los aviones, bombas con paracaídas y decenas de fallos del juego original corregidos. Nació en 2020 y su primera versión estable salió en febrero de 2021. La última estable es la 0.4.0.2 (28 de enero), y la última prelanzamiento, la 0.5-alpha2 (10 de octubre), ya trae el Syringe.exe de SyringeEx. El README avisa de que el proyecto no está lo bastante mantenido y busca responsables, aunque en las últimas seis semanas ha recibido un centenar de commits. Su guía de contribución anima a usar agentes de IA (GitHub Copilot, Cursor y similares) para escribir hooks, revisar código y documentar, y el repositorio incluye instrucciones para ellos; ninguno de sus últimos 100 commits lleva a una IA como coautor."
  en: "Phobos: a community-made engine extension for Command & Conquer: Yuri’s Revenge, with new features and fixes aimed at mod makers. It’s a DLL (Phobos.dll) that SyringeEx, an extended, open-source version of Syringe, injects into the game’s executable, gamemd.exe: its code hooks into specific addresses in the binary, found by disassembling it. It’s designed to accompany Ares, the other major engine extension, without introducing incompatibilities, but doesn’t need it to work, and it’s compatible with the CnCNet 5 spawner. On its own it changes almost nothing beyond a few fixes: its features are enabled from each mod’s INI files and documented on its website, in Chinese too. They include new projectile trajectories, shields, damage multipliers, a building production queue, new orders for aircraft, parabombs, and dozens of fixes for bugs in the original game. It started in 2020, and its first stable release came out in February 2021. The latest stable release is 0.4.0.2 (January 28), and the latest pre-release, 0.5-alpha2 (October 10), bundles SyringeEx’s Syringe.exe. The README warns that the project isn’t maintained actively enough and is looking for maintainers, though it has received about a hundred commits in the last six weeks. Its contributing guide encourages using AI coding agents (GitHub Copilot, Cursor, and similar tools) to write hooks, review code, and write documentation, and the repository includes instructions for them; none of its last 100 commits lists an AI as a co-author."
requirements:
  es: "Tu propia copia de Command & Conquer: Red Alert 2 con la expansión Yuri's Revenge para PC. Phobos.dll, Phobos.pdb y el Syringe.exe de SyringeEx (0.1.0.2 o posterior) van en la carpeta de gamemd.exe, y el juego se arranca a través de Syringe.exe o del RunAres.bat de Ares. Se recomienda instalar también Ares para tener todas las funciones. Las partidas guardadas no sirven de una versión de Phobos a otra. Además, Windows."
  en: "Your own copy of Command & Conquer: Red Alert 2 with the Yuri’s Revenge expansion for PC. Phobos.dll, Phobos.pdb, and SyringeEx’s Syringe.exe (0.1.0.2 or later) go in the folder with gamemd.exe, and the game is launched through Syringe.exe or Ares’s RunAres.bat. Installing Ares too is recommended for the full feature set. Saves don’t carry over between Phobos versions. Plus Windows."
