desc:
  es: "Thinker: mod de Sid Meier's Alpha Centauri: Alien Crossfire que rehace partes del motor del juego. Su launcher, thinker.exe, arranca el terranx.exe de la versión 2.0 sin modificarlo en el disco y le hace cargar una DLL adicional con el código nuevo, escrito en C++; desde ahí el proyecto va reescribiendo funciones del motor original, como el arranque de la partida, el código de red o el mantenimiento de cada turno. Reescribe por completo la IA de producción y de movimiento, con cambios menores en la diplomacia, y ofrece mejores rutinas de automatización para las facciones del jugador; cambia el dibujado del mapa y el generador de mapas aleatorios, añade mecánicas nuevas y decenas de opciones en thinker.ini para reglas que el juego tenía fijas, más opciones de resolución (pantalla completa a la del escritorio o ventana sin bordes) y un menú propio con Alt+T, e incluye los parches de Scient, con arreglos del juego original. Corrige además cierres del juego en Windows 11 al terminar el turno y al guardar. Un modo SMAC-in-SMACX permite jugar algo parecido al Alpha Centauri original, sin el contenido de la expansión. El multijugador por TCP/IP funciona, aunque es menos estable que el modo de un jugador. Está probado con la versión de GOG. Las versiones se publican en Dropbox y, desde abril, también en GitHub; la v5.5 salió el 16 de agosto. El repositorio y la descarga incluyen versiones modificadas de alphax.txt, el archivo de reglas y textos del juego (en el repositorio, también en alemán), y, para el modo SMAC-in-SMACX, los archivos de texto alphax.txt, helpx.txt, conceptsx.txt y tutor.txt adaptados del mod SMAC in SMACX de DrazharLn."
  en: "Thinker: a mod for Sid Meier’s Alpha Centauri: Alien Crossfire that remakes parts of the game engine. Its launcher, thinker.exe, starts the version 2.0 terranx.exe without changing it on disk and makes it load an extra DLL with the new code, written in C++; from there the project keeps rewriting functions of the original engine, such as game startup, the network code, and turn upkeep. It fully rewrites the production and movement AI, with minor changes to diplomacy, and offers better automation routines for player factions; it changes map rendering and the random map generator, adds new mechanics and dozens of options in thinker.ini for rules the game had hardcoded, more resolution options (fullscreen at desktop resolution or borderless windowed), and its own menu on Alt+T, and it includes Scient’s patches, with fixes for the original game. It also fixes game crashes on Windows 11 when ending the turn and when saving. A SMAC-in-SMACX mode lets you play something close to the original Alpha Centauri, without the expansion content. TCP/IP multiplayer works, though it’s less stable than single-player. It’s tested with the GOG release. Releases are published on Dropbox and, since April, on GitHub too; v5.5 came out on August 16. The repository and the download include modified versions of alphax.txt, the game’s rules and text file (in the repository, in German too), and, for SMAC-in-SMACX mode, the text files alphax.txt, helpx.txt, conceptsx.txt, and tutor.txt adapted from DrazharLn’s SMAC in SMACX mod."
requirements:
  es: "Tu propia copia de Sid Meier's Alpha Centauri con la expansión Alien Crossfire para PC, con el parche oficial 2.0 de Alien Crossfire (también vale el terranx.exe del parche v2 de Scient); la versión 1.0 no es compatible. Los archivos se descomprimen en la carpeta del juego y se arranca con thinker.exe. Además, Windows."
  en: "Your own copy of Sid Meier’s Alpha Centauri with the Alien Crossfire expansion for PC, with the official Alien Crossfire 2.0 patch (the terranx.exe from Scient’s v2 patch works too); version 1.0 isn’t supported. The files are extracted into the game folder, and the game is started with thinker.exe. Plus Windows."
