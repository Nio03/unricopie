name: DolRecomp
kind: recompiler
consoles:
  - gamecube
  - wii
repo: ExpansionPak/DolRecomp
status: experimental
desc:
  es: "Recompilador estático para GameCube y Wii (y, de forma experimental, Wii U) que traduce ejecutables PowerPC a C. Por ahora solo cubre la CPU: no incluye entorno de ejecución ni renderizador propios. Es el sucesor de GCRecompiler."
  en: "Static recompiler for GameCube and Wii (with experimental Wii U support) that lifts PowerPC executables to C. CPU-only for now: no bundled runtime or renderer. Successor to GCRecompiler."
tags:
  - powerpc
