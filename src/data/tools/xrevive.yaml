name: xrevive
kind: launcher
consoles:
  - xbox
repo: Teraflopping/xrevive
author: Teraflopping
status: experimental
desc:
  es: "Launcher de escritorio para juegos de la Xbox original recompilados con Xrecomp, con servicios en línea a través de xb.live, un proyecto que recupera los de Xbox Live: inicias sesión una vez y ves amigos, salas, eventos de la comunidad y clasificaciones. Añades tu propia ISO o la carpeta del juego, y el launcher descarga el ejecutable recompilado que le corresponde; no incluye ningún juego. El primero con juego en línea es Midnight Club 3: DUB Edition, desde la versión 0.1.5 (13 de octubre); la 0.1.6 añadió un editor de sus partidas y la conversión de partidas de la versión de PS2. Los ejecutables de los juegos son para Windows de 64 bits; el launcher también tiene versiones para macOS y Linux."
  en: "Desktop launcher for original Xbox games recompiled with Xrecomp, with online services through xb.live, a project that brings back Xbox Live: you sign in once and see friends, lobbies, community events, and leaderboards. You add your own ISO or game folder, and the launcher downloads the matching recompiled executable; it includes no games. The first game with online play is Midnight Club 3: DUB Edition, since version 0.1.5 (October 13); 0.1.6 added a save editor for it and conversion of saves from the PS2 version. The game executables are 64-bit Windows only; the launcher also has macOS and Linux builds."
tags:
  - x86
  - online
