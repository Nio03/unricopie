name: xrevive
kind: launcher
consoles:
  - xbox
repo: Teraflopping/xrevive
author: Teraflopping
status: experimental
desc:
  es: "Launcher de escritorio para juegos de la Xbox original recompilados con Xrecomp, con servicios en línea a través de xb.live, un proyecto que recupera los servicios en línea de Xbox: inicias sesión una vez y todos los juegos comparten esa sesión, con emparejamiento, amigos, invitaciones y clasificaciones. También descarga actualizaciones de título y contenido descargable. No distribuye ningún juego: compila cada uno a partir de un disco que tengas. Su README avisaba de que no estaba listo y preveía publicarlo hacia el 12 o 13 de octubre."
  en: "Desktop launcher for original Xbox games recompiled with Xrecomp, with online services through the xb.live revival project: you sign in once and every game inherits it, with matchmaking, friends, invites, and leaderboards. It also downloads title updates and DLC. It ships no games: it builds each one from a disc you own. Its README warned that it wasn’t ready and expected a release around October 12–13."
tags:
  - x86
  - online
