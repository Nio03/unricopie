desc:
  es: "Ports Launcher: biblioteca e instalador de ports nativos no oficiales y recompilaciones, escrito en Rust con la interfaz en Slint, para Windows y Linux, con versión para Android. Funciona con un catálogo (ports.json) que su autor mantiene en el repositorio, con unas 350 entradas para PC, la mayoría de PS1, N64 y Xbox 360, y otro local (ports.local.json) para añadir los tuyos. Instala con un clic desde las versiones de GitHub o GitLab, o desde un enlace directo, eligiendo el archivo adecuado para tu sistema, y mantiene cada port actualizado, con la opción de elegir una de sus últimas versiones. Cada entrada tiene un panel con sus instrucciones, como los archivos de tu copia que pide y sus sumas CRC32, enlaces a su web, a sus mods, a la carpeta de instalación y a la de partidas, y configuraciones opcionales. Conserva las partidas al desinstalar, exporta las de todos los ports a un .zip con fecha, registra el tiempo de juego, se maneja entero con teclado o con un mando XInput, y tiene un modo de biblioteca a pantalla completa al estilo de Big Picture de Steam, más de 100 temas de color, presencia en Discord opcional y la interfaz en 20 idiomas. Es portátil: un ejecutable y una copia mínima de 7-Zip para descomprimir, sin instalación. Se publica como una única versión continua cuyo archivo se sustituye en cada actualización. Su README dice que se hizo junto con Claude. No incluye archivos de los juegos; las carátulas vienen de SteamGridDB. El repositorio guarda además algunos extras que instala el catálogo, entre ellos una compilación de zelda3 y un parche en formato RIP para su zelda3_assets.dat que cambia el idioma del juego."
  en: "Ports Launcher: a library manager and installer for unofficial native ports and recompilations, written in Rust with a Slint interface, for Windows and Linux, with an Android version. It works from a catalog (ports.json) its author maintains in the repository, with about 350 PC entries, mostly PS1, N64, and Xbox 360, plus a local one (ports.local.json) for adding your own. It installs with one click from GitHub or GitLab releases, or from a direct link, picking the right file for your system, and keeps each port updated, with the option to pick one of its latest releases instead. Each entry has a panel with its instructions, such as the files it needs from your copy and their CRC32 checksums, links to its website, its mods, the install folder, and the save folder, and optional presets. It keeps saves when uninstalling, exports every port’s saves to a dated .zip, tracks play time, can be driven entirely with a keyboard or an XInput controller, and has a fullscreen library mode in the style of Steam’s Big Picture, more than 100 color themes, optional Discord presence, and its interface in 20 languages. It’s portable: one executable plus a minimal copy of 7-Zip for extracting, with no installation. It’s published as a single rolling release whose file is replaced on every update. Its README says it was built together with Claude. It includes no game files; the box art comes from SteamGridDB. The repository also keeps a few extras the catalog installs, among them a build of zelda3 and a RIP-format patch for its zelda3_assets.dat that changes the game’s language."
tags:
