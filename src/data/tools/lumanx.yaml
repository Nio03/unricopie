name: "LumaNX"
kind: launcher
consoles: [switch]
repo: Xc1Ym/LumaNX
status: beta
desc:
  es: "Aplicación gráfica de terceros para Mac con chip Apple para usar nxnative: importas tus juegos de Switch (NSP, XCI, NSZ o XCZ, con actualizaciones y DLC), prepara el código, los shaders y los archivos de ejecución con cachés validadas, y los lanzas desde una biblioteca, o genera un IPA sin firmar para iPhone y iPad. Incluye también conversión entre formatos de paquete, copias y verificación de partidas guardadas, y mandos de Switch Pro, Xbox y PlayStation por GameController. El motor, la ejecución nativa y los gráficos sobre Metal son de nxnative, que se sincroniza una vez al día, y la app trae una instantánea suya. También importa, solo para Mac y de forma experimental, carpetas descifradas de juegos de Switch 2 que nxnative tenga registrados. El README avisa de que preparar un juego con éxito no garantiza que se pueda jugar entero y de que no se ha validado la compatibilidad en iPhone o iPad. Su última versión es la 0.3.0, del 2 de noviembre (20 en total). Ninguno de sus últimos 100 commits lleva a Claude como coautor. El repositorio incluye además tablas por juego de la instantánea de nxnative con datos de shaders (hashes y desplazamientos, sin programas de shader)."
  en: "A third-party graphical app for Apple Silicon Macs that drives nxnative: you import your Switch games (NSP, XCI, NSZ, or XCZ, with updates and DLC), it prepares the code, shaders, and runtime files with validated caches, and you launch them from a library, or generate an unsigned IPA for iPhone and iPad. It also converts between package formats, backs up and verifies saves, and supports Switch Pro, Xbox, and PlayStation controllers through GameController. The engine, native execution, and Metal graphics come from nxnative, which is synchronized once a day, and the app ships a snapshot of it. It also imports, on Mac only and experimentally, decrypted folders of Switch 2 games that nxnative has registered. The README warns that a game preparing successfully doesn’t mean it can be played in full and that iPhone and iPad compatibility hasn’t been validated. Its latest release is 0.3.0, from November 2 (20 in total). None of its last 100 commits list Claude as a co-author. The repository also carries per-game tables from the nxnative snapshot with shader data (hashes and offsets, no shader programs)."
tags:
  - arm64
  - build-ios
