name: SaturnRecomp
kind: recompiler
consoles:
  - saturn
repo: sonsegajp/SaturnRecomp
status: experimental
desc:
  es: "Entorno de ejecución para Sega Saturn y kit de investigación de recompilación estática, hecho en sala limpia. Conviene ser claro con su estado: hoy, el modo jugable ejecuta el código SH-2 con un intérprete, y la recompilación por adelantado sigue siendo investigación, no un port. Incluye un launcher nativo para Windows."
  en: "Clean-room Sega Saturn runtime and static-recompilation research toolkit. Worth being clear about its state: today its playable path runs SH-2 code through an interpreter, and the ahead-of-time recompilation side is still research, not a port. It ships a native Windows launcher."
tags:
  - sh-2
  - clean-room
