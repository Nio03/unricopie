name: PS2 Web Recomp
kind: recompiler
consoles:
  - ps2
repo: snuri00/ps2-web-recomp
author: snuri00
status: experimental
desc:
  es: "Recompilador estático de PS2 que convierte tu imagen de disco en una página web: el código del Emotion Engine se traduce de antemano a C++ y se compila a WebAssembly, y un runtime reproduce el resto de la consola. El procesador de E/S (IOP) ejecuta en un intérprete los módulos IRX del propio disco, el Graphics Synthesizer se dibuja con sombreadores de cómputo de WebGPU, los microprogramas de la VU1 se compilan de antemano y el sonido y los vídeos están reimplementados. Además genera un ejecutable nativo, ps2run, para Linux x86-64 y macOS con Apple Silicon (wgpu-native sobre Vulkan o Metal, con SDL2), con ventana, mandos y resolución interna de hasta 3x. Un solo script hace todo el proceso: lee el ejecutable del disco, lo traduce, ejecuta el juego varias veces sin ventana para encontrar las funciones que faltan y compila la página y el ejecutable; también aplica parches .pnach de PCSX2. Se ha probado con dos juegos: Gran Turismo 4 (PAL), que se juega con sonido y partidas guardadas, y God of War II, que llega al combate. El README avisa de que con otro juego lo más probable es que se detenga en alguna llamada del sistema sin implementar, y hay un arranque experimental de Gran Turismo 3 aportado por otro autor. La recompilación de Gran Turismo 4 de moesuito se basa en él. Para usarlo hacen falta tu imagen de disco (ISO, BIN/CUE, o ZIP o 7z que la contenga), git, CMake, Ninja, un compilador de C++20 (mejor clang) y Python 3; la primera vez instala el SDK de Emscripten, la ventana nativa necesita las bibliotecas de desarrollo de SDL2 y la página, un navegador con WebGPU. El repositorio no trae nada del juego, y el README pide no publicar el código generado. Licencia MIT. 27 de sus últimos 100 commits llevan a Claude como coautor."
  en: "A PS2 static recompiler that turns your disc image into a web page: the Emotion Engine code is translated ahead of time into C++ and compiled to WebAssembly, and a runtime reproduces the rest of the console. The I/O processor (IOP) runs the disc’s own IRX modules on an interpreter, the Graphics Synthesizer is drawn with WebGPU compute shaders, the VU1 microprograms are compiled ahead of time, and sound and movies are reimplemented. It also builds a native executable, ps2run, for x86-64 Linux and Apple silicon macOS (wgpu-native on Vulkan or Metal, with SDL2), with a window, controllers, and internal resolution up to 3x. A single script does the whole job: it reads the disc’s executable, translates it, runs the game a few times without a window to find the missing functions, and builds the page and the executable; it also applies PCSX2 .pnach patches. It’s been tried with two games: Gran Turismo 4 (PAL), which plays with sound and saves, and God of War II, which reaches combat. The README warns that another game will most likely stop at some unimplemented system call, and there’s an experimental Gran Turismo 3 bring-up contributed by another author. moesuito’s Gran Turismo 4 recompilation builds on it. Using it takes your disc image (ISO, BIN/CUE, or a ZIP or 7z holding one), git, CMake, Ninja, a C++20 compiler (clang preferred), and Python 3; the first run installs the Emscripten SDK, the native window needs the SDL2 development files, and the page needs a browser with WebGPU. The repository includes nothing from any game, and the README asks you not to publish the generated code. MIT license. 27 of its last 100 commits list Claude as a co-author."
