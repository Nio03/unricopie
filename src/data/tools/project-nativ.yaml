name: Project Nativ
kind: recompiler
consoles:
  - vita
repo: TheLostPantheon/nativ
status: beta
desc:
  es: "Cadena de recompilación estática que convierte juegos de PS Vita en programas nativos para Windows, macOS y Linux (también la Steam Deck). Trata por separado las dos partes de un juego de Vita: su código, ARMv7 con Thumb-2, VFP y NEON, se traduce a C de antemano y se compila; las bibliotecas de Sony que carga (libgxm, libc, FIOS y otras) se recompilan con él a partir del firmware que se baja de la web de Sony, y por debajo un entorno de ejecución propio hace de núcleo y de hardware de la consola: hilos, gráficos en tu GPU y sonido. Cada juego tiene un paquete con sus parches y ajustes, que solo admite las versiones exactas para las que se escribió, reconocidas por el SHA-256 de su programa principal. Hoy cubre cuatro juegos, todos en su edición estadounidense: Killzone: Mercenary, Uncharted: Golden Abyss, Unit 13 y Shovel Knight, que fue la primera prueba. El launcher guía la primera configuración, descifra en tu equipo el firmware y tus juegos, compila cada juego la primera vez que se juega (unos minutos) y ofrece, según el juego, escala de render de hasta seis veces la resolución de la Vita, pantallas de 21:9 y 32:9, campo de visión, cámara con el ratón y 60 fps experimentales, además de juego en línea entre copias de Nativ. Según el README, el repositorio no contiene código de Sony ni de los juegos; para descifrar trae las claves conocidas de la Vita, portadas del código de Vita3K. Está en beta pública: la primera versión, la 0.1.0, salió el 29 de octubre, y la última es la 0.1.5 (2 de noviembre), con descargas para Windows, macOS y Linux. Su README dice que gran parte del código y de la documentación se escribió con ayuda de IA, bajo la dirección de su autor, y que se prueba en los propios juegos."
  en: "A static recompilation toolchain that turns PS Vita games into native programs for Windows, macOS, and Linux (Steam Deck included). It handles the two halves of a Vita game separately: its code, ARMv7 with Thumb-2, VFP, and NEON, is translated to C ahead of time and compiled; the Sony libraries it loads (libgxm, libc, FIOS, and others) are recompiled with it from the firmware you download from Sony’s website, and underneath, a runtime of its own stands in for the console’s kernel and hardware: threads, graphics on your GPU, and sound. Each game has a pack with its patches and settings, which only accepts the exact versions it was written for, recognized by the SHA-256 of the game’s main program. It currently covers four games, all in their US editions: Killzone: Mercenary, Uncharted: Golden Abyss, Unit 13, and Shovel Knight, which was the first proof. The launcher walks you through the first-time setup, decrypts the firmware and your games on your PC, builds each game the first time you play it (a few minutes), and offers, depending on the game, a render scale of up to six times the Vita’s resolution, 21:9 and 32:9 screens, field of view, mouse camera control, and experimental 60 fps, plus online play between copies of Nativ. According to the README, the repository contains no Sony or game code; for decryption it carries the known Vita keys, ported from Vita3K’s code. It’s in public beta: the first release, 0.1.0, came out on October 29, and the latest is 0.1.5 (November 2), with downloads for Windows, macOS, and Linux. Its README says much of the code and documentation was written with AI assistance, under its author’s direction, and is tested on the games themselves."
tags:
