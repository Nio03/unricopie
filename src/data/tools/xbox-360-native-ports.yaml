status: beta
desc:
  es: "Colección de recompilaciones de juegos de Xbox 360 para Linux y Windows, con un lanzador común, rexmenu, hecho con raylib. Cada versión publicada es un lanzador por juego: trae el código del juego recompilado, un renderizador nativo en Vulkan, un mezclador de audio nativo y una pequeña interfaz, y los datos los pones tú. rexmenu muestra la colección en un carril de juegos, sigue los logros por título y en toda la biblioteca, gestiona partidas guardadas (con copia antes de borrar), importa juegos de un ISO, un archivo .zip, .7z o .rar, un paquete STFS/LIVE/PIRS o una carpeta extraída, los verifica con las sumas de comprobación con las que se construyó el port y ejecuta el juego dentro de su propia ventana con un mando virtual de Xbox 360. Cada juego muestra qué parte de las llamadas del sistema de la consola resuelve ya de forma nativa. Hay 16 versiones, una por título: Burnout Revenge, Ridge Racer Unbounded, Midnight Club: Los Angeles, Split/Second, Banjo-Kazooie, Banjo-Tooie, Geometry Wars 1, 2 y 3, Rez HD, Soulcalibur II HD Online, After Burner Climax, Hydro Thunder Hurricane, Space Giraffe, Daytona USA y OutRun Online Arcade. El repositorio incluye, en la carpeta collections, el código C++ generado por el recompilador para al menos Midnight Club: Los Angeles (más de cien archivos de alrededor de 1 MB), además de otras colecciones con sus propios archivos de proyecto."
  en: "A collection of Xbox 360 game recompilations for Linux and Windows, with a common launcher, rexmenu, built with raylib. Each published release is a per-game launcher: it holds the game’s recompiled code, a native Vulkan renderer, a native audio mixer and a small interface, and you supply the data. rexmenu shows the collection on a game rail, tracks achievements per title and across the library, manages saves (backing up before deleting), imports games from an ISO, a .zip, .7z or .rar archive, an STFS/LIVE/PIRS package or an extracted folder, verifies them against the checksums the port was built from, and runs the game inside its own window with a virtual Xbox 360 pad. Each game shows how much of the console’s system calls it already answers natively. There are 16 releases, one per title: Burnout Revenge, Ridge Racer Unbounded, Midnight Club: Los Angeles, Split/Second, Banjo-Kazooie, Banjo-Tooie, Geometry Wars 1, 2 and 3, Rez HD, Soulcalibur II HD Online, After Burner Climax, Hydro Thunder Hurricane, Space Giraffe, Daytona USA and OutRun Online Arcade. The repository includes, in the collections folder, the C++ code generated by the recompiler for at least Midnight Club: Los Angeles (over a hundred files of about 1 MB), along with other collections with their own project files."
