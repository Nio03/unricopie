name: "Xbox 360 Native Ports (rexmenu)"
games: [burnout-revenge, ridge-racer-unbounded, midnight-club-los-angeles, split-second, banjo-kazooie, banjo-tooie, geometry-wars-retro-evolved, geometry-wars-retro-evolved-2, geometry-wars-3-dimensions, rez-hd, soulcalibur-ii-hd-online, after-burner-climax, hydro-thunder-hurricane, space-giraffe, daytona-usa, outrun-online-arcade]
