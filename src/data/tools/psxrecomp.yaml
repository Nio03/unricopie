name: psxrecomp
kind: recompiler
consoles:
  - ps1
repo: mstan/psxrecomp
status: usable
desc:
  es: "Recompilador de PS1 que traduce MIPS R3000A a C nativo y recompila la propia BIOS SCPH1001 como núcleo del sistema. Es la base de muchos recomps de PS1 del catálogo, como Crash Bandicoot 2, Ridge Racer Revolution, Valkyrie Profile o la serie Mega Man X."
  en: "PS1 recompiler that lifts R3000A MIPS to native C and recompiles the SCPH1001 BIOS itself as the kernel. It’s the base of many PS1 recomps in the catalog, such as Crash Bandicoot 2, Ridge Racer Revolution, Valkyrie Profile, and the Mega Man X series."
tags:
  - mips
  - bios
