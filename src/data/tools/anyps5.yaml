name: AnyPS5
kind: recompiler
consoles:
  - ps5
repo: boykopovar/AnyPS5
author: boykopovar
status: experimental
desc:
  es: "Convierte automáticamente ejecutables de PS5 al formato nativo de Linux y Windows, y aporta implementaciones de las bibliotecas del sistema para enlazarlas de forma dinámica. Sin emulación y sin un proceso aparte de entorno de ejecución. Su técnica es distinta de la del resto de herramientas del catálogo: la PS5 usa x86-64, igual que el PC, así que no traduce instrucciones entre arquitecturas, sino el formato del ejecutable y las llamadas al sistema, algo más cercano al modelo de Wine que al de N64Recomp. Las bibliotecas del sistema que cubre son todavía parciales y crecen a medida que se declaran más funciones; ante un estado no compatible, el proceso se detiene en lugar de seguir a ciegas."
  en: "Automatically converts PS5 executables to the native format of Linux and Windows, and supplies implementations of the system libraries to link against dynamically. No emulation and no separate runtime process. Its technique differs from the rest of the tools here: the PS5 is x86-64 just like the PC, so it doesn’t translate instructions across architectures; it translates the executable format and the system calls, closer to Wine’s model than to N64Recomp’s. System library coverage is partial and grows as more functions are declared; unsupported states abort the process instead of carrying on blindly."
tags:
  - x86
  - compat-layer
