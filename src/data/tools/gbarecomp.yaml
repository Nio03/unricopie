name: gbarecomp
kind: recompiler
consoles:
  - gba
repo: mstan/gbarecomp
author: mstan
status: experimental
desc:
  es: "Ecosistema de recompilación estática para juegos de Game Boy Advance, del mismo autor que psxrecomp. Los juegos que salen de él (Mario Kart: Super Circuit) son el banco de pruebas; el framework reutilizable es el objetivo declarado."
  en: "Static recompilation ecosystem for Game Boy Advance games, from the same author as psxrecomp. The games that come out of it (Mario Kart: Super Circuit) are the proving ground; the reusable framework is the stated goal."
