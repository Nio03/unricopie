name: "Añadir un proyecto al catálogo"
description: "Propón un recomp, un port, una decompilación, una herramienta o un mod para Recompendium."
title: "[nuevo] <Nombre del proyecto>"
labels: ["nuevo-proyecto"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por aportar! Si sabes editar YAML, lo más rápido es abrir un Pull Request
        copiando un archivo de `src/data/` (ver `CONTRIBUTING.md`). Si no, llena esto y alguien
        lo añade. También puedes usar el formulario de la página Contribuir del sitio.

        Entran recomps, ports, decompilaciones, herramientas y mods que **pidan tu propia copia
        del juego**: nada que incluya ROMs, imágenes de disco ni recursos del juego. Los
        emuladores y los núcleos FPGA no entran.
  - type: dropdown
    id: type
    attributes:
      label: Tipo
      options:
        - "Recomp (juego)"
        - "Port o remake de fans"
        - "Decompilación"
        - "Herramienta / launcher / recompilador"
        - "Mod, editor o gestor de mods"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Nombre
      placeholder: "Conker's Bad Fur Day"
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repositorio GitHub (owner/repo)
      description: "Solo el slug, sin https://github.com/. Si no vive en GitHub, déjalo vacío y pon el enlace en notas."
      placeholder: "usuario/MiRecomp"
  - type: dropdown
    id: console
    attributes:
      label: Consola original (si es un juego o un mod)
      # Misma lista y mismo orden que src/lib/consoles.ts.
      options:
        - "NES / Famicom"
        - "SNES / Super Famicom"
        - "N64"
        - "GameCube"
        - "Wii"
        - "PS5"
        - "PS4"
        - "PS3"
        - "PS2"
        - "PS1"
        - "PSP"
        - "Xbox 360"
        - "Wii U"
        - "Dreamcast"
        - "Saturn"
        - "Mega Drive / Genesis"
        - "Mega-CD / Sega CD"
        - "32X / Super 32X"
        - "Master System / Mark III"
        - "Game Gear"
        - "Game Boy"
        - "GBC"
        - "GBA"
        - "Virtual Boy"
        - "DS"
        - "3DS"
        - "Switch"
        - "Xbox"
        - "Xbox One"
        - "Arcade"
        - "Neo Geo"
        - "DOS"
        - "Windows"
        - "PC-98"
        - "Mac OS clásico"
        - "Móviles"
        - "Otra"
  - type: dropdown
    id: status
    attributes:
      label: Estado
      description: "Para juegos: Experimental, Jugable o Totalmente jugable (de principio a fin). Para herramientas: Experimental, Beta, Usable o Estable."
      options:
        - "Experimental"
        - "Jugable"
        - "Totalmente jugable"
        - "Beta (herramienta)"
        - "Usable (herramienta)"
        - "Estable (herramienta)"
  - type: input
    id: author
    attributes:
      label: Autor / mantenedor
  - type: textarea
    id: desc
    attributes:
      label: Descripción (una o dos líneas)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notas / enlaces / cómo lo verificaste
      description: "Releases jugables, vídeos, hilos. Cuanto más fácil sea de verificar, más rápido entra."
