name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-publica cuando el refresco de stats termina (el push del bot no
  # dispara workflows por sí solo). La suma de reportes lo pide con
  # workflow_dispatch, y solo si cambió algo.
  workflow_run:
    workflows: ["Refresh GitHub stats"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no cancela una en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Token de solo lectura del repo privado de recetas (Nio03/unricopie-data). Sin él,
      # el sitio se publica igual, solo que sin recetas.json para el launcher.
      UNRICOPIE_DATA_TOKEN: ${{ secrets.UNRICOPIE_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El feed RSS saca la fecha de alta de cada ficha del primer commit
          # que la anadio, asi que necesita el historial entero. Con el checkout
          # superficial por defecto el build no falla, pero el feed sale sin fechas.
          fetch-depth: 0
      # Las recetas de Unricopie: se exportan del repo privado a public/ solo aquí, en el
      # build, y salen publicadas en /unricopie/recetas.json sin pasar por este repo.
      - name: Recetas de Unricopie (repo privado)
        if: env.UNRICOPIE_DATA_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: Nio03/unricopie-data
          token: ${{ secrets.UNRICOPIE_DATA_TOKEN }}
          path: _unricopie-data
      - name: Exportar recetas.json
        if: env.UNRICOPIE_DATA_TOKEN != ''
        run: |
          pip install --quiet pyyaml
          python3 _unricopie-data/scripts/exportar.py public/unricopie/recetas.json
          rm -rf _unricopie-data
      - name: Build con Astro
        uses: withastro/action@v3
        env:
          # Cloudflare Web Analytics: el token es un secreto del repo, nunca va en el código.
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
